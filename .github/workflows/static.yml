# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    # 게임 파일이 바뀔 때만 배포한다 (문서·도구 커밋은 배포를 안 띄운다)
    paths:
      - "index.html"
      - "KuntoGame/**"
      - "assets/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # 게임을 돌리는 데 필요한 파일만 배포한다 (문서·도구·워크플로는 뺀다)
      - name: Build site
        run: |
          mkdir _site
          cp -r index.html KuntoGame assets _site/
          touch _site/.nojekyll
          # 파일 주소에 커밋 번호(?v=)를 붙여서 브라우저가 옛 파일을 캐시로 쓰지 않게 한다
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
