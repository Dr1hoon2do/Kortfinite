        toggle.addComponent(new UIImage(Resource.image("buttons"), { region: { x: this.icon * 16, y: 0, width: 16, height: 16 } }));
        toggle.addComponent(new UIButton({ action: this.action, pressedRegion: { x: this.icon * 16, y: 16, width: 16, height: 16 } }));

        this.panel = this.engine.createUI(this.action + "Panel");
        const prt = this.panel.getComponent(RectTransform);
        prt.sortOrder = UILayer.PANEL;
        prt.setAnchor(1, 0, 1, 1);
        this.placeFrame();
        this.panel.addComponent(new UIRect({ color: "rgba(18, 13, 10, 0.82)", borderColor: "#5a4a3a", borderWidth: 1 }));
        this.panel.addComponent(new UIElement()); // 패널 위 탭이 뒤의 월드로 새지 않게 막는다

        const header = prt.createChild("header");
        const hrt = header.getComponent(RectTransform);
        hrt.setAnchor(0, 0, 1, 0);
        hrt.setOffsets(12, 0, 12, -28);
        this.header = header.addComponent(new UIText(this.title, { fontSize: 12, color: "#e8d9b8", align: "left" }));

        const body = prt.createChild("body");
        const brt = body.getComponent(RectTransform);
        brt.setAnchor(0, 0, 1, 1);
        brt.setOffsets(0, 28, 0, 1);
        this.body = brt;
        this.build(brt);

        this.setOpen(this.startOpen);
    }

    // 상속해서 본문을 만든다
    build(body) {}

    // 상속해서 열려 있는 동안 매 프레임 갱신한다
    refresh() {}

    setTitle(text) {
        this.header.setText(text);
    }

    setOpen(value) {
        if (value && SidePanel.current && SidePanel.current !== this) SidePanel.current.setOpen(false);
        const was = this.open;
        this.open = value;
        this.panel.setActive(value);
        if (value && !was) UIKit.fadeIn(this.panel);
        if (value) SidePanel.current = this;
        else if (SidePanel.current === this) SidePanel.current = null;
    }

    // 화면 폭이 바뀌면 버튼·패널 자리를 다시 (좁은 화면은 버튼 두 줄)
    placeFrame() {
        const two = SidePanel.twoRows(this.engine);
        if (two === this._two) return;
        this._two = two;
        const p = SidePanel.buttonPos(this.engine, this.slot);
        this.toggleRT.setSizeAndPosition(SidePanel.BUTTON, SidePanel.BUTTON, p.x, p.y);
        this.panel.getComponent(RectTransform).setOffsets(-this.panelWidth - this.margin, SidePanel.top(this.engine), this.margin, this.margin);
    }

    update() {
        this.placeFrame();
        if (Input.getButtonDown(this.action)) this.setOpen(!this.open);
        if (this.open) this.refresh();
    }
}

/* ===== assets/dat/ui/panel/StatusPanel.js ===== */
// 플레이어 상태창. 체력바와 능력치 줄을 매 프레임 플레이어 값으로 갱신한다.
// 줄을 늘리려면 rows에 [이름, 값을 돌려주는 함수]를 추가하면 된다.
// 아래에 런 시드. 처음 화면으로 나가기는 설정 창(SettingsPanel).
class StatusPanel extends SidePanel {
    constructor(options) {
        super({ action: "status", keys: ["KeyC"], icon: 5, slot: 2, title: "상태", width: 236, ...options });
        this.player = options.player;
        this.turns = options.turns;
        this.run = options.run ?? null;
        this.rows = options.rows ?? [
            ["공격력", (p) => StatusPanel.withGear(p.stats.attack, Player.BASE_ATTACK)],
            ["방어력", (p) => StatusPanel.withGear(p.stats.defense, Player.BASE_DEFENSE)],
            ["이동속도", (p) => StatusPanel.withGear(p.speed, Player.BASE_SPEED)],
            ["기력", (p) => `${p.energy} / ${p.maxEnergy}${p.drawLock > 0 ? ` · 쉼 ${p.drawLock}턴` : ""}`],
            ["방어도", (p) => p.blocks.length ? p.blocks.map((b) => `${b.v}(${b.t}턴)`).join(" + ") : "0"],
            ["상태", (p) => Status.text(p) || "없음"],
            ["마나", (p) => `${p.mana} / ${p.maxMana}`],
            ["돈", (p) => `${p.money} G`],
            ["처치", (p) => p.kills],
            ["층", () => (this.run ? `${this.run.floor}층 · 지나온 방 ${this.run.visited.length}` : "")],
            ["행동 패", (p) => `${p.cards.counts().a} / ${p.cards.actionLimit}`],
            ["소지품 패", (p) => `${p.cards.counts().i} / ${p.cards.invLimit}${p.cards.overflow ? ` (행동 패 ${p.cards.overflow}칸 차지)` : ""}`],
            ["장착", (p) => p.cards.equippedCards.map((c) => c.name).join(", ") || "없음"],
            ["덱 / 묘지", (p) => `${p.cards.deck.length} / ${p.cards.graveyard.length} (전체 ${p.cards.allActions.length})`],
            ["턴", () => this.turns.turn],
            ["카드 빼기 값", () => (this.run ? `${this.run.removeCost} G` : "")]
        ];
    }

    // "8 (+3)" — 장비로 오른 만큼
    static withGear(value, base) {
        return value === base ? String(value) : `${value} (${value > base ? "+" : ""}${value - base})`;
    }

    build(body) {
        const pad = 12;
        const name = body.createChild("name");
        StatusPanel.place(name, pad, 6, null, 18);
        name.addComponent(new UIText(this.player.displayName, { fontSize: 14, fontWeight: "bold", color: "#e8d9b8", align: "left", verticalAlign: "top" }));

        const hpLabel = body.createChild("hpLabel");
        StatusPanel.place(hpLabel, pad, 32, null, 14);
        hpLabel.addComponent(new UIText("체력", { fontSize: 12, color: "#c8b890", align: "left", verticalAlign: "top" }));
        const hpValue = body.createChild("hpValue");
        StatusPanel.place(hpValue, pad, 32, null, 14);
        this.hpText = hpValue.addComponent(new UIText("", { fontSize: 12, color: "#e8d9b8", align: "right", verticalAlign: "top" }));

        const hpBack = body.createChild("hpBar");
        StatusPanel.place(hpBack, pad, 50, null, 10);
        hpBack.addComponent(new UIRect({ color: "#2a1e16", borderColor: "#5a4a3a", borderWidth: 1 }));
        this.hpFill = hpBack.getComponent(RectTransform).createChild("fill");
        this.hpFill.addComponent(new UIRect({ color: "#c43434" }));

        // 줄: 왼쪽 이름(고정 폭), 오른쪽 값(길면 줄바꿈). 값이 바뀌면 줄 높이를 다시 잰다 (layoutRows)
        this.values = [];
        this.labels = [];
        for (const [label] of this.rows) {
            const l = body.createChild("label");
            this.labels.push(l.addComponent(new UIText(label, { fontSize: 12, color: "#c8b890", align: "left", verticalAlign: "top" })));
            const v = body.createChild("value");
            this.values.push(v.addComponent(new UIText("", { fontSize: 12, color: "#e8d9b8", align: "right", verticalAlign: "top", wrap: true, lineHeight: 1.3 })));
        }
        this.seedText = this.run ? UIKit.label(body, "seed", `런 시드: ${this.run.seed}`, pad, 0, null, 14, { fontSize: 11, color: "#c8b890" }) : null;
        this.hint = UIKit.label(body, "hint", "설정·처음 화면: 오른쪽 위 메뉴 버튼 (O)", pad, 0, null, 28, { fontSize: 10, color: UIKit.COLORS.dim, wrap: true });
        this._ctx = document.createElement("canvas").getContext("2d");
        this._layoutKey = null;
    }

    static LABEL_W = 78;

    layoutRows() {
        const pad = 12;
        const W = this.panelWidth;
        const vw = W - pad * 2 - StatusPanel.LABEL_W;
        const key = this.values.map((v) => v.text).join("|");
        if (key === this._layoutKey) return;
        this._layoutKey = key;
        let y = 74;
        this.values.forEach((v, i) => {
            const lines = Math.max(1, v.measureLines(this._ctx, vw));
            const h = Math.ceil(lines * 12 * 1.3);
            StatusPanel.place(this.labels[i].gameObject, pad, y, StatusPanel.LABEL_W, 16);
            StatusPanel.place(v.gameObject, pad + StatusPanel.LABEL_W, y, vw, h);
            y += Math.max(22, h + 6);
        });
        if (this.seedText) StatusPanel.place(this.seedText.gameObject, pad, y + 8, null, 14);
        StatusPanel.place(this.hint.gameObject, pad, y + 28, null, 28);
    }

    refresh() {
        const p = this.player;
        const s = p.stats;
        this.hpText.setText(`${s.hp} / ${s.maxHp}`);
        const frt = this.hpFill.getComponent(RectTransform);
        frt.setAnchor(0, 0, s.hp / s.maxHp, 1);
        frt.setOffsets(1, 1, 1, 1);
        this.rows.forEach(([, get], i) => this.values[i].setText(String(get(p))));
        this.layoutRows();
    }

    // 가로로 꽉 차게(좌우 x 여백) 또는 너비 w로, 위에서 y만큼 내려서 높이 h
    static place(go, x, y, w, h) {
        const rt = go.getComponent(RectTransform);
        rt.setAnchor(0, 0, w === null ? 1 : 0, 0);
        rt.setOffsets(x, y, w === null ? x : -(x + w), -(y + h));
    }
}

/* ===== assets/dat/ui/TileTargeting.js ===== */
// 칸 지정 모드: 칸을 골라야 하는 행동(칸을 고르는 카드, 상호작용 버튼)이 여기로 들어온다.
// 요청(request)마다 사거리, 효과 범위, 확정 방식, 확정했을 때 할 일을 정한다:
//   { name, range, radius, includeSelf, taps(1이면 바로, 2면 한 번 더 눌러 확정), color, onConfirm({ x, y }), valid(),
//     tiles(고를 수 있는 칸 키 Set — 이동 카드는 걸어서 갈 수 있는 칸만) }
// - 바닥에 사거리(옅게)와 조준한 칸의 효과 범위(진하게)를 그린다. 데스크톱은 마우스를 올린 칸 범위를 미리 보여준다.
// - [취소], Esc는 취소. 사거리 밖을 탭하면 알려주고 조준은 그대로 둔다.
// - 패의 카드를 고르면 바로 이 모드가 된다: 안내줄에 카드 설명과 [쓰기] [묘지로/버리기] [취소].
//   칸이 필요 없는 카드(나에게 쓰는 카드·물약 등)는 내 칸만 고를 수 있다 (나를 누르거나 [사용]).
// 월드 탭은 WorldInput이 이쪽으로 넘겨준다 (active일 때).
// 안내줄은 끌어서 옮길 수 있다 (뒤에 숨은 적을 고를 때). 옮긴 자리는 다음 카드에도 그대로 쓴다.
class TileTargeting extends Component {
    // options: { engine, world, player }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.world = options.world;
        this.player = options.player;
        this.request = null;
        this.aim = null;   // 조준한 칸 { x, y }
        this.hover = null; // 마우스를 올린 칸
        this.drag = { x: 0, y: 0 }; // 안내줄을 끌어 옮긴 양 (UI 단위)
        this._ctx = document.createElement("canvas").getContext("2d");
    }

    get active() {
        return this.request !== null;
    }

    // 지금 지정 중인 카드 (카드 요청일 때)
    get card() {
        return this.request ? this.request.card ?? null : null;
    }

    start() {
        this.addComponent(new TargetOverlay(this));

        // 아래 안내줄: 이름과 안내, 카드 설명, [시전] [묘지로] [취소]. 아래 패(HandBar) 위에 뜬다.
        this.banner = this.engine.createUI("targeting");
        const brt = this.banner.getComponent(RectTransform);
        brt.sortOrder = UILayer.TARGET;
        brt.setAnchor(0.5, 1, 0.5, 1);
        this.bannerRT = brt;
        this.layoutBanner(260, 0);
        this.banner.addComponent(new UIRect({ color: "rgba(18, 13, 10, 0.9)", borderColor: UIKit.COLORS.gold, borderWidth: 1 }));
        this.banner.addComponent(new UIDrag({ onMove: (dx, dy) => this.moveBanner(dx, dy) }));
        // 손잡이 표시 (오른쪽 위)
        const grip = brt.createChild("grip");
        const grt = grip.getComponent(RectTransform);
        grt.setAnchor(1, 0, 1, 0);
        grt.setSizeAndPosition(54, 16, -32, 12);
        grip.addComponent(new UIText("≡ 옮기기", { fontSize: 9, color: UIKit.COLORS.faint }));

        const label = brt.createChild("label");
        const lrt = label.getComponent(RectTransform);
        lrt.setAnchor(0, 0, 1, 0);
        lrt.setOffsets(10, 6, 10, -30);
        this.label = label.addComponent(new UIText("", { fontSize: 12, color: UIKit.COLORS.text, align: "left" }));
        const desc = brt.createChild("desc");
        this.descRT = desc.getComponent(RectTransform);
        this.descRT.setAnchor(0, 0, 1, 1);
        this.desc = desc.addComponent(new UIText("", { fontSize: 12, color: "#d8c8a0", align: "left", verticalAlign: "top", wrap: true, lineHeight: 1.35, rich: true }));
        const terms = brt.createChild("terms");
        this.termsRT = terms.getComponent(RectTransform);
        this.termsRT.setAnchor(0, 0, 1, 0);
        this.terms = terms.addComponent(new UIText("", { fontSize: 10, color: "#a89878", align: "left", verticalAlign: "top", wrap: true, lineHeight: 1.35, rich: true }));

        this.castButton = UIKit.button(brt, "cast", "시전", () => this.confirm());
        this.discardButton = UIKit.button(brt, "discard", "묘지로", () => this.discardCard());
        this.cancelButton = UIKit.button(brt, "cancel", "취소", () => this.cancel());

        this.banner.setActive(false);
    }

    // 안내줄 크기와 버튼 자리. descLines: 카드 설명 줄 수 (0이면 설명 없음), termLines: 용어 풀이 줄 수
    layoutBanner(w, descLines, termLines = 0) {
        const descH = descLines ? Math.ceil(descLines * 12 * 1.35) + 4 : 0;
        const termH = termLines ? Math.ceil(termLines * 10 * 1.35) + 6 : 0;
        const h = 30 + descH + termH + 38;
        this._bw = w;
        this._bh = h;
        this.placeBanner();
        if (this.descRT) this.descRT.setOffsets(10, 26, 10, 38 + termH);
        if (this.termsRT) this.termsRT.setOffsets(10, 26 + descH + 2, 10, -(26 + descH + termH));
        if (!this.castButton) return;
        const buttons = [this.castButton, ...(this.discardButton.go.isActive ? [this.discardButton] : []), this.cancelButton];
        buttons.forEach((b, i) => {
            b.rt.setAnchor(i / buttons.length, 1, (i + 1) / buttons.length, 1);
            b.rt.setOffsets(i === 0 ? 8 : 3, -34, i === buttons.length - 1 ? 8 : 3, 6);
        });
    }

    // 기본 자리 (아래 패 위 가운데) + 끌어 옮긴 양. 화면 밖으로는 못 나가게
    placeBanner() {
        const scale = this.engine.uiRoot.scale;
        const W = this.engine.canvas.width / scale;
        const H = this.engine.canvas.height / scale;
        const w = this._bw, h = this._bh;
        const baseY = -(HandBar.HEIGHT + 4 + h / 2);
        const maxX = Math.max(0, (W - w) / 2);
        this.drag.x = Math.max(-maxX, Math.min(maxX, this.drag.x));
        const top = H + baseY - h / 2; // 기본 자리의 위쪽 끝 (화면 위에서)
        this.drag.y = Math.max(-top + 4, Math.min(H - h - 4 - top, this.drag.y));
        this.bannerRT.setSizeAndPosition(w, h, this.drag.x, baseY + this.drag.y);
    }

    moveBanner(dx, dy) {
        this.drag.x += dx;
        this.drag.y += dy;
        this.placeBanner();
    }

    begin(request) {
        if (this.active) this.cancel(true);
        this.request = { radius: 0, includeSelf: false, taps: 2, color: "#ff8a30", verb: "시전", ...request };
        this.aim = this.request.self ? { x: this.player.x, y: this.player.y } : null; // 나에게 쓰는 카드는 처음부터 내 칸
        this.hover = null;
        this.player.clearGoal();
        this.banner.setActive(true);
        this.castButton.text.setText(this.request.verb);
        // 카드면 설명과 [묘지로] 버튼
        const card = this.request.card;
        this.discardButton.go.setActive(!!card);
        const width = this.engine.canvas.width / this.engine.uiRoot.scale;
        const w = card ? Math.min(320, width - 24) : 260;
        let lines = 0;
        let termLines = 0;
        if (card) {
            const cost = CardDef.costText(card.cost);
            const body = card.text(false); // 전투 중: 수치만 ("5 피해")
            const text = `${cost ? `(${cost}) ` : ""}${body}`;
            this.desc.setText(text);
            lines = this.desc.measureLines(this._ctx, w - 20);
            const terms = CardInspector.enabled() ? CardText.glossary(body) : "";
            this.terms.setText(terms);
            termLines = terms ? this.terms.measureLines(this._ctx, w - 20) : 0;
            this.discardButton.text.setText(card.isSkill ? (card.def.noDiscard ? "묘지로 (불가)" : "묘지로") : "버리기");
            UIKit.setEnabled(this.discardButton, !card.def.noDiscard);
        } else {
            this.desc.setText("");
            this.terms.setText("");
        }
        this.layoutBanner(w, lines, termLines);
        // 좁은 화면에선 패널이 방을 가리므로 닫는다
        if (this.engine.width < 600 && SidePanel.current) SidePanel.current.setOpen(false);
        if (this.request.message) MessageLog.add(this.request.message, "#e8b840");
    }

    // 고른 카드를 버린다 (행동 카드는 묘지로, 아이템은 없어진다. 턴 안 씀)
    discardCard() {
        const card = this.card;
        if (!card) return;
        this.cancel(true);
        if (!this.player.discardByHand(card)) return;
        if (!card.isSkill) MessageLog.add(`${josa(card.name, "을를")} 버렸다`, "#e8c860");
    }

    // 칸이 필요 없는 카드: 내 칸만 고를 수 있다 (나를 누르거나 [사용])
    beginSelf(card) {
        const p = this.player;
        this.begin({
            name: card.name, card, range: 0, radius: 0, includeSelf: true, self: true,
            taps: 1, verb: "사용", color: "#7cd47c",
            tiles: new Set([`${p.x},${p.y}`]),
            valid: () => this.player.cards.hand.includes(card),
            onConfirm: () => { this.player.requestCard(card); }
        });
    }

    // 칸을 고르는 카드 (card.target { range, radius, walk?, line?, color? }). 칸이 필요 없는 카드면 beginSelf
    //   walk: 걸어서 갈 수 있는 칸만 (이동 카드) / line: 상하좌우 일직선 칸만 (찌르기)
    beginCard(card) {
        const t = card.target;
        if (!t) return this.beginSelf(card);
        if (t.walk && this.player.root > 0) {
            MessageLog.add(`속박되어 이동 카드를 쓸 수 없다 (${this.player.root}턴 남음)`, "#c8b890");
            return;
        }
        let tiles = t.walk ? new Set(ActionCards.reachable(this.world, this.player, t.range).keys()) : null;
        if (t.line) {
            tiles = new Set();
            const p = this.player;
            for (const [dx, dy] of Entity.DIRS) for (let i = 1; i <= t.range; i++) tiles.add(`${p.x + dx * i},${p.y + dy * i}`);
        }
        if (t.tiles) tiles = new Set(t.tiles(this.world)); // 정해진 칸만 (CardKit: 빈칸 등)
        if (tiles && !tiles.size) {
            MessageLog.add(`${card.name}: 고를 수 있는 칸이 없다`, "#c8b890");
            return;
        }
        this.begin({
            name: card.name, card, range: t.range, radius: t.radius ?? 0,
            taps: t.taps ?? 2, verb: t.verb ?? "시전", color: t.color ?? "#ff8a30",
            tiles,
            message: `${josa(card.name, "을를")} 쓸 칸을 고른다`,
            valid: () => this.player.cards.hand.includes(card),
            onConfirm: (target) => { this.player.requestCard(card, target); }
        });
    }

    cancel(silent = false) {
        if (!this.active) return;
        this.request = null;
        this.aim = null;
        this.banner.setActive(false);
        if (!silent) MessageLog.add("취소했다", "#c8b890");
    }

    inRange(x, y) {
        const r = this.request;
        const d = Math.abs(x - this.player.x) + Math.abs(y - this.player.y);
        if (d === 0) return r.includeSelf;
        if (r.tiles) return r.tiles.has(`${x},${y}`);
        return d <= r.range;
    }

    // 효과가 닿는 칸들 (정사각형 반경)
    area(x, y) {
        const r = this.request.radius;
        const tiles = [];
        for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) tiles.push([x + dx, y + dy]);
        }
        return tiles;
    }

    // 월드 칸을 탭했을 때
    tap(x, y) {
        if (!this.inRange(x, y)) {
            MessageLog.add("사거리 밖이다", "#c8b890");
            return;
        }
        const again = this.aim && this.aim.x === x && this.aim.y === y;
        this.aim = { x, y };
        if (again || this.request.taps === 1) this.confirm();
    }

    confirm() {
        if (!this.active || !this.aim) return;
        const { onConfirm } = this.request;
        const target = this.aim;
        this.request = null;
        this.aim = null;
        this.banner.setActive(false);
        onConfirm(target);
    }

    update() {
        if (!this.active) return;
        const r = this.request;
        if (!this.player.alive || (r.valid && !r.valid()) || Modal.isOpen) return this.cancel();
        if (Input.getButtonDown("cancel")) return this.cancel();
        if (Input.getKeyDown("Enter")) return this.confirm();

        // 마우스를 올린 칸 (UI 위가 아닐 때)
        const p = Input.pointer;
        this.hover = null;
        if (p && p.type === "mouse" && !UIEventSystem.raycast(p.position.x, p.position.y)) {
            const w = Camera.main.screenToWorld(p.position.x, p.position.y);
            const t = this.world.tileSize;
            this.hover = { x: Math.round(w.x / t), y: Math.round(w.y / t) };
        }

        const where = r.self ? "나를 누르거나 [사용]" : r.card && r.card.target && r.card.target.line ? `일직선 ${r.range}칸 안의 칸` : r.tiles ? (r.card && r.card.target && r.card.target.walk ? `걸어서 ${r.range}칸 안의 칸` : `${r.range}칸 안의 빈칸`) : r.range <= 1 ? (r.includeSelf ? "내 칸이나 바로 옆 칸" : "바로 옆 칸") : `${r.range}칸 안의 칸`;
        this.label.setText(r.self ? `${r.name}: ${where}` : this.aim && r.taps > 1 ? `${r.name}: 한 번 더 누르면 ${r.verb}` : `${r.name}: ${where}을 고르기`);
        this.castButton.text.color = this.aim ? UIKit.COLORS.text : UIKit.COLORS.faint;
    }
}

// 대상 지정 표시: 사거리 칸(옅게), 마우스를 올린 칸의 범위(중간), 조준한 칸의 범위(진하게 + 중심 테두리)
class TargetOverlay extends Renderer {
    constructor(targeting) {
        super();
        this.targeting = targeting;
        this.sortingLayer = "Default";
        this.orderInLayer = 1; // 청크(0) 위, 엔티티(2) 아래
    }

    getBounds(out) {
        return null;
    }

    render(ctx, camera) {
        const tg = this.targeting;
        if (!tg.active) return;
        const req = tg.request;
        const p = tg.player;
        const t = tg.world.tileSize;
        const m = camera.viewMatrix;
        ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);

        const fill = (tiles, color, alpha) => {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = color;
            for (const [x, y] of tiles) ctx.fillRect(x * t - t / 2, y * t - t / 2, t, t);
        };

        const r = req.range;
        const range = [];
        for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) {
                if (Math.abs(dx) + Math.abs(dy) <= r && tg.inRange(p.x + dx, p.y + dy)) range.push([p.x + dx, p.y + dy]);
            }
        }
        fill(range, "#e8d9b8", 0.22);

        const h = tg.hover;
        if (h && !(tg.aim && tg.aim.x === h.x && tg.aim.y === h.y)) {
            const ok = tg.inRange(h.x, h.y);
            fill(ok ? tg.area(h.x, h.y) : [[h.x, h.y]], ok ? "#e8b840" : "#d8443c", 0.25);
        }

        if (tg.aim) {
            fill(tg.area(tg.aim.x, tg.aim.y), req.color, 0.45);
            ctx.globalAlpha = 1;
            ctx.strokeStyle = "#fff0c0";
            ctx.lineWidth = 1 / camera.effectiveZoom * 2;
            ctx.strokeRect(tg.aim.x * t - t / 2, tg.aim.y * t - t / 2, t, t);
        }
        ctx.globalAlpha = 1;
    }
}

/* ===== assets/dat/ui/WorldInput.js ===== */
// 화면(방) 터치/클릭 처리, 줌.
// - 짧게 탭: 칸 지정 중이면 그 칸을 고른다. 아니면 Player.setGoal (적이 없는 방에서만 걸어간다, 바로 옆 상호작용 대상은 쓴다)
// - 한 손가락 드래그: 화면만 끈다.
// - 두 손가락 / 마우스 휠 / + - 키: 줌 (손가락 가운데·커서 아래 지점을 기준으로). UI 위에서 굴린 휠은 무시한다.
// - F 키: 방 전체가 보이게 다시 맞춘다 (Run.fitCamera).
// 줌은 소수 배율(월드 1픽셀 = 화면 n픽셀)이고, 휠/키는 한 번에 일정 비율씩, 두 손가락은 거리 비율 그대로 바뀐다.
// UI가 먼저 잡은 포인터(consumed)는 건드리지 않는다.
class WorldInput extends Component {
    static ICON_ON = 6;
    static ICON_OFF = 7;

    // options: { engine, world, player, camera(CameraFollow), targeting, run, minZoom, maxZoom }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.world = options.world;
        this.player = options.player;
        this.camera = options.camera;
        this.targeting = options.targeting; // 대상 지정 중이면 탭을 그쪽으로 넘긴다
        this.run = options.run ?? null;
        this.minZoom = options.minZoom ?? 1;
        this.maxZoom = options.maxZoom ?? 12;
        this.wheelSpeed = options.wheelSpeed ?? 0.0015; // 휠 deltaY 100(마우스 한 칸)이면 약 1.16배
        this.keyStep = options.keyStep ?? 1.25;          // + - 키 한 번에 곱하는 배율
        this._gestures = new Map(); // pointerId -> { drag, pinch }
        this._pinch = null;
    }

    start() {
        Input.defineButton("follow", ["KeyF"]);
        Input.defineButton("zoomIn", ["Equal", "NumpadAdd"]);
        Input.defineButton("zoomOut", ["Minus", "NumpadSubtract"]);

        this.addComponent(new GoalMarker(this.player, this.world.tileSize));
    }

    static region(col, row) {
        return { x: col * 16, y: row * 16, width: 16, height: 16 };
    }

    setFollow(value) {
        this.camera.follow = value;
    }

    update() {
        if (Input.getButtonDown("follow") && this.run) this.run.fitCamera(true);
        if (Input.getButtonDown("zoomIn")) this.smoothZoomBy(this.keyStep, this.screenCenter());
        if (Input.getButtonDown("zoomOut")) this.smoothZoomBy(1 / this.keyStep, this.screenCenter());
        this.updateWheel();

        for (const p of Input.pointers) {
            if (p.pressed && !p.consumed && p.button === 0) this._gestures.set(p.id, { drag: false, pinch: false });
        }
        for (const id of [...this._gestures.keys()]) {
            if (!Input.getPointer(id)) this._gestures.delete(id);
        }

        const held = Input.pointers.filter((p) => p.held && this._gestures.has(p.id));
        if (held.length >= 2) this.updatePinch(held[0], held[1]);
        else this._pinch = null;

        for (const p of Input.pointers) {
            const g = this._gestures.get(p.id);
            if (!g) continue;

            // 두 손가락에 한 번이라도 쓰인 포인터는 탭/드래그로 치지 않는다
            if (!g.pinch && !this._pinch) {
                if (!g.drag && p.dragDistance > Input.dragThreshold) {
                    g.drag = true;
                    if (this.camera.follow) this.setFollow(false);
                }
                if (g.drag && (p.delta.x !== 0 || p.delta.y !== 0)) this.pan(p.delta);
            }
            if (p.released) {
                this._gestures.delete(p.id);
                if (!g.drag && !g.pinch) this.tap(p.position);
            }
        }
    }

    updatePinch(a, b) {
        this._gestures.get(a.id).pinch = true;
        this._gestures.get(b.id).pinch = true;
        const dist = a.position.distance(b.position);
        const mid = new Vector((a.position.x + b.position.x) / 2, (a.position.y + b.position.y) / 2);

        const pinch = this._pinch;
        if (!pinch || pinch.a !== a.id || pinch.b !== b.id) {
            this._pinch = { a: a.id, b: b.id, dist: Math.max(dist, 1), zoom: Camera.main.effectiveZoom };
            return;
        }
        this.zoomTo(pinch.zoom * dist / pinch.dist, mid);
        if (!this.camera.follow) this.pan(new Vector((a.delta.x + b.delta.x) / 2, (a.delta.y + b.delta.y) / 2));
    }

    // 휠은 UI 위가 아닐 때만. 굴린 양에 비례해서 연속으로 바뀌어 트랙패드도 부드럽다
    updateWheel() {
        if (Input.wheel === 0) return;
        const p = Input.pointerPosition;
        if (UIEventSystem.raycast(p.x, p.y)) return;
        this.zoomBy(Math.exp(-Input.wheel * this.wheelSpeed), p); // 휠을 아래로 굴리면(+) 축소
    }

    screenCenter() {
        return new Vector(this.engine.width / 2, this.engine.height / 2);
    }

    zoomBy(factor, screenPoint) {
        this._zoomTween?.stop();
        this._zoomTween = null;
        // 배율은 정수로 맞춰 그리므로, 작은 휠 한 칸이 반올림에 먹히지 않게 실수 배율을 따로 이어 간다
        const eff = Camera.main.effectiveZoom;
        const base = this._zf !== undefined && Math.round(this._zf) === eff ? this._zf : eff;
        this.zoomTo(base * factor, screenPoint);
    }

    // 키로 한 단계씩 줌: 0.15초 동안 부드럽게. 연달아 누르면 목표에서 이어서 곱한다
    smoothZoomBy(factor, screenPoint, duration = 0.15) {
        const from = Camera.main.effectiveZoom;
        const base = this._zoomTween && !this._zoomTween.finished ? this._zoomGoal : from;
        const goal = Math.min(Math.max(base * factor, this.minZoom), this.maxZoom);
        this._zoomTween?.stop();
        this._zoomGoal = goal;
        // 배율은 곱셈이라 로그 공간에서 보간해야 속도가 고르다
        this._zoomTween = Tween.value(Math.log(from), Math.log(goal), duration, (v) => this.zoomTo(Math.exp(v), screenPoint), {
            ease: "outQuad",
            unscaled: true,
            owner: this
        });
    }

    // 배율을 바꾼다. 추적이 꺼져 있으면 screenPoint 아래 월드 지점이 그 자리에 남도록 카메라를 옮긴다.
    zoomTo(level, screenPoint) {
        const cam = Camera.main;
        const clamped = Math.min(Math.max(level, this.minZoom), this.maxZoom);
        this._zf = clamped;
        // 도트가 깨지지 않게 1배 이상은 정수 배율로만 (소수 배율이면 도트 크기가 들쭉날쭉해진다)
        const next = clamped >= 1 ? Math.max(1, Math.round(clamped)) : clamped;
        if (next === cam.effectiveZoom) return;

        const anchor = cam.screenToWorld(screenPoint.x, screenPoint.y);
        cam.setPixelZoom(next);
        if (this.camera.follow) return;

        const r = this.engine.pixelRatio;
        const x = anchor.x - (screenPoint.x - this.engine.width / 2) * r / next;
        const y = anchor.y + (screenPoint.y - this.engine.height / 2) * r / next;
        const p = this.camera.transform.position;
        this.camera.pan(x - p.x, y - p.y);
    }

    // 화면 픽셀만큼 끈 걸 월드 단위로 바꿔 카메라를 반대로 민다 (손가락 아래 지점이 따라오게)
    pan(delta) {
        const k = this.engine.pixelRatio / Camera.main.effectiveZoom;
        this.camera.pan(-delta.x * k, delta.y * k);
    }

    tap(position) {
        const p = this.player;
        if (!p.alive) return;
        const w = Camera.main.screenToWorld(position.x, position.y);
        const t = this.world.tileSize;
        const x = Math.round(w.x / t);
        const y = Math.round(w.y / t);
        if (this.targeting && this.targeting.active) this.targeting.tap(x, y);
        else if (!(x === p.x && y === p.y)) p.setGoal(x, y);
    }
}

// 탭한 목표 칸에 모서리 표시. 엔티티를 노리면 빨간색.
class GoalMarker extends Renderer {
    constructor(player, tileSize) {
        super();
        this.player = player;
        this.tileSize = tileSize;
        this.sortingLayer = "Foreground";
    }

    getBounds(out) {
        return null;
    }

    render(ctx, camera) {
        const g = this.player.goal;
        if (!g) return;
        const m = camera.viewMatrix;
        ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);

        const t = this.tileSize;
        const x0 = g.x * t - t / 2;
        const y0 = g.y * t - t / 2;
        const x1 = x0 + t;
        const y1 = y0 + t;
        const len = 4;
        ctx.fillStyle = g.entity ? "#e0483e" : "#f0e6cc";
        ctx.globalAlpha = 0.9;
        for (const [cx, cy, sx, sy] of [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]]) {
            ctx.fillRect(sx > 0 ? cx : cx - len, sy > 0 ? cy : cy - 1, len, 1);
            ctx.fillRect(sx > 0 ? cx : cx - 1, sy > 0 ? cy : cy - len, 1, len);
        }
        ctx.globalAlpha = 1;
    }
}

/* ===== assets/dat/ui/PlayerHud.js ===== */
// 왼쪽 위: 돈·층 + 최근 메시지. 화면 아래(드로우/대기 버튼 위): 체력·기력·마나 막대를 가로로, 그 위에 상태이상 아이콘 줄.
// 상태이상 아이콘(방어도 포함)을 누르면 목록 창. 많으면 +N으로 묶는다. (쓰러지면 EndScreen이 뜬다)
class PlayerHud extends Component {
    static LOG_MAX_WIDTH = 360; // 메시지 칸 최대 너비 (UI 단위). 화면이 좁으면 화면 폭 - 32
    static LOG_WRAP = 4;        // 메시지 하나가 차지할 수 있는 최대 줄 수
    static LOG_FONT = 11;
    static CHIPS = 16;   // 상태이상 아이콘 칸 수 (넘치면 마지막 칸이 +N)
    static CHIP_W = 28;
    static BAR_BOTTOM = 174; // 막대 줄의 아래 끝 (화면 아래에서, UI 단위): 패 120 + 버튼 줄 50 + 틈 4
    static BAR_H = 18;
    static LOG_Y = 40;      // 메시지 칸 위쪽 (돈·층 줄 아래)

    // 글자를 너비에 맞춰 줄로 나눈다 (단어 단위, 너무 긴 단어는 글자 단위).
    // 실제로 그려지는 크기(UI 배율)로 재야 한글 폭이 맞는다. 넘치는 글은 마지막 줄 끝을 …로
    static wrap(text, width, scale = 1) {
        if (!PlayerHud._measure) PlayerHud._measure = document.createElement("canvas").getContext("2d");
        const g = PlayerHud._measure;
        g.font = UIText.font(UIText.snap(PlayerHud.LOG_FONT * scale), "normal"); // 실제로 그려지는 도트 글꼴 크기와 같게
        width *= scale;
        const lines = [];
        let line = "";
        for (const word of text.split(" ")) {
            const test = line ? line + " " + word : word;
            if (g.measureText(test).width <= width) {
                line = test;
                continue;
            }
            if (line) lines.push(line);
            line = "";
            for (const ch of word) {
                if (line && g.measureText(line + ch).width > width) {
                    lines.push(line);
                    line = "";
                }
                line += ch;
            }
        }
        lines.push(line);
        if (lines.length > PlayerHud.LOG_WRAP) {
            lines.length = PlayerHud.LOG_WRAP;
            let last = lines[lines.length - 1];
            while (last && g.measureText(last + "…").width > width) last = last.slice(0, -1);
            lines[lines.length - 1] = last + "…";
        }
        return lines;
    }

    get logWidth() {
        const screen = this.engine.canvas.width / this.engine.uiRoot.scale;
        // 버튼이 두 줄인 좁은 화면은 둘째 줄 버튼(의뢰) 자리를 비운다
        // 오른쪽 위 버튼 줄과 같은 높이에 있으면 버튼 왼쪽까지만, 버튼 줄 아래로 내려갔으면 화면 끝까지
        const beside = this.logY < SidePanel.BUTTON + 16 + 4;
        const room0 = beside ? this.leftZone : screen - 32;
        const full = Math.max(120, Math.min(PlayerHud.LOG_MAX_WIDTH, Math.floor(room0)));
        // 넓은 화면: 방 왼쪽 빈 곳이 220 이상이면 그 폭만 써서 방을 가리지 않는다
        const run = this.run;
        if (run && run.state === "room" && run.plan && Camera.main) {
            const left = Camera.main.worldToScreen(new Vector(-8, 0)).x / this.engine.uiRoot.scale;
            const room = Math.floor(left - 16 - 10);
            if (room >= 220) return Math.min(full, room);
        }
        return full;
    }

    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.world = options.world;
        this.run = options.run ?? null;
        this.maxWidth = options.width ?? 180;
        this.width = this.maxWidth;
        this._logVersion = -1;
        this._dead = false;
        this._statusKey = null;
        this.statusOpen = false;
        this.logY = PlayerHud.LOG_Y;
        this.leftZone = 200; // 오른쪽 위 버튼 왼쪽의 빈 폭 (fitWidth가 정한다)
    }

    start() {
        const w = this.width;

        // ---- 아래: 체력 · 기력 · 마나 막대 (드로우/대기 버튼 위, 가로로)
        this.hpBar = this.bottomBar("hpBar", 0, "#c43434");
        this.energyBar = this.bottomBar("energyBar", 1, "#c8a02c");
        this.manaBar = this.bottomBar("manaBar", 2, "#3c78d8");
        this.hpBack = this.hpBar.back;

        // ---- 그 위: 상태이상 아이콘 줄 (방에 겹쳐 뜨고, 없으면 숨는다)
        const row = this.engine.createUI("statusRow");
        const rrt = row.getComponent(RectTransform);
        rrt.sortOrder = UILayer.HAND;
        rrt.setAnchor(0, 1, 1, 1);
        const top = PlayerHud.BAR_BOTTOM + PlayerHud.BAR_H + 4;
        rrt.setOffsets(12, -(top + 20), 12, top);
        this.statusRT = rrt;
        this.statusGO = row;
        this.chips = [];
        for (let i = 0; i < PlayerHud.CHIPS; i++) {
            const chip = UIKit.button(rrt, "chip" + i, "", () => this.openStatus(), { fontSize: 10 });
            chip.rt.setAnchor(0, 0, 0, 0);
            chip.rt.setPivot(0, 0);
            chip.rt.setSizeAndPosition(PlayerHud.CHIP_W, 18, i * (PlayerHud.CHIP_W + 3), 1);
            chip.go.setActive(false);
            this.chips.push(chip);
        }
        row.setActive(false);
        this.buildStatusDialog();

        // ---- 왼쪽 위: 돈, 지금 층과 방 종류
        const money = this.engine.createUI("money");
        const mrt0 = money.getComponent(RectTransform);
        this.moneyRT = mrt0;
        mrt0.setPivot(0, 0);
        mrt0.setSizeAndPosition(76, 18, 16, 16);
        money.addComponent(new UIRect({ color: "rgba(18, 13, 10, 0.82)", borderColor: "#5a4a3a", borderWidth: 1 }));
        const coin = mrt0.createChild("coin");
        UIKit.place(coin, 2, 1, 16, 16);
        coin.addComponent(new UIImage(Resource.image("cards"), { region: { x: 17 * 16, y: 0, width: 16, height: 16 } }));
        this.moneyText = UIKit.label(mrt0, "value", "", 20, 0, null, 18, { fontSize: 11, color: "#f0d878", verticalAlign: "middle" });

        const where = this.engine.createUI("levelName");
        const wrt = where.getComponent(RectTransform);
        this.levelRT = wrt;
        wrt.setPivot(0, 0);
        wrt.setSizeAndPosition(130, 18, 16 + 76 + 6, 16);
        where.addComponent(new UIRect({ color: "rgba(18, 13, 10, 0.82)", borderColor: "#5a4a3a", borderWidth: 1 }));
        this.levelText = UIKit.label(wrt, "value", "", 0, 0, null, 18, { fontSize: 11, color: "#a0d0f0", align: "center", verticalAlign: "middle" });

        this.logBack = this.engine.createUI("logBack");
        this.logBack.addComponent(new UIRect({ color: "rgba(18, 13, 10, 0.55)" }));
        this.logBack.setActive(false);

        // 메시지 줄: 긴 메시지는 여러 줄로 나뉘므로 넉넉하게 만들어 둔다
        this.lines = [];
        for (let i = 0; i < MessageLog.max * PlayerHud.LOG_WRAP; i++) {
            const go = this.engine.createUI("log");
            const rt = go.getComponent(RectTransform);
            rt.setPivot(0, 0);
            rt.setSizeAndPosition(w, 15, 22, this.logY + 4 + i * 15);
            this.lines.push(go.addComponent(new UIText("", { fontSize: 11, color: "#e8d9b8", align: "left", verticalAlign: "top" })));
        }
    }

    // 아래 막대 한 칸 (바탕 + 채움 + 글자). i번째 칸 (0..2)이 화면 폭을 3등분한다
    bottomBar(name, i, color) {
        const go = this.engine.createUI(name);
        const rt = go.getComponent(RectTransform);
        rt.sortOrder = UILayer.HAND;
        rt.setAnchor(i / 3, 1, (i + 1) / 3, 1);
        rt.setOffsets(i === 0 ? 12 : 3, -(PlayerHud.BAR_BOTTOM + PlayerHud.BAR_H), i === 2 ? 12 : 3, PlayerHud.BAR_BOTTOM);
        const back = go.addComponent(new UIRect({ color: "rgba(18, 13, 10, 0.88)", borderColor: "#5a4a3a", borderWidth: 1 }));
        const fill = rt.createChild("fill").addComponent(new UIRect({ color }));
        const label = rt.createChild("label");
        const lrt = label.getComponent(RectTransform);
        lrt.setAnchor(0, 0, 1, 1);
        lrt.setOffsets(4, 0, 4, 0);
        const text = label.addComponent(new UIText("", { fontSize: 10, color: "#ffffff", align: "left", verticalAlign: "middle" }));
        return { rt, fill, text, back };
    }

    // ---------- 상태이상 아이콘 · 목록 창 ----------
    buildStatusDialog() {
        const { root, box } = Modal.create(this.engine, "statusList", 300, 340, () => this.closeStatus());
        this.statusDlg = root;
        this.statusBox = box;
        UIKit.label(box, "title", "상태이상 · 방어도", 14, 10, null, 18, { fontSize: 14, fontWeight: "bold", color: UIKit.COLORS.gold });
        // 목록은 스크롤 (상태이상이 많을 수 있다)
        const list = box.createChild("list");
        const lrt = list.getComponent(RectTransform);
        lrt.setAnchor(0, 0, 1, 1);
        lrt.setOffsets(12, 36, 12, 52);
        list.addComponent(new UIRect({ color: "rgba(0, 0, 0, 0.25)" }));
        list.addComponent(new UIMask());
        this.statusContent = lrt.createChild("content").getComponent(RectTransform);
        const bar = lrt.createChild("scrollbar");
        bar.addComponent(new UIRect({ color: "rgba(232, 217, 184, 0.45)" }));
        this.statusScroll = list.addComponent(new UIScrollView({ content: this.statusContent, bar: bar.getComponent(RectTransform) }));
        this.statusRows = [];
        const close = UIKit.button(box, "close", "닫기", () => this.closeStatus(), { fontSize: 13 });
        close.rt.setAnchor(0, 1, 1, 1);
        close.rt.setOffsets(12, -44, 12, 10);
    }

    openStatus() {
        if (this.statusOpen) return;
        this.statusOpen = true;
        this._dlgKey = null;
        Modal.fit(this.engine, this.statusBox, 300, 340);
        Modal.show(this.statusDlg, true);
        this.statusScroll.scrollTo(0);
    }

    closeStatus() {
        if (!this.statusOpen) return;
        this.statusOpen = false;
        Modal.show(this.statusDlg, false);
    }

    // 아이콘 줄에 올릴 것들: 방어도(덩어리마다) → 버프 → 디버프
    statusEntries() {
        const p = this.player;
        const blocks = [...p.blocks].sort((a, b) => a.t - b.t).map((b) => ({ key: "block", name: "방어도", color: "#3c78b8", value: b.v, t: b.t, from: null, kind: "block" }));
        const list = Status.entries(p);
        return [...blocks, ...list.filter((e) => e.buff), ...list.filter((e) => !e.buff)];
    }

    // 아이콘 줄과 (열려 있으면) 목록 창을 지금 상태에 맞춘다
    updateStatus() {
        const entries = this.statusEntries();
        const key = entries.map((e) => `${e.key}${e.from ?? ""}:${e.value}:${e.t}`).join("|");
        this.statusGO.setActive(entries.length > 0);
        if (key !== this._statusKey || this._chipCap !== this.chipCap()) {
            this._statusKey = key;
            this._chipCap = this.chipCap();
            const cap = this._chipCap;
            const over = entries.length > cap;
            const shown = over ? cap - 1 : entries.length;
            this.chips.forEach((chip, i) => {
                chip.go.setActive(i < (over ? cap : entries.length));
                if (i >= (over ? cap : entries.length)) return;
                if (over && i === shown) {
                    chip.rect.color = "#3a332d";
                    chip.rect.borderColor = "#a89878";
                    chip.text.color = "#e8d9b8";
                    chip.text.setText(`+${entries.length - shown}`);
                    return;
                }
                const en = entries[i];
                chip.rect.color = en.color;
                chip.rect.borderColor = en.key === "block" ? "#8cc8f0" : en.buff ? "#5cc86c" : "#d8443c";
                chip.text.color = "#140c08";
                chip.text.setText(`${en.key === "block" ? "방" : en.name[0]}${en.value}`);
            });
        }
        if (!entries.length && this.statusOpen) this.closeStatus();
        if (this.statusOpen && key !== this._dlgKey) {
            this._dlgKey = key;
            for (const r of this.statusRows) r.destroy();
            this.statusRows = [];
            let y = 6;
            for (const e of entries) {
                const d = Status.describe(e);
                const color = e.key === "block" ? "#8cc8f0" : e.buff ? "#7cd47c" : "#f08c80";
                const go = this.statusContent.createChild("row");
                const rt = UIKit.place(go, 6, y, null, 52);
                go.addComponent(new UIRect({ color: "rgba(42, 35, 30, 0.95)", borderColor: UIKit.COLORS.border, borderWidth: 1 }));
                UIKit.label(rt, "t", d.title, 8, 5, null, 15, { fontSize: 12, fontWeight: "bold", color });
                UIKit.label(rt, "d", d.desc, 8, 22, null, 28, { fontSize: 10, color: "#c8b890", wrap: true, lineHeight: 1.25 });
                this.statusRows.push(go);
                y += 56;
            }
            this.statusScroll.contentHeight = y + 6;
        }
        if (this.statusOpen && Input.getButtonDown("cancel")) this.closeStatus();
    }

    // 한 줄에 놓을 수 있는 아이콘 수
    chipCap() {
        const screen = this.engine.canvas.width / this.engine.uiRoot.scale;
        return Math.max(4, Math.min(PlayerHud.CHIPS, Math.floor((screen - 24 + 3) / (PlayerHud.CHIP_W + 3))));
    }

    static setBar(bar, value, max, label, color) {
        const rt = bar.fill.getComponent(RectTransform);
        rt.setAnchor(0, 0, Math.max(0, Math.min(1, value / max)), 1);
        rt.setOffsets(1, 1, 1, 1);
        if (color) bar.fill.color = color;
        bar.text.setText(label);
    }

    // 왼쪽 위 칸들(돈·층·메시지)이 오른쪽 위 버튼들과 겹치지 않게 자리를 잡는다.
    //   버튼은 오른쪽 끝에서 4개(48 + 틈 8) 높이 16~64. 그 왼쪽 빈 폭(leftZone) 안에 돈·층을 한 줄로 놓을 수 있으면 한 줄,
    //   모자라면 돈 아래에 층을 놓는다. 메시지는 빈 폭이 넉넉하면 버튼 옆(위쪽), 아니면 버튼 줄 아래로 내려간다.
    fitWidth() {
        const screen = this.engine.canvas.width / this.engine.uiRoot.scale;
        const n = SidePanel.twoRows(this.engine) ? 4 : SidePanel.SLOTS;
        const buttons = 16 + n * SidePanel.BUTTON + (n - 1) * 8;
        const zone = Math.max(60, Math.floor(screen - buttons - 8 - 16)); // x=16 부터 쓸 수 있는 폭
        const moneyW = 76;
        const oneRow = zone >= moneyW + 6 + 70;
        const levelW = oneRow ? Math.min(130, zone - moneyW - 6) : Math.min(130, zone);
        const rowsBottom = oneRow ? 34 : 56;               // 돈·층 칸이 끝나는 y
        const buttonBottom = 16 + SidePanel.BUTTON + 6;     // 버튼 줄이 끝나는 y
        // 메시지가 버튼 옆에 놓이려면 폭이 160은 돼야 한다. 아니면 버튼 줄 아래(= 패널이 시작하는 높이)로
        const besideOk = zone >= 160;
        const logY = besideOk ? rowsBottom + 6 : Math.max(rowsBottom + 6, buttonBottom);
        const key = `${zone}:${oneRow}:${logY}`;
        this.leftZone = zone;
        if (key === this._fitKey) return;
        this._fitKey = key;
        this.logY = logY;
        this._logVersion = -1; // 메시지 칸 다시 배치
        this.moneyRT.setSizeAndPosition(moneyW, 18, 16, 16);
        this.levelRT.setSizeAndPosition(levelW, 18, oneRow ? 16 + moneyW + 6 : 16, oneRow ? 16 : 38);
    }

    update() {
        const s = this.player.stats;
        const block = this.player.block;
        const p = this.player;
        PlayerHud.setBar(this.hpBar, s.hp, s.maxHp, block ? `체력 ${s.hp}/${s.maxHp} · 방어 ${block}` : `체력 ${s.hp}/${s.maxHp}`);
        this.hpBack.borderColor = block ? "#8cc8f0" : "#5a4a3a";
        this.hpBack.borderWidth = block ? 2 : 1;
        const lock = p.drawLock > 0 ? ` · 쉼 ${p.drawLock}` : "";
        PlayerHud.setBar(this.energyBar, Math.min(p.energy, p.maxEnergy), p.maxEnergy, `기력 ${p.energy}/${p.maxEnergy}${lock}`, p.energy > 0 ? "#c8a02c" : "#6a5a3a");
        PlayerHud.setBar(this.manaBar, p.mana, p.maxMana, `마나 ${p.mana}/${p.maxMana}`);

        this.updateStatus();
        this.fitWidth();

        // 메시지: 최근 logLines줄 (설정)
        const shown = Settings.get("logLines");
        const logWidth = this.logWidth;
        const key = MessageLog.version + ":" + shown + ":" + logWidth + ":" + this.logY;
        if (key !== this._logVersion) {
            this._logVersion = key;
            const messages = MessageLog.lines.slice(-shown);
            const rows = [];
            messages.forEach((m, i) => {
                const opacity = 0.55 + 0.45 * (i + 1) / messages.length;
                for (const text of PlayerHud.wrap(m.text, logWidth - 14, this.engine.uiRoot.scale)) rows.push({ text, color: m.color, opacity });
            });
            // 오래된 줄부터 버려서 최근 메시지가 늘 보이게 (줄 수 한도 = 설정 × 2)
            while (rows.length > Math.min(this.lines.length, shown * 2)) rows.shift();
            this.lines.forEach((text, i) => {
                const row = rows[i];
                text.setText(row ? row.text : "");
                if (row) {
                    text.color = row.color;
                    text.opacity = row.opacity;
                }
                text.getComponent(RectTransform).setSizeAndPosition(logWidth - 8, 15, 22, this.logY + 4 + i * 15);
            });
            const n = Math.min(rows.length, this.lines.length);
            const brt = this.logBack.getComponent(RectTransform);
            brt.setPivot(0, 0);
            brt.setSizeAndPosition(logWidth, n * 15 + 6, 16, this.logY);
            this.logBack.setActive(n > 0);
        }

        this.moneyText.setText(`${this.player.money} G`);
        if (this.run) {
            const node = this.run.node;
            this.levelText.setText(this.run.state === "room" && node ? `${this.run.floorNo}층 · ${RunMap.TYPES[node.type].name}` : `${this.run.floorNo}층 · 지도`);
        }
    }
}

/* ===== assets/dat/ui/HandBar.js ===== */
// 화면 아래 패. 왼쪽 탭으로 [행동 패]와 [인벤토리 패](소지품: 물약·장비·젬)를 바꿔 본다 (Tab 키). 한 줄로 펼쳐진다 (많으면 겹친다).
//   쓸 수 있는 카드를 누르면 바로 칸 지정이 된다: 안내줄에 설명과 [쓰기] [묘지로] [취소] (TileTargeting).
//     칸을 골라 쓰는 카드는 땅을 탭하면 쓰고, 칸이 필요 없는 카드는 나를 누르거나 [사용] (한 번 더 눌러도 쓴다).
//   장비·젬·지금 못 쓰는 카드는 위에 설명 칸이 뜬다 [장착]/[끼우기]/[사용] [버리기] (젬 칸이 있으면 [젬]).
//   숫자 키 1~9: 그 자리 카드를 고르기 (다시 누르면 쓰기)
// 카드 줄 위 왼쪽: [드로우 (덱 n)] [대기], 오른쪽: 덱·묘지 장수 (누르면 이번 전투의 덱 보기)
// 카드 쓰기·버리기·장착은 턴을 쓰지 않는다. 뽑기·대기만 1턴.
class HandBar extends Component {
    static HEIGHT = 196;   // 아래에서 차지하는 높이 (UI 단위). 카메라가 이만큼 피해서 방을 맞춘다
    static CARD_W = 60;
    static CARD_H = 100;
    static BUTTON = 44;
    static BUTTON_W = 72;
    static TAB_W = 46;   // 왼쪽 탭 폭

    // options: { engine, player, world, targeting, gems(GemDialog), deckView(DeckViewer) }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.world = options.world;
        this.targeting = options.targeting;
        this.gems = options.gems ?? null;
        this.deckView = options.deckView ?? null;
        this.selected = null;
        this.mode = "action"; // 보이는 패: "action" 행동 패 / "inv" 인벤토리 패
        this.views = [];
        this._key = null;
    }

    get cards() {
        return this.player.cards;
    }

    start() {
        Input.defineButton("draw", ["Space", "KeyR"]);
        Input.defineButton("wait", ["KeyZ"]);
        Input.defineButton("interact", ["KeyE"]);
        Input.defineButton("handTab", ["Tab", "KeyI"]);
        const e = this.engine;

        // 카드 줄 바탕
        this.tray = e.createUI("handTray");
        const trt = this.tray.getComponent(RectTransform);
        trt.sortOrder = UILayer.HAND;
        trt.setAnchor(0, 1, 1, 1);
        trt.setOffsets(0, -(HandBar.CARD_H + 20), 0, 0);
        this.tray.addComponent(new UIRect({ color: "rgba(18, 13, 10, 0.78)", borderColor: "#5a4a3a", borderWidth: 1 }));
        this.tray.addComponent(new UIButton({ onTap: () => this.select(null) })); // 빈 곳을 누르면 고르기 해제
        this.trayRT = trt;
        this.cardsRoot = trt.createChild("cards").getComponent(RectTransform);
        this.cardsRoot.setAnchor(0, 0, 1, 1);
        this.cardsRoot.setOffsets(HandBar.TAB_W, 0, 0, 0);
        // 왼쪽 탭: 행동 패 / 인벤토리 패
        const tabH = (HandBar.CARD_H + 20 - 12) / 2;
        this.tabs = {};
        for (const [i, mode] of ["action", "inv"].entries()) {
            const b = UIKit.button(trt, "tab " + mode, "", () => this.setMode(mode), { fontSize: 10 });
            b.rt.setAnchor(0, 0, 0, 0);
            b.rt.setSizeAndPosition(HandBar.TAB_W - 8, tabH, 4 + (HandBar.TAB_W - 8) / 2, 4 + tabH / 2 + i * (tabH + 4));
            if (b.text.wrap !== undefined) b.text.wrap = true;
            this.tabs[mode] = b;
        }
        this.emptyText = UIKit.label(trt, "empty", "", 0, 40, null, 20, { fontSize: 11, color: UIKit.COLORS.dim, align: "center" });

        // 버튼 줄
        // [드로우] 덱에서 1장 뽑기 (1턴) · [대기] 아무것도 안 하고 1턴
        const y = -(HandBar.CARD_H + 20 + 6 + HandBar.BUTTON / 2);
        const bw = HandBar.BUTTON_W;
        this.drawButton = this.textButton("draw", "드로우", 12 + bw / 2, y, () => this.draw());
        this.waitButton = this.textButton("wait", "대기", 12 + bw / 2 + (bw + 6), y, () => this.wait());
        // [상호작용] 서 있는 칸의 물건·바로 옆의 출구·상인·모닥불·상자 (E 키와 같다). 할 것이 있으면 켜지고 이름이 보인다
        this.interactButton = this.textButton("interact", "상호작용", 12 + bw / 2 + 2 * (bw + 6), y, () => this.interact());
        this.deckText = this.drawButton.sub;

        // 오른쪽: 덱·묘지 (누르면 덱 보기)
        this.pile = UIKit.button(e.createUI("pileRoot").getComponent(RectTransform), "pile", "", () => this.deckView && this.deckView.open(), { fontSize: 11 });
        const prt = this.pile.go.getComponent(RectTransform).parent;
        prt.sortOrder = UILayer.HAND;
        prt.setAnchor(1, 1, 1, 1);
        prt.setOffsets(-130, y - 16, 12, -(y + 16));
        this.pile.rt.setAnchor(0, 0, 1, 1);

        // 고른 카드 설명 칸 (버튼 줄 위)
        this.detail = e.createUI("cardDetail");
        const drt = this.detail.getComponent(RectTransform);
        drt.sortOrder = UILayer.HAND + 1;
        drt.setAnchor(0.5, 1, 0.5, 1);
        this.detail.addComponent(new UIRect({ color: "rgba(30, 24, 20, 0.95)", borderColor: UIKit.COLORS.gold, borderWidth: 1 }));
        this.detail.addComponent(new UIElement());
        this.detailTitle = UIKit.label(drt, "name", "", 10, 7, null, 16, { fontSize: 12, fontWeight: "bold" });
        this.detailText = UIKit.label(drt, "text", "", 10, 26, null, 60, { fontSize: 12, color: "#d8c8a0", wrap: true, lineHeight: 1.35, rich: true });
        this._ctx = document.createElement("canvas").getContext("2d");
        this.useButton = UIKit.button(drt, "use", "사용", () => this.useSelected());
        this.discardButton = UIKit.button(drt, "discard", "버리기", () => this.discardSelected());
        this.gemButton = UIKit.button(drt, "gems", "젬", () => this.selected && this.gems && this.gems.openCard(this.selected));
        this.detail.setActive(false);
    }

    // 글자 버튼 (위: 이름, 아래: 작은 글자)
    textButton(name, label, x, y, onTap) {
        const go = this.engine.createUI("action " + name);
        const rt = go.getComponent(RectTransform);
        rt.sortOrder = UILayer.HAND;
        rt.setAnchor(0, 1, 0, 1);
        rt.setSizeAndPosition(HandBar.BUTTON_W, HandBar.BUTTON, x, y);
        const b = UIKit.button(rt, "button", "", onTap, { fontSize: 13 });
        b.rt.setAnchor(0, 0, 1, 1);
        b.rect.borderColor = "#8a7050";
        b.text.getComponent(RectTransform).setOffsets(0, 4, 0, 16);
        b.text.setText(label);
        b.text.fontWeight = "bold";
        const sub = b.rt.createChild("sub");
        const srt = sub.getComponent(RectTransform);
        srt.setAnchor(0, 1, 1, 1);
        srt.setOffsets(2, -17, 2, 3);
        b.sub = sub.addComponent(new UIText("", { fontSize: 10, color: "#a89878" }));
        b.go = go;
        return b;
    }

    // 지금 보이는 패의 카드들 (탭에 따라 행동 카드 또는 소지품)
    get order() {
        return this.mode === "inv" ? [...this.cards.items] : [...this.cards.actions];
    }

    setMode(mode) {
        if (this.mode === mode) return;
        this.mode = mode;
        if (this.selected && !this.order.includes(this.selected)) {
            this.targeting.cancel(true);
            this.selected = null;
        }
        this._key = null;
    }

    select(card) {
        if (this.targeting.active && this.targeting.card && this.targeting.card !== card) this.targeting.cancel(true);
        this.selected = card;
        this._justSelected = true; // 이번 프레임의 탭은 바깥 탭으로 치지 않는다
        this._detailKey = null;
        this.layout();
        if (!card) return;
        // 쓸 수 있는 카드는 바로 칸 지정 (칸이 필요 없는 카드는 내 칸)
        if (this.direct(card)) this.targeting.beginCard(card);
    }

    // 고르자마자 칸 지정으로 가는 카드인가 (장비·젬은 설명 칸에서 장착·끼우기)
    direct(card) {
        const d = card.def;
        return !!(d.use && !d.slot && !d.gem && this.player.alive && this.player.canUse(card));
    }

    tapCard(card) {
        if (Modal.isOpen || !this.player.alive) return;
        if (this.selected === card) {
            if (this.targeting.active && this.targeting.request.self) this.targeting.confirm(); // 나에게 쓰는 카드는 한 번 더 누르면 쓴다
            else if (card.target) this.select(null); // 칸 카드는 다시 누르면 취소
            else this.useSelected();
            return;
        }
        this.select(card);
    }

    useSelected() {
        const card = this.selected;
        if (!card || !this.player.alive || !this.cards.hand.includes(card)) return;
        if (card.def.gem) {
            if (this.gems) this.gems.openGem(card);
            return;
        }
        if (card.def.slot) {
            if (this.cards.isEquipped(card)) this.cards.unequip(card);
            else this.cards.equip(card);
            return;
        }
        if (!card.def.use) {
            MessageLog.add(`${josa(card.def.name, "은는")} 쓸 수 없다`, "#c8b890");
            return;
        }
        if (card.target) this.targeting.beginCard(card);
        else {
            this.player.requestCard(card);
            this.selected = null;
        }
    }

    discardSelected() {
        const card = this.selected;
        if (!card || !this.player.alive) return;
        if (!this.player.discardByHand(card)) return;
        if (!card.isSkill) MessageLog.add(`${josa(card.name, "을를")} 버렸다`, "#e8c860");
        this.targeting.cancel(true);
        this.selected = null;
    }

    update() {
        const p = this.player;
        const c = this.cards;
        const lock = p.drawLock > 0;
        this.deckText.setText(lock ? `쉼 ${p.drawLock}턴` : c.deck.length ? `1장 · 1턴` : c.graveyard.length ? "묘지 섞기" : "덱 없음");
        this.deckText.color = lock ? "#f0a070" : c.deck.length ? "#a8b8d0" : c.graveyard.length ? "#a0b8e8" : "#8a7a6a";
        this.waitButton.sub.setText("1턴 쉬기");
        this.refreshInteract();
        this.pile.text.setText(`덱 ${c.deck.length} · 묘지 ${c.graveyard.length}`);

        if (this.selected && !c.hand.includes(this.selected)) this.selected = null;
        // 칸 지정을 [취소]하면 카드 고르기도 풀린다
        const tc = this.targeting.active ? this.targeting.card : null;
        if (this._tcard && !tc && this.selected === this._tcard) this.selected = null;
        this._tcard = tc;
        this.refreshTabs();
        if (this.targeting.active && this.targeting.card && this.targeting.card !== this.selected) this.selected = this.targeting.card;

        const width = Math.round(this.engine.canvas.width / this.engine.uiRoot.scale);
        const key = c.version + ":" + width + ":" + this.mode;
        if (key !== this._key) {
            this._key = key;
            this.rebuild();
        }
        this.refreshViews();
        this.refreshDetail(width);
        this.dismissDetail();

        if (!p.alive || Modal.isOpen) return;
        if (Input.getButtonDown("draw")) {
            if (this.targeting.active) this.targeting.confirm();
            else this.draw();
        }
        if (Input.getButtonDown("wait")) this.wait();
        if (Input.getButtonDown("interact")) this.interact(); // E 키 (아래 [상호작용] 버튼도 같다)
        if (Input.getButtonDown("handTab")) this.setMode(this.mode === "inv" ? "action" : "inv");
        for (let i = 1; i <= 9; i++) {
            if (Input.getKeyDown("Digit" + i)) {
                const card = this.order[i - 1];
                if (card) this.tapCard(card);
            }
        }
    }

    draw() {
        this.targeting.cancel(true);
        this.selected = null;
        this.player.wantsDraw = true;
    }

    wait() {
        this.targeting.cancel(true);
        this.selected = null;
        this.player.wantsWait = true;
    }

    // 지금 상호작용할 수 있는 것들 [{ e, here }] (서 있는 칸의 물건이 먼저, 그다음 바로 옆)
    interactables() {
        const p = this.player;
        const out = [];
        for (const e of this.world.entitiesAt(p.x, p.y)) if (e !== p && e.interactable) out.push({ e, here: true });
        for (const [dx, dy] of Entity.DIRS) {
            const e = this.world.entityAt(p.x + dx, p.y + dy);
            if (e && e.interactable && !out.some((o) => o.e === e)) out.push({ e, here: false });
        }
        return out;
    }

    // 상호작용 버튼: 할 것이 있으면 켜고 첫 대상의 이름을 보여 준다
    refreshInteract() {
        const list = this.player.alive && this.world.entitiesAt ? this.interactables() : [];
        const first = list[0];
        const name = first ? (first.e.displayName ?? "") : "";
        const label = first ? (list.length > 1 ? `${name} 외 ${list.length - 1}` : name) : "주변에 없음";
        const key = (first ? name + list.length : "-") + (this.targeting.active ? "t" : "");
        if (key === this._interactKey) return;
        this._interactKey = key;
        UIKit.setEnabled(this.interactButton, list.length > 0);
        this.interactButton.sub.setText(label || "E");
        this.interactButton.sub.color = first ? "#f0d878" : "#8a7a6a";
    }

    // 상호작용: 바로 옆에 하나뿐이면 바로, 아니면 칸 고르기
    interact() {
        if (this.targeting.active && this.targeting.request.kind === "interact") return this.targeting.cancel();
        const p = this.player;
        // 서 있는 칸의 떨어진 물건이 먼저다 (물건은 그 칸 위에서만 가진다)
        const under = this.world.entitiesAt(p.x, p.y).find((e) => e !== p && e.interactable);
        if (under) {
            p.wantsInteract = { x: p.x, y: p.y };
            return;
        }
        const near = [];
        for (const [dx, dy] of Entity.DIRS) {
            const e = this.world.entityAt(p.x + dx, p.y + dy);
            if (e && e.interactable) near.push(e);
        }
        if (near.length === 1) {
            p.wantsInteract = { x: near[0].x, y: near[0].y };
            return;
        }
        this.targeting.begin({
            kind: "interact", name: "상호작용", range: 1, includeSelf: false, taps: 1, color: "#7cc4e8", verb: "확인",
            onConfirm: (t) => { p.wantsInteract = t; }
        });
    }

    // 카드 UI를 새로 만든다 (패가 바뀌거나 화면 폭이 바뀌면)
    rebuild() {
        for (const v of this.views) v.go.destroy();
        this.views = [];
        CardInspector.untrack(this);
        const list = this.order;
        for (const card of list) {
            const go = this.cardsRoot.createChild("card");
            const view = go.addComponent(new CardView(card, this.cards.isEquipped(card)));
            view.layout(HandBar.CARD_W);
            go.addComponent(new UIButton({ onTap: () => this.tapCard(card) }));
            this.views.push({ go, view, card });
            CardInspector.track(this, go.getComponent(RectTransform), card, false); // 마우스를 올리면 크게 (전투 중이라 수치만)
        }
        this.emptyText.setText(list.length ? "" : this.mode === "inv" ? "소지품 패가 비었다 · 물약·장비·젬이 여기 들어온다" : "행동 패가 비었다 · [드로우](Space)로 덱에서 카드를 뽑는다 (1턴)");
        this.layout();
    }

    // 탭 글자: 장수 / 한도. 보고 있는 탭은 밝게
    refreshTabs() {
        const c = this.cards;
        const n = c.counts();
        const over = c.overflow; // 소지품이 넘쳐서 행동 패 자리를 차지한 장수
        const key = `${this.mode}:${n.a}/${c.actionLimit}:${n.i}/${c.invLimit}:${over}`;
        if (key === this._tabKey) return;
        this._tabKey = key;
        // 넘치면: 행동 탭 "3/4 (-1칸)" 빨갛게, 소지품 탭 "5/4" 주황
        const label = {
            action: over ? `행동\n${n.a}/${c.actionLimit}\n(-${over}칸)` : `행동\n${n.a}/${c.actionLimit}`,
            inv: `소지품\n${n.i}/${c.invLimit}`
        };
        for (const [mode, b] of Object.entries(this.tabs)) {
            const warn = over > 0;
            b.text.setText(label[mode]);
            b.text.fontSize = mode === "action" && over ? 9 : 10;
            const on = mode === this.mode;
            b.rect.color = warn && mode === "action" ? (on ? "#7a3428" : "#4a2420") : on ? "#6a5238" : "rgba(42, 35, 30, 0.95)";
            b.rect.borderColor = warn ? "#e07050" : UIKit.COLORS.border;
            b.text.color = warn ? (mode === "action" ? "#ffb0a0" : "#f0b070") : on ? UIKit.COLORS.gold : UIKit.COLORS.dim;
        }
    }

    // 카드 자리: 가운데 정렬, 폭이 모자라면 겹친다
    layout() {
        const width = this.engine.canvas.width / this.engine.uiRoot.scale - HandBar.TAB_W;
        const n = this.views.length;
        if (!n) return;
        const w = HandBar.CARD_W;
        const gap = 6;
        const split = n;
        const extra = 0;
        const avail = width - 16;
        let step = w + gap;
        if (n > 1 && n * w + (n - 1) * gap + extra > avail) step = Math.max(14, (avail - w - extra) / (n - 1));
        const total = w + step * (n - 1) + extra;
        let x = (width - total) / 2;
        this.views.forEach((v, i) => {
            if (i === split && i > 0) x += extra;
            const lift = v.card === this.selected ? 12 : 0;
            CardView.place(v.go, x, 10 - lift, w, HandBar.CARD_H);
            x += step;
        });
        // 고른 카드가 옆 카드에 가리지 않게 맨 위로 (그리는 순서 = 자식 순서)
        const kids = this.cardsRoot.children;
        const sel = this.views.find((v) => v.card === this.selected);
        const order = this.views.map((v) => v.go.getComponent(RectTransform)).filter((rt) => !sel || rt !== sel.go.getComponent(RectTransform));
        if (sel) order.push(sel.go.getComponent(RectTransform));
        kids.length = 0;
        kids.push(...order);
    }

    refreshViews() {
        for (const v of this.views) {
            const card = v.card;
            const usable = this.player.canUse(card);
            const rt = v.go.getComponent(RectTransform);
            rt.alpha = usable || card === this.selected ? 1 : 0.55;
            v.view.setSelected(card === this.selected);
        }
        if (this._layoutSel !== this.selected) {
            this._layoutSel = this.selected;
            this.layout();
        }
    }

    // 고른 카드 설명 칸
    // 설명 창이 떠 있을 때 창 바깥을 탭(끌지 않고 뗌)하면 고르기를 푼다. 칸을 고르는 중(대상 지정)에는 땅 탭이 대상 고르기라 건드리지 않는다
    dismissDetail() {
        const fresh = this._justSelected;
        this._justSelected = false;
        if (!this.selected || fresh || this.targeting.active || Modal.isOpen || !this.detail.isActive) return;
        const rt = this.detail.getComponent(RectTransform);
        for (const p of Input.pointers) {
            if (p.released && p.dragDistance <= Input.dragThreshold && !rt.containsPoint(p.position.x, p.position.y)) {
                this.selected = null;
                this._detailKey = null;
                this.layout();
                return;
            }
        }
    }

    refreshDetail(width) {
        const card = this.selected;
        const show = !!card && !this.targeting.active && !Modal.isOpen;
        this.detail.setActive(show);
        if (!show) return;
        const key = card.id + ":" + this.cards.version + ":" + width + ":" + this.player.energy + ":" + this.player.mana;
        if (key === this._detailKey) return;
        this._detailKey = key;
        const w = Math.min(340, width - 24);
        const body = card.text(false);
        const terms = CardInspector.enabled() ? CardText.glossary(body) : "";
        const text = terms ? `${body}\n\n${terms}` : body;
        this.detailText.setText(text);
        const lines = this.detailText.measureLines(this._ctx, w - 20);
        const th = Math.ceil(lines * 12 * 1.35);
        const h = 26 + th + 8 + 34;
        const bottom = HandBar.CARD_H + 20 + 6 + HandBar.BUTTON + 8;
        this.detail.getComponent(RectTransform).setOffsets(-w / 2, -(bottom + h), -w / 2, bottom);
        const cost = CardDef.costText(card.cost);
        const worn = this.cards.isEquipped(card) ? " · 착용 중" : "";
        this.detailTitle.setText(`${card.name} · ${CardDef.kindName(card.def)}${cost ? " · " + cost : ""}${worn}`);
        this.detailText.getComponent(RectTransform).setOffsets(10, 26, 10, -(26 + th + 4));

        const def = card.def;
        const socketed = def.spell && Spell.data(card).sockets > 0;
        const buttons = [this.useButton, ...(socketed ? [this.gemButton] : []), this.discardButton];
        this.gemButton.go.setActive(!!socketed);
        buttons.forEach((b, i) => {
            b.rt.setAnchor(i / buttons.length, 1, (i + 1) / buttons.length, 1);
            b.rt.setOffsets(i === 0 ? 8 : 3, -38, i === buttons.length - 1 ? 8 : 3, 8);
        });
        const payable = this.player.canUse(card);
        this.useButton.text.setText(def.slot ? (this.cards.isEquipped(card) ? "해제" : "장착") : def.gem ? "끼우기" : card.target ? "칸 고르기" : "사용");
        UIKit.setEnabled(this.useButton, !!(def.slot || def.gem || (def.use && payable)));
        if (socketed) this.gemButton.text.setText(`젬 ${Spell.data(card).gems.length}/${Spell.data(card).sockets}`);
        this.discardButton.text.setText(card.isSkill ? (def.noDiscard ? "묘지로 (불가)" : "묘지로") : "버리기");
        UIKit.setEnabled(this.discardButton, !def.noDiscard);
    }
}

/* ===== assets/dat/ui/MapScreen.js ===== */
// 지도 화면: 이 층의 방 지도 (아이작식 격자). 가 본 방과 그 옆 방만 보인다. 화면을 가득 덮는다.
//   고르기 모드 (방을 나왔을 때): 보이는 방(지금 방 빼고)이 금색으로 깜빡이고, 누르면 그 방으로 들어간다.
//     우두머리를 쓰러뜨렸으면 아래 버튼이 [다음 층으로]가 된다 (남은 방을 더 둘러봐도 된다).
//   보기 모드 (방 안에서 지도 버튼·M): 지도를 본다. [닫기]
// 칸 그림은 map_icons.png (전투·정예·상점·휴식·보물·우두머리·시작), 칸 사이 선은 MapLines가 그린다.
class MapScreen extends Component {
    static SPACING = 56;   // 칸 간격 최댓값 (큰 층은 화면 너비에 맞게 줄인다)
    static NODE = 34;
    static MIN_SPACING = 26;

    // options: { engine, run, deckView }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.run = options.run;
        this.deckView = options.deckView ?? null;
        this.equipDialog = options.equipDialog ?? null;
        this.mode = null; // "choose" | "view"
        this.nodes = new Map(); // id → { go, rt, ring, node }
        this.built = null;      // 칸을 만들어 둔 RunMap (층이 바뀌면 다시)
    }

    get isOpen() {
        return this.mode !== null;
    }

    start() {
        Input.defineButton("map", ["KeyM"]);
        const e = this.engine;
        this.root = e.createUI("mapScreen");
        const rrt = this.root.getComponent(RectTransform);
        rrt.setAnchor(0, 0, 1, 1);
        rrt.setOffsets(0, 0, 0, 0);
        this.root.addComponent(new UIRect({ color: "rgba(16, 12, 9, 0.97)" }));
        this.root.addComponent(new UIElement());

        this.title = UIKit.label(rrt, "title", "", 14, 12, null, 20, { fontSize: 15, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.sub = UIKit.label(rrt, "sub", "", 14, 34, null, 16, { fontSize: 11, color: "#c8b890" });
        // 범례
        const legend = rrt.createChild("legend");
        this.legend = UIKit.place(legend, 14, 54, null, 18);
        Object.entries(RunMap.TYPES).forEach(([type, info], i) => {
            const icon = this.legend.createChild("icon");
            UIKit.place(icon, i * 48, 0, 16, 16);
            icon.addComponent(new UIImage(Resource.image("map_icons"), { region: { x: info.icon * 16, y: 0, width: 16, height: 16 } }));
            UIKit.label(this.legend, "name", info.name, i * 48 + 18, 1, 30, 16, { fontSize: 9, color: info.color });
        });

        const list = rrt.createChild("list");
        this.list = list.getComponent(RectTransform);
        this.list.setAnchor(0, 0, 1, 1);
        this.list.setOffsets(8, 78, 8, 56); // 넓은 화면에선 update에서 가운데 좁게
        list.addComponent(new UIRect({ color: "rgba(40, 32, 24, 0.6)", borderColor: UIKit.COLORS.border, borderWidth: 1 }));
        list.addComponent(new UIMask());
        this.content = this.list.createChild("content").getComponent(RectTransform);
        const lines = this.content.createChild("lines");
        lines.getComponent(RectTransform).setAnchor(0, 0, 1, 1);
        this.lines = lines.addComponent(new MapLines(this));
        const bar = this.list.createChild("scrollbar");
        bar.addComponent(new UIRect({ color: "rgba(232, 217, 184, 0.45)" }));
        this.scroll = list.addComponent(new UIScrollView({ content: this.content, bar: bar.getComponent(RectTransform) }));

        this.buildNodes();

        // 아래 버튼
        this.deckButton = UIKit.button(rrt, "deck", "덱 보기", () => this.deckView && this.deckView.open(), { fontSize: 12 });
        this.deckButton.rt.setAnchor(0, 1, 1 / 3, 1);
        this.deckButton.rt.setOffsets(12, -46, 3, 10);
        // 지도 화면은 아래 패를 가려서, 장비는 여기서 입고 벗는다
        this.equipButton = UIKit.button(rrt, "equip", "장비", () => this.equipDialog && this.equipDialog.open(), { fontSize: 12 });
        this.equipButton.rt.setAnchor(1 / 3, 1, 2 / 3, 1);
        this.equipButton.rt.setOffsets(3, -46, 3, 10);
        this.closeButton = UIKit.button(rrt, "close", "닫기", () => this.onThird(), { fontSize: 12 });
        this.closeButton.rt.setAnchor(2 / 3, 1, 1, 1);
        this.closeButton.rt.setOffsets(3, -46, 12, 10);

        this.root.setActive(false);
    }

    // 이 층 지도의 칸들을 만든다 (층이 바뀌면 다시)
    buildNodes() {
        for (const n of this.nodes.values()) n.go.destroy();
        this.nodes.clear();
        const map = this.run.map;
        this.built = map;
        for (const node of map.nodes.values()) {
            const info = RunMap.TYPES[node.type];
            const go = this.content.createChild("node " + node.id);
            const rt = go.getComponent(RectTransform);
            const ring = rt.createChild("ring");
            ring.getComponent(RectTransform).setAnchor(0, 0, 1, 1);
            ring.getComponent(RectTransform).setOffsets(-4, -4, -4, -4);
            const ringRect = ring.addComponent(new UIRect({ color: "rgba(232, 184, 64, 0.18)", borderColor: UIKit.COLORS.gold, borderWidth: 2 }));
            const back = go.addComponent(new UIRect({ color: "#2a231e", borderColor: info.color, borderWidth: 1 }));
            const icon = rt.createChild("icon");
            icon.getComponent(RectTransform).setAnchor(0, 0, 1, 1);
            icon.getComponent(RectTransform).setOffsets(3, 3, 3, 3);
            icon.addComponent(new UIImage(Resource.image("map_icons"), { region: { x: info.icon * 16, y: 0, width: 16, height: 16 } }));
            go.addComponent(new UIButton({ onTap: () => this.tapNode(node) }));
            // 아직 뭔가 남은 방 표시 (못 받은 보상 · 안 연 상자 · 안 쓴 모닥불 · 안 산 물건): 오른쪽 위 노란 느낌표
            const badge = rt.createChild("badge");
            UIKit.place(badge, MapScreen.NODE - 9, -7, 16, 16); // 크기·자리는 update에서 칸 크기에 맞춘다
            badge.addComponent(new UIRect({ color: "#f0c030", borderColor: "#140c08", borderWidth: 1 }));
            const badgeText = UIKit.label(badge.getComponent(RectTransform), "!", "!", 0, 0, 16, 16, { fontSize: 12, fontWeight: "bold", color: "#140c08", align: "center", verticalAlign: "middle" });
            badgeText.getComponent(RectTransform).setAnchor(0, 0, 1, 1);
            badgeText.getComponent(RectTransform).setOffsets(0, 0, 0, 0);
            badge.setActive(false);
            go.setActive(false);
            this.nodes.set(node.id, { go, rt, ring, ringRect, back, node, badge, badgeText });
        }
        this._width = null;
    }

    // 아래 셋째 버튼: 고르는 중에는 [다음 층으로] (내려갈 수 있을 때), 보기 모드에서는 [닫기]
    onThird() {
        if (this.mode === "choose") {
            if (this.run.canDescend) this.run.descend();
            return;
        }
        this.close();
    }

    // choose: 고르기 모드 (방을 나와서), 아니면 보기 모드
    open(choose) {
        this.mode = choose ? "choose" : "view";
        if (this.built !== this.run.map) this.buildNodes();
        if (!this.root.isActive) Modal.show(this.root, true);
        this._width = null;
        this.refresh();
        this.scrollToCurrent();
    }

    close() {
        if (!this.mode) return;
        this.mode = null;
        Modal.show(this.root, false);
    }

    toggleView() {
        if (this.mode === "view") this.close();
        else if (!this.mode && !Modal.isOpen && this.run.state === "room") this.open(false);
    }

    tapNode(node) {
        if (this.mode !== "choose") return;
        if (!this.run.choices().some((n) => n.id === node.id)) {
            MessageLog.add("거기로는 갈 수 없다 (지도에 보이는 방만)", "#c8b890");
            return;
        }
        this.run.enter(node.id);
    }

    // 칸 자리 (content 왼쪽 위 기준, UI 단위). 격자 가운데가 가로 가운데
    nodePos(node, width) {
        const b = this.run.map.bounds();
        const sp = this.spacing;
        const span = (b.maxY - b.minY) * sp;
        const view = this.list && this.list.rect ? this.list.rect.height / this.list.uiRoot.scale : 0;
        const top = Math.max(34, (view - span) / 2); // 화면이 남으면 가운데로
        return { x: width / 2 + (node.x - (b.minX + b.maxX) / 2) * sp, y: top + (node.y - b.minY) * sp };
    }

    get contentHeight() {
        const b = this.run.map.bounds();
        return 34 * 2 + (b.maxY - b.minY) * this.spacing;
    }

    // 칸 간격: 가로 칸 수가 많은 큰 층은 화면 너비에 맞춰 줄인다 (세로는 스크롤)
    get spacing() {
        return this._spacing ?? MapScreen.SPACING;
    }

    fitSpacing(width) {
        const b = this.run.map.bounds();
        const cols = Math.max(1, b.maxX - b.minX);
        const fit = Math.floor((width - 40) / cols);
        this._spacing = Math.max(MapScreen.MIN_SPACING, Math.min(MapScreen.SPACING, fit));
        this._nodeSize = Math.round(MapScreen.NODE * Math.min(1, this._spacing / 48));
    }

    scrollToCurrent() {
        const run = this.run;
        const node = run.map.get(run.pending ?? run.current ?? run.map.start.id);
        const y = this.nodePos(node, this._width || 300).y;
        const view = this.scroll.viewportHeight || 400;
        this.scroll.contentHeight = this.contentHeight;
        this.scroll.scrollTo(y - view * 0.5);
    }

    refresh() {
        const run = this.run;
        const choices = new Set(run.choices().map((n) => n.id));
        const visited = new Set(run.visited);
        const shown = run.map.revealed(run.visited);
        if (run.pending) shown.add(run.pending);
        this.title.setText(this.mode === "choose" ? `다음 방을 고른다 · ${run.floorNo}층` : `${run.floorNo}층 지도`);
        this.sub.setText(`체력 ${run.player.stats.hp}/${run.player.stats.maxHp} · ${run.player.money} G · 덱 ${run.player.cards.allActions.length}장 · ${run.bossCleared ? "우두머리를 쓰러뜨렸다" : "우두머리 방을 찾아라"}`);
        for (const [id, n] of this.nodes) {
            n.go.setActive(shown.has(id));
            const pending = run.roomPending(id);
            n.badge.setActive(pending && id !== run.pending);
            // 금색 테두리: 아직 안 가 본 방이거나 뭔가 남은 방만 (다 끝낸 방은 안 띄운다)
            const on = this.mode === "choose" && choices.has(id) && (!visited.has(id) || pending);
            const here = id === run.pending || (!run.pending && this.mode === "choose" && id === run.current);
            n.ring.setActive(on || here);
            n.ringRect.borderColor = here ? "#7cc4e8" : UIKit.COLORS.gold;
            const done = visited.has(id);
            n.back.color = done ? "#4a3e32" : "#2a231e";
            n.go.getComponent(RectTransform).alpha = on || done || here ? 1 : 0.7;
        }
        // 셋째 버튼
        const choose = this.mode === "choose";
        this.closeButton.text.setText(choose ? (run.canDescend ? "다음 층으로 ▼" : run.bossCleared ? "마지막 층" : "고르는 중") : "닫기");
        UIKit.setEnabled(this.closeButton, !choose || run.canDescend);
        this.closeButton.rect.borderColor = choose && run.canDescend ? UIKit.COLORS.gold : UIKit.COLORS.border;
    }

    update() {
        if (Input.getButtonDown("map")) this.toggleView();
        if (!this.mode) return;
        if (this.built !== this.run.map) {
            this.buildNodes();
            this.refresh();
        }
        if (this.mode === "view" && Input.getButtonDown("cancel") && !(this.equipDialog && this.equipDialog.isOpen)) return this.close();
        const screen = Math.round(this.engine.canvas.width / this.engine.uiRoot.scale);
        const side = Math.max(8, Math.floor((screen - 560) / 2));
        if (side !== this._side) {
            this._side = side;
            this.list.setOffsets(side, 78, side, 56);
        }
        const width = Math.round(this.list.rect.width / this.list.uiRoot.scale);
        if (width !== this._width && width > 0) {
            this._width = width;
            this.fitSpacing(width);
            const unit = this._nodeSize;
            const bs = unit < 28 ? 12 : 16; // 느낌표 표시 크기
            for (const n of this.nodes.values()) {
                const p = this.nodePos(n.node, width);
                const size = n.node.type === "boss" ? unit + 6 : unit;
                UIKit.place(n.badge, size - Math.round(bs * 0.55), -Math.round(bs * 0.45), bs, bs);
                n.badgeText.fontSize = bs === 12 ? 9 : 12;
                n.rt.setAnchor(0, 0, 0, 0);
                n.rt.setPivot(0.5, 0.5);
                n.rt.setSizeAndPosition(size, size, p.x, p.y);
            }
            this.scroll.contentHeight = this.contentHeight;
            this.scrollToCurrent();
        }
        // 고를 수 있는 칸 깜빡이기
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 220);
        for (const n of this.nodes.values()) if (n.ring.isActive) n.ringRect.opacity = 0.5 + 0.5 * pulse;
    }
}

// 지도 칸 사이 선 (문). 가 본 방끼리는 밝게, 아직 안 가 본 쪽은 점선으로 흐리게
class MapLines extends Renderer {
    constructor(screen) {
        super();
        this.screen = screen;
        this.sortingLayer = "UI";
    }

    getBounds() {
        return null;
    }

    render(ctx) {
        const s = this.screen;
        const rt = this.getComponent(RectTransform);
        const r = rt.rect;
        const scale = rt.uiRoot.scale;
        const width = s._width;
        if (!width) return;
        const run = s.run;
        const visited = new Set(run.visited);
        const shown = run.map.revealed(run.visited);
        if (run.pending) shown.add(run.pending);
        const alpha = rt.worldAlpha;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.lineCap = "round";
        for (const node of run.map.nodes.values()) {
            if (!shown.has(node.id)) continue;
            const a = s.nodePos(node, width);
            for (const id of node.next) {
                if (id < node.id || !shown.has(id)) continue; // 한 번씩만
                const b = s.nodePos(run.map.get(id), width);
                const walked = visited.has(node.id) && visited.has(id);
                ctx.strokeStyle = walked ? "#e8d9b8" : "rgba(168, 152, 120, 0.55)";
                ctx.lineWidth = (walked ? 3 : 2) * scale;
                ctx.setLineDash(walked ? [] : [4 * scale, 4 * scale]);
                ctx.beginPath();
                ctx.moveTo(r.x + a.x * scale, r.y + a.y * scale);
                ctx.lineTo(r.x + b.x * scale, r.y + b.y * scale);
                ctx.stroke();
            }
        }
        ctx.restore();
    }
}
