        this.stats = new Stats(options.stats);
        this.loot = options.loot ?? [];   // 쓰러지면 그 자리에 떨어뜨리는 카드 id
        this.solid = options.solid ?? true; // false면 길을 막지 않고 부딪혀 공격 대상도 아니다 (아이템)
        this.deathVerb = options.deathVerb ?? "쓰러졌다";
        this.tags = new Set(options.tags ?? []);
        this._anims = []; // 턴 중에 생긴 연출 (emit). TurnManager가 그 턴 단계에 넣는다
        this.ai = null;
        if (options.ai) this.setAI(options.ai);
    }

    // 움직이지 않고 그림이 안 바뀌는 엔티티(지형지물)는 청크 그림에 같이 구워서 그린다 (ChunkRenderer).
    // 구운 엔티티는 오브젝트를 켜지 않아서 렌더러가 없다. 맞으면 입자·숫자(PropOverlay)로 보여 준다.
    get baked() {
        return false;
    }

    start() {
        // 큰 엔티티는 그림 중심이 차지한 칸들의 한가운데다 (엔티티 좌표는 왼쪽 아래 칸 중심)
        const pivot = this.size > 1 ? { x: 0.5 / this.size, y: 0.5 / this.size } : undefined;
        this.sr = new SpriteRenderer(Resource.image(this.sprite), { orderInLayer: 2, pivot });
        this.addComponent(this.sr);
        this.overlay = this.addComponent(new EntityOverlay(this));
        this.sync();
        this.applyFlip();
    }

    sync() {
        if (!this.world) return; // 아직 방에 없다 (런 시작 전 플레이어)
        const t = this.world.tileSize;
        this.transform.position = new Vector(this.x * t, this.y * t);
    }

    applyFlip() {
        if (this.sr && this.size === 1) this.sr.flipX = this.flipX; // 큰 그림은 좌우로 안 뒤집는다 (중심이 한가운데가 아니라서)
    }

    // 차지한 칸들 [[x, y]…] (기본은 지금 자리, 다른 자리를 주면 그 자리에 놓았을 때)
    tilesOf(x = this.x, y = this.y) {
        const out = [];
        for (let dy = 0; dy < this.size; dy++) for (let dx = 0; dx < this.size; dx++) out.push([x + dx, y + dy]);
        return out;
    }

    // 두 엔티티 사이 칸 거리 (맨해튼, 차지한 칸 가운데 가장 가까운 두 칸 사이). 붙어 있으면 1
    static gap(a, b) {
        // 그냥 {x, y}인 것(칸 목록 등)은 한 칸짜리로 본다
        const ta = a.tilesOf ? a.tilesOf() : [[a.x, a.y]];
        const tb = b.tilesOf ? b.tilesOf() : [[b.x, b.y]];
        if (ta.length === 1 && tb.length === 1) return Math.abs(ta[0][0] - tb[0][0]) + Math.abs(ta[0][1] - tb[0][1]);
        let best = Infinity;
        for (const [ax, ay] of ta) for (const [bx, by] of tb) best = Math.min(best, Math.abs(ax - bx) + Math.abs(ay - by));
        return best;
    }

    // b가 차지한 칸 중 (x, y)에 가장 가까운 칸 [x, y]
    nearestTile(x, y) {
        let best = null;
        let bd = Infinity;
        for (const [tx, ty] of this.tilesOf()) {
            const d = Math.abs(tx - x) + Math.abs(ty - y);
            if (d < bd) { bd = d; best = [tx, ty]; }
        }
        return best;
    }

    setAI(ai) {
        this.ai = ai;
        ai.entity = this;
    }

    hasTag(tag) {
        return this.tags.has(tag);
    }

    hasAnyTag(tags) {
        return tags.some((t) => this.tags.has(t));
    }

    get alive() {
        return this.stats.alive;
    }

    get attitude() {
        return this.ai ? this.ai.attitude : "neutral";
    }

    // 말을 걸 수 있는 엔티티 (NPC)
    get interactable() {
        return false;
    }

    isHostileTo(other) {
        return this.ai ? this.ai.isHostileTo(other) : false;
    }

    onAttacked(attacker) {
        if (this.ai) this.ai.onAttacked(attacker);
    }

    act(ctx) {
        return this.ai ? this.ai.act(ctx) : null;
    }

    // 이번 턴에 보여줄 연출 추가 (예: 머리 위 "수확!" 글자)
    emit(anim) {
        this._anims.push(anim);
    }

    takeAnims() {
        const list = this._anims;
        this._anims = [];
        return list;
    }

    // 저장: 종류, 위치, 체력(다쳤을 때만) + 종류별 상태
    save() {
        const data = { t: this.type, x: this.x, y: this.y };
        if (this.stats.hp !== this.stats.maxHp) data.hp = this.stats.hp;
        if (this.flipX) data.f = 1;
        if (this.built) data.b = 1; // 플레이어가 지은 것 (몬스터가 부수고, 침대면 플레이어 것)
        const ai = this.ai && this.ai.save ? this.ai.save() : null;
        if (ai) data.ai = ai;
        return Object.assign(data, this.saveState());
    }

    // 상속해서 종류별로 저장할 값 (이름, 소지품 등)
    saveState() {
        return {};
    }

    // 불러올 때. 상속하면 super.loadState(data)도 부른다
    loadState(data) {
        if (data.hp !== undefined) this.stats.hp = data.hp;
        if (data.f) this.flipX = true;
        if (data.b) this.built = true;
        if (data.ai && this.ai && this.ai.load) this.ai.load(data.ai);
    }
}

// 저장한 엔티티를 다시 만들기 위한 종류표. 새 엔티티 클래스는 파일 끝에서 register 한다.
//   EntityTypes.register("cow", (x, y, data) => new Cow(x, y));
class EntityTypes {
    static factories = new Map();

    static register(type, factory) {
        EntityTypes.factories.set(type, factory);
    }

    static create(type, x, y, data = {}) {
        const factory = EntityTypes.factories.get(type);
        if (!factory) throw new Error("알 수 없는 엔티티 종류: " + type);
        const entity = factory(x, y, data);
        entity.type = type;
        return entity;
    }

    static load(data) {
        const entity = EntityTypes.create(data.t, data.x, data.y, data);
        entity.loadState(data);
        return entity;
    }
}

/* ===== assets/dat/world/ChunkManager.js ===== */
// 방 하나의 타일·엔티티 저장소. 청크(16x16) 단위로 타일 그림을 구워 그린다.
// 방은 작아서(최대 2x2 청크) 렌더 거리 안 청크를 모두 켜 둔다. 방마다 새로 만들고, 방을 나가면 통째로 버린다.
// 청크를 처음 만들 때 생성기(RoomPlan)가 타일을 채우고 엔티티를 놓는다.
class ChunkManager extends Component {
    // options: { chunkSize, tileSize, renderDistance(타일), generator: { fillTiles(chunk), populate(chunk) → Entity[] } }
    constructor(options = {}) {
        super();
        this.chunkSize = options.chunkSize ?? 16;
        this.tileSize = options.tileSize ?? 16;
        this.allSize = this.chunkSize * this.tileSize;
        this.renderDistance = options.renderDistance ?? 128;
        this.generator = options.generator ?? null;
        this.chunks = new Map();
        this.turn = 0; // 지금 턴 (TurnManager가 알려 준다)
        this.actors = new Set(); // 턴마다 행동하는 것 (AI가 있는 엔티티, 플레이어)
        this.hazards = new Set(); // 장벽·지뢰·장판 (Allies.js의 Hazard)
        this.damagedProps = new Set(); // 다친 구운 지형지물 (PropOverlay가 체력바를 그린다)

        this.focus = null; // 보통 플레이어
        this.loadedBounds = { minX: 0, minY: 0, maxX: 0, maxY: 0 }; // 켜진 청크가 덮는 월드 영역 (카메라 제한용)
        this._center = null;
        this._active = new Set();
    }

    // 플레이어 청크에서 몇 청크까지 켜는지 (128타일 / 16 = 8 → 17x17 청크)
    get chunkRadius() {
        return Math.ceil(this.renderDistance / this.chunkSize);
    }

    start() {
        this.propOverlay; // 구운 지형지물 체력바 렌더러를 미리 붙여 둔다
    }

    update() {
        if (this.focus) this.loadAround(this.focus.x, this.focus.y);
    }

    // (x, y) 타일이 있는 청크를 중심으로 반경 안 청크를 만들고 켜고, 벗어난 청크는 끈다
    loadAround(x, y) {
        const n = this.chunkSize;
        const ccx = Math.floor(x / n);
        const ccy = Math.floor(y / n);
        if (this._center && this._center.cx === ccx && this._center.cy === ccy) return;
        this._center = { cx: ccx, cy: ccy };

        // 원형: 플레이어 청크 가운데에서 청크의 가장 가까운 점까지가 renderDistance 안인 청크만
        const r = this.chunkRadius;
        const mx = ccx * n + n / 2;
        const my = ccy * n + n / 2;
        const next = new Set();
        for (let cy = ccy - r; cy <= ccy + r; cy++) {
            for (let cx = ccx - r; cx <= ccx + r; cx++) {
                const dx = Math.max(cx * n - mx, 0, mx - (cx * n + n));
                const dy = Math.max(cy * n - my, 0, my - (cy * n + n));
                if (dx * dx + dy * dy > this.renderDistance * this.renderDistance) continue;
                next.add(this.chunks.get(cx + "," + cy) ?? this._createChunk(cx, cy));
            }
        }
        for (const chunk of this._active) if (!next.has(chunk)) this._setChunkActive(chunk, false);
        for (const chunk of next) if (!this._active.has(chunk)) this._setChunkActive(chunk, true);
        this._active = next;

        const half = this.tileSize / 2;
        const b = this.loadedBounds;
        b.minX = (ccx - r) * this.allSize - half;
        b.minY = (ccy - r) * this.allSize - half;
        b.maxX = (ccx + r + 1) * this.allSize - half;
        b.maxY = (ccy + r + 1) * this.allSize - half;
    }

    // 그 청크가 아직 없으면 만든다 (꺼진 채로). 저장/부활처럼 렌더 범위 밖을 다룰 때 쓴다
    ensureChunk(cx, cy) {
        return this.chunks.get(cx + "," + cy) ?? this._createChunk(cx, cy);
    }

    _createChunk(cx, cy) {
        const chunk = new Chunk(this, cx, cy);
        const go = new GameObject("chunk " + cx + "," + cy);
        go.addComponent(chunk);
        go.addComponent(new ChunkRenderer(chunk));
        go.setActive(false);
        this.gameObject.addChild(go);
        this.chunks.set(chunk.key, chunk);

        if (this.generator) {
            this.generator.fillTiles(chunk);
            for (const entity of this.generator.populate(chunk)) this.spawn(entity);
        }
        return chunk;
    }

    // 청크를 켜고 끈다. 엔티티 오브젝트는 청크가 화면 근처일 때만 켠다 (setEntitiesVisible, ChunkRenderer가 부른다).
    // 엔티티 오브젝트가 꺼져 있어도 청크 데이터에는 그대로 있어서 턴 계산(AI)은 된다. 꺼지는 건 그리기와 update뿐.
    _setChunkActive(chunk, value) {
        chunk.gameObject.setActive(value);
        if (!value) this.setEntitiesVisible(chunk, false);
    }

    setEntitiesVisible(chunk, value) {
        chunk.visible = value;
        for (const entity of chunk.entities) {
            if (entity.baked || entity instanceof Player || !entity.gameObject) continue; // 구운 엔티티는 늘 꺼 둔다
            entity.gameObject.setActive(value);
        }
    }

    // 입자 (맞은 지형지물의 파편 등). 월드 오브젝트에 하나
    get particles() {
        if (!this._particles) this._particles = this.addComponent(new ParticleSystem({ capacity: 1024 }));
        return this._particles;
    }

    // 구운 지형지물의 체력바·피해 숫자
    get propOverlay() {
        if (!this._propOverlay) this._propOverlay = this.addComponent(new PropOverlay(this));
        return this._propOverlay;
    }

    // 구운 엔티티가 들어오거나 나가면 그 청크 그림을 다시 굽는다
    _bakeChanged(entity, chunk) {
        if (!entity.baked || !chunk) return;
        chunk.dirty = true;
    }

    getChunkAt(x, y) {
        return this.chunks.get(Math.floor(x / this.chunkSize) + "," + Math.floor(y / this.chunkSize));
    }

    // 청크 안 1차원 번호
    localIndex(x, y) {
        const n = this.chunkSize;
        return (((y % n) + n) % n) * n + (((x % n) + n) % n);
    }

    getTile(x, y) {
        const chunk = this.getChunkAt(x, y);
        if (!chunk) return TileDef.VOID;
        return chunk.tiles[this.localIndex(x, y)];
    }

    // 그 칸을 막고 있는 엔티티 (solid). 한 칸에 하나뿐이다. 이동·공격·길찾기는 이걸 본다.
    entityAt(x, y) {
        const chunk = this.getChunkAt(x, y);
        const cell = chunk && chunk.cells.get(this.localIndex(x, y));
        if (!cell) return undefined;
        for (const e of cell) if (e.solid) return e;
        return undefined;
    }

    // 그 칸의 모든 엔티티 (막는 엔티티 + 겹쳐 있는 아이템들)
    entitiesAt(x, y) {
        const chunk = this.getChunkAt(x, y);
        const cell = chunk && chunk.cells.get(this.localIndex(x, y));
        return cell ? cell.slice() : [];
    }

    // 칸 색인 (chunk.cells) 맞추기: 청크에 넣고 뺄 때, 칸을 옮길 때 부른다
    // 큰 엔티티는 차지한 칸마다 색인에 들어간다 (그 칸 어디를 눌러도 같은 엔티티)
    _cellAdd(chunk, e) {
        for (const [x, y] of e.tilesOf()) {
            const c = this.getChunkAt(x, y) ?? this.ensureChunk(Math.floor(x / this.chunkSize), Math.floor(y / this.chunkSize));
            const i = this.localIndex(x, y);
            const cell = c.cells.get(i);
            if (cell) cell.push(e);
            else c.cells.set(i, [e]);
        }
    }

    _cellRemove(chunk, e, x = e.x, y = e.y) {
        for (const [tx, ty] of e.tilesOf(x, y)) {
            const c = this.getChunkAt(tx, ty);
            if (!c) continue;
            const i = this.localIndex(tx, ty);
            const cell = c.cells.get(i);
            if (!cell) continue;
            const k = cell.indexOf(e);
            if (k >= 0) cell.splice(k, 1);
            if (!cell.length) c.cells.delete(i);
        }
    }

    // 여러 칸에 있는 엔티티 중 조건에 맞는 것. tag를 주면 그 태그가 있는 것만
    entitiesIn(tiles, options = {}) {
        const list = [];
        for (const [x, y] of tiles) {
            for (const e of this.entitiesAt(x, y)) {
                if (!e.alive || (options.tag && !e.hasTag(options.tag)) || (options.filter && !options.filter(e))) continue;
                list.push(e);
            }
        }
        return list;
    }

    isWalkable(x, y) {
        return TileDef.get(this.getTile(x, y)).walkable && !this.entityAt(x, y);
    }

    // 이 타일에 들어갈 수 있는가 (엔티티는 안 본다)
    static tileOk(tileId) {
        const t = TileDef.get(tileId);
        return !!t && t.walkable;
    }

    canEnter(mover, x, y) {
        if (!mover || mover.size === 1 || mover.size === undefined) return ChunkManager.tileOk(this.getTile(x, y)) && !this.entityAt(x, y);
        for (const [tx, ty] of mover.tilesOf(x, y)) {
            if (!ChunkManager.tileOk(this.getTile(tx, ty))) return false;
            const o = this.entityAt(tx, ty);
            if (o && o !== mover) return false;
        }
        return true;
    }

    // (예전: 저장 대상 표시) 방은 저장하지 않는다. 부르는 곳이 많아 빈 함수로 둔다
    touch(entity) {}

    addEntity(entity) {
        entity.world = this;
        if (entity.ai || entity instanceof Player) this.actors.add(entity);
        if (entity.isHazard) this.hazards.add(entity);
        const n = this.chunkSize;
        const chunk = this.getChunkAt(entity.x, entity.y) ?? this.ensureChunk(Math.floor(entity.x / n), Math.floor(entity.y / n));
        chunk.entities.add(entity);
        this._cellAdd(chunk, entity);
        if (entity.baked) {
            this._bakeChanged(entity, chunk);
            if (entity.alive && entity.stats.hp < entity.stats.maxHp) this.damagedProps.add(entity); // 다친 채로 불러온 것
        }
    }

    removeEntity(entity) {
        this.actors.delete(entity);
        this.hazards.delete(entity);
        const chunk = this.getChunkAt(entity.x, entity.y);
        chunk.entities.delete(entity);
        this._cellRemove(chunk, entity);
        if (entity.baked) {
            // 부서진 것은 부서지는 연출(HitAnim)이 시작될 때까지 그림에 남긴다. 연출이 안 오면 잠시 뒤 저절로 빠진다
            if (!entity.alive) chunk.ghosts.push({ entity, until: performance.now() + 2000 });
            else this._bakeChanged(entity, chunk);
        }
    }

    // 부서지는 연출이 시작됐다: 남겨 둔 그림을 지운다
    releaseGhost(entity) {
        const chunk = this.getChunkAt(entity.x, entity.y);
        if (!chunk) return;
        const i = chunk.ghosts.findIndex((g) => g.entity === entity);
        if (i < 0) return;
        chunk.ghosts.splice(i, 1);
        chunk.dirty = true;
    }

    // 엔티티를 월드에 넣고 GameObject도 만든다 (월드 오브젝트의 자식). 청크가 꺼져 있으면 같이 꺼진 채로.
    spawn(entity) {
        this.addEntity(entity);
        const go = new GameObject(entity.type ?? "entity");
        go.addComponent(entity);
        const chunk = this.getChunkAt(entity.x, entity.y);
        go.setActive(chunk.gameObject.isActive && chunk.visible && !entity.baked);
        this.gameObject.addChild(go);
        return entity;
    }

    swapEntities(a, b) {
        const ca = this.getChunkAt(a.x, a.y);
        const cb = this.getChunkAt(b.x, b.y);
        this._cellRemove(ca, a);
        this._cellRemove(cb, b);
        [a.x, b.x] = [b.x, a.x];
        [a.y, b.y] = [b.y, a.y];
        if (ca !== cb) {
            ca.entities.delete(a);
            cb.entities.delete(b);
            ca.entities.add(b);
            cb.entities.add(a);
        }
        this._cellAdd(this.getChunkAt(a.x, a.y), a);
        this._cellAdd(this.getChunkAt(b.x, b.y), b);
    }

    moveEntity(entity, dx, dy) {
        if (dx) entity.flipX = dx < 0;

        const nx = entity.x + dx;
        const ny = entity.y + dy;
        if (!this.canEnter(entity, nx, ny)) return false;

        const from = this.getChunkAt(entity.x, entity.y);
        const to = this.getChunkAt(nx, ny);
        this._cellRemove(from, entity);
        if (from !== to) {
            from.entities.delete(entity);
            to.entities.add(entity);
            // 화면 근처 청크로 들어오면 보이게 (멀리서 걸어 들어오는 동물)
            if (to.visible && !(entity instanceof Player) && !entity.gameObject.isActive) entity.gameObject.setActive(true);
        }
        entity.x = nx;
        entity.y = ny;
        this._cellAdd(to, entity);
        if (entity instanceof Player) {
            Equip.stepped(entity, this); // 구부러진 동전 줍기
            Pickups.stepped(entity, this); // 바닥에 떨어진 것 줍기·사기
        }
        return true;
    }

    // 순간이동 (부활 등). 도착 청크가 없으면 만든다
    teleport(entity, x, y) {
        this.removeEntity(entity);
        this.ensureChunk(Math.floor(x / this.chunkSize), Math.floor(y / this.chunkSize));
        entity.x = x;
        entity.y = y;
        this.addEntity(entity);
        entity.sync();
    }

    // (x, y)에서 가장 가까운 비어 있는 걸을 수 있는 칸 (나선형으로 찾는다)
    findFreeTile(x, y, maxRadius = 12) {
        for (let r = 0; r <= maxRadius; r++) {
            for (let dy = -r; dy <= r; dy++) {
                for (let dx = -r; dx <= r; dx++) {
                    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
                    this.ensureChunk(Math.floor((x + dx) / this.chunkSize), Math.floor((y + dy) / this.chunkSize));
                    if (this.isWalkable(x + dx, y + dy)) return { x: x + dx, y: y + dy };
                }
            }
        }
        return { x, y };
    }

    // (x, y) 근처에서 size×size 칸이 모두 비어 있는 자리의 왼쪽 아래 칸 (큰 몬스터 놓을 곳)
    findFreeArea(x, y, size = 2, maxRadius = 12) {
        const probe = { size, tilesOf: (ax, ay) => { const o = []; for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) o.push([ax + dx, ay + dy]); return o; } };
        for (let r = 0; r <= maxRadius; r++) {
            for (let dy = -r; dy <= r; dy++) {
                for (let dx = -r; dx <= r; dx++) {
                    if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
                    if (this.canEnter(probe, x + dx, y + dy)) return { x: x + dx, y: y + dy };
                }
            }
        }
        return { x, y };
    }

    // center에서 원형 반경 radius 칸 안의 엔티티
    entitiesNear(center, radius) {
        const n = this.chunkSize;
        const cr = Math.ceil(radius / n) + 1;
        const r2 = radius * radius;
        const list = [];
        for (const e of this.activeEntities(center, cr)) {
            const dx = e.x - center.x;
            const dy = e.y - center.y;
            if (dx * dx + dy * dy <= r2) list.push(e);
        }
        return list;
    }

    // center에서 원형 반경 radius 칸 안의 행동하는 엔티티 (actors만 훑어서 빠르다)
    actorsNear(center, radius) {
        const r2 = radius * radius;
        const list = [];
        for (const e of this.actors) {
            const dx = e.x - center.x;
            const dy = e.y - center.y;
            if (dx * dx + dy * dy <= r2) list.push(e);
        }
        return list;
    }

    activeEntities(center, radius) {
        const n = this.chunkSize;
        const ccx = Math.floor(center.x / n);
        const ccy = Math.floor(center.y / n);
        const list = [];
        for (let cy = ccy - radius; cy <= ccy + radius; cy++) {
            for (let cx = ccx - radius; cx <= ccx + radius; cx++) {
                const chunk = this.chunks.get(cx + "," + cy);
                if (chunk) list.push(...chunk.entities);
            }
        }
        return list;
    }

    // 방 안의 살아 있는 적 (플레이어를 노리는 것)
    hostiles(player) {
        const list = [];
        for (const e of this.actors) if (e !== player && e.alive && e.ai && e.attitude === "hostile") list.push(e);
        return list;
    }
}

/* ===== assets/dat/world/ChunkRenderer.js ===== */
// 청크 타일을 캔버스 한 장에 구워서 그린다.
// 화면 근처(한 청크 여유)에 들어올 때만 캔버스를 만들고 굽고, 멀어지거나 청크가 꺼지면 캔버스를 버린다.
// 렌더 거리 17x17 청크를 전부 구워 두면 캔버스만 70MB가 넘어서, 보이는 것만 들고 있는다.
// 같은 기준으로 청크의 엔티티 오브젝트도 켜고 끈다.
// 지형지물(나무, 바위, 벽... entity.baked)은 타일 위에 같이 굽는다. 엔티티마다 따로 그리면 수천 번 그려야 해서다.
// 구운 엔티티가 들어오거나 나가면(ChunkManager가 dirty로 표시) 그 청크만 다시 굽는다.
class ChunkRenderer extends Component {
    static _list = [];

    constructor(chunk) {
        super();
        this.chunk = chunk;
        this.sr = null;
    }

    start() {
        const manager = this.chunk.manager;
        // 엔티티 스프라이트는 기준점이 중앙이라 타일 (x, y)의 중심이 월드 (x*t, y*t)에 온다.
        // 청크 이미지는 좌하단 기준점으로 반 타일만큼 당겨서 타일 중심을 엔티티와 맞춘다.
        const half = manager.tileSize / 2;
        this.transform.position = new Vector(this.chunk.cx * manager.allSize - half, this.chunk.cy * manager.allSize - half);
        this.sr = this.addComponent(new SpriteRenderer(null, { pivot: { x: 0, y: 0 } }));
    }

    update() {
        // 부서지는 연출이 끝내 안 온 유령 그림은 잠시 뒤 지운다
        const ghosts = this.chunk.ghosts;
        if (ghosts.length) {
            const now = performance.now();
            const left = ghosts.filter((g) => g.until > now);
            if (left.length !== ghosts.length) {
                this.chunk.ghosts = left;
                this.chunk.dirty = true;
            }
        }
        const near = this._nearCamera();
        if (near && (this.chunk.dirty || !this.chunk.sprite)) this.bake();
        else if (!near && this.chunk.sprite) this.release();
        // 엔티티(나무, 동물...)도 화면 근처 청크만 켠다. 수천 개를 매 프레임 돌지 않게
        if (near !== this.chunk.visible) this.chunk.manager.setEntitiesVisible(this.chunk, near);
    }

    onDisable() {
        if (this.chunk.sprite) this.release();
    }

    _nearCamera() {
        const cam = Camera.main;
        if (!cam) return false;
        const m = this.chunk.manager;
        const p = this.transform.position;
        const pad = m.allSize;
        return cam.isInView(p.x - pad, p.y - pad, p.x + m.allSize + pad, p.y + m.allSize + pad);
    }

    release() {
        this.chunk.sprite = null;
        this.chunk.dirty = true;
        if (this.sr) this.sr.setSprite(null);
    }

    bake() {
        const chunk = this.chunk;
        const n = chunk.manager.chunkSize;
        const t = chunk.manager.tileSize;

        if (!chunk.sprite) {
            chunk.sprite = document.createElement("canvas");
            chunk.sprite.width = chunk.manager.allSize;
            chunk.sprite.height = chunk.manager.allSize;
        }
        const ctx = chunk.sprite.getContext("2d");

        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, chunk.manager.allSize, chunk.manager.allSize);

        for (let ly = 0; ly < n; ly++) {
            for (let lx = 0; lx < n; lx++) {
                const def = TileDef.get(chunk.tiles[ly * n + lx]);
                if (!def.sprite) continue;
                ctx.drawImage(Resource.image(def.sprite), lx * t, (n - 1 - ly) * t);
            }
        }

        this._bakeEntities(ctx, chunk, n, t);

        chunk.dirty = false;
        this.sr.setSprite(chunk.sprite);
    }

    // 구운 엔티티를 북쪽 줄부터 그린다 (그림이 칸보다 커도 남쪽 것이 위에 오게)
    _bakeEntities(ctx, chunk, n, t) {
        const list = ChunkRenderer._list;
        list.length = 0;
        for (const e of chunk.entities) if (e.baked) list.push(e);
        for (const g of chunk.ghosts) list.push(g.entity);
        if (!list.length) return;
        list.sort((a, b) => b.y - a.y || a.x - b.x);
        const x0 = chunk.cx * n;
        const y0 = chunk.cy * n;
        for (const e of list) {
            const img = Resource.image(e.sprite);
            if (!img) continue;
            const w = img.naturalWidth || img.width;
            const h = img.naturalHeight || img.height;
            // 엔티티 그림은 칸 가운데 기준 (SpriteRenderer pivot 0.5와 같다)
            const px = (e.x - x0) * t + (t - w) / 2;
            const py = (n - 1 - (e.y - y0)) * t + (t - h) / 2;
            if (e.flipX) {
                ctx.save();
                ctx.translate(px + w, py);
                ctx.scale(-1, 1);
                ctx.drawImage(img, 0, 0);
                ctx.restore();
            } else {
                ctx.drawImage(img, px, py);
            }
        }
        list.length = 0;
    }
}

/* ===== assets/dat/world/Pathfinder.js ===== */
// 타일 격자 A* (상하좌우). 시작에서 목표까지 첫 걸음 방향을 구한다.
// 목표 칸은 엔티티가 있어도 들어갈 수 있다고 본다 (마지막 걸음이 공격/자리바꾸기가 된다).
class Pathfinder {
    static DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    // 전체 경로 (방향 배열). 못 가면 null. ignoreEntities면 엔티티를 장애물로 보지 않는다.
    // mover를 주면 그것이 들어갈 수 있는 타일로 본다 (배를 가진 플레이어는 깊은 물도)
    // 열린 목록은 이진 힙(f가 같으면 먼저 넣은 것부터), 칸 키는 숫자라서 문자열·배열을 거의 만들지 않는다.
    static find(world, sx, sy, gx, gy, options = {}) {
        const maxNodes = options.maxNodes ?? 4000;
        const ignoreEntities = options.ignoreEntities ?? false;
        const mover = options.mover ?? null;
        const tileOk = (x, y) => ChunkManager.tileOk(world.getTile(x, y), mover);
        if (sx === gx && sy === gy) return [];
        if (!tileOk(gx, gy)) return null;

        const key = Pathfinder.key;
        const goalKey = key(gx, gy);
        const cost = new Map();   // 칸 키 -> 지금까지 가장 싼 g
        const came = new Map();   // 칸 키 -> 이전 칸 키 * 4 + 방향 번호
        const heap = new PathHeap();
        let seq = 0;

        cost.set(key(sx, sy), 0);
        heap.push(sx, sy, 0, Math.abs(gx - sx) + Math.abs(gy - sy), seq++);
        let expanded = 0;

        while (heap.size > 0 && expanded < maxNodes) {
            heap.pop();
            const cx = heap.x, cy = heap.y, cg = heap.g;
            const ck = key(cx, cy);
            if (cost.get(ck) < cg) continue; // 더 싼 길로 이미 다시 들어간 낡은 항목
            expanded++;

            if (ck === goalKey) {
                const path = [];
                let k = ck;
                while (came.has(k)) {
                    const v = came.get(k);
                    const d = Pathfinder.DIRS[v & 3];
                    path.push([d[0], d[1]]);
                    k = (v - (v & 3)) / 4;
                }
                return path.reverse();
            }

            for (let d = 0; d < 4; d++) {
                const dir = Pathfinder.DIRS[d];
                const nx = cx + dir[0];
                const ny = cy + dir[1];
                const nk = key(nx, ny);
                const g = cg + 1;
                const old = cost.get(nk);
                if (old !== undefined && old <= g) continue;
                let ok;
                if (nk === goalKey || ignoreEntities) ok = tileOk(nx, ny);
                else ok = tileOk(nx, ny) && !world.entityAt(nx, ny);
                if (!ok) continue;
                cost.set(nk, g);
                came.set(nk, ck * 4 + d);
                heap.push(nx, ny, g, g + Math.abs(gx - nx) + Math.abs(gy - ny), seq++);
            }
        }
        return null;
    }

    // 칸 좌표 -> 숫자 키 (좌표 ±2^20 안)
    static key(x, y) {
        return (x + 1048576) * 2097152 + (y + 1048576);
    }

    // 다음 한 걸음. 엔티티를 피해서 길이 없으면 엔티티를 무시한 길로 (길을 막은 쥐가 비키면 지나간다)
    static nextStep(world, from, gx, gy) {
        const path = Pathfinder.find(world, from.x, from.y, gx, gy, { mover: from })
            ?? Pathfinder.find(world, from.x, from.y, gx, gy, { ignoreEntities: true, mover: from });
        return path && path.length ? path[0] : null;
    }
}

// A*용 최소 힙. 항목을 평행 배열에 넣어 객체를 만들지 않는다. pop()한 값은 x, y, g에 남는다.
class PathHeap {
    constructor() {
        this.xs = []; this.ys = []; this.gs = []; this.fs = []; this.ss = [];
        this.size = 0;
        this.x = 0; this.y = 0; this.g = 0;
    }

    _less(i, j) {
        return this.fs[i] < this.fs[j] || (this.fs[i] === this.fs[j] && this.ss[i] < this.ss[j]);
    }

    _swap(i, j) {
        let t;
        t = this.xs[i]; this.xs[i] = this.xs[j]; this.xs[j] = t;
        t = this.ys[i]; this.ys[i] = this.ys[j]; this.ys[j] = t;
        t = this.gs[i]; this.gs[i] = this.gs[j]; this.gs[j] = t;
        t = this.fs[i]; this.fs[i] = this.fs[j]; this.fs[j] = t;
        t = this.ss[i]; this.ss[i] = this.ss[j]; this.ss[j] = t;
    }

    push(x, y, g, f, s) {
        let i = this.size++;
        this.xs[i] = x; this.ys[i] = y; this.gs[i] = g; this.fs[i] = f; this.ss[i] = s;
        while (i > 0) {
            const p = (i - 1) >> 1;
            if (!this._less(i, p)) break;
            this._swap(i, p);
            i = p;
        }
    }

    pop() {
        this.x = this.xs[0]; this.y = this.ys[0]; this.g = this.gs[0];
        const last = --this.size;
        if (last > 0) {
            this.xs[0] = this.xs[last]; this.ys[0] = this.ys[last]; this.gs[0] = this.gs[last];
            this.fs[0] = this.fs[last]; this.ss[0] = this.ss[last];
            let i = 0;
            for (;;) {
                const l = i * 2 + 1, r = l + 1;
                let m = i;
                if (l < last && this._less(l, m)) m = l;
                if (r < last && this._less(r, m)) m = r;
                if (m === i) break;
                this._swap(i, m);
                i = m;
            }
        }
    }
}

/* ===== assets/dat/rules/Animation.js ===== */
class Anim {
    constructor(duration) {
        this.duration = duration;
        this.elapsed = 0;
        this.finished = false;
    }

    get remaining() {
        return Math.max(0, this.duration - this.elapsed);
    }

    update(dt) {
        this.elapsed += dt;
        const t = Math.min(this.elapsed / this.duration, 1);
        this.onUpdate(t);
        this.finished = t >= 1;
    }

    onUpdate(t) {}
}

// 연출 묶음을 차례로 재생하는 연출 하나 (한 턴에 두 번 움직이는 우두머리: 첫 행동 연출 → 둘째 행동 연출)
class SeqAnim extends Anim {
    constructor(groups) {
        const gs = groups.filter((g) => g.length).map((g) => ({ anims: g, dur: Math.max(0.001, ...g.map((a) => a.duration)) }));
        super(gs.reduce((s, g) => s + g.dur, 0.001));
        this.groups = gs;
        this.gi = 0;
        this.gt = 0;
    }

    update(dt) {
        let left = dt;
        while (left > 0 && this.gi < this.groups.length) {
            const g = this.groups[this.gi];
            const use = Math.min(left, g.dur - this.gt);
            for (const a of g.anims) if (!a.finished) a.update(Math.min(use, a.remaining + 1e-9));
            this.gt += use;
            left -= use;
            if (this.gt >= g.dur - 1e-9) {
                for (const a of g.anims) if (!a.finished) a.update(a.remaining + 1e-9);
                this.gi++;
                this.gt = 0;
            }
        }
        this.elapsed += dt;
        this.finished = this.gi >= this.groups.length;
    }
}

// 연출 순서 중간에 할 일 (걸어가서 도착한 뒤 상호작용 등). 처음 재생될 때 한 번 부른다
class CallbackAnim extends Anim {
    constructor(fn) {
        super(0.001);
        this.fn = fn;
        this.called = false;
    }

    onUpdate() {
        if (this.called) return;
        this.called = true;
        this.fn();
    }
}

class MoveAnim extends Anim {
    constructor(entity, from, to, duration = 0.14) {
        super(duration);
        this.entity = entity;
        this.from = from;
        this.to = to;
    }

    onUpdate(t) {
        this.entity.transform.position = new Vector(
            this.from.x + (this.to.x - this.from.x) * t,
            this.from.y + (this.to.y - this.from.y) * t
        );
    }
}

// 공격: 상대 쪽으로 반 칸 찔렀다가 돌아온다. 논리 좌표는 그대로.
class AttackAnim extends Anim {
    constructor(attacker, target, tileSize, duration = 0.16) {
        super(duration);
        this.entity = attacker;
        this.home = new Vector(attacker.x * tileSize, attacker.y * tileSize);
        this.dx = Math.sign(target.x - attacker.x) * tileSize * 0.45;
        this.dy = Math.sign(target.y - attacker.y) * tileSize * 0.45;
    }

    onUpdate(t) {
        const k = Ease.pingPong(t); // 0 → 1 → 0
        this.entity.transform.position = new Vector(this.home.x + this.dx * k, this.home.y + this.dy * k);
    }
}

// 피격: 깜빡이고 피해 숫자를 띄운다. 죽었으면 끝에 흐려지며 사라진다 (플레이어는 흐린 채로 남는다).
class HitAnim extends Anim {
    constructor(target, damage, dies, duration = 0.32) {
        super(duration);
        this.entity = target;
        this.damage = damage;
        this.dies = dies;
    }

    onUpdate(t) {
        const e = this.entity;
        // 화면 흔들기: 플레이어가 맞으면 피해만큼, 지형지물이 부서지면 살짝
        if (!this._shook) {
            this._shook = true;
            if (Camera.main && e instanceof Player) Camera.main.shake(Math.min(1.5 + this.damage * 0.4, 5), 0.25);
            else if (Camera.main && e.baked && this.dies) Camera.main.shake(1.2, 0.15);
        }
        // 청크에 구운 지형지물: 깜빡일 그림이 없으니 파편 입자와 숫자로 보여 주고, 부서졌으면 남겨 둔 그림을 지운다
        if (e.baked) {
            if (!this._started) {
                this._started = true;
                if (e.world) {
                    e.world.propOverlay.hit(e, this.damage, this.dies);
                    if (this.dies) e.world.releaseGhost(e);
                }
            }
            if (t >= 1 && this.dies) e.gameObject.destroy();
            return;
        }
        // 화면 밖이라 아직 한 번도 켜지지 않은 엔티티는 그릴 것이 없다 (죽었으면 지우기만)
        if (e.overlay) e.overlay.popup = { text: String(this.damage), t };
        if (e.sr) {
            const blink = t < 0.5 && Math.floor(t * 8) % 2 === 0;
            e.sr.opacity = blink ? 0.25 : 1;
            if (this.dies && t >= 0.5) e.sr.opacity = 1 - (t - 0.5) * 2 * (e instanceof Player ? 0.65 : 1);
        }

        if (t >= 1) {
            if (e.overlay) e.overlay.popup = null;
            if (this.dies && !(e instanceof Player)) e.gameObject.destroy();
        }
    }
}

// 엔티티 머리 위에 글자를 띄운다 (회복량 등)
class PopupAnim extends Anim {
    constructor(entity, text, color, duration = 0.5) {
        super(duration);
        this.entity = entity;
        this.text = text;
        this.color = color;
    }

    onUpdate(t) {
        const e = this.entity;
        if (e.baked) {
            // 구운 지형지물은 공용 표시(PropOverlay)에 띄운다 (Tween으로 혼자 재생)
            if (!this._started && e.world) e.world.propOverlay.popup(e, this.text, this.color, this.duration);
            this._started = true;
            return;
        }
        if (e.overlay) e.overlay.popup = t < 1 ? { text: this.text, t, color: this.color } : null;
    }
}

// 시트의 아이콘 하나를 from에서 to로 날린다 (파이어볼 등). 재생이 시작될 때 만들고 끝나면 지운다.
class ProjectileAnim extends Anim {
    constructor(world, sprite, frame, from, to, speed = 160) {
        super(Math.max(0.08, from.distance(to) / speed));
        this.world = world;
        this.sprite = sprite;
        this.frame = frame;
        this.from = from;
        this.to = to;
        this.go = null;
    }

    onUpdate(t) {
        if (!this.go) {
            this.go = new GameObject("projectile");
            this.go.addComponent(new SpriteRenderer(Resource.image(this.sprite), {
                region: { x: this.frame * 16, y: 0, width: 16, height: 16 },
                pixelsPerUnit: 1.5,
                sortingLayer: "Foreground"
            }));
            this.world.gameObject.addChild(this.go);
        }
        this.go.transform.setPosition(this.from.x + (this.to.x - this.from.x) * t, this.from.y + (this.to.y - this.from.y) * t);
        if (t >= 1) this.go.destroy();
    }
}

// 여러 칸을 한꺼번에 번쩍이게 한다 (폭발 범위 등). 재생이 시작될 때 만들고 끝나면 지운다.
class AreaFlashAnim extends Anim {
    constructor(world, tiles, color, duration = 0.3, shake = true) {
        super(duration);
        this.shake = shake;
        this.world = world;
        this.tiles = tiles;
        this.color = color;
        this.go = null;
    }

    onUpdate(t) {
        if (!this.go) {
            if (Camera.main && this.shake) Camera.main.shake(2.5, 0.3); // 폭발
            this.go = new GameObject("flash");
            this.flash = this.go.addComponent(new TileFlash(this.tiles, this.world.tileSize, this.color));
            this.world.gameObject.addChild(this.go);
        }
        this.flash.alpha = 0.75 * (1 - t);
        if (t >= 1) this.go.destroy();
    }
}

// 칸들을 한 색으로 칠하는 월드 렌더러
class TileFlash extends Renderer {
    constructor(tiles, tileSize, color) {
        super();
        this.tiles = tiles;
        this.tileSize = tileSize;
        this.color = color;
        this.alpha = 1;
        this.sortingLayer = "Foreground";
    }

    getBounds(out) {
        return null;
    }

    render(ctx, camera) {
        const m = camera.viewMatrix;
        ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);
        const t = this.tileSize;
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        for (const [x, y] of this.tiles) ctx.fillRect(x * t - t / 2, y * t - t / 2, t, t);
        ctx.globalAlpha = 1;
    }
}

// 연출 큐. 단계(step)는 차례대로, 한 단계 안의 연출은 동시에 재생한다.
// - speed: 재생 배속 (설정의 "애니메이션 속도")
// - 한 단계가 프레임 중간에 끝나면 남은 시간을 다음 단계로 넘긴다. 다음 턴이 같은 프레임에 들어오면 그 턴으로도 넘겨서
//   한 칸씩 이어 걸을 때 멈칫하지 않고 미끄러지듯 이어진다.
class AnimQueue extends Component {
    constructor() {
        super();
        this.steps = [];
        this.speed = 1;
        this.carry = 0; // 지난 프레임에 쓰고 남은 시간 (바로 다음 단계가 들어왔을 때만 쓴다)
        this.ambient = []; // 배경 연출 (play)
        this.last = performance.now();
    }

    get busy() {
        return this.steps.length > 0;
    }

    enqueue(step) {
        if (step.length) this.steps.push(step);
    }

    // 턴을 붙잡지 않는 연출 (머리 위 글자, 플레이어와 상관없는 주변 싸움·이동 등). 큐와 따로 같은 속도로 재생된다
    play(anim) {
        this.ambient.push(anim);
    }

    _updateAmbient(dt) {
        if (!this.ambient.length) return;
        for (const anim of this.ambient) if (!anim.finished) anim.update(Math.min(dt, anim.remaining + 1e-9));
        this.ambient = this.ambient.filter((a) => !a.finished);
    }

    update() {
        const now = performance.now();
        let dt = Math.min((now - this.last) / 1000, 0.1) * this.speed;
        this.last = now;
        this._updateAmbient(dt);
        if (!this.busy) {
            this.carry = 0;
            return;
        }
        dt += this.carry;
        this.carry = 0;

        while (this.busy && dt > 0) {
            const step = this.steps[0];
            let longest = 0;
            for (const anim of step) if (!anim.finished) longest = Math.max(longest, anim.remaining);
            const use = Math.min(dt, longest);
            for (const anim of step) {
                if (!anim.finished) anim.update(dt >= longest ? anim.remaining + 1e-9 : use);
            }
            if (step.every((anim) => anim.finished)) {
                this.steps.shift();
                dt -= longest;
            } else {
                dt = 0;
            }
        }
        if (!this.busy) this.carry = Math.max(0, dt);
    }
}

/* ===== assets/dat/rules/TurnManager.js ===== */
// 턴 진행. 플레이어의 모든 행동은 카드로 한다 (Player.nextAction):
//   - 카드 쓰기(이동·공격·방어·주문·소모품), 상호작용, 적이 없는 방에서 걷기: 턴이 지나지 않는다
//   - 뽑기(덱에서 1장), 대기: 1턴이 지난다 → 방의 적이 한 번씩 행동하고, 새 턴이 시작된다 (기력 가득, 방어도·쉼 -1)
// 연출이 끝나야 다음 입력을 받는다. 플레이어 행동이 아무것도 못 했으면(null) 아무 일도 없다.
class TurnManager extends Component {
    // options: { world, player, queue, run }
    constructor(options) {
        super();
        this.world = options.world;
        this.player = options.player;
        this.queue = options.queue;
        this.run = options.run ?? null;
        this.turn = 0;
        this.resting = 0; // 남은 "그냥 넘길 턴" (rest(n): 디버그·테스트용으로 대기를 n번)
        // 턴이 끝나면 Events.emit(GameEvent.TURN_END, { turn })로 알린다
    }

    update() {
        if (this.queue.busy || !this.player.alive || !this.player.world) return;
        if (this.resting > 0) {
            this.resting--;
            this.passTurn();
            return;
        }
        const action = this.player.nextAction();
        if (action) this.playTurn(action);
    }

    // 1턴을 쓴다 (대기와 같다)
    spendTurn() {
        if (!this.player.alive) return false;
        this.player.clearGoal();
        this.passTurn();
        return true;
    }

    // n턴 그냥 넘기기 (프레임마다 한 턴씩, 대기와 같다)
    rest(n) {
        this.resting += n;
    }

    playTurn(action) {
        const steps = this.playerAction(this.player, action);
        if (!steps) return;
        if (!this.passes(action)) {
            for (const step of steps) this.queue.enqueue(step);
            return;
        }
        this.passTurn(steps.flat());
    }

    // 이 행동이 턴을 넘기는가 (뽑기·대기, 테스트용 한 칸 걷기)
    passes(action) {
        return action.type === "draw" || action.type === "wait" || action.type === "move";
    }

    // 턴 넘기기: 턴 +1 → 방의 적 행동 → 새 턴 (기력 가득, 방어도·쉼 -1)
    // lead: 이 단계에 같이 재생할 플레이어 연출
    passTurn(lead = []) {
        const player = this.player;
        this.turn++;
        const together = Settings.get("together");
        const ctx = { world: this.world, player, turn: this.turn };
        if (typeof CardPrep !== "undefined") CardPrep.turnEnd(player); // 준비: 패에 들고 있는 카드의 턴 끝 효과
        const step = [...lead];
        const ambient = [];
        // 상태 이상의 남은 턴은 플레이어가 턴을 넘길 때 1 준다 (적이 건 것은 이 뒤에 걸리므로 플레이어 턴 n번 동안 이어진다)
        Status.tickTurns(player);
        for (const entity of [...this.world.actors]) {
            if (entity === player || !entity.alive || !player.alive || !entity.ai) continue;
            // 패턴이 있는 적 (EnemyAI): 정해 둔 의도를 한다
            if (entity.ai.takeTurn) {
                const r = entity.ai.takeTurn(ctx, this);
                (!together || r.hitPlayer ? step : ambient).push(...r.anims);
                continue;
            }
            const moves = entity.moves ?? 1;
            for (let i = 0; i < moves && entity.alive && player.alive; i++) {
                const result = this.perform(entity, entity.act(ctx));
                if (!result) break;
                (!together || this.lastTarget === player ? step : ambient).push(...result);
                if (this.lastWasAttack) break; // 치면 그 턴은 끝
            }
        }
        // 소환수 (적 다음에 움직인다)
        for (const entity of [...this.world.actors]) {
            if (!(entity instanceof Ally) || !entity.alive || !player.alive) continue;
            step.push(...entity.ai.takeTurn(ctx, this).anims);
        }
        // 설치물 (지뢰·장판·장벽)
        for (const h of [...(this.world.hazards ?? [])]) if (h.world) step.push(...h.tick(ctx));
        // 플레이어 독: 적이 다 움직인 뒤 (방어도로 못 막는다). 화상은 새 턴 시작에 (아래 startTurn 다음)
        if (player.alive) {
            const p0 = player.poison;
            if (p0) MessageLog.add(`독으로 ${p0} 피해`, "#9ce05c");
            step.push(...Status.tickPoison(player, this.world));
        }

        // 다음 턴 의도 (머리 위·땅에 보인다)
        EnemyMoves.planAll(this.world, player, this.turn);

        if (player.alive) {
            player.startTurn();
            step.push(...Status.tickStart(player, this.world));
            if (player.alive) step.push(...SlimeQueen.turnStart(player, this.world)); // 슬라임퀸에게 갇혀 있으면
            step.push(...Equip.turnStart(player, this.world)); // 장착한 장비 (마력석 마법서 …)
            player.cards.notify("turn", { turn: this.turn });
        }
        this.queue.enqueue(step);
        for (const anim of ambient) this.queue.play(anim);
        Events.emit(GameEvent.TURN_END, { turn: this.turn });
    }

    // 플레이어 행동 → 연출 단계 배열. 아무것도 못 했으면 null
    playerAction(player, action) {
        const cards = player.cards;
        switch (action.type) {
            case "card":
                return cards.use(action.card, { user: player, world: this.world, turns: this, target: action.target, picks: action.picks });
            case "draw":
                return this.draw(player) ? [[]] : null;
            case "wait":
                MessageLog.add("한 턴 기다렸다", "#a0b8e8");
                return [[]];
            case "interact":
                this.interact(player, action.x, action.y);
                return null;
            case "walk":
                return this.walk(player, action.path, action.then);
            case "move": {
                const anims = this.perform(player, action.dir); // 테스트·디버그용: 한 칸 걷고 1턴
                return anims ? [anims] : null;
            }
        }
        return null;
    }

    // 적이 없는 방에서 걷기 (턴 안 씀): 길을 따라 한 칸씩 미끄러진다. 도착하면 then 칸과 상호작용
    walk(player, path, then) {
        const steps = [];
        const t = this.world.tileSize;
        for (const [dx, dy] of path) {
            const fx = player.x;
            const fy = player.y;
            if (!this.world.moveEntity(player, dx, dy)) break;
            steps.push([new MoveAnim(player, new Vector(fx * t, fy * t), new Vector(player.x * t, player.y * t))]);
        }
        if (then) {
            const done = () => this.interact(player, then.x, then.y);
            steps.push([new CallbackAnim(done)]);
        }
        return steps.length ? steps : null;
    }

    // 덱에서 1장 뽑기 (1턴). 못 뽑으면 이유를 알리고 false
    draw(player) {
        const cards = player.cards;
        if (player.drawLock > 0) {
            MessageLog.add(`쉬는 중이라 ${player.drawLock}턴 동안 뽑을 수 없다 (대기로 턴을 넘기자)`, "#c8b890");
            return false;
        }
        if (!cards.canDraw) {
            MessageLog.add("덱도 묘지도 비어 있다", "#c8b890");
            return false;
        }
        if (cards.actionFull) {
            MessageLog.add("행동 패가 가득 차서 뽑을 수 없다 (카드를 쓰거나 묘지로 버리자)", "#c8b890");
            return false;
        }
        return cards.draw(1).length > 0;
    }

    face(entity, x) {
        if (x !== entity.x) entity.flipX = x < entity.x;
        entity.applyFlip();
    }

    // 상호작용 (턴 안 씀): 내 칸이나 바로 옆 칸의 출구·상인·모닥불·상자. 아무것도 못 했으면 false
    interact(player, x = player.x, y = player.y) {
        if (Math.abs(x - player.x) + Math.abs(y - player.y) > 1) return false;
        this.face(player, x);
        const target = this.world.entitiesAt(x, y).find((e) => e !== player && e.interactable);
        if (!target) {
            MessageLog.add("상호작용할 것이 없다", "#c8b890");
            return false;
        }
        return !!target.interact({ player, world: this.world, turns: this, run: this.run });
    }

    // 한 칸 행동: 그 칸에 적대하는 상대가 있으면 공격, 아니면 이동. 아무것도 못 했으면 null (턴 소모 없음)
    perform(entity, dir) {
        this.lastWasAttack = false;
        this.lastTarget = null; // 이번 행동이 친 대상
        if (!dir) return null;
        if (dir[0]) entity.flipX = dir[0] < 0;
        entity.applyFlip();

        const target = this.world.entityAt(entity.x + dir[0], entity.y + dir[1]);
        if (target && entity.isHostileTo(target) && !(entity instanceof Player && target.interactable && target.attitude !== "hostile")) {
            this.lastWasAttack = true;
            this.lastTarget = target;
            return Combat.attack(entity, target, this.world);
        }

        const fx = entity.x;
        const fy = entity.y;
        if (!this.world.moveEntity(entity, dir[0], dir[1])) return null;
        return [this.slide(entity, fx, fy)];
    }

    // 이전 칸(fx, fy)에서 지금 논리 좌표로 미끄러지는 연출
    slide(entity, fx, fy) {
        const t = this.world.tileSize;
        return new MoveAnim(entity, new Vector(fx * t, fy * t), new Vector(entity.x * t, entity.y * t));
    }
}

/* ===== assets/dat/entity/Stats.js ===== */
// 전투 능력치. 피해 = max(1, 공격력 - 방어력)
class Stats {
    constructor(options = {}) {
        this.maxHp = options.maxHp ?? 10;
        this.hp = options.hp ?? this.maxHp;
        this.attack = options.attack ?? 1;
        this.defense = options.defense ?? 0;
    }

    get alive() {
        return this.hp > 0;
    }

    damageFrom(attacker) {
        return Math.max(1, attacker.attack - this.defense);
    }
}

/* ===== assets/dat/entity/AI.js ===== */
// 엔티티 행동. 매 턴 act(ctx)가 이동할 방향을 돌려준다 (null이면 쉼).
// 그 방향에 적대하는 엔티티가 있으면 이동 대신 공격이 된다 (부딪혀서 공격).
// 새 AI는 이 클래스를 상속해서 act / isHostileTo / onAttacked / attitude를 바꾸면 된다.
// ctx = { world, player, turn }
class AI {
    constructor(options = {}) {
        this.entity = null;
        this.sight = options.sight ?? 6; // 대상을 알아차리는 거리 (칸, 맨해튼)
    }

    // 플레이어 입장에서 본 태도. UI 색과 의도 표시에 쓴다.
    get attitude() { return "neutral"; }

    isHostileTo(other) { return false; }

    act(ctx) { return null; }

    onAttacked(attacker) {}

    distance(a, b) {
        return Entity.gap(a, b);
    }

    // 대상 쪽으로 한 칸. 길찾기로 막힌 길을 돌아가고, 대상 칸 자체는 막혀 있어도 고른다(공격).
    stepToward(target) {
        const e = this.entity;
        const goal = target.nearestTile(e.x, e.y); // 큰 대상은 가장 가까운 칸으로
        if (this.distance(e, target) === 1) return [goal[0] - e.x, goal[1] - e.y];
        const path = Pathfinder.find(e.world, e.x, e.y, goal[0], goal[1], { maxNodes: 1500 });
        if (path && path.length) return path[0];
        // 길이 막혔으면(다른 몬스터가 막고 있다) 가까워지는 쪽 빈칸으로
        const dx = Math.sign(target.x - e.x);
        const dy = Math.sign(target.y - e.y);
        for (const [sx, sy] of [[dx, 0], [0, dy]]) {
            if ((sx || sy) && e.world.isWalkable(e.x + sx, e.y + sy)) return [sx, sy];
        }
        return null;
    }
}

// 적대: 시야 안의 플레이어를 쫓아가 공격한다.
class HostileAI extends AI {
    get attitude() { return "hostile"; }

    isHostileTo(other) {
        return other instanceof Player || (typeof Ally !== "undefined" && other instanceof Ally);
    }

    act(ctx) {
        const p = ctx.player;
        if (!p.alive || this.distance(this.entity, p) > this.sight) return null;
        return this.stepToward(p);
    }
}

// 중립: 제자리에 있다가, 공격받으면 공격한 상대를 쫓아가 반격한다 (끝까지 잊지 않는다)
class NeutralAI extends AI {
    constructor(options = {}) {
        super(options);
        this.enemy = null;
    }

    get attitude() {
        return this.enemy ? "hostile" : "neutral";
    }

    isHostileTo(other) {
        return other === this.enemy;
    }

    onAttacked(attacker) {
        this.enemy = attacker;
    }

    act(ctx) {
        if (this.enemy && !this.enemy.alive) this.enemy = null;
        return this.enemy ? this.stepToward(this.enemy) : null;
    }
}

/* ===== assets/dat/rules/Combat.js ===== */
// 공격 한 번의 로직: 피해 계산 → 맞은 쪽 반응(AI) → 죽음 처리 → 메시지.
// 연출(애니메이션)은 돌려주기만 하고, 재생은 TurnManager가 큐에 넣는다.
class Combat {
    // 가장 최근 hit의 결과 { target, dealt(깎인 체력), blocked(방어도로 막은 양), dies } — 흡혈·처치 효과가 읽는다
    static last = null;

    // 부딪혀 공격 (몬스터·상인의 공격): 공격 연출 + 공격력만큼 피해. 방어력은 피해를 줄이지 않는다 (방어도만 막는다).
    // 플레이어는 부딪혀 공격하지 않고 공격 카드로 친다
    static attack(attacker, target, world) {
        return Combat.strike(attacker, target, world, attacker.stats.attack);
    }

    // 정해진 피해로 한 번 친다 (공격 카드, 부딪히기). using: 메시지에 붙일 카드 이름
    static strike(attacker, target, world, damage, using = null) {
        if (target.invulnerable) {
            MessageLog.add(`${josa(target.displayName, "은는")} 꿈쩍도 하지 않는다`, "#c8b890");
            return [new AttackAnim(attacker, target, world.tileSize)];
        }
        damage = Status.modify(damage, attacker, target);
        MessageLog.add(`${josa(attacker.displayName, "이가")} ${target.displayName}에게 ${damage} 피해${using ? ` (${using})` : ""}`,
            attacker instanceof Player ? "#e8d9b8" : "#f0a0a0");
        return [new AttackAnim(attacker, target, world.tileSize), ...Combat.hit(target, damage, attacker, world, "physical", false)];
    }

    // 피해 유형. 기본 공격은 물리. 주문은 Spell.register의 element
    static TYPES = { physical: "물리", heat: "열", cold: "냉기", shock: "전기", arcane: "마력", dark: "암흑", poison: "독" };

    // 피해 주기: 방어도가 먼저 막고, 체력이 0이 되면 방에서 빠진다.
    // 공격이 아닌 피해(폭발 등)도 이걸 부르고, 돌려받은 연출을 AnimQueue에 넣으면 된다.
    // mod: 약화·취약 보정을 할지 (Combat.strike처럼 이미 보정한 피해면 false)
    static hit(target, damage, source, world, type = "physical", mod = true) {
        if (target.invulnerable) return [];
        if (mod) damage = Status.modify(damage, source, target);
        // 슬라임퀸 가두기: 퀸은 가둔 대상에게서, 가둔 대상은 퀸이 아닌 상대에게서 피해를 입지 않는다
        if (damage > 0 && typeof SlimeQueen !== "undefined" && SlimeQueen.blocks(target, source)) {
            MessageLog.add(`${josa(target.displayName, "은는")} 점액에 감싸여 피해를 입지 않았다`, "#7cd47c");
            Combat.last = { target, dealt: 0, blocked: 0, dies: false, damage: 0 };
            return [new PopupAnim(target, "무효", "#7cd47c")];
        }
        // 보호: 피해를 한 번 통째로 무시한다 (수치 = 남은 횟수)
        if (damage > 0 && Status.get(target, "protect") > 0) {
            Status.set(target, "protect", Status.get(target, "protect") - 1);
            MessageLog.add(`${josa(target.displayName, "은는")} 보호로 피해를 무시했다`, "#70d0c0");
            Combat.last = { target, dealt: 0, blocked: 0, dies: false, damage: 0 };
            return [new PopupAnim(target, "보호", "#70d0c0")];
        }
        let blocked = 0;
        if (source && target.absorb) {
            const left = target.absorb(damage);
            blocked = damage - left;
            damage = left;
            if (blocked) MessageLog.add(`방어도로 ${blocked} 피해를 막았다`, "#8cc8f0");
        }
        const hpBefore = target.stats.hp;
        target.stats.hp = Math.max(0, target.stats.hp - damage);
        const dealt = hpBefore - target.stats.hp;

        const before = target.attitude;
        if (source) target.onAttacked(source);
        if (before !== "hostile" && target.attitude === "hostile") {
            MessageLog.add(`${josa(target.displayName, "이가")} 화났다!`, "#f0a0a0");
        }

        Events.emit(GameEvent.DAMAGED, { target, damage, dealt, source, world, type });

        const dies = !target.stats.alive;
        Combat.last = { target, dealt, blocked, dies, damage };
        if (dies) Combat.kill(target, source, world);
        const back = [];
        if (blocked && !damage) return [new PopupAnim(target, "막음", "#8cc8f0"), ...back];
        return [new HitAnim(target, damage, dies), ...back];
    }

    static kill(target, killer, world) {
        world.removeEntity(target);
        MessageLog.add(`${josa(target.displayName, "이가")} ${target.deathVerb}`, target instanceof Player ? "#f06060" : "#c8b890");
        Events.emit(GameEvent.KILLED, { target, killer, world });
        if (target instanceof Player) Events.emit(GameEvent.PLAYER_DIED, { player: target, killer, world });
    }
}

/* ===== assets/dat/rules/Status.js ===== */
// 상태 이상·버프. 플레이어와 몬스터·소환수가 같은 체계를 쓴다.
//   entity.status  = { 키: 수치 }   — 수치 (독 3, 화상 피해 2, 빙결 추가 피해 4 …)
//   entity.statusT = { 키: 남은 턴 } — 턴으로 세는 것들의 남은 턴
// 종류 (DEFS.kind):
//   "dot"   독: 턴이 끝날 때 수치만큼 피해를 입고 수치가 1 준다 (턴 수 없음)
//   "vt"    수치 + 턴: 화상(턴 시작 피해) · 빙결(맞을 때 추가 피해) · 무기력(턴 시작 기력 감소) ·
//            경질화(방어력 +) · 둔화(이동속도 -%) · 힘(공격력 +)
//   "turns" 턴만: 속박 · 기절 · 도발 (수치는 남은 턴과 같다)
// 영구: 턴이 ENDLESS(999) 이상이면 방(전투)이 끝날 때까지 줄지 않는다 (경질화 "이번 전투동안", 늑대의 힘 "영구")
//
// 턴이 줄어드는 때
//   몬스터·소환수: 자기 턴 시작에 화상 피해 → 행동 → 자기 턴 끝에 독 피해, 남은 턴 -1
//   플레이어: 턴을 넘길 때(적이 움직이기 전) 남은 턴 -1 → (적이 움직인 뒤) 독 피해 → 새 턴 시작에 화상 피해·무기력 적용
//            (무기력만 새 턴에 적용하고 나서 줄어든다: "1턴" = 바로 다음 턴)
class Status {
    static ENDLESS = 999;

    static DEFS = {
        poison: { name: "독", color: "#9ce05c", kind: "dot", max: 99, tag: "poison" },
        burn: { name: "화상", color: "#ff8a40", kind: "vt", max: 99, tag: "burning", desc: "턴 시작시 수치만큼 피해" },
        ice: { name: "빙결", color: "#7ab8ff", kind: "vt", max: 99, tag: "ice", desc: "피해를 입을 때 수치만큼 추가 피해" },
        lethargy: { name: "무기력", color: "#9a8cf0", kind: "vt", max: 9, tag: "lethargy", late: true, desc: "턴 시작시 얻는 기력이 수치만큼 감소" },
        harden: { name: "경질화", color: "#9ad0e8", kind: "vt", max: 99, buff: true, tag: "hardening", desc: "수치만큼 방어력 증가" },
        slow: { name: "둔화", color: "#8c9cf0", kind: "vt", max: 100, tag: "slowness", desc: "이동속도가 수치(%)만큼 감소" },
        str: { name: "힘", color: "#f0a050", kind: "vt", max: 99, buff: true, tag: "strength", desc: "수치만큼 공격력 증가" },
        root: { name: "속박", color: "#e8e8f0", kind: "turns", max: 9, tag: "root", desc: "움직이지 못한다" },
        stun: { name: "기절", color: "#f0e070", kind: "turns", max: 3, tag: "sturn", desc: "행동할 수 없다" },
        taunt: { name: "도발", color: "#f08080", kind: "turns", max: 9, tag: "taunt", desc: "공격 대상이 도발한 쪽이 된다" },
        growth: { name: "성장", color: "#e0605a", kind: "vt", max: 99, buff: true, tag: "growth", desc: "최대 체력이 수치만큼 증가" },
        swift: { name: "신속", color: "#b8d070", kind: "vt", max: 9, buff: true, tag: "swift", desc: "수치만큼 이동속도 증가" },
        protect: { name: "보호", color: "#70d0c0", kind: "vt", max: 9, buff: true, tag: "protect", desc: "피해를 수치(회)만큼 무시한다" },
        stunimm: { name: "기절 면역", color: "#c8c0a0", kind: "turns", max: 99, buff: true, desc: "기절에 걸리지 않는다 (우두머리)" },
        charm: { name: "매료", color: "#f080c0", kind: "vt", max: 9, tag: "charm", desc: "건 상대에게서 수치칸 이내로만 움직일 수 있다 (여럿이면 겹치는 범위)" }
    };

    // 매료: 건 사람(by)마다 { by, n, t }가 따로 있다 (e.charms). 매료당한 쪽은 모든 시전자에게서 n칸 이내인 칸으로만 움직일 수 있다
    //   (여러 명에게 걸리면 그 범위들의 교집합). 화면에 보이는 상태효과 수치는 가장 좁은 n, 턴은 가장 긴 것
    static charm(by, target, n = 2, turns = 1) {
        const list = (target.charms ??= []).filter((c) => c.by !== by);
        Status.casterName(by); // 시전자 번호는 거는 순서대로
        list.push({ by, n, t: turns });
        target.charms = list;
        Status.syncCharm(target);
    }

    static syncCharm(e) {
        const list = (e.charms ?? []).filter((c) => c.t > 0);
        e.charms = list;
        if (!list.length) {
            if (e.status) delete e.status.charm;
            if (e.statusT) delete e.statusT.charm;
            return;
        }
        e.status ??= {};
        e.statusT ??= {};
        e.status.charm = Math.min(...list.map((c) => c.n));
        e.statusT.charm = Math.max(...list.map((c) => c.t));
    }

    // 턴이 지나면 매료도 한 턴씩 줄어든다
    static tickCharm(e) {
        for (const c of e.charms ?? []) c.t--;
        Status.syncCharm(e);
    }

    // e가 (x, y)에 설 수 있는가? 매료한 상대(살아 있는) 모두에게서 n칸 이내여야 한다 (그 밖이면 못 간다)
    static charmBlocks(e, x, y) {
        for (const c of e.charms ?? []) {
            if (!c.by || !c.by.alive || c.t <= 0) continue;
            if (Math.abs(x - c.by.x) + Math.abs(y - c.by.y) > c.n) return true;
        }
        return false;
    }

    // 예전 키 → 지금 키 (저장·옛 코드 호환)
    static ALIAS = { burning: "burn", hardening: "harden", slowness: "slow", strength: "str", sturn: "stun" };

    static key(k) {
        return Status.ALIAS[k] ?? k;
    }

    static get(e, key) {
        return (e.status && e.status[Status.key(key)]) || 0;
    }

    static turns(e, key) {
        return (e.statusT && e.statusT[Status.key(key)]) || 0;
    }

    static has(e, key) {
        return Status.get(e, key) > 0;
    }

    // 직접 정하기 (수치 v, 남은 턴 t). v가 0이면 지운다
    static set(e, key, v, t = null) {
        key = Status.key(key);
        if (!e.status) e.status = {};
        if (!e.statusT) e.statusT = {};
        const d = Status.DEFS[key];
        v = Math.max(0, Math.min(d ? d.max : 99, v));
        if (v) {
            e.status[key] = v;
            if (d && d.kind === "vt") e.statusT[key] = t ?? e.statusT[key] ?? 1;
            else if (d && d.kind === "turns") e.statusT[key] = v;
        } else {
            delete e.status[key];
            delete e.statusT[key];
        }
        if (key === "charm" && !v) e.charms = [];
        if ((key === "str" || key === "harden" || key === "growth") && e.statsChanged) e.statsChanged();
        return v;
    }

    // 더하기. 수치는 쌓이고, 턴은 더 긴 쪽을 따른다. 턴만 있는 것(속박·기절·도발)은 턴이 늘어난다(긴 쪽)
    // 우두머리는 기절한 동안과 그 뒤 일정 턴 동안 기절에 걸리지 않는다. 면역 턴 = 기절 턴 + 루트(지금까지 걸린 기절 턴 합)
    static immune(e, key) {
        return Status.key(key) === "stun" && e.rank === "boss" && (Status.get(e, "stun") > 0 || Status.get(e, "stunimm") > 0);
    }

    static add(e, key, n, turns = null) {
        key = Status.key(key);
        const d = Status.DEFS[key];
        if (!d) return 0;
        if (key === "stun" && e.rank === "boss") {
            if (Status.immune(e, key)) return Status.get(e, "stun");
            e.stunTotal = (e.stunTotal ?? 0) + n;
            Status.set(e, "stun", Math.max(Status.get(e, "stun"), n));
            Status.set(e, "stunimm", n + Math.floor(Math.sqrt(e.stunTotal) + 1e-9));
            return Status.get(e, "stun");
        }
        if (d.kind === "turns") {
            Status.set(e, key, Math.max(Status.get(e, key), n));
            return Status.get(e, key);
        }
        if (d.kind === "vt") {
            const t = Math.max(Status.turns(e, key), turns ?? 1);
            Status.set(e, key, Status.get(e, key) + n, t);
            return Status.get(e, key);
        }
        Status.set(e, key, Status.get(e, key) + n);
        return Status.get(e, key);
    }

    static clear(e, keys = null) {
        for (const k of Object.keys(e.status ?? {})) if (!keys || keys.includes(k)) Status.set(e, k, 0);
    }

    // 디버프만 지우기 (정화). 지운 개수
    static cleanse(e, limit = 99) {
        const bad = Object.keys(e.status ?? {}).filter((k) => Status.DEFS[k] && !Status.DEFS[k].buff);
        const gone = bad.slice(0, limit);
        for (const k of gone) Status.set(e, k, 0);
        return gone.length;
    }

    // 지금 디버프가 몇 개인가
    static debuffs(e) {
        return Object.keys(e.status ?? {}).filter((k) => Status.DEFS[k] && !Status.DEFS[k].buff);
    }

    // 피해 보정: 맞는 쪽이 빙결이면 수치만큼 추가 피해
    static modify(dmg, source, target) {
        if (typeof Equip !== "undefined") dmg = Equip.dealt(dmg, source, target); // 장착한 장비 (구부러진 단검 …)
        if (typeof Player !== "undefined" && source instanceof Player && source.dmgBoost && dmg > 0) dmg = Math.floor(dmg * source.dmgBoost + 1e-9); // 기도 붉은 변형: 이번 턴 피해 증가
        if (target && dmg > 0) dmg += Status.get(target, "ice");
        return Math.max(dmg > 0 ? 1 : 0, dmg);
    }

    // 이동속도 (둔화: -%): base는 원래 이동속도
    static speed(e, base) {
        base += Status.get(e, "swift"); // 신속
        if (typeof Goo !== "undefined" && Goo.on(e)) base = Math.floor(base * 67 / 100 + 1e-9); // 점액 장판 위: 둔화 33%
        const slow = Status.get(e, "slow");
        return slow ? Math.floor(base * (100 - slow) / 100 + 1e-9) : base;
    }

    // 턴 시작 효과 (화상 피해). 연출 배열
    static tickStart(e, world) {
        const anims = [];
        const b = Status.get(e, "burn");
        if (b && e.alive) {
            MessageLog.add(`${josa(e.displayName, "이가")} 화상으로 ${b} 피해`, "#ff8a40");
            anims.push(...Combat.hit(e, b, null, world, "heat"));
        }
        return anims;
    }

    // 턴 끝 효과 (독 피해, 수치 -1)
    static tickPoison(e, world) {
        const anims = [];
        const p = Status.get(e, "poison");
        if (p && e.alive) {
            anims.push(...Combat.hit(e, p, null, world, "poison"));
            Status.add(e, "poison", -1);
        }
        return anims;
    }

    // 남은 턴 -1 (skipLate: 무기력은 따로 센다). 0이 되면 사라진다
    static tickTurns(e, skipLate = true) {
        for (const k of Object.keys(e.statusT ?? {})) {
            const d = Status.DEFS[k];
            if (skipLate && d && d.late) continue;
            if (k === "charm") continue; // 매료는 시전자별로 따로 센다 (tickCharm)
            if (e.statusT[k] >= Status.ENDLESS) continue;
            e.statusT[k]--;
            if (e.statusT[k] <= 0) Status.set(e, k, 0);
        }
        if (e.charms && e.charms.length) Status.tickCharm(e);
    }

    // 몬스터·소환수가 자기 턴 시작에 부른다 (예전 이름 호환): 화상 피해
    static tickDamage(e, world) {
        return Status.tickStart(e, world);
    }

    // 플레이어의 새 턴: 무기력으로 기력이 줄고, 무기력의 남은 턴이 준다
    static applyLate(e) {
        const l = Status.get(e, "lethargy");
        if (!l) return 0;
        if (e.statusT.lethargy !== undefined) {
            e.statusT.lethargy--;
            if (e.statusT.lethargy <= 0) Status.set(e, "lethargy", 0);
        }
        return l;
    }

    // 시전자 이름 (같은 이름이 둘 이상이면 A·B…를 붙여 가른다). 방에 들어갈 때 번호는 처음부터
    static _labels = new Map();
    static casterName(by) {
        const base = by.displayName ?? "?";
        if (by.world && Status._lw !== by.world) { // 방이 바뀌면 번호는 처음부터
            Status._lw = by.world;
            Status._labels.clear();
        }
        if (!by._label) {
            const n = (Status._labels.get(base) ?? 0) + 1;
            Status._labels.set(base, n);
            by._label = String.fromCharCode(64 + Math.min(n, 26));
        }
        return by._label === "A" && !Status._dup(base, by) ? base : `${base}${by._label}`;
    }

    static _dup(base, by) {
        return (Status._labels.get(base) ?? 0) > 1;
    }

    // e에게 by가 건 매료가 아직 있는가
    static charmedBy(e, by) {
        return (e.charms ?? []).some((c) => c.by === by && c.t > 0);
    }

    // 화면에 그릴 상태이상 목록 [{ key, name, color, value, t, from }]. 매료는 시전자마다 하나씩
    static entries(e) {
        const out = [];
        for (const k of Object.keys(e.status ?? {})) {
            const d = Status.DEFS[k];
            if (!d) continue;
            if (k === "charm") {
                for (const c of e.charms ?? []) if (c.t > 0) out.push({ key: k, name: d.name, color: d.color, value: c.n, t: c.t, from: c.by ? Status.casterName(c.by) : null });
            } else out.push({ key: k, name: d.name, color: d.color, value: e.status[k], t: Status.turns(e, k), from: null, buff: !!d.buff });
        }
        return out;
    }

    // 상태이상 목록 창에 쓸 글: { title, desc }  (예: "매료(서큐버스A) 2칸 · 3턴")
    static describe(en) {
        if (en.key === "block") return { title: `방어도 ${en.value} · ${en.t}턴`, desc: "피해를 체력보다 먼저 막는다. 곧 끝나는 것부터 깎이고, 턴이 지나면 사라진다" };
        const d = Status.DEFS[en.key];
        const unit = en.key === "slow" ? "%" : en.key === "protect" ? "회" : "";
        const turns = en.t >= Status.ENDLESS ? "전투 중" : `${en.t}턴`;
        let part;
        if (d.kind === "dot") part = `${en.value}`;
        else if (d.kind === "turns") part = en.t >= Status.ENDLESS ? "" : turns;
        else if (en.key === "charm") part = `${en.value}칸 · ${turns}`;
        else part = `${en.value}${unit} · ${turns}`;
        const from = en.from ? `(${en.from})` : "";
        if (en.key === "charm") return { title: `${d.name}${from} ${part}`, desc: `${en.from ?? "건 상대"}에게서 ${en.value}칸 안으로만 움직일 수 있다 (여럿에게 걸리면 겹치는 범위)` };
        const desc = d.kind === "dot" ? "턴이 끝날 때 수치만큼 피해를 입고, 수치가 1 줄어든다" : d.desc ?? "";
        return { title: `${d.name}${from}${part ? " " + part : ""}`, desc };
    }

    // "독 3 · 화상 2(3턴)"  ·  매료는 "매료(서큐버스A) 2칸(3턴) · 매료(서큐버스B) 2칸(1턴)"
    static text(e) {
        return Object.keys(e.status ?? {}).filter((k) => Status.DEFS[k]).map((k) => {
            const d = Status.DEFS[k];
            if (k === "charm" && e.charms && e.charms.length) {
                return e.charms.filter((c) => c.t > 0).map((c) => `${d.name}(${c.by ? Status.casterName(c.by) : "?"}) ${c.n}칸(${c.t}턴)`).join(" · ");
            }
            const t = Status.turns(e, k);
            const unit = k === "slow" ? "%" : k === "protect" ? "회" : "";
            if (d.kind === "turns") return `${d.name} ${t >= Status.ENDLESS ? "" : t + "턴"}`.trim();
            const tt = d.kind === "vt" ? (t >= Status.ENDLESS ? "(전투 중)" : `(${t}턴)`) : "";
            return `${d.name} ${e.status[k]}${unit}${tt}`;
        }).join(" · ");
    }
}

/* ===== assets/dat/entity/EntityOverlay.js ===== */
// 엔티티 머리 위 표시: 체력바(색 = 플레이어에 대한 태도), 피격 숫자, 의도(플레이어를 노리는 적이 다음 턴에 할 일).
// 체력바는 AI가 있는 엔티티는 항상, 아이템처럼 AI가 없는 엔티티는 다쳤을 때만 보인다.
// 월드 공간 렌더러라서 카메라 확대에 맞춰 같이 커진다. 플레이어는 체력바를 HUD로 보여서 숫자만 띄운다.
class EntityOverlay extends Renderer {
    static COLORS = { hostile: "#d8443c", neutral: "#d8a83c", friendly: "#5cb85c", item: "#b8b0a0" };

    constructor(entity) {
        super();
        this.entity = entity;
        this.sortingLayer = "Foreground";
        this.popup = null; // { text, t, color? } HitAnim / PopupAnim이 채운다
        this._m = new Matrix();
    }

    // 화면 밖이면 그리지 않게 (지형지물이 수천 개라 컬링이 필요하다). 위쪽은 피격 숫자가 뜨는 자리까지
    getBounds(out) {
        const p = this.transform.position;
        out.minX = p.x - 10;
        out.maxX = p.x + 10;
        out.minY = p.y - 10;
        out.maxY = p.y + 26;
        return out;
    }

    render(ctx, camera) {
        const e = this.entity;
        if (!e.alive && !this.popup) return;
        const bar = e.alive && !(e instanceof Player) && (e.ai || e.stats.hp < e.stats.maxHp);
        const popup = this.popup && Settings.get("damageNumbers") ? this.popup : null;
        const intent = bar ? Intent.of(e) : null;
        if (!bar && !popup) return;
        Matrix.multiply(camera.viewMatrix, this.transform.worldMatrix, this._m);
        EntityOverlay.draw(ctx, this._m, e, bar, popup, intent);
    }

    // 체력바·숫자 그리기. m = 화면 행렬(카메라 × 엔티티 위치). 구운 지형지물(PropOverlay)도 같이 쓴다
    static draw(ctx, m, e, bar, popup, intent = null) {
        ctx.setTransform(m.a, m.b, m.c, m.d, Math.round(m.e), Math.round(m.f));
        ctx.scale(1, -1); // 월드 Y-up → 여기서부터 y는 아래로 +, 엔티티 중심이 원점
        if (e.size > 1) ctx.translate((e.size - 1) * 8, -(e.size - 1) * 8); // 큰 엔티티: 차지한 칸들의 가운데 위로 (타일 16 기준 반 칸씩)
        if (intent) Intent.draw(ctx, intent, !!popup);

        if (bar) {
            const w = 12 * (e.size > 1 ? e.size : 1);
            const fill = Math.ceil(w * e.stats.hp / e.stats.maxHp);
            ctx.fillStyle = "rgba(20, 14, 10, 0.85)";
            ctx.fillRect(-w / 2 - 1, -12, w + 2, 3);
            ctx.fillStyle = EntityOverlay.COLORS[e.attitude];
            ctx.fillRect(-w / 2, -11, fill, 1);
            if (e.guard > 0) {
                // 몬스터 방어도: 체력바 왼쪽 파란 칸
                ctx.font = "bold 5px monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#3c78b8";
                ctx.fillRect(-w / 2 - 7, -13, 6, 5);
                ctx.fillStyle = "#ffffff";
                ctx.fillText(String(e.guard), -w / 2 - 4, -10.5);
            }
            // 상태 이상: 발밑에 색 칸 + 수치 (독·약화 등)
            const keys = Status.entries(e);
            if (keys.length) {
                ctx.font = "bold 4px monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                let x = -keys.length * 2.5;
                for (const k of keys) {
                    ctx.fillStyle = "rgba(20, 14, 10, 0.85)";
                    ctx.fillRect(x - 0.5, 7.5, 5, 5);
                    ctx.fillStyle = k.color;
                    ctx.fillRect(x, 8, 4, 4);
                    ctx.fillStyle = "#000000";
                    ctx.fillText(String(k.value), x + 2, 10.2);
                    x += 5;
                }
            }
        }

        if (popup) {
            const t = popup.t;
            const rise = Ease.outCubic(t) * 7; // 처음엔 빨리 솟고 천천히 멈춘다
            ctx.globalAlpha = 1 - t * t;
            ctx.font = "bold 8px monospace";
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            ctx.fillStyle = "rgba(20, 14, 10, 0.9)";
            ctx.fillText(popup.text, 0.5, -13 - rise + 0.5);
            ctx.fillStyle = popup.color ?? (e instanceof Player ? "#ff7060" : "#ffffff");
            ctx.fillText(popup.text, 0, -13 - rise);
            ctx.globalAlpha = 1;
        }
    }
}

// 청크에 구운 지형지물(나무, 바위, 벽...)의 체력바와 피해 숫자를 렌더러 하나로 그린다.
// 지형지물마다 렌더러를 두면 수천 개를 매 프레임 훑어야 해서, 다친 것·숫자가 뜬 것만 따로 들고 있는다.
class PropOverlay extends Renderer {
    constructor(world) {
        super();
        this.world = world;
        this.sortingLayer = "Foreground";
        this.popups = []; // { entity, text, color, t }
        this._m = new Matrix();
        this._pos = new Matrix();
    }

    // 맞았을 때: 파편 입자를 튀기고, 숫자를 띄우고, 다쳤으면 체력바 목록에 넣는다
    hit(entity, damage, dies) {
        const t = this.world.tileSize;
        const img = Resource.image(entity.sprite);
        this.world.particles.emit(entity.x * t, entity.y * t, {
            count: dies ? 18 : 5 + Math.min(damage, 5) * 2,
            colors: ParticleSystem.paletteFromImage(img, null, 4),
            area: dies ? 6 : 3,
            speed: dies ? [30, 80] : [25, 60],
            angle: Math.PI / 2,
            spread: dies ? Math.PI * 2 : Math.PI * 1.2,
            gravity: -300,
            drag: 1.5,
            life: [0.25, 0.55],
            size: [1.5, 2.5]
        });
        if (dies) this.world.damagedProps.delete(entity);
        else if (entity.stats.hp < entity.stats.maxHp) this.world.damagedProps.add(entity);
        this.popup(entity, String(damage));
    }

    // 머리 위 글자 (Tween으로 0.5초 동안 솟았다 사라진다)
    popup(entity, text, color = null, duration = 0.5) {
        const p = { entity, text, color, t: 0 };
        this.popups.push(p);
        Tween.to(p, { t: 1 }, duration, {
            owner: this,
            onComplete: () => {
                const i = this.popups.indexOf(p);
                if (i >= 0) this.popups.splice(i, 1);
            }
        });
        return p;
    }

    get isVisible() {
        return (this.popups.length > 0 || this.world.damagedProps.size > 0) && super.isVisible;
    }

    getBounds(out) {
        return null; // 몇 개 안 돼서 그릴 때 하나씩 화면 안인지 본다
    }

    render(ctx, camera) {
        const t = this.world.tileSize;
        const numbers = Settings.get("damageNumbers");
        for (const e of this.world.damagedProps) {
            if (!e.alive || e.stats.hp >= e.stats.maxHp || e.world !== this.world) {
                this.world.damagedProps.delete(e);
                continue;
            }
            const popup = numbers ? this.popups.find((p) => p.entity === e) : null;
            this._draw(ctx, camera, e, t, true, popup);
        }
        if (!numbers) return;
        for (const p of this.popups) {
            if (this.world.damagedProps.has(p.entity) && p.entity.alive) continue; // 위에서 체력바와 같이 그렸다
            this._draw(ctx, camera, p.entity, t, false, p);
        }
    }

    _draw(ctx, camera, e, t, bar, popup) {
        const x = e.x * t;
        const y = e.y * t;
        if (!camera.isInView(x - 10, y - 10, x + 10, y + 26)) return;
        Matrix.setIdentity(this._pos);
        this._pos.e = x;
        this._pos.f = y;
        Matrix.multiply(camera.viewMatrix, this._pos, this._m);
        EntityOverlay.draw(ctx, this._m, e, bar, popup);
    }
}

// 적의 의도: 플레이어를 노리는 엔티티가 다음 턴(플레이어가 뽑기·대기로 턴을 넘기면)에 할 일.
//   이번 턴에 닿을 거리면 공격 (빨간 칼 + 피해), 아니면 다가온다 (노란 !)
// 카드로 움직이면(턴 안 씀) 바로 바뀐다 (그릴 때마다 계산한다)
class Intent {
    static of(e) {
        const p = Player.current;
        if (!p || !p.alive || !e.ai || !e.alive || e.world !== p.world) return null;
        if (e.ai instanceof EnemyAI) return EnemyMoves.view(e.ai, p);
        if (!e.isHostileTo(p)) return null;
        const d = Math.abs(e.x - p.x) + Math.abs(e.y - p.y);
        if (d <= (e.moves ?? 1)) return { kind: "attack", v: e.stats.attack };
        if (d <= (e.ai.sight ?? 6)) return { kind: "chase" };
        return null;
    }

    // 의도별 바탕색과 글자. 숫자는 피해·방어도
    static STYLE = {
        charge: { color: "#e05a20", label: "돌진" },
        leap: { color: "#8a6a3a", label: "도약" },
        area: { color: "#b83030", label: "광역" },
        web: { color: "#9aa0b0", label: "거미줄" },
        buff: { color: "#c89020", label: "울부짖기" },
        block: { color: "#3c78b8", label: "방어" },
        heal: { color: "#3c9a4a", label: "회복" },
        summon: { color: "#8a50c8", label: "소환" },
        idle: { color: "#5a5248", label: "쉼" },
        stunned: { color: "#806040", label: "기절" },
        chase: { color: "#8a7a3a", label: "이동" }
    };

    // 엔티티 중심 원점, y 아래로 +. 체력바(-12) 위에 그린다. 숫자가 뜨는 중이면 살짝 옆으로
    static draw(ctx, intent, shifted) {
        Intent.drawBox(ctx, intent, shifted);
        if (intent.double && intent.second) Intent.drawBox(ctx, intent.second, shifted, -30, "2 ");
        else if (intent.double) {
            // 한 턴에 두 번 움직인다: 위에 작은 "x2" 딱지
            ctx.font = "bold 6px monospace";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            const x = shifted ? 5 : 0;
            ctx.fillStyle = "rgba(20, 8, 6, 0.9)";
            ctx.fillRect(x - 8, -30, 16, 8);
            ctx.fillStyle = "#f0a020";
            ctx.fillRect(x - 7, -29, 14, 6);
            ctx.fillStyle = "#140c08";
            ctx.fillText("x2", x - 5, -29);
        }
    }

    static drawBox(ctx, intent, shifted, y = -21, prefix = "") {
        const x0 = shifted ? 5 : 0;
        ctx.font = "bold 6px monospace";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        if (intent.kind === "attack") {
            const text = prefix + String(intent.v) + (intent.poison ? "+독" + intent.poison : "");
            const w = 7 + Math.ceil(ctx.measureText(text).width);
            const left = Math.round(x0 - w / 2);
            ctx.fillStyle = "rgba(20, 8, 6, 0.9)";
            ctx.fillRect(left - 1, y - 1, w + 2, 8);
            ctx.fillStyle = intent.poison ? "#5a8a2c" : "#c83a30";
            ctx.fillRect(left, y, w, 6);
            // 작은 칼 (대각선)
            ctx.fillStyle = "#f0e6cc";
            for (let i = 0; i < 4; i++) ctx.fillRect(left + 1 + i, y + 4 - i, 1, 1);
            ctx.fillStyle = "#e8b840";
            ctx.fillRect(left + 1, y + 3, 1, 1);
            ctx.fillRect(left + 2, y + 4, 1, 1);
            ctx.fillStyle = "#ffffff";
            ctx.fillText(text, left + 6, y);
            return;
        }
        const st = Intent.STYLE[intent.kind] ?? { color: "#806040", label: "?" };
        const label = intent.kind === "area" && intent.name ? intent.name : st.label;
        const text = prefix + label + (intent.v !== undefined ? " " + intent.v : "");
        const w = Math.ceil(ctx.measureText(text).width) + 4;
        const left = Math.round(x0 - w / 2);
        ctx.fillStyle = "rgba(20, 8, 6, 0.9)";
        ctx.fillRect(left - 1, y - 1, w + 2, 8);
        ctx.fillStyle = st.color;
        ctx.fillRect(left, y, w, 6);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(text, left + 2, y);
    }
}

/* ===== assets/dat/entity/Props.js ===== */
// 방 안의 지형지물: 입구, 출구, 모닥불, 보물 상자. 길을 막고, 부서지지 않는다(invulnerable).
// 상호작용(손 버튼·E, 또는 바로 옆에서 탭)하면 interact(ctx)가 불린다. ctx = { player, world, turns, run }
class Prop extends Entity {
    constructor(x, y, sprite, options = {}) {
        super(x, y, sprite, { deathVerb: "부서졌다", ...options, tags: ["prop", ...(options.tags ?? [])] });
        this.invulnerable = true;
    }

    act() {
        return null;
    }

    // 그림이 바뀌지 않는 지형지물은 청크 그림에 구워진다
    get baked() {
        return true;
    }

    get interactable() {
        return !!this.interact;
    }
}

// 입구: 방에 들어온 자리 (꾸밈. 되돌아갈 수는 없다)
class Entrance extends Prop {
    constructor(x, y) {
        super(x, y, "ladder_up", { type: "entrance", name: "입구" });
    }

    interact() {
        MessageLog.add("들어온 길이다. 되돌아갈 수는 없다", "#c8b890");
        return true;
    }
}

// 출구: 방의 적을 모두 쓰러뜨리면 열린다. 열린 출구를 쓰면 지도에서 다음 방을 고른다
class Exit extends Prop {
    constructor(x, y) {
        super(x, y, "exit_locked", { type: "exit", name: "출구" });
        this.open = false;
    }

    // 열리고 닫힐 때 그림이 바뀌어서 굽지 않는다
    get baked() {
        return false;
    }

    setOpen(value) {
        this.open = value;
        this.sprite = value ? "stairs_down" : "exit_locked";
        if (this.sr) this.sr.setSprite(Resource.image(this.sprite));
    }

    interact(ctx) {
        if (!this.open) {
            const n = ctx.world.hostiles(ctx.player).length;
            MessageLog.add(`출구가 잠겨 있다. 적을 모두 쓰러뜨려야 열린다 (남은 적 ${n})`, "#e8b860");
            return true;
        }
        ctx.run.leaveRoom();
        return true;
    }
}

// 모닥불 (휴식처): 한 번만 쉴 수 있다 (RestDialog)
class Campfire extends Prop {
    constructor(x, y, data = {}) {
        super(x, y, "campfire", { type: "campfire", name: "모닥불" });
        this.used = !!data.used;
    }

    interact(ctx) {
        if (this.used) {
            MessageLog.add("이미 쉬었다. 출구로 나가자", "#c8b890");
            return true;
        }
        ctx.run.ui.rest.open(this);
        return true;
    }
}

// 보물 상자: 열면 돈과 장비·젬·물약 중 하나 (RewardDialog)
class TreasureChest extends Prop {
    constructor(x, y, data = {}) {
        super(x, y, "chest", { type: "treasure", name: "보물 상자" });
        this.opened = !!data.opened;
    }

    interact(ctx) {
        if (this.opened) {
            MessageLog.add("빈 상자다", "#c8b890");
            return true;
        }
        this.opened = true;
        ctx.run.openTreasure(this);
        return true;
    }
}

EntityTypes.register("entrance", (x, y) => new Entrance(x, y));
EntityTypes.register("exit", (x, y) => new Exit(x, y));
EntityTypes.register("campfire", (x, y, d) => new Campfire(x, y, d));
EntityTypes.register("treasure", (x, y, d) => new TreasureChest(x, y, d));

/* ===== assets/dat/entity/EnemyAI.js ===== */
// 적의 패턴. 적은 턴이 끝날 때마다 다음 턴에 할 일(의도, intent)을 정해 머리 위에 보여 주고, 다음 턴이 지날 때 그대로 한다.
// 카드 쓰기는 턴이 안 들기 때문에, 플레이어는 의도를 보고 피하거나(이동 카드) 막거나(방어 카드) 먼저 잡을 수 있다.
//
// 의도 종류 (intent.kind):
//   approach — 이동속도만큼 다가가고, 닿아 있으면 친다. { pct, stat: "atk"|"def", lifesteal, poison(독만 건다) }
//              닿아 있는 채로(이동을 다 쓰지 않았을 때) 친다: 이동속도를 다 쓰고 닿았다면 그 턴은 치지 않는다
//   move     — 정해 둔 칸으로 간다 (거리 두기·자리 잡기)
//   charge   — 같은 줄로 벽·부딪히는 것까지 돌진, 부딪힌 상대에게 피해 (고블린)
//   leap     — 표시한 칸으로 도약해 주변을 친다. 착지 칸에 플레이어가 있으면 밀어낸다 (오우거)
//   rush     — 방어도를 얻고 달려가 (닿으면 충돌 피해) 주변 3x3을 휘두른다 (해골 기사). { to, path, block, col, swing, tiles }
//   area     — 표시한 칸들에 피해와 상태 이상: 뼈·점액·돌 던지기, 거미줄 (원거리·범위)
