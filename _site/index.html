/* ===== assets/dat/ui/dialog/Codex.js ===== */
// 도감: 시작 화면에서 여는 카드·몬스터 목록. 런 밖이라 수치는 기본 능력치(공격력 5 등) 기준으로 자세히 보인다.
//   탭: [카드] [강화] [몬스터]  (내용은 카드 공방에서 내보낸 데이터)
//   카드를 누르면(마우스를 올려도) 카드 정보 창이 크게 뜬다. 주문·젬은 카드마다 비용·품질이 달라서 대표 한 장을 보여 준다.
class Codex extends Component {
    static TABS = [["skill", "카드"], ["upgrade", "강화"], ["monster", "몬스터"]];
    static CARD_W = 80;

    // 적 설명: 공방의 행동 글
    static patternText(k) {
        return [k.note, k.pattern].filter(Boolean).join("\n");
    }

    // 비용 경우가 여럿인 카드는 경우마다 따로 한 장씩 (나올 때 그중 하나가 정해지니까)
    static variants(def) {
        const n = Card.costOptions(def).length;
        if (n < 2) return [new Card(def.id)];
        return Array.from({ length: n }, (_, i) => { const c = new Card(def.id); c.ensureData().pay = i; return c; });
    }

    constructor(options) {
        super();
        this.engine = options.engine;
        this.tab = "skill";
        this.views = [];
        this.rows = [];
        this.open_ = false;
        this._ctx = document.createElement("canvas").getContext("2d");
    }

    get isOpen() {
        return this.open_;
    }

    start() {
        const { root, box } = Modal.create(this.engine, "codex", 460, 600, () => this.close());
        this.root = root;
        this.box = box;
        UIKit.label(box, "title", "도감", 14, 10, null, 18, { fontSize: 14, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.note = UIKit.label(box, "note", "", 70, 12, null, 16, { fontSize: 10, color: UIKit.COLORS.dim });
        const tabs = box.createChild("tabs");
        this.tabsRT = tabs.getComponent(RectTransform);
        this.tabsRT.setAnchor(0, 0, 1, 0);
        this.tabsRT.setOffsets(12, 34, 12, -62);
        this.tabButtons = {};
        Codex.TABS.forEach(([id, label], i) => {
            const n = Codex.TABS.length;
            const b = UIKit.button(this.tabsRT, id, label, () => this.setTab(id), { fontSize: 12 });
            b.rt.setAnchor(i / n, 0, (i + 1) / n, 1);
            b.rt.setOffsets(i === 0 ? 0 : 2, 0, i === n - 1 ? 0 : 2, 0);
            this.tabButtons[id] = b;
        });
        const list = box.createChild("list");
        this.list = list.getComponent(RectTransform);
        this.list.setAnchor(0, 0, 1, 1);
        this.list.setOffsets(12, 68, 12, 56);
        list.addComponent(new UIRect({ color: "rgba(0, 0, 0, 0.25)" }));
        list.addComponent(new UIMask());
        this.content = this.list.createChild("content").getComponent(RectTransform);
        const bar = this.list.createChild("scrollbar");
        bar.addComponent(new UIRect({ color: "rgba(232, 217, 184, 0.45)" }));
        this.scroll = list.addComponent(new UIScrollView({
            content: this.content, bar: bar.getComponent(RectTransform),
            onTap: (pointer) => {
                const v = this.views.find((v) => UIKit.contains(v.go.getComponent(RectTransform), pointer.position));
                if (v) this.select(v.card === this.selected ? null : v);
            }
        }));
        const close = UIKit.button(box, "close", "닫기", () => this.close(), { fontSize: 13 });
        close.rt.setAnchor(0, 1, 1, 1);
        close.rt.setOffsets(12, -46, 12, 10);
    }

    open() {
        this.open_ = true;
        Modal.fit(this.engine, this.box, 460, 600);
        Modal.show(this.root, true);
        this.setTab(this.tab);
    }

    close() {
        if (!this.open_) return;
        this.open_ = false;
        CardInspector.hide(this);
        CardInspector.untrack(this);
        Modal.show(this.root, false);
    }

    setTab(id) {
        this.tab = id;
        this.selected = null;
        CardInspector.hide(this);
        this.scroll.scrollTo(0);
        for (const [tid, b] of Object.entries(this.tabButtons)) b.rect.color = tid === id ? UIKit.COLORS.buttonOn : UIKit.COLORS.buttonOff;
        this.rebuild();
    }

    select(v) {
        this.selected = v ? v.card : null;
        for (const x of this.views) x.view.setSelected(x.card === this.selected);
        if (v) CardInspector.show(v.card, { verbose: true, owner: this, near: v.go.getComponent(RectTransform) });
        else CardInspector.hide(this);
    }

    // 탭별 카드 (이름순, 희귀도순)
    cards(tab) {
        const order = { undefined: 0, common: 1, uncommon: 2, rare: 3 };
        const defs = [...CardDef.defs.values()];
        const byRarity = (a, b) => (order[a.def.rarity] ?? 0) - (order[b.def.rarity] ?? 0) || a.def.name.localeCompare(b.def.name, "ko");
        const rng = Rng.make(20240607);
        if (tab === "skill") return defs.filter((d) => d.type === "skill" && !d.upgradeKey && d.base).flatMap((d) => Codex.variants(d)).sort((a, b) => (a.def.kind === "basic" ? 0 : 1) - (b.def.kind === "basic" ? 0 : 1) || a.def.name.localeCompare(b.def.name, "ko"));
        return defs.filter((d) => d.type === "skill" && d.upgradeKey).flatMap((d) => Codex.variants(d)).sort((a, b) => a.def.base.localeCompare(b.def.base) || a.def.name.localeCompare(b.def.name, "ko"));
    }

    rebuild() {
        for (const v of this.views) v.go.destroy();
        for (const r of this.rows) r.destroy();
        this.views = [];
        this.rows = [];
        CardInspector.untrack(this);
        this._width = null;
        if (this.tab === "monster") {
            this.note.setText("1층 기준 · 정예·우두머리는 더 세다");
            return;
        }
        this.note.setText(this.tab === "upgrade" ? "캠프에서 강화 · 공격력 5 기준" : "누르면 크게 · 공격력 5 기준");
        for (const card of this.cards(this.tab)) {
            const go = this.content.createChild("card");
            const view = go.addComponent(new CardView(card));
            this.views.push({ go, view, card });
            CardInspector.track(this, go.getComponent(RectTransform), card, true);
        }
    }

    // 몬스터 한 줄: 그림, 이름, 능력치, 패턴 설명
    buildMonsters(width) {
        for (const r of this.rows) r.destroy();
        this.rows = [];
        let y = 6;
        const textW = width - 12 - 56 - 8;
        // 맨 위: 강해지는 규칙
        const head = this.content.createChild("rules");
        const rule = UIKit.label(this.content, "rulesText", "층 Lv마다 [[hp:체력 +30%]] · [[atk:공격력 +1]]. 정예: [[hp:체력 ×1.8]] · [[atk:공격력 +2]]. 우두머리: [[hp:체력 ×3.5]] · [[atk:공격력 +3]].", 10, y, width - 20, 10, { fontSize: 11, color: "#c8b890", wrap: true, lineHeight: 1.4, rich: true });
        const rl = rule.measureLines(this._ctx, width - 20);
        UIKit.place(rule.gameObject, 10, y, width - 20, Math.ceil(rl * 11 * 1.4));
        this.rows.push(head, rule.gameObject);
        y += Math.ceil(rl * 11 * 1.4) + 8;
        for (const [kind, k] of Object.entries(Monster.KINDS)) {
            const go = this.content.createChild("monster");
            const rt = UIKit.place(go, 6, y, width - 12, 10);
            go.addComponent(new UIRect({ color: "rgba(42, 35, 30, 0.95)", borderColor: UIKit.COLORS.border, borderWidth: 1 }));
            const icon = rt.createChild("icon");
            UIKit.place(icon, 6, 6, 44, 44);
            icon.addComponent(new UIRect({ color: "#2a2520", borderColor: "#1e1610", borderWidth: 1 }));
            icon.addComponent(new UIImage(Resource.image(k.sprite ?? kind), { region: { x: 0, y: 0, width: 16 * (k.size ?? 1), height: 16 * (k.size ?? 1) } }));
            UIKit.label(rt, "name", `${k.name} · ${EnemyData.GRADES[k.grade] ?? "중형"}`, 58, 6, textW, 16, { fontSize: 13, fontWeight: "bold", color: UIKit.COLORS.text });
            const stats = `[[hp:체력 ${k.hp}]] · [[atk:공격력 ${k.attack}]] · [[def:방어력 ${k.defense}]]${k.moves > 1 ? ` · [[spd:이동 ${k.moves}칸]]` : ""}`;
            UIKit.label(rt, "stats", stats, 58, 24, textW, 14, { fontSize: 11, color: "#c8b890", rich: true });
            const pat = UIKit.label(rt, "pattern", Codex.patternText(k), 58, 42, textW, 10, { fontSize: 11, color: "#d8c8a0", wrap: true, lineHeight: 1.4, rich: true });
            const lines = pat.measureLines(this._ctx, textW);
            const ph = Math.ceil(lines * 11 * 1.4);
            UIKit.place(pat.gameObject, 58, 42, textW, ph);
            const h = Math.max(56, 42 + ph + 8);
            UIKit.place(go, 6, y, width - 12, h);
            this.rows.push(go);
            y += h + 6;
        }
        this.scroll.contentHeight = y;
    }

    update() {
        if (!this.open_) return;
        if (Input.getButtonDown("cancel")) return this.close();
        const width = Math.round(this.list.rect.width / this.list.uiRoot.scale);
        if (width === this._width || width <= 0) return;
        this._width = width;
        if (this.tab === "monster") return this.buildMonsters(width);
        const w = Codex.CARD_W;
        const gap = 8;
        const cols = Math.max(2, Math.floor((width - gap) / (w + gap)));
        const left = Math.floor((width - (cols * w + (cols - 1) * gap)) / 2);
        let h = 0;
        this.views.forEach((v, i) => {
            h = v.view.layout(w);
            CardView.place(v.go, left + (i % cols) * (w + gap), gap + Math.floor(i / cols) * (h + gap), w, h);
        });
        this.scroll.contentHeight = this.views.length ? gap + Math.ceil(this.views.length / cols) * (h + gap) : 0;
    }
}

/* ===== assets/dat/ui/PickupInfo.js ===== */
// 바닥 물건 곁에 가면 그 물건 정보를 보여 주는 칸.
// 계약: new PickupInfo({ engine, player, world, run }) — 컴포넌트, 플레이어 바로 옆(상하좌우)의 Pickup(entity/Pickups.js)을 찾아 보여 준다.
// - 옆칸 Pickup 집합(또는 폭·돈·카드 정보 설정·상태이상 줄 유무)이 바뀔 때만 다시 만든다 (매 프레임은 열쇠 문자열 비교뿐).
// - 선택창(Modal)이 열려 있거나 칸 고르기 중(Game.targeting.active)이면 숨긴다.
// - 글자와 바탕만 있어서 월드 탭을 가로채지 않는다 (UIElement가 없음 → UIEventSystem.raycast에 안 걸린다).
// - 자리: 손패 막대 위 (칸 고르기 안내줄과 같은 자리 — 안내줄이 뜨면 이쪽이 숨는다).
class PickupInfo extends Component {
    static MAX_W = 320;      // 물건이 하나일 때 칸 폭
    static MIN_W = 150;      // 여럿일 때 나란히 놓을 수 있는 최소 칸 폭
    static GAP = 4;
    static PAD = 8;

    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.world = options.world;
        this.run = options.run ?? null;
        this._key = null;
        this._ctx = document.createElement("canvas").getContext("2d");
    }

    start() {
        this.root = this.engine.createUI("pickupInfo");
        this.rt = this.root.getComponent(RectTransform);
        this.rt.sortOrder = UILayer.HAND + 1;
        this.rt.setAnchor(0.5, 1, 0.5, 1);
        this.parts = [];
        // 글 줄 수를 재는 도구 (실제 UI 배율로 재야 한다)
        const m = this.rt.createChild("measure");
        UIKit.place(m, 0, 0, 10, 10);
        this.measurer = m.addComponent(new UIText("", { fontSize: 12, wrap: true, lineHeight: 1.35, rich: true }));
        this.root.setActive(false);
    }

    // 플레이어가 서 있는 칸과 바로 옆의 Pickup들 (서 있는 칸이 먼저, 그다음 위·오른·아래·왼 순). 가지는 건 서 있는 칸의 것뿐
    nearby() {
        const p = this.player;
        const list = [];
        for (const [dx, dy] of [[0, 0], ...Entity.DIRS]) {
            for (const o of this.world.entitiesAt(p.x + dx, p.y + dy)) {
                if (o instanceof Pickup && o.world && o.item) list.push({ pickup: o, dx, dy });
            }
        }
        return list;
    }

    hidden() {
        const g = window.Game;
        return Modal.isOpen || !this.player.alive || !!(g && g.targeting && g.targeting.active);
    }

    update() {
        if (!this.root) return;
        const list = this.hidden() ? [] : this.nearby();
        if (!list.length) {
            if (this._key !== "") {
                this._key = "";
                this.clear();
                this.root.setActive(false);
            }
            return;
        }
        const scale = this.engine.uiRoot.scale;
        const W = Math.floor(this.engine.canvas.width / scale);
        const H = Math.floor(this.engine.canvas.height / scale);
        const priced = list.some((e) => e.pickup.item.price);
        const above = this.statusRowActive() ? 1 : 0;
        const key = `${W}x${H}:${above}:${CardInspector.enabled() ? 1 : 0}:${priced ? this.player.money : "-"}:` +
            list.map((e) => `${e.dx},${e.dy}:${e.pickup.item.key}`).join("|");
        if (key === this._key) return;
        this._key = key;
        this.build(list, W, H, above);
        this.root.setActive(true);
    }

    // 상태이상 아이콘 줄이 떠 있는가 (있으면 그 위로 올린다)
    statusRowActive() {
        if (!this._statusGO || this._statusGO.isDestroyed) this._statusGO = this.engine.find("statusRow");
        return !!(this._statusGO && this._statusGO.isActive);
    }

    clear() {
        for (const go of this.parts) go.destroy();
        this.parts = [];
    }

    // ---- 칸 하나의 내용 ----
    // 반환: { lines: [{ text, size, color, bold, wrap, h }], icon: def|null, w, h } — 폭 w 안에서 높이를 잰다
    describe(entry) {
        const it = entry.pickup.item;
        const rows = [];
        let icon = null;
        let title = "";
        let sub = "";
        if (it.kind === "gold" || !it.card) {
            title = `${it.gold ?? 0} G`;
            sub = "돈 더미";
        } else {
            const card = it.card;
            const def = card.def;
            icon = def;
            title = card.name;
            const cost = CardDef.costText(card.cost);
            const rarity = def.rarity ? ` · ${ShopDialog.RARITY[def.rarity]}` : "";
            sub = `${CardDef.kindName(def)}${rarity}${cost ? " · " + cost : ""}`;
        }
        return { it, icon, title, sub, card: it.card && it.kind !== "gold" ? it.card : null };
    }

    build(list, W, H, above) {
        this.clear();
        const pad = PickupInfo.PAD;
        const gap = PickupInfo.GAP;
        const n = list.length;
        const avail = W - 16;
        // 배치: 하나면 한 칸. 여럿이면 나란히(칸 폭 150 이상) 못 놓을 때 세로로
        let cols = 1;
        if (n > 1) {
            cols = n;
            while (cols > 1 && Math.floor((avail - gap * (cols - 1)) / cols) < PickupInfo.MIN_W) cols--;
        }
        const cardW = n === 1 ? Math.min(PickupInfo.MAX_W, avail) : Math.min(PickupInfo.MAX_W, Math.floor((avail - gap * (cols - 1)) / cols));
        const compact = n > 1;

        // 칸마다 내용을 만들고 높이를 잰다 (자리는 나중에)
        const cells = list.map((e) => this.makeCell(e, cardW, compact));
        const rows = [];
        for (let i = 0; i < n; i += cols) rows.push(cells.slice(i, i + cols));
        const rowH = rows.map((r) => Math.max(...r.map((c) => c.h)));
        const hintText = list.some((n) => n.dx === 0 && n.dy === 0) ? "서 있는 칸의 것을 [상호작용] 버튼(손 모양)이나 E로 가진다" : "그 칸 위에 올라서서 [상호작용] 버튼(손 모양)이나 E로 가진다";
        const footH = 18;

        let totalW = cardW * cols + gap * (cols - 1);
        if (cols > 1 && rows[rows.length - 1].length < cols && rows.length === 1) totalW = cardW * rows[0].length + gap * (rows[0].length - 1);
        const bodyH = rowH.reduce((a, b) => a + b, 0) + gap * (rows.length - 1);
        const totalH = bodyH + gap + footH;
        // 화면 높이에 안 맞으면 어쩔 수 없이 넘치지만, 좁은 화면 대비로 용어 풀이를 이미 뺐다 (여럿일 때)

        const bottom = PlayerHud.BAR_BOTTOM + PlayerHud.BAR_H + 4 + (above ? 24 : 0) + 4;
        this.rt.setSizeAndPosition(totalW, totalH, 0, -(bottom + totalH / 2));

        let y = 0;
        rows.forEach((r, ri) => {
            r.forEach((c, ci) => this.place(c, ci * (cardW + gap), y, cardW, rowH[ri]));
            y += rowH[ri] + gap;
        });
        // 안내 한 줄
        const foot = this.rt.createChild("foot");
        this.parts.push(foot);
        UIKit.place(foot, 0, y, totalW, footH);
        foot.addComponent(new UIRect({ color: "rgba(18, 13, 10, 0.9)", borderColor: UIKit.COLORS.border, borderWidth: 1 }));
        const frt = foot.getComponent(RectTransform);
        UIKit.label(frt, "t", hintText, 4, 0, totalW - 8, footH, { fontSize: 10, color: UIKit.COLORS.dim, align: "center", verticalAlign: "middle" });
    }

    // 칸 한 개를 만들 재료와 높이 (이름 줄·종류 줄·설명·용어·값·묶음 안내)
    makeCell(entry, w, compact) {
        const d = this.describe(entry);
        const pad = PickupInfo.PAD;
        const tw = w - pad * 2;
        const it = d.it;
        const measure = (text, size, wrapW, bold = false) => {
            const t = this.measurer;
            t.fontSize = size;
            t.fontWeight = bold ? "bold" : "normal";
            t.setText(text);
            const lines = t.measureLines(this._ctx, wrapW);
            t.setText(""); // 재는 글이 화면에 그려지지 않게
            return lines;
        };
        const cell = { d, w, items: [] };
        let y = pad;
        const iconSize = compact ? 28 : 36;
        const headW = tw - (d.icon ? iconSize + 6 : 0);
        const headX = pad + (d.icon ? iconSize + 6 : 0);
        // 머리: 그림 + 이름 + 종류 줄
        const nameSize = compact ? 12 : 14;
        cell.items.push({ type: "text", text: d.title, x: headX, y: y + 1, w: headW, h: Math.ceil(nameSize * 1.3), size: nameSize, color: UIKit.COLORS.gold, bold: true });
        const subLines = measure(d.sub, 10, headW);
        const subH = Math.ceil(subLines * 10 * 1.35);
        const subY = y + 1 + Math.ceil(nameSize * 1.3) + 1;
        cell.items.push({ type: "text", text: d.sub, x: headX, y: subY, w: headW, h: subH, size: 10, color: "#c8b890", wrap: true });
        if (d.icon) cell.items.push({ type: "icon", def: d.icon, x: pad, y: y, size: iconSize });
        y = Math.max(subY + subH, y + (d.icon ? iconSize : 0)) + 4;

        // 설명 + 용어 풀이
        if (d.card) {
            const body = d.card.text(false);
            if (body) {
                const size = compact ? 11 : 12;
                const h = Math.ceil(measure(body, size, tw) * size * 1.35);
                cell.items.push({ type: "text", text: body, x: pad, y, w: tw, h, size, color: "#efe2c4", wrap: true });
                y += h + 4;
            }
            const terms = !compact && CardInspector.enabled() ? CardText.glossary(body) : "";
            if (terms) {
                const h = Math.ceil(measure(terms, 10, tw) * 10 * 1.35);
                cell.items.push({ type: "line", x: pad, y: y, w: tw });
                y += 4;
                cell.items.push({ type: "text", text: terms, x: pad, y, w: tw, h, size: 10, color: "#a89878", wrap: true });
                y += h + 4;
            }
        }
        // 값
        if (it.price) {
            const lack = this.player.money < it.price;
            const size = compact ? 13 : 16;
            cell.items.push({ type: "text", text: `값 ${it.price} G`, x: pad, y, w: tw, h: Math.ceil(size * 1.3), size, color: lack ? "#f08c80" : "#f0d878", bold: true });
            y += Math.ceil(size * 1.3) + 2;
            if (lack) {
                const msg = `돈이 모자란다 (지금 ${this.player.money} G)`;
                const h = Math.ceil(measure(msg, 10, tw) * 10 * 1.35);
                cell.items.push({ type: "text", text: msg, x: pad, y, w: tw, h, size: 10, color: "#e8584c", wrap: true });
                y += h + 2;
            }
        }
        // 묶음
        if (it.group) {
            const msg = "셋 중 하나만 가질 수 있다";
            const h = Math.ceil(measure(msg, 10, tw) * 10 * 1.35);
            cell.items.push({ type: "text", text: msg, x: pad, y, w: tw, h, size: 10, color: "#7cc4e8", wrap: true });
            y += h + 2;
        }
        cell.h = y + pad - 2;
        return cell;
    }

    place(cell, x, y, w, h) {
        const go = this.rt.createChild("cell");
        this.parts.push(go);
        UIKit.place(go, x, y, w, h);
        const priceLack = cell.d.it.price && this.player.money < cell.d.it.price;
        go.addComponent(new UIRect({ color: "rgba(18, 13, 10, 0.92)", borderColor: priceLack ? "#a8483c" : UIKit.COLORS.gold, borderWidth: 1 }));
        const crt = go.getComponent(RectTransform);
        for (const e of cell.items) {
            if (e.type === "icon") UIKit.icon(crt, "icon", e.def, e.x, e.y, e.size);
            else if (e.type === "line") {
                const l = crt.createChild("line");
                UIKit.place(l, e.x, e.y, e.w, 1);
                l.addComponent(new UIRect({ color: "rgba(232, 184, 64, 0.35)" }));
            } else {
                UIKit.label(crt, "t", e.text, e.x, e.y, e.w, e.h, { fontSize: e.size, color: e.color, fontWeight: e.bold ? "bold" : "normal", wrap: !!e.wrap, lineHeight: 1.35, rich: true });
            }
        }
    }
}

/* ===== assets/dat/system/Settings.js ===== */
// 게임 설정. 세계와 상관없이 이 브라우저에 한 벌 저장된다 (localStorage "kortfinite.settings").
// 값 읽기: Settings.get("animSpeed"). 바뀔 때 할 일: Settings.on("key", (value) => ...)
// 새 설정은 DEFS에 한 줄 추가하면 설정 창에 저절로 나온다:
//   { key, label, section, type: "choice", options: [[값, "보이는 글자"], ...], default }
//   { key, label, section, type: "toggle", default }
class Settings {
    static KEY = "kortfinite.settings";
    static VERSION = 2; // 2: 디버그 표시 불투명도 기본값 0%로 (예전 저장값은 버린다)

    static DEFS = [
        { key: "animSpeed", section: "애니메이션", label: "애니메이션 속도", type: "choice", default: 1.5,
            options: [[0.75, "느리게"], [1, "보통"], [1.5, "빠르게"], [2, "아주 빠르게"], [4, "거의 즉시"]] },
        { key: "together", section: "애니메이션", label: "내 이동과 주변 행동을 함께", type: "toggle", default: true },
        { key: "damageNumbers", section: "애니메이션", label: "피해·회복 숫자", type: "toggle", default: true },
        { key: "shake", section: "애니메이션", label: "화면 흔들림", type: "toggle", default: true },

        { key: "logLines", section: "화면", label: "메시지 줄 수", type: "choice", default: 4,
            options: [[2, "2줄"], [4, "4줄"], [6, "6줄"]] },
        { key: "cardInfo", section: "화면", label: "카드 정보 창 (크게 보기·용어 풀이)", type: "toggle", default: true },

        { key: "debugAlpha", section: "디버그", label: "디버그 표시 불투명도 (F3)", type: "choice", default: 0,
            options: [[1, "100%"], [0.75, "75%"], [0.5, "50%"], [0.25, "25%"], [0, "0% (숨김)"]] }
    ];

    static values = null;
    static listeners = new Map();

    static def(key) {
        return Settings.DEFS.find((d) => d.key === key);
    }

    static load() {
        Settings.values = {};
        for (const d of Settings.DEFS) Settings.values[d.key] = d.default;
        try {
            const saved = JSON.parse(localStorage.getItem(Settings.KEY) ?? "{}");
            if ((saved._v ?? 1) < 2) delete saved.debugAlpha;
            for (const [k, v] of Object.entries(saved)) if (Settings.def(k)) Settings.values[k] = v;
        } catch (e) {
            // 저장소를 못 쓰면 기본값으로
        }
    }

    static get(key) {
        if (!Settings.values) Settings.load();
        return Settings.values[key];
    }

    static set(key, value) {
        if (!Settings.values) Settings.load();
        Settings.values[key] = value;
        try {
            localStorage.setItem(Settings.KEY, JSON.stringify({ ...Settings.values, _v: Settings.VERSION }));
        } catch (e) {
            // 이번 실행 동안만 유지
        }
        for (const fn of Settings.listeners.get(key) ?? []) fn(value);
    }

    // 바뀔 때 부를 함수 등록. 등록할 때 지금 값으로 한 번 부른다
    static on(key, fn) {
        if (!Settings.listeners.has(key)) Settings.listeners.set(key, []);
        Settings.listeners.get(key).push(fn);
        fn(Settings.get(key));
    }

    // 선택지 한 칸 옮기기 (dir: -1 / +1)
    static step(key, dir) {
        const d = Settings.def(key);
        const i = d.options.findIndex(([v]) => v === Settings.get(key));
        const next = Math.min(Math.max((i < 0 ? 0 : i) + dir, 0), d.options.length - 1);
        Settings.set(key, d.options[next][0]);
    }

    static text(key) {
        const d = Settings.def(key);
        const v = Settings.get(key);
        if (d.type === "toggle") return v ? "켜짐" : "꺼짐";
        const opt = d.options.find(([value]) => value === v);
        return opt ? opt[1] : String(v);
    }
}

// 설정 창: 오른쪽 위 메뉴 버튼(키 Esc가 아닌 O)으로 연다. 항목은 Settings.DEFS에서 만든다.
// 아래에 조작법 안내와 [처음 화면으로] [닫기]. (저장은 방 사이에서 저절로 된다)
class SettingsPanel extends Component {
    static ROW = 34;
    static ICON = 11;

    // options: { engine, slot, onExit, seed }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.slot = options.slot ?? 3;
        this.onExit = options.onExit ?? null;
        this.seed = options.seed ?? null;
        this.rows = [];
    }

    get isOpen() {
        return this.root.isActive;
    }

    start() {
        Input.defineButton("settings", ["KeyO"]);

        // 오른쪽 위 메뉴 버튼
        const size = SidePanel.BUTTON;
        const toggle = this.engine.createUI("settingsToggle");
        const trt = toggle.getComponent(RectTransform);
        trt.setAnchor(1, 0, 1, 0);
        trt.setSizeAndPosition(size, size, -16 - size / 2 - this.slot * (size + 8), 16 + size / 2);
        const icon = SettingsPanel.ICON;
        toggle.addComponent(new UIImage(Resource.image("buttons"), { region: { x: icon * 16, y: 0, width: 16, height: 16 } }));
        toggle.addComponent(new UIButton({ onTap: () => this.toggle(), pressedRegion: { x: icon * 16, y: 16, width: 16, height: 16 } }));

        const { root, box } = Modal.create(this.engine, "settings", 340, 560, () => this.close());
        this.root = root;
        this.box = box;
        UIKit.label(box, "title", "설정", 14, 10, null, 18, { fontSize: 14, fontWeight: "bold", color: UIKit.COLORS.gold });
        if (this.seed !== null) UIKit.label(box, "seed", `런 시드 ${this.seed} · 방 사이에서 저절로 저장된다`, 14, 30, null, 14, { fontSize: 10, color: UIKit.COLORS.dim });

        // 항목 목록 (스크롤)
        const list = box.createChild("list");
        this.list = list.getComponent(RectTransform);
        this.list.setAnchor(0, 0, 1, 1);
        this.list.setOffsets(8, 50, 8, 100);
        list.addComponent(new UIRect({ color: "rgba(0, 0, 0, 0.25)" }));
        list.addComponent(new UIMask());
        const content = this.list.createChild("content").getComponent(RectTransform);
        const bar = this.list.createChild("scrollbar");
        bar.addComponent(new UIRect({ color: "rgba(232, 217, 184, 0.45)" }));
        this.scroll = list.addComponent(new UIScrollView({ content, bar: bar.getComponent(RectTransform) }));

        let y = 6;
        let section = null;
        for (const d of Settings.DEFS) {
            if (d.section !== section) {
                section = d.section;
                UIKit.label(content, "section", section, 8, y + 6, null, 16, { fontSize: 11, fontWeight: "bold", color: UIKit.COLORS.gold });
                y += 26;
            }
            this.rows.push(this.buildRow(content, d, y));
            y += SettingsPanel.ROW;
        }
        UIKit.label(content, "section", "조작법", 8, y + 6, null, 16, { fontSize: 11, fontWeight: "bold", color: UIKit.COLORS.gold });
        y += 26;
        const help = [
            "카드: 아래 패에서 누르기 / 숫자 1~9 → 칸 고르기",
            "드로우 Space (1턴) · 대기 Z (1턴) · 말 걸기·열기 E",
            "적이 없는 방: 땅을 탭하면 걸어간다",
            "지도 M · 덱 D · 상태 C · 설정 O · 화면 맞춤 F",
            "줌: 휠, + / -, 두 손가락 · 취소: Esc"
        ];
        for (const line of help) {
            UIKit.label(content, "help", line, 10, y, null, 14, { fontSize: 10, color: "#c8b890" });
            y += 17;
        }
        this.scroll.contentHeight = y + 10;

        // 아래 버튼
        const actions = box.createChild("actions");
        const art = actions.getComponent(RectTransform);
        art.setAnchor(0, 1, 1, 1);
        art.setOffsets(8, -92, 8, 10);
        const exit = UIKit.button(art, "exit", "처음 화면으로 (방 안이면 그 방부터 다시)", () => this.onExit && this.onExit(), { fontSize: 12 });
        exit.rt.setAnchor(0, 0, 1, 0.5);
        exit.rt.setOffsets(0, 0, 0, 3);
        const close = UIKit.button(art, "close", "닫기", () => this.close(), { fontSize: 13 });
        close.rt.setAnchor(0, 0.5, 1, 1);
        close.rt.setOffsets(0, 3, 0, 0);
    }

    // 한 줄: 이름 + (선택지면 [<] 값 [>], 켜기/끄기면 버튼 하나)
    buildRow(parentRT, d, y) {
        const go = parentRT.createChild("setting " + d.key);
        const rt = UIKit.place(go, 6, y, null, SettingsPanel.ROW - 4);
        go.addComponent(new UIRect({ color: "rgba(42, 35, 30, 0.95)", borderColor: UIKit.COLORS.border, borderWidth: 1 }));
        UIKit.label(rt, "name", d.label, 8, 0, null, SettingsPanel.ROW - 4, { fontSize: 11, verticalAlign: "middle" });
        const row = { def: d };
        if (d.type === "toggle") {
            row.value = UIKit.button(rt, "toggle", "", () => Settings.set(d.key, !Settings.get(d.key)), { fontSize: 11 });
            row.value.rt.setAnchor(1, 0, 1, 1);
            row.value.rt.setOffsets(-70, 4, 6, 4);
        } else {
            const prev = UIKit.button(rt, "prev", "<", () => Settings.step(d.key, -1), { fontSize: 12 });
            prev.rt.setAnchor(1, 0, 1, 1);
            prev.rt.setOffsets(-122, 4, 98, 4);
            const next = UIKit.button(rt, "next", ">", () => Settings.step(d.key, 1), { fontSize: 12 });
            next.rt.setAnchor(1, 0, 1, 1);
            next.rt.setOffsets(-30, 4, 6, 4);
            const value = rt.createChild("value");
            const vrt = value.getComponent(RectTransform);
            vrt.setAnchor(1, 0, 1, 1);
            vrt.setOffsets(-98, 0, 30, 0);
            row.text = value.addComponent(new UIText("", { fontSize: 11, color: "#ffffff" }));
        }
        return row;
    }

    toggle() {
        if (this.isOpen) this.close();
        else this.open();
    }

    open() {
        if (this.isOpen) return;
        Modal.fit(this.engine, this.box, 340, 560);
        Modal.show(this.root, true);
    }

    close() {
        Modal.show(this.root, false);
    }

    update() {
        if (Input.getButtonDown("settings")) this.toggle();
        if (!this.isOpen) return;
        if (Input.getButtonDown("cancel")) return this.close();
        for (const row of this.rows) {
            const text = Settings.text(row.def.key);
            if (row.text) row.text.setText(text);
            else {
                row.value.text.setText(text);
                const on = Settings.get(row.def.key);
                row.value.rect.color = on ? UIKit.COLORS.buttonOn : UIKit.COLORS.buttonOff;
                row.value.rect.borderColor = on ? UIKit.COLORS.gold : UIKit.COLORS.border;
            }
        }
    }
}

/* ===== assets/dat/system/SaveSystem.js ===== */
// 런 저장본. 브라우저 localStorage "kortfinite.run"에 하나만 둔다 (이 브라우저에서만 보인다).
// 방 사이(지도에서 고를 때, 방에 들어갈 때)에 저장한다. 런이 끝나면(이기거나 쓰러지면) 지운다.
// 형식(VERSION)이 다른 저장본과 예전 오픈월드 세계 저장본(kortfinite.worlds, kortfinite.world.*)은 읽을 때 지운다.
// localStorage를 못 쓰는 환경(사생활 보호 모드 등)이면 메모리에만 두고, 새로고침하면 사라진다.
class RunStore {
    static KEY = "kortfinite.run";
    static VERSION = 11; // 아이작식 층 지도 = 8, 로그라이크 런 = 4, 지도 4~5칸 그물망 = 5, 엇갈림 적은 지도·시드 섞기 = 6, 공방 데이터 카드·적으로 교체 = 7, 제단·퀘스트 방(지도 달라짐) = 10
    static persistent = true;
    static _memory = null;

    static _cleanOld() {
        try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const k = localStorage.key(i);
                if (k && (k === "kortfinite.worlds" || k.startsWith("kortfinite.world."))) localStorage.removeItem(k);
            }
        } catch (e) {
            RunStore.persistent = false;
        }
    }

    static load() {
        RunStore._cleanOld();
        let raw = RunStore._memory;
        try {
            raw = localStorage.getItem(RunStore.KEY) ?? raw;
        } catch (e) {
            RunStore.persistent = false;
        }
        if (!raw) return null;
        try {
            const data = JSON.parse(raw);
            if (data.version !== RunStore.VERSION) {
                RunStore.clear();
                return null;
            }
            return data;
        } catch (e) {
            return null;
        }
    }

    static save(data) {
        RunStore._cleanOld();
        const raw = JSON.stringify(data);
        RunStore._memory = raw;
        try {
            localStorage.setItem(RunStore.KEY, raw);
            return true;
        } catch (e) {
            RunStore.persistent = false;
            return false;
        }
    }

    static clear() {
        RunStore._memory = null;
        try {
            localStorage.removeItem(RunStore.KEY);
        } catch (e) {
            RunStore.persistent = false;
        }
    }

    // 시드 글자: 숫자면 그 숫자, 글자면 해시, 비우면 무작위
    static seedFrom(text) {
        const t = (text ?? "").trim();
        if (!t) return Math.floor(Math.random() * 2147483647);
        if (/^-?\d+$/.test(t)) return Number(t) >>> 0;
        let h = 2166136261;
        for (let i = 0; i < t.length; i++) h = Math.imul(h ^ t.charCodeAt(i), 16777619);
        return h >>> 0;
    }
}

/* ===== assets/dat/system/TitleScreen.js ===== */
// 글자 입력칸. 엔진 UI에는 글자 입력이 없어서, 이 UI 사각형 위에 HTML <input>을 겹쳐 띄운다.
// (모바일 키보드, 한글 입력을 브라우저가 처리한다.) 오브젝트가 꺼지면 숨고, 파괴되면 지워진다.
class TextField extends Component {
    // options: { engine, placeholder, maxLength, value }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.placeholder = options.placeholder ?? "";
        this.maxLength = options.maxLength ?? 24;
        this.initial = options.value ?? "";
        this.el = null;
    }

    awake() {
        const el = document.createElement("input");
        el.type = "text";
        el.placeholder = this.placeholder;
        el.maxLength = this.maxLength;
        el.value = this.initial;
        el.autocomplete = "off";
        el.spellcheck = false;
        Object.assign(el.style, {
            position: "fixed", boxSizing: "border-box", margin: "0", padding: "0 8px",
            border: "1px solid #5a4a3a", borderRadius: "0", outline: "none",
            background: "#2a231e", color: "#e8d9b8", font: "13px Galmuri11, monospace",
            display: "none", zIndex: "10", userSelect: "text", webkitUserSelect: "text"
        });
        el.addEventListener("focus", () => (el.style.borderColor = "#e8b840"));
        el.addEventListener("blur", () => (el.style.borderColor = "#5a4a3a"));
        document.body.appendChild(el);
        this.el = el;
    }

    get value() {
        return this.el ? this.el.value : "";
    }

    set value(v) {
        if (this.el) this.el.value = v;
    }

    onEnable() {
        if (this.el) this.el.style.display = "block";
    }

    onDisable() {
        if (this.el) {
            this.el.blur();
            this.el.style.display = "none";
        }
    }

    onDestroy() {
        if (this.el) this.el.remove();
        this.el = null;
    }

    // 캔버스 픽셀 사각형 → 페이지 CSS 좌표
    lateUpdate() {
        const r = this.getComponent(RectTransform).rect;
        const canvas = this.engine.canvas;
        const box = canvas.getBoundingClientRect();
        const k = box.width / canvas.width;
        Object.assign(this.el.style, {
            left: box.left + r.x * k + "px",
            top: box.top + r.y * k + "px",
            width: r.width * k + "px",
            height: r.height * k + "px"
        });
    }
}

// 시작 화면: [이어하기] (저장된 런이 있으면) · [새 런] (시드, 디버그 명령) · [도감] (카드·몬스터). 런 설명 몇 줄.
// 고르면 자기 UI를 지우고 onPlay({ seed, debug, save })를 부른다.
class TitleScreen extends Component {
    // options: { engine, onPlay({ seed, debug, save }) }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.onPlay = options.onPlay;
        this.objects = [];
    }

    start() {
        this.saved = RunStore.load();
        const bg = this.ui("titleBackground");
        const bgrt = bg.getComponent(RectTransform);
        bgrt.setAnchor(0, 0, 1, 1);
        bgrt.setOffsets(0, 0, 0, 0);
        bg.addComponent(new UIRect({ color: "#16110d" }));
        bg.addComponent(new UIElement());

        const title = bgrt.createChild("title");
        const trt = title.getComponent(RectTransform);
        trt.setAnchor(0, 0, 1, 0);
        trt.setOffsets(0, 40, 0, -80);
        title.addComponent(new UIText("Kortfinite", { fontSize: 30, fontWeight: "bold", color: UIKit.COLORS.gold }));
        const sub = bgrt.createChild("subtitle");
        const srt = sub.getComponent(RectTransform);
        srt.setAnchor(0, 0, 1, 0);
        srt.setOffsets(0, 80, 0, -100);
        sub.addComponent(new UIText("카드로 싸우며 던전을 탐색해 층마다 우두머리를 쓰러뜨려라", { fontSize: 12, color: UIKit.COLORS.dim }));

        this.box = bgrt.createChild("menu");
        const box = this.box.getComponent(RectTransform);
        box.setAnchor(0.5, 0, 0.5, 0);
        this.continueButton = UIKit.button(box, "continue", "", () => this.resume(), { fontSize: 14 });
        UIKit.place(this.continueButton.go, 0, 0, null, 44);
        this.newButton = UIKit.button(box, "new", "새 런", () => this.showCreate(), { fontSize: 14 });
        UIKit.place(this.newButton.go, 0, 52, null, 44);
        this.codexButton = UIKit.button(box, "codex", "도감 (카드 · 몬스터)", () => this.codex.open(), { fontSize: 13 });
        UIKit.place(this.codexButton.go, 0, 104, null, 38);
        this.inspector = this.gameObject.addComponent(new CardInspector({ engine: this.engine }));
        this.codex = this.gameObject.addComponent(new Codex({ engine: this.engine }));
        this.help = UIKit.label(box, "help", [
            "· 층은 방들의 지도. 시작 방에서 출발해 갈 방(전투·정예·상점·휴식·보물)을 골라 탐색한다",
            "· 우두머리 방을 찾아 쓰러뜨리면 다음 층으로 내려간다 (남은 방을 더 둘러봐도 된다)",
            "· 모든 행동은 카드로 한다. 카드 쓰기는 턴이 안 들고 기력을 쓴다",
            "· [드로우]·[대기]만 턴이 지나고, 그때 적이 움직인다",
            "· 이기면 카드 3장 중 하나를 덱에 넣는다. 쓰러지면 런이 끝난다"
        ].join("\n"), 0, 156, null, 110, { fontSize: 11, color: "#c8b890", wrap: true, lineHeight: 1.5 });
        if (this.saved) {
            this.continueButton.text.setText(`이어하기 (${this.savedFloor()}층 · ${this.saved.player.hp} 체력 · ${this.saved.player.money} G)`);
        } else {
            this.continueButton.go.setActive(false);
            UIKit.place(this.newButton.go, 0, 0, null, 44);
            UIKit.place(this.codexButton.go, 0, 52, null, 38);
            UIKit.place(this.help.gameObject, 0, 104, null, 110);
        }

        this.storageNote = UIKit.label(bgrt, "note", "", 0, 0, null, 14, { fontSize: 10, color: UIKit.COLORS.faint, align: "center" });
        this.buildCreateDialog();
    }

    savedFloor() {
        const s = this.saved;
        return s.floorNo ?? 1;
    }

    ui(name) {
        const go = this.engine.createUI(name);
        this.objects.push(go);
        return go;
    }

    buildCreateDialog() {
        const { root, box } = Modal.create(this.engine, "newRun", 320, 236, () => Modal.show(this.createDialog, false));
        this.objects.push(root);
        this.createDialog = root;
        UIKit.label(box, "title", "새 런", 14, 12, null, 18, { fontSize: 14, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.warn = UIKit.label(box, "warn", "", 14, 32, null, 14, { fontSize: 10, color: "#f0a070" });
        UIKit.label(box, "seedLabel", "시드 (비우면 무작위, 숫자나 글자)", 14, 52, null, 14, { fontSize: 11, color: "#c8b890" });
        const seed = box.createChild("seed");
        UIKit.place(seed, 14, 68, null, 32);
        this.seedField = seed.addComponent(new TextField({ engine: this.engine, placeholder: "무작위", maxLength: 24 }));
        UIKit.label(box, "debugLabel", "디버그 명령 (/give, /summon, /floor …)", 14, 112, null, 14, { fontSize: 11, color: "#c8b890" });
        this.debugOn = false;
        this.debugButton = UIKit.button(box, "debug", "끔", () => this.setDebug(!this.debugOn), { fontSize: 12 });
        UIKit.place(this.debugButton.go, 14, 128, 80, 28);

        const ok = UIKit.button(box, "ok", "시작", () => this.create(), { fontSize: 13 });
        ok.rt.setAnchor(0, 1, 0.5, 1);
        ok.rt.setOffsets(14, -50, 3, 14);
        const cancel = UIKit.button(box, "cancel", "취소", () => Modal.show(this.createDialog, false), { fontSize: 13 });
        cancel.rt.setAnchor(0.5, 1, 1, 1);
        cancel.rt.setOffsets(3, -50, 14, 14);
    }

    setDebug(on) {
        this.debugOn = on;
        this.debugButton.text.setText(on ? "켬" : "끔");
        this.debugButton.rect.color = on ? UIKit.COLORS.buttonOn : UIKit.COLORS.buttonOff;
    }

    showCreate() {
        this.seedField.value = "";
        this.setDebug(false);
        this.warn.setText(this.saved ? "이어 하던 런은 지워진다" : "");
        Modal.show(this.createDialog, true);
    }

    create() {
        const seed = RunStore.seedFrom(this.seedField.value);
        RunStore.clear();
        this.finish({ seed, debug: this.debugOn, save: null });
    }

    resume() {
        if (!this.saved) return;
        this.finish({ seed: this.saved.seed, debug: !!this.saved.debug, save: this.saved });
    }

    finish(meta) {
        for (const go of this.objects) go.destroy();
        if (this.codex.root) this.codex.root.destroy();
        if (this.inspector.root) this.inspector.root.destroy();
        Modal.openCount = 0;
        this.gameObject.destroy();
        this.onPlay(meta);
    }

    // 화면 크기에 맞춰 배치
    update() {
        const scale = this.engine.uiRoot.scale;
        const w = Math.min(360, this.engine.canvas.width / scale - 24);
        const h = this.engine.canvas.height / scale;
        if (w === this._w && h === this._h) return;
        this._w = w;
        this._h = h;
        const box = this.box.getComponent(RectTransform);
        box.setOffsets(-w / 2, 124, -w / 2, -(124 + 280));
        this.storageNote.getComponent(RectTransform).setOffsets(0, h - 20, 0, -(h - 6));
        this.storageNote.setText(RunStore.persistent ? "저장은 이 브라우저에 남는다 (방 사이에서 저장)" : "이 브라우저에선 저장이 유지되지 않는다");
    }
}

/* ===== assets/dat/system/DebugConsole.js ===== */
// 디버그 명령 창 (마인크래프트 명령어처럼). 새 런을 시작할 때 "디버그 명령"을 켠 런에서만 쓸 수 있다.
// 여는 법: 키보드 "/" 또는 화면 아래 가운데 "/" 버튼. Enter로 실행, Esc로 닫기, ↑↓로 이전 명령.
// 명령은 DebugConsole.register(이름, { args, help, aliases, run(ctx, args) })로 더한다. run이 돌려준 글은 창에 찍힌다.
// ctx = { console, player, cards, world(지금 방), run, turns }
class DebugConsole extends Component {
    static commands = new Map();
    static aliases = new Map();
    static LINES = 13;

    static register(name, def) {
        DebugConsole.commands.set(name, { name, args: "", aliases: [], ...def });
        for (const a of def.aliases ?? []) DebugConsole.aliases.set(a, name);
    }

    static find(name) {
        return DebugConsole.commands.get(name) ?? DebugConsole.commands.get(DebugConsole.aliases.get(name));
    }

    // options: { engine, player, world, run, turns }
    constructor(options) {
        super();
        this.o = options;
        this.lines = [];
        this.history = [];
        this.at = 0;
    }

    get ctx() {
        const o = this.o;
        return { console: this, player: o.player, cards: o.player.cards, world: o.world, run: o.run, turns: o.turns };
    }

    start() {
        const engine = this.o.engine;
        const { root, box } = Modal.create(engine, "debugConsole", 460, 330, () => this.close());
        this.root = root;
        this.box = box;
        UIKit.label(box, "title", "디버그 명령 (help: 명령 목록, Esc: 닫기)", 12, 8, null, 16, { fontSize: 12, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.out = UIKit.label(box, "out", "", 12, 30, null, 250, { fontSize: 11, color: "#c8e8b0", wrap: true, lineHeight: 1.4 });
        const input = box.createChild("input");
        const irt = input.getComponent(RectTransform);
        irt.setAnchor(0, 1, 1, 1);
        irt.setOffsets(12, -42, 12, 10);
        this.field = input.addComponent(new TextField({ engine, placeholder: "/give heavy", maxLength: 80 }));

        // 화면 오른쪽, 아래 패 위 "/" 버튼 (모바일)
        this.button = engine.createUI("debugButton");
        const brt = this.button.getComponent(RectTransform);
        brt.setAnchor(1, 1, 1, 1);
        brt.setSizeAndPosition(32, 32, -28, -(HandBar.HEIGHT + 24));
        this.button.addComponent(new UIRect({ color: "rgba(40, 30, 60, 0.85)", borderColor: "#9a5ad8", borderWidth: 1 }));
        this.button.addComponent(new UIButton({ onTap: () => this.open() }));
        const t = brt.createChild("label");
        t.getComponent(RectTransform).setAnchor(0, 0, 1, 1);
        t.addComponent(new UIText("/", { fontSize: 18, color: "#e0c8ff" }));

        this._onKey = (e) => {
            const typing = document.activeElement && document.activeElement.tagName === "INPUT";
            if (this.isOpen) {
                if (e.target !== this.field.el) return;
                if (e.key === "Enter") { e.preventDefault(); this.submit(); }
                else if (e.key === "Escape") { e.preventDefault(); this.close(); }
                else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
                    e.preventDefault();
                    if (!this.history.length) return;
                    this.at = Math.max(0, Math.min(this.history.length, this.at + (e.key === "ArrowUp" ? -1 : 1)));
                    this.field.value = this.history[this.at] ?? "";
                }
                e.stopPropagation();
                return;
            }
            if (!typing && e.key === "/" && !Modal.isOpen) {
                e.preventDefault();
                this.open();
            }
        };
        document.addEventListener("keydown", this._onKey, true);
        this.print("디버그 명령을 쓸 수 있는 런이다. help를 쳐 보자");
    }

    onDestroy() {
        document.removeEventListener("keydown", this._onKey, true);
    }

    get isOpen() {
        return !!this.root && this.root.isActive;
    }

    open() {
        if (this.isOpen) return;
        Modal.fit(this.o.engine, this.box, 460, 330);
        Modal.show(this.root, true);
        this.field.value = "";
        this.at = this.history.length;
        setTimeout(() => this.field.el && this.field.el.focus(), 0);
    }

    close() {
        if (!this.isOpen) return;
        Modal.show(this.root, false);
    }

    print(text, color) {
        for (const line of String(text).split("\n")) this.lines.push(line);
        this.lines = this.lines.slice(-DebugConsole.LINES);
        if (this.out) this.out.setText(this.lines.join("\n"));
    }

    submit() {
        const text = this.field.value.trim();
        this.field.value = "";
        if (!text) return;
        this.history.push(text);
        this.at = this.history.length;
        this.print("> " + text);
        const result = this.run(text);
        if (result) this.print(result);
    }

    // 명령 한 줄 실행. 결과 글을 돌려준다
    run(text) {
        const [head, ...args] = text.replace(/^\//, "").trim().split(/\s+/);
        const cmd = DebugConsole.find(head.toLowerCase());
        if (!cmd) return `모르는 명령: ${head} (help)`;
        try {
            const r = cmd.run(this.ctx, args);
            return r === undefined ? "완료" : r;
        } catch (err) {
            console.error(err);
            return `오류: ${err.message}`;
        }
    }

    // ---------- 도우미 ----------
    // 이름이나 id로 카드 정의 찾기 ("wood", "나무", "돌도끼")
    static resolveCard(q) {
        if (!q) return null;
        if (CardDef.defs.has(q)) return q;
        const all = [...CardDef.defs.entries()];
        const exact = all.find(([id, d]) => d.name === q);
        if (exact) return exact[0];
        const part = all.find(([id, d]) => id.includes(q) || (d.name ?? "").includes(q));
        return part ? part[0] : null;
    }

    // 카드를 패에 (가득하면 행동 카드는 덱, 아이템은 못 준다)
    static giveCard(ctx, card) {
        if (ctx.cards.addToHand(card)) return "패";
        if (card.isSkill) {
            ctx.cards.addToDeck(card);
            return "덱";
        }
        return "못 받음";
    }

    static int(v, def) {
        const n = parseInt(v, 10);
        return Number.isFinite(n) ? n : def;
    }
}

// ================= 명령들 =================
DebugConsole.register("help", {
    args: "[명령]", help: "명령 목록 / 명령 설명",
    run(ctx, [name]) {
        if (name) {
            const c = DebugConsole.find(name.replace(/^\//, ""));
            return c ? `/${c.name} ${c.args} — ${c.help}${c.aliases.length ? ` (= ${c.aliases.join(", ")})` : ""}` : `모르는 명령: ${name}`;
        }
        const all = [...DebugConsole.commands.values()].map((c) => `/${c.name}`);
        const rows = [];
        for (let i = 0; i < all.length; i += 6) rows.push(all.slice(i, i + 6).join("  "));
        return rows.join("\n") + "\nhelp <명령>으로 자세히";
    }
});

DebugConsole.register("give", {
    args: "<카드> [수]", aliases: ["card", "i"],
    help: "카드 지급. 이름·id 모두 된다. 행동 카드는 패가 차면 덱으로",
    run(ctx, [q, n]) {
        const id = DebugConsole.resolveCard(q);
        if (!id) return `그런 카드가 없다: ${q ?? ""} (/cards로 찾기)`;
        const cards = [];
        {
            const count = Math.max(1, Math.min(99, DebugConsole.int(n, 1)));
            for (let i = 0; i < count; i++) cards.push(Card.create(id));
        }
        const where = cards.map((c) => DebugConsole.giveCard(ctx, c));
        const name = cards[0].name;
        const at = where.includes("못 받음") ? "패가 가득해 일부 못 받음" : where.includes("덱") ? "패가 가득해 일부 덱" : "패";
        return `${name} ×${cards.reduce((s, c) => s + (c.count ?? 1), 0)} 지급 (${at})`;
    }
});

DebugConsole.register("cards", {
    args: "[검색어]", help: "카드 id 목록 (검색어로 거르기)",
    run(ctx, [q]) {
        const list = [...CardDef.defs.entries()].filter(([id, d]) => !q || id.includes(q) || (d.name ?? "").includes(q));
        const shown = list.map(([id, d]) => `${id}(${d.name})`).slice(0, 40);
        return shown.join(" ") + (list.length > 40 ? ` … (${list.length}개)` : "");
    }
});

DebugConsole.register("summon", {
    args: "<종류> [수] [레벨] [elite|boss]", aliases: ["spawn"],
    help: "몬스터 소환 (rat, wolf, goblin, ogre, skeleton, slime, spider, stone_golem …). elite·boss를 붙이면 정예·우두머리",
    run(ctx, [type, n, lv, rank]) {
        if (!type || !Monster.KINDS[type]) return `종류: ${Object.keys(Monster.KINDS).join(", ")}`;
        const count = Math.max(1, Math.min(20, DebugConsole.int(n, 1)));
        const p = ctx.player;
        let made = 0;
        for (let i = 0; i < count; i++) {
            const size = Monster.KINDS[type].size ?? 1;
            const spot = size > 1 ? ctx.world.findFreeArea(p.x + 2, p.y, size, 8) : ctx.world.findFreeTile(p.x + 2, p.y, 8);
            if (size > 1 ? !ctx.world.canEnter({ size, tilesOf: (ax, ay) => { const o = []; for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) o.push([ax + dx, ay + dy]); return o; } }, spot.x, spot.y) : !ctx.world.isWalkable(spot.x, spot.y)) continue;
            ctx.world.spawn(EntityTypes.create(type, spot.x, spot.y, { lv: Math.max(1, DebugConsole.int(lv, 1)), rank: rank === "boss" || rank === "elite" ? rank : "normal" }));
            made++;
        }
        EnemyMoves.planAll(ctx.world, p, ctx.turns.turn);
        if (made && ctx.run) {
            ctx.run.cleared = false;
            if (ctx.run.exit) ctx.run.exit.setOpen(false);
        }
        return `${type} ${made}마리 소환`;
    }
});

DebugConsole.register("killall", {
    args: "", aliases: ["kill", "win"], help: "방의 적을 모두 없앤다 (방을 정리한 것으로 친다)",
    run(ctx) {
        let n = 0;
        for (let pass = 0; pass < 5; pass++) { // 슬라임이 갈라지면 한 번 더
            const list = ctx.world.hostiles(ctx.player);
            if (!list.length) break;
            for (const e of list) {
                e.stats.hp = 0;
                Combat.kill(e, ctx.player, ctx.world);
                if (e.gameObject) e.gameObject.destroy();
                n++;
            }
        }
        return `${n}마리 치움`;
    }
});

DebugConsole.register("room", {
    args: "<start|battle|elite|shop|rest|treasure|boss>", aliases: ["go"],
    help: "이 층의 그 종류의 방으로 바로 간다 (지도에서 고른 것처럼)",
    run(ctx, [type]) {
        const run = ctx.run;
        if (!RunMap.TYPES[type]) return `종류: ${Object.keys(RunMap.TYPES).join(", ")}`;
        const node = [...run.map.nodes.values()].find((n) => n.type === type);
        if (!node) return `그런 방이 이 층에 없다`;
        ctx.console.close();
        run.state = "map";
        run.enter(node.id, true);

    }
});

/* ===== assets/dat/player/Player.js ===== */
class Player extends Entity {
    static BASE_HP = 40;
    static BASE_ATTACK = 5;
    static BASE_DEFENSE = 5;
    static BASE_SPEED = 3;     // 이동속도: [기본이동] 한 장으로 걷는 칸 수
    static MAX_ENERGY = 3;     // 기력: 행동 카드 비용. 턴이 지날 때마다 가득 찬다
    static MAX_MANA = 20;
    // 기본 능력치 (캐릭터는 하나뿐)
    static BASE = { hp: 40, atk: 5, def: 5, speed: 3, mana: 20, energy: 3, gold: 50 };
    static current = null;     // 카드 설명(피해 수치 등)이 보는 플레이어

    // options.cards: CardSystem 옵션 { actionHand, invHand, rules }
    constructor(x, y, options = {}) {
        super(x, y, "player", {
            type: "player", name: "당신",
            stats: { maxHp: Player.BASE.hp, attack: Player.BASE.atk, defense: Player.BASE.def },
            tags: ["creature", "human", "player"]
        });
        Player.current = this;
        this.kills = 0;
        this.turnNo = 0;        // 지금 몇 번째 턴인가 (방마다 처음부터는 아니고 세기만 한다)
        this.turnUses = {};     // 이번 턴에 쓴 횟수 { 카드 id: 번 } — 턴 제한
        this.energySpent = 0;   // 이번 턴에 쓴 기력 (붉은 과부하)
        this.dmgBoost = 0;      // 쓰는 중인 카드의 피해 배수 (기도 붉은 변형), 0이면 없음
        this.money = options.money ?? Player.BASE.gold;
        // 마나: 주문 비용. 저절로 차지 않는다 — 방에 들어갈 때 조금, 마나 물약, 명상, 모닥불로 찬다
        this.maxMana = Player.BASE.mana;
        this.mana = this.maxMana;
        // 기력: 행동 카드 비용. 턴이 지날 때마다 가득 찬다
        this.maxEnergy = Player.BASE.energy;
        this.energy = this.maxEnergy;
        this.speed = Player.BASE.speed;
        // 방어도: [{ v: 남은 양, t: 남은 턴 }]. 따로 세고, 곧 끝나는 것부터 깎인다
        this.blocks = [];
        // 쉼: 남은 턴 동안 카드를 뽑지 못한다 (주문 비용 "쉼 n")
        this.drawLock = 0;
        // 상태 이상·버프 (Status.js): 독, 화상, 약화, 취약, 속박, 재생, 힘, 가시
        this.status = {};
        // 영구히 오른 능력치 (카드 효과: 처치·방 정리 때 조금씩) { maxHp, attack, defense, maxMana, speed }
        this.perm = {};
        // 이 방을 정리하면 할 일 (카드 효과 "방을 정리하면 ~"): [{ fx, card }]
        this.onClear = [];
        this._statVer = 0;
        this.cards = new CardSystem(options.cards);   // 패(행동·인벤토리)/덱/묘지/장비

        this.goal = null;           // 걸어갈 칸 { x, y, entity } — 적이 없는 방에서만 (카드 없이 걷는다)
        this.wantsInteract = null;  // 상호작용할 칸 { x, y }
        this.wantsCard = null;      // 쓰려고 고른 패의 카드 { card, target? }
        this.wantsDraw = false;     // 뽑기 (1턴)
        this.wantsWait = false;     // 대기 (1턴)
        this.pendingDir = null;     // 테스트·디버그용: 카드 없이 한 칸 걷기(부딪히면 공격) + 1턴. 화면 입력으로는 안 생긴다
    }

    update() {
        this.refreshGear();
    }

    // 예전 이름: 독·속박 수치 (Status)
    get poison() { return Status.get(this, "poison"); }
    set poison(v) { Status.set(this, "poison", v); }
    get root() { return Status.get(this, "root"); }
    set root(v) { Status.set(this, "root", v); }

    // 힘·영구 능력치가 바뀌었다 (능력치 다시 계산)
    statsChanged() {
        this._statVer++;
        this.refreshGear();
    }

    // 영구히 능력치 올리기
    addPerm(key, n) {
        this.perm[key] = (this.perm[key] ?? 0) + n;
        if (key === "maxMana") this.maxMana = Player.BASE.mana + this.perm.maxMana;
        if (key === "maxHp") this.stats.hp += n;
        this.statsChanged();
    }

    // 방에 적이 없는가 (적이 없으면 땅을 탭해 카드 없이 걸어 다닌다)
    get safe() {
        return !!this.world && this.world.hostiles(this).length === 0;
    }

    // 땅 탭: 적이 없는 방이면 그 칸으로 걸어간다 (턴·카드 없이). 상호작용할 것(출구·상인·모닥불·상자)을 탭하면 옆까지 가서 쓴다.
    // 적이 있는 방에서는 아무것도 하지 않는다 (움직임은 이동 카드로). 바로 옆의 상호작용 대상은 언제든 쓴다
    setGoal(x, y) {
        // 서 있는 칸을 다시 탭하면 그 칸의 떨어진 물건을 가진다
        if (x === this.x && y === this.y && this.world.entitiesAt(x, y).some((e) => e !== this && e.interactable)) {
            this.wantsInteract = { x, y };
            return true;
        }
        const entity = this.world.entityAt(x, y);
        const usable = entity && entity !== this && entity.interactable && !this.isHostileTo(entity);
        if (usable && Math.abs(x - this.x) + Math.abs(y - this.y) === 1) {
            this.wantsInteract = { x, y };
            return true;
        }
        // 적을 탭하면 그 적이 다음 턴에 할 일을 알려 준다
        if (entity && entity !== this && entity.ai instanceof EnemyAI && entity.alive) {
            MessageLog.add(EnemyMoves.describe(entity, this), "#f0c8a0");
            this.clearGoal();
            return false;
        }
        if (!this.safe) {
            this.clearGoal();
            return false;
        }
        if (entity && entity !== this && !usable) {
            this.clearGoal();
            return false;
        }
        this.goal = { x, y, entity: usable ? entity : null };
        return true;
    }

    clearGoal() {
        this.goal = null;
    }

    // 이번 행동. { type: "card", card, target } | { type: "draw" } | { type: "wait" } | { type: "interact", x, y } | { type: "walk", path } | null
    nextAction() {
        if (Modal.isOpen) return null;
        if (this.pendingDir) {
            const dir = this.pendingDir;
            this.pendingDir = null;
            this.clearGoal();
            return { type: "move", dir };
        }
        if (this.wantsCard) {
            const { card, target, picks } = this.wantsCard;
            this.wantsCard = null;
            this.clearGoal();
            return { type: "card", card, target, picks };
        }
        if (this.wantsDraw) {
            this.wantsDraw = false;
            this.clearGoal();
            return { type: "draw" };
        }
        if (this.wantsWait) {
            this.wantsWait = false;
            this.clearGoal();
            return { type: "wait" };
        }
        if (this.wantsInteract) {
            const { x, y } = this.wantsInteract;
            this.wantsInteract = null;
            this.clearGoal();
            return { type: "interact", x, y };
        }
        if (this.goal) return this._walkStep();
        return null;
    }

    // 걸어가기 (적이 없는 방): 목표까지 길을 찾아 한 번에 걷는다. 상호작용 대상이면 옆에 닿은 뒤 쓴다
    _walkStep() {
        const g = this.goal;
        this.clearGoal();
        if (!this.safe) return null;
        const w = this.world;
        if (g.entity && Math.abs(g.x - this.x) + Math.abs(g.y - this.y) === 1) return { type: "interact", x: g.x, y: g.y };
        const path = Pathfinder.find(w, this.x, this.y, g.x, g.y, { mover: this });
        if (!path || !path.length) {
            MessageLog.add("거기까지 가는 길이 없다", "#c8b890");
            return null;
        }
        if (g.entity) path.pop(); // 대상 칸 앞에서 멈춘다
        return { type: "walk", path, then: g.entity ? { x: g.x, y: g.y } : null };
    }

    get attitude() {
        return "player";
    }

    // 플레이어는 우호가 아닌 상대를 칠 수 있다. 상호작용 대상(상인·출구 …)은 화났을 때만 적
    isHostileTo(other) {
        if (other.interactable) return other.attitude === "hostile";
        return other.attitude !== "friendly";
    }

    // ---------- 장비 (Gear.js) ----------
    gear(key) {
        return Gear.sum(this.cards, key);
    }

    // 장비가 바뀌면 능력치 다시 계산
    refreshGear() {
        const key = this.cards.version + ":" + this._statVer + ":" + Status.get(this, "growth");
        if (this._gearVersion === key) return;
        this._gearVersion = key;
        const pm = this.perm ?? {};
        this.stats.attack = Player.BASE.atk + this.gear("attack") + (pm.attack ?? 0) + Status.get(this, "str");
        const def = Player.BASE.def + this.gear("defense") + (pm.defense ?? 0) + Status.get(this, "harden");
        this.stats.defense = Math.floor(def * (100 + this.gear("defensePct")) / 100 + 1e-9); // 방어력 % 증가는 버림
        this.speed = Player.BASE.speed + this.gear("speed") + (pm.speed ?? 0); // 둔화는 Status.speed가 따로 반영한다
        const max = this.baseMaxHp + this.gear("maxHp") + (pm.maxHp ?? 0) + Status.get(this, "growth");
        if (max !== this.stats.maxHp) {
            this.stats.maxHp = max;
            this.stats.hp = Math.min(this.stats.hp, max);
        }
    }

    // 최대 체력 (모닥불·보상으로 오른다. 장비 보너스는 빼고)
    get baseMaxHp() {
        return this._baseMaxHp ?? Player.BASE.hp;
    }

    set baseMaxHp(v) {
        this._baseMaxHp = v;
        this._gearVersion = null;
        this.statsChanged();
    }

    // ---------- 방어도 ----------
    get block() {
        return this.blocks.reduce((s, b) => s + b.v, 0);
    }

    addBlock(v, turns) {
        if (v > 0) this.blocks.push({ v, t: turns });
    }

    // 피해를 방어도로 막고 남은 피해를 돌려준다. 곧 끝나는 방어도부터 깎는다
    absorb(damage) {
        this.blocks.sort((a, b) => a.t - b.t);
        for (const b of this.blocks) {
            if (damage <= 0) break;
            const used = Math.min(b.v, damage);
            b.v -= used;
            damage -= used;
        }
        this.blocks = this.blocks.filter((b) => b.v > 0);
        return damage;
    }

    // ---------- 턴 ----------
    // 턴이 지난 뒤 (뽑기·대기, 주변이 다 움직인 다음): 방어도 남은 턴 -1, 기력 가득, 쉼 -1
    startTurn() {
        this.turnNo++;
        this.turnUses = {};
        this.energySpent = 0;
        for (const b of this.blocks) b.t--;
        this.blocks = this.blocks.filter((b) => b.t > 0 && b.v > 0);
        this.energy = this.maxEnergy;
        // 무기력: 새 턴에 얻는 기력이 줄어든다
        const lazy = Status.applyLate(this);
        if (lazy) {
            this.energy = Math.max(0, this.energy - lazy);
            MessageLog.add(`무기력으로 기력이 ${lazy} 줄었다 (${this.energy}/${this.maxEnergy})`, "#9a8cf0");
        }
        if (this.drawLock > 0) this.drawLock--;
    }

    // 방에 들어갈 때: 방어도·쉼을 비우고 기력을 채운다
    enterRoom() {
        this.turnUses = {};
        this.energySpent = 0;
        this.dmgBoost = 0;
        this.blocks = [];
        this.heldBy = null;
        this.holdFx = false;
        Status.clear(this);
        this.onClear = [];
        this.drawLock = 0;
        this.energy = this.maxEnergy;
        this.clearGoal();
    }

    // 카드를 쓰겠다고 정한다. 고르기가 필요한 카드(버릴 카드 · 덱에서 찾기)는 고르기 창을 먼저 연다
    requestCard(card, target = null) {
        const pk = card.def.picker;
        if (!pk) {
            this.wantsCard = { card, target };
            return;
        }
        const cfg = pk(this, card);
        if (cfg.min > 0 && cfg.cards.length < cfg.min) {
            MessageLog.add(`${card.name}: 고를 카드가 없다`, "#c8b890");
            return;
        }
        if (!cfg.cards.length || !CardPicker.viewer) {
            this.wantsCard = { card, target, picks: [] };
            return;
        }
        CardPicker.open(cfg.title, cfg.cards, cfg.min, cfg.max, (picks) => { this.wantsCard = { card, target, picks }; }, { sections: cfg.sections ?? null });
    }

    // 이 카드를 지금 쓸 수 있는가 (비용 + 속박이면 이동 카드는 못 쓴다)
    canUse(card) {
        if (this.root > 0 && card.target && (card.target.walk || card.target.move)) return false;
        if (this.turnLimited(card)) return false;
        return !card.cost || this.canPay(card.cost);
    }

    // 비용: energy(기력), mana, hp(남는 체력이 1 이상일 때만), rest(쉼: 그만큼 못 뽑는다, 언제든 낼 수 있다)
    canPay(cost) {
        if (cost.energy && this.energy < cost.energy) return false;
        if (cost.mana && this.mana < cost.mana) return false;
        if (cost.hp && this.stats.hp <= cost.hp) return false; // 체력 비용으로 쓰러질 수는 없다
        if (cost.gold && this.money < cost.gold) return false;
        return true;
    }

    lackText(cost) {
        if (cost.energy && this.energy < cost.energy) return `기력이 모자란다 (${this.energy}/${cost.energy}) · 턴을 넘기면 가득 찬다`;
        if (cost.mana && this.mana < cost.mana) return `마나가 모자란다 (${this.mana}/${cost.mana})`;
        if (cost.gold && this.money < cost.gold) return `돈이 모자란다 (${this.money}/${cost.gold} G)`;
        if (cost.hp && this.stats.hp <= cost.hp) return `체력이 모자란다 (체력 ${cost.hp}을 쓰려면 ${cost.hp + 1} 이상 있어야 한다)`;
        return "";
    }

    // 손으로 [묘지로] 버리기. 상태이상 카드(점액)는 비용(discardCost)을 내야 버려진다. 카드 효과로 버려질 땐 이걸 안 쓴다
    discardByHand(card) {
        if (card.def.noDiscard) {
            MessageLog.add(`${card.name}: [묘지로] 사용불가 — 카드를 써서 소멸시키거나 카드 효과로만 버려진다`, "#c8b890");
            return false;
        }
        return !!this.cards.discard(card);
    }

    // 턴 제한: 이 턴에 이 카드를 더 쓸 수 없는가 ([턴 제한(3)]). 드로우 효과만 제한하는 카드(limitDraw)는 쓰는 건 막지 않는다
    turnLimited(card) {
        const lim = card.def.turnLimit;
        return !!lim && !card.def.limitDraw && (this.turnUses[card.defId] ?? 0) >= lim;
    }

    pay(cost) {
        if (cost.energy) { this.energy -= cost.energy; this.energySpent += cost.energy; }
        if (cost.mana) this.mana -= cost.mana;
        if (cost.hp) this.stats.hp = Math.max(1, this.stats.hp - cost.hp);
        if (cost.gold) this.money -= cost.gold;
        if (cost.rest) {
            this.drawLock += cost.rest;
            MessageLog.add(`${this.drawLock}턴 동안 카드를 뽑을 수 없다 (쉼)`, "#a0b8e8");
        }
    }

    save() {
        return {
            hp: this.stats.hp, maxHp: this.baseMaxHp, money: this.money, kills: this.kills, mana: this.mana, perm: this.perm,
            cards: this.cards.save()
        };
    }

    load(data) {
        this.money = data.money;
        this.kills = data.kills ?? 0;
        this.mana = data.mana ?? this.maxMana;
        this.cards.load(data.cards);
        this.perm = data.perm ?? {};
        this.maxMana = Player.BASE.mana + (this.perm.maxMana ?? 0);
        this.baseMaxHp = data.maxHp ?? Player.BASE.hp;
        this.stats.hp = Math.min(data.hp, this.stats.maxHp);
    }
}

// ---- 이벤트를 듣는 쪽: 처치 수 ----
Events.on(GameEvent.KILLED, ({ killer, target }) => {
    if (!(killer instanceof Player) || !target.hasTag("creature")) return;
    killer.kills++;
    killer.cards.notify("kill", { target });
}, { priority: 10 });

    ["chest", "entities/chest.png"],
    ["campfire", "entities/campfire.png"],
    ["stairs_down", "entities/stairs_down.png"],
    ["exit_locked", "entities/exit_locked.png"],
    ["ladder_up", "entities/ladder_up.png"],
    ["dungeon_floor", "tiles/dungeon_floor.png"],
    ["dungeon_wall", "tiles/dungeon_wall.png"],
    ["cave_floor", "tiles/cave_floor.png"],
    ["cave_wall", "tiles/cave_wall.png"],
    ["planks", "tiles/planks.png"],
    ["grass", "tiles/grass.png"],
    ["buttons", "ui/buttons.png"],
    ["map_icons", "ui/map_icons.png"],
    ["turret", "entities/turret.png"],
    ["totem", "entities/totem.png"],
    ["scarecrow", "entities/scarecrow.png"],
    ["barrier", "entities/barrier.png"],
    ["mine", "entities/mine.png"],
    ["field", "entities/field.png"],
    ["card_glyphs", "card_glyphs.png"],
    ["cards", "cards.png"]
  ]);
  console.log("Images Loaded");
  Load.basePath = "assets/dat/";
  /* 스크립트는 build_bundle.py가 이미 합쳤다 */
  console.log("Scripts Loaded");
  GameContent.load(); // 공방 카드 등록
  EquipContent.load();  // 공방 장비 등록 (아이콘 시트에 같이 들어간다)
  EnemyData.load();   // 공방 적 등록
  CardKit.buildIcons(); // 카드 아이콘 시트 "kicons"
  Debug.opacity = Settings.get("debugAlpha"); // 시작 화면부터 설정대로 (기본 0%: 숨김)

  // 도트 글꼴을 미리 불러 둔다 (안 불러진 채 그리면 기본 글꼴로 그려진다). 실패해도 기본 글꼴로 계속한다
  try {
    await Promise.all(["9px Galmuri9", "11px Galmuri11", "bold 11px Galmuri11", "14px Galmuri14"].map((f) => document.fonts.load(f, "가나다ABC123")));
  } catch (e) { console.warn("글꼴을 못 불러왔다", e); }

  // 화면 배율(devicePixelRatio)만큼 해상도를 높여서 그린다: CSS 픽셀 크기로 그리고 브라우저가 소수 배로 늘리면(폰은 2.625배 같은 값)
  // 도트 크기가 들쭉날쭉 깨진다. 기기 픽셀 그대로 그리고 카메라 배율을 정수로 맞춘다 (Run.fitCamera)
  const pr = Math.min(window.devicePixelRatio || 1, 3);
  const App = new Engine({ canvas: "#game", pixelRatio: pr, uiScale: pr }); // UI 1단위 = CSS 픽셀 1개 (기기 픽셀 pr개)
  App.camera.zoom = 1;
  App.start();
  window.App = App;
  console.log("started");

  // 시작 화면: 이어하기 / 새 런
  const title = new GameObject("title");
  title.addComponent(new TitleScreen({ engine: App, onPlay: (meta) => startGame(App, meta) }));
  App.add(title);
}

// 오른쪽 위 둥근 버튼 하나 (slot: 오른쪽부터 0, 1, 2 …, icon: buttons.png 칸)
function cornerButton(App, name, slot, icon, onTap, action = null) {
  const size = SidePanel.BUTTON;
  const go = App.createUI(name);
  const rt = go.getComponent(RectTransform);
  rt.setAnchor(1, 0, 1, 0);
  const p = SidePanel.buttonPos(App, slot);
  rt.setSizeAndPosition(size, size, p.x, p.y);
  go.addComponent(new UIImage(Resource.image("buttons"), { region: { x: icon * 16, y: 0, width: 16, height: 16 } }));
  go.addComponent(new UIButton({ onTap, action, pressedRegion: { x: icon * 16, y: 16, width: 16, height: 16 } }));
  return go;
}

// meta: { seed, debug, save }
function startGame(App, meta) {
  MessageLog.lines = [];

  // 행동 패 4장 · 인벤토리 패 4장 (장비로 늘어난다). 새 런은 시작 덱(기본이동 3, 기본공격 3)을 덱에 든다
  const player = new Player(0, 0, { cards: { rules: [] } });
  if (!meta.save) player.cards.giveStarter();
  const playerObject = new GameObject("player");
  playerObject.addComponent(player);
  App.add(playerObject);

  const queue = new AnimQueue();
  const follow = App.camera.gameObject.addComponent(new CameraFollow({ target: player.transform, follow: false }));

  // 런: 지도 · 방 · 저장
  const run = new Run({ engine: App, player, queue, follow, meta, save: meta.save });
  const runObject = new GameObject("run");
  runObject.addComponent(run);
  App.add(runObject);
  const world = run.view; // 지금 방으로 이어지는 창구. 아래 모든 world는 이것

  const turns = new TurnManager({ world, player, queue, run });
  const turnObject = new GameObject("turns");
  turnObject.addComponent(queue);
  turnObject.addComponent(turns);
  App.add(turnObject);

  Input.dragThreshold = 10;
  Settings.on("animSpeed", (v) => (queue.speed = v));
  Settings.on("shake", (v) => (Camera.shakeEnabled = v));
  Settings.on("debugAlpha", (v) => (Debug.opacity = v));
  Debug.corner = "top-right";
  Debug.offset = { x: 8, y: 64 };
  Events.on(GameEvent.TURN_END, ({ turn }) => {
    if (!Debug.enabled) return;
    Debug.set("턴", turn);
    Debug.set("방", run.node ? run.node.id : "-");
    Debug.set("엔티티", run.room ? run.room.actors.size : 0);
  }, { owner: turns });

  // 적의 예고 (다음 턴에 맞는 칸)를 땅에 그린다
  const intents = new GameObject("intents");
  intents.addComponent(new IntentOverlay(run));
  App.add(intents);
  // 장판 (독·화상 바닥)
  const fields = new GameObject("fields");
  fields.addComponent(new HazardOverlay(run));
  App.add(fields);

  const ui = new GameObject("ui");
  const targeting = ui.addComponent(new TileTargeting({ engine: App, world, player }));
  ui.addComponent(new PlayerHud({ engine: App, player, world, run }));
  ui.addComponent(new WorldInput({ engine: App, world, player, camera: follow, targeting, run, minZoom: 0.5 }));
  const gems = ui.addComponent(new GemDialog({ engine: App, player }));
  const deckView = ui.addComponent(new DeckViewer({ engine: App, player, gems }));
  CardPicker.viewer = deckView;
  const hand = ui.addComponent(new HandBar({ engine: App, player, world, targeting, gems, deckView }));
  ui.addComponent(new StatusPanel({ engine: App, player, turns, run }));
  // 오른쪽 위 버튼 (왼쪽부터): 내 카드 · 상태 · 지도 · 메뉴
  cornerButton(App, "mapToggle", 1, 15, () => run.ui.map.toggleView());
  Input.defineButton("deck", ["KeyD"]);
  cornerButton(App, "deckToggle", 3, 4, () => deckView.openOwned());
  ui.addComponent(new SettingsPanel({
    engine: App, slot: 0, seed: run.seed,
    onExit: () => location.reload()
  }));
  const reward = ui.addComponent(new RewardDialog({ engine: App, player }));
  const shop = ui.addComponent(new ShopDialog({ engine: App, player, run, deckView }));
  const rest = ui.addComponent(new RestDialog({ engine: App, player, deckView }));
  ui.addComponent(new PickupInfo({ engine: App, player, world, run }));
  const equip = ui.addComponent(new EquipDialog({ engine: App, player }));
  const map = ui.addComponent(new MapScreen({ engine: App, run, deckView, equipDialog: equip }));
  const end = ui.addComponent(new EndScreen({ engine: App, player }));
  ui.addComponent(new CardInspector({ engine: App }));
  // 디버그 명령 (새 런을 만들 때 켠 런만): "/" 키나 오른쪽 가운데 버튼
  const debugConsole = meta.debug ? ui.addComponent(new DebugConsole({ engine: App, player, world, run, turns })) : null;
  // 덱 보기 키 (D)
  ui.addComponent(new (class extends Component {
    update() {
      if (Input.getButtonDown("deck") && !Modal.isOpen) deckView.openOwned();
    }
  })());
  App.add(ui);
  run.ui = { map, reward, shop, rest, end };

  window.Game = { run, world, player, turns, queue, targeting, hand, deckView, gems, reward, shop, rest, equip, map, end, debugConsole, follow, meta };
  MessageLog.add(meta.save ? "이어서 한다" : "새 런을 시작한다. 지도에서 첫 방을 고르자", "#e8b840");
  MessageLog.add("카드를 써서 움직이고 싸운다 (쓰기는 턴이 안 든다). 뽑기·대기만 1턴", "#c8b890");
  // UI가 다 만들어진 다음 프레임에 Run이 시작한다 (지도를 열거나, 못 끝낸 방으로)
}

main();

  </script>
