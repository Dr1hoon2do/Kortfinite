/* ===== assets/dat/card/Gem.js ===== */
// 젬: 스킬 카드의 젬 칸(0~3칸, Spell.js)에 끼워 비용·위력·추가 효과를 바꾼다.
//
// 젬 카드 한 장 = 종류(CardDef: gem_power 등) + 카드 데이터 { q: 품질 }
//   품질은 E D C B A (A가 가장 좋다). 안에서는 숫자 1~5 (E=1 … A=5). 수치는 종류마다 values[품질 - 1].
//   카드 이름은 "젬(증폭) B"처럼.
// 끼우기: 플레이어가 어디서나 (턴 안 씀). 패에 있는 스킬 카드에, 그 카드에 효과가 있는 젬만.
// 빼기:   플레이어가 직접 빼면 젬이 깨진다.
// 값 = 15 × 2.3^품질 × 젬 가치(종류마다)
class Gem {
    static BASE_PRICE = 15;
    static GROWTH = 2.3;
    static REMOVE_RATE = 0.3;   // 연금술사 빼기 수수료 = 젬 값 × 이것
    static REMOVE_MIN = 100;    // 수수료 최소
    static GRADES = ["", "E", "D", "C", "B", "A"]; // 품질 숫자 → 글자

    // 종류: name, frame, values[품질 1~5] (0이면 그 품질은 안 나옴), worth(젬 가치), text(v), info, fits(card) 그 카드에 효과가 있는가
    static KINDS = {}; // (지금 게임에는 젬이 없다 — 체계만 남겨 둔다)

    // 그 종류가 나오는 가장 낮은 품질
    static minTier(id) {
        const k = Gem.kind(id);
        return k.values.findIndex((v) => v > 0) + 1;
    }

    static kind(id) {
        return Gem.KINDS[CardDef.resolve(id)];
    }

    // 품질 1~5. 그 종류가 안 나오는 낮은 품질(예전 저장본)은 나오는 가장 낮은 품질로 올린다
    static quality(card) {
        return Math.max(card.data?.q ?? 1, Gem.minTier(card.defId));
    }

    static grade(card) {
        return Gem.GRADES[Gem.quality(card)];
    }

    // 수치는 늘 품질에서 정한다 (예전 저장본의 v는 무시)
    static value(card) {
        return Gem.kind(card.defId).values[Gem.quality(card) - 1];
    }

    static name(card) {
        return `${card.def.name} ${Gem.grade(card)}`;
    }

    static price(card) {
        const k = Gem.kind(card.defId);
        return Math.max(1, Math.floor(Gem.BASE_PRICE * Gem.GROWTH ** Gem.quality(card) * k.worth));
    }

    static describe(card) {
        const k = Gem.kind(card.defId);
        return `${k.text(Gem.value(card))}\n${k.info}\n주문 카드의 빈 젬 칸에 끼운다. 직접 빼면 깨진다.`;
    }

    static summary(card) {
        return Gem.kind(card.defId).text(Gem.value(card));
    }

    // ---- 저장 형태 { d, x }로 (스킬 카드 안에 끼운 젬) ----
    static valueOf(saved) {
        return Gem.value(Card.load(saved));
    }

    static priceOf(saved) {
        return Gem.price(Card.load(saved));
    }

    static lineOf(saved) {
        const card = Card.load(saved);
        return `${card.name}: ${Gem.kind(card.defId).text(Gem.value(card))}`;
    }

    // ---- 굴리기 ----
    // 품질 tier의 젬 한 장
    static roll(id, tier, rng = Math.random) {
        tier = Math.max(tier, Gem.minTier(id));
        const card = new Card(id);
        card.data = { q: tier };
        return card;
    }

    static rollTier(min, max, rng = Math.random) {
        return min + Math.floor(rng() * (max - min + 1));
    }

    // 아무 종류나 (품질 min~max). 그 품질에 안 나오는 종류(환원은 C부터, 치유는 B부터)는 뺀다
    static rollAny(min, max, rng = Math.random) {
        const tier = Gem.rollTier(min, max, rng);
        const ids = Object.keys(Gem.KINDS).filter((id) => Gem.minTier(id) <= tier);
        return Gem.roll(ids[Math.floor(rng() * ids.length)], tier, rng);
    }

    // ---- 끼우기·빼기 ----
    // 이 젬을 이 카드에 끼울 수 있는가. 안 되면 이유 글자, 되면 ""
    static whyNot(card, gemCard) {
        if (!card.def.spell) return "스킬 카드에만 끼울 수 있다";
        const { sockets, gems } = Spell.data(card);
        if (!sockets) return "젬 칸이 없다";
        if (gems.length >= sockets) return "젬 칸이 꽉 찼다";
        if (!Gem.kind(gemCard.defId).fits(card)) return "이 카드에는 효과가 없다";
        return "";
    }

    // 패의 젬을 스킬 카드(패·덱·묘지 어디든)에 끼운다 (턴 안 씀)
    static socket(cards, card, gemCard) {
        const why = Gem.whyNot(card, gemCard);
        if (why) {
            MessageLog.add(why, "#c8b890");
            return false;
        }
        if (cards.removeFromHand(gemCard) < 0) return false;
        const d = Spell.data(card);
        card.data = { cost: d.cost, sockets: d.sockets, ...(card.data ?? {}), gems: [...d.gems, gemCard.save()] };
        cards._changed();
        MessageLog.add(`${card.name}에 ${josa(gemCard.name, "을를")} 끼웠다`, "#c8a0f8");
        return true;
    }

    // index번 젬을 뺀다. keep이면 젬 카드를 돌려주고, 아니면 깨진다 (null)
    static unsocket(cards, card, index, keep) {
        const gems = [...Spell.data(card).gems];
        const saved = gems.splice(index, 1)[0];
        if (!saved) return null;
        card.data = { ...card.data, gems };
        const gem = Card.load(saved);
        cards._changed();
        if (!keep) {
            MessageLog.add(`${josa(gem.name, "을를")} 억지로 빼다가 깨뜨렸다`, "#f0a060");
            return null;
        }
        return gem;
    }

    static removeFee(saved) {
        return Math.max(Gem.REMOVE_MIN, Math.floor(Gem.priceOf(saved) * Gem.REMOVE_RATE));
    }
}

for (const [id, k] of Object.entries(Gem.KINDS)) {
    CardDef.register(id, {
        type: "item", name: k.name, gem: true, material: false,
        description: k.info, price: Gem.BASE_PRICE, sprite: "cards", frame: k.frame
    });
}

/* ===== assets/dat/card/DrawRule.js ===== */
// 드로우 조건. CardSystem.notify(event, data)로 사건이 오면 on()이 이번에 뽑을 장수를 돌려준다.
// 새 조건은 이 클래스를 상속해서 on()만 바꾸면 된다. 지금 오는 사건:
//   "turn" { turn }       — 플레이어가 한 턴을 마칠 때마다
//   "kill" { target }     — 플레이어가 무언가를 쓰러뜨렸을 때
class DrawRule {
    on(event, data, cards) {
        return 0;
    }
}

// n턴마다 count장
class EveryNTurnsDraw extends DrawRule {
    constructor(n = 5, count = 1) {
        super();
        this.n = n;
        this.count = count;
    }

    on(event, data) {
        return event === "turn" && data.turn % this.n === 0 ? this.count : 0;
    }
}

// 적을 쓰러뜨리면 count장
class KillDraw extends DrawRule {
    constructor(count = 1) {
        super();
        this.count = count;
    }

    on(event) {
        return event === "kill" ? this.count : 0;
    }
}

/* ===== assets/dat/data/CardImpl.js ===== */
// 카드 공방 데이터(GameData.js)의 카드를 게임 카드로 만든다.
//   - 이름·비용·설명·태그·강화(변형)는 데이터에서 읽는다. 설명글의 "공격력 60%" 같은 말은 지금 능력치로 바꿔 숫자를 보여 준다.
//   - 실제 동작은 이 파일의 CARDS[카드 id] (변형은 VARIANTS[카드 id][변형 key]에서 CARDS를 덮어쓴다)에 짜 둔다.
//   새 카드가 데이터에 생기면: CARDS에 그 id의 동작을 한 덩어리 추가하면 된다 (tools/import_data.py가 빠진 id를 알려 준다).
//
// 비용: 공방 카드의 costs는 "비용의 경우들"이다. 한 경우 안의 자원은 모두 함께 낸다 (기력 1 + 마나 1이면 둘 다).
//   경우가 여럿이면 카드 한 장마다 그중 하나로 정해져 나온다 (Card.cost · data.pay, 도감에는 경우마다 한 장). 체력 비용은 체력이 모자라면 못 쓴다.
// 수치 규칙: 모든 % 계산은 버림 (0이 되면 0). 능력치 비례 값도, 이동속도 비례 값(칸·장수)도 반올림·올림 없이 버린다. 둔화는 이동속도를 줄인다.
class CardOps {
    static say(msg) {
        MessageLog.add(msg, "#c8b890");
        return null;
    }

    static pct(base, pct) {
        return Math.floor(base * pct / 100 + 1e-9);
    }

    static atk(u, pct) {
        return CardOps.pct(u.stats.attack, pct);
    }

    static def(u, pct) {
        return CardOps.pct(u.stats.defense, pct);
    }

    // 지금 이동속도 (둔화 반영)
    static speed(u) {
        return Status.speed(u, u.speed);
    }

    static spd(u, pct = 100) {
        return Math.floor(CardOps.speed(u) * pct / 100 + 1e-9);
    }

    static dist(a, b) {
        return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    static px(world, e) {
        return new Vector(e.x * world.tileSize, e.y * world.tileSize);
    }

    // x, y에 있는 적 (살아 있고 적대인 것)
    static foeAt(ctx, x, y) {
        const e = ctx.world.entityAt(x, y);
        return e && e !== ctx.user && e.alive && !e.invulnerable && e.attitude === "hostile" && ctx.user.isHostileTo(e) ? e : null;
    }

    // 중심 (cx, cy) 정사각형 반경 r 안의 모든 적
    static foesSquare(ctx, cx, cy, r) {
        const out = [];
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
            const f = CardOps.foeAt(ctx, cx + dx, cy + dy);
            if (f && !out.includes(f)) out.push(f);
        }
        return out;
    }

    // 사거리 range 안의 적 하나를 고른 칸에서 찾는다 (일직선 아님). 없으면 null + 안내
    static pickFoe(ctx, range) {
        const t = ctx.target;
        if (!t || CardOps.dist(ctx.user, t) > range || (t.x === ctx.user.x && t.y === ctx.user.y)) return CardOps.say(`${range}칸 안의 대상을 골라야 한다`);
        const foe = CardOps.foeAt(ctx, t.x, t.y);
        return foe ?? CardOps.say("그 칸에는 대상이 없다");
    }

    // 바로 옆(상하좌우) 적 하나
    static pickAdjacent(ctx) {
        const t = ctx.target;
        if (!t || CardOps.dist(ctx.user, t) !== 1) return CardOps.say("바로 옆 칸을 골라야 한다");
        const foe = CardOps.foeAt(ctx, t.x, t.y);
        if (!foe) return CardOps.say("그 칸에는 대상이 없다");
        if (t.x !== ctx.user.x) ctx.user.flipX = t.x < ctx.user.x;
        ctx.user.applyFlip();
        return foe;
    }

    // 날아가서 맞히기: [날아가는 연출, 맞는 연출]
    static shoot(ctx, foe, dmg, frame = null) {
        const u = ctx.user;
        const w = ctx.world;
        const d = Status.modify(dmg, u, foe);
        MessageLog.add(`${josa(u.displayName, "이가")} ${foe.displayName}에게 ${d} 피해 (${ctx.card.name})`, "#e8d9b8");
        const fly = new ProjectileAnim(w, "kicons", frame ?? ctx.card.def.frame, CardOps.px(w, u), CardOps.px(w, foe));
        return [[fly], Combat.hit(foe, d, u, w, "physical", false)];
    }

    // 상태 이상 주기 (연출 하나). 우두머리는 기절에 면역인 동안 걸리지 않는다
    static inflict(target, key, n, turns = null) {
        if (Status.immune(target, key)) {
            MessageLog.add(`${josa(target.displayName, "은는")} 기절에 면역이다`, "#c8c0a0");
            return new PopupAnim(target, "기절 면역", Status.DEFS.stunimm.color);
        }
        Status.add(target, key, n, turns);
        const d = Status.DEFS[Status.key(key)];
        return new PopupAnim(target, `${d.name} ${n}`, d.color);
    }

    // 빈칸들 (사거리 n, 벽·다른 것에 막히지 않은 바닥)
    static freeTiles(world, u, n) {
        const out = [];
        for (let dy = -n; dy <= n; dy++) for (let dx = -n; dx <= n; dx++) {
            if (!(dx || dy) || Math.abs(dx) + Math.abs(dy) > n) continue;
            const x = u.x + dx;
            const y = u.y + dy;
            if (world.getChunkAt(x, y) && world.isWalkable(x, y) && !world.entitiesAt(x, y).some((e) => e.isHazard)) out.push(`${x},${y}`);
        }
        return out;
    }

    // 옆 칸(상하좌우)의 빈칸
    static adjacentFree(world, u) {
        return CardOps.freeTiles(world, u, 1);
    }

    // 토템이 서 있는 턴: 이동속도 200% (붉은 토템은 3턴). 0턴이면 영영 서 있으니 최소 1
    static totemLife(def, u) {
        return def.explode ? 3 : Math.max(1, CardOps.spd(u ?? Player.current, 200));
    }

    // 걸어서 이동 (ActionCards.move). 움직인 칸 수를 steps.moved에 적어 준다
    static walk(ctx, n) {
        const steps = ActionCards.move(ctx, n);
        if (steps) steps.moved = steps.length;
        return steps;
    }

    // 순간이동 (벽·지형 상관없이 사거리 안 빈칸으로)
    static teleport(ctx, n) {
        const u = ctx.user;
        const t = ctx.target;
        if (u.root > 0) return CardOps.say(`속박되어 움직일 수 없다 (${u.root}턴 남음)`);
        if (!t || !CardOps.freeTiles(ctx.world, u, n).includes(`${t.x},${t.y}`)) return CardOps.say(`${n}칸 안의 빈칸을 골라야 한다`);
        if (Status.charmBlocks(u, t.x, t.y)) return CardOps.say("매료당해 건 상대에게서 벗어난 칸으로는 갈 수 없다");
        const w = ctx.world;
        const fx = u.x;
        const fy = u.y;
        w.removeEntity(u);
        u.x = t.x;
        u.y = t.y;
        w.addEntity(u);
        Equip.stepped(u, w);
        Pickups.stepped(u, w);
        Equip.moved(u);
        if (t.x !== fx) u.flipX = t.x < fx;
        u.applyFlip();
        MessageLog.add(`${josa(u.displayName, "이가")} 순간이동했다`, "#c8a0f8");
        return [[new MoveAnim(u, new Vector(fx * w.tileSize, fy * w.tileSize), new Vector(t.x * w.tileSize, t.y * w.tileSize), 0.1)]];
    }

    // 덱에서 n장 뽑기 연출
    static draw(ctx, n, over = false) {
        const drawn = ctx.cards.draw(n, over);
        return drawn.length ? [new PopupAnim(ctx.user, `+${drawn.length}장`, "#a0b8e8")] : [];
    }

    static heal(u, n) {
        const s = u.stats;
        const got = Math.min(n, s.maxHp - s.hp);
        s.hp += got;
        if (got > 0) MessageLog.add(`체력 ${got} 회복`, "#7cd47c");
        return got;
    }

    static mana(u, n) {
        const got = Math.min(n, u.maxMana - u.mana);
        u.mana += got;
        if (got > 0) MessageLog.add(`마나 ${got} 회복`, "#7cb0f0");
        return got;
    }

    // 덱에서 조건에 맞는 카드를 n장까지 패로 가져온다 (맨 위부터). 가져온 카드들
    static fetchWhere(ctx, pred, n) {
        const got = [];
        for (let i = ctx.cards.deck.length - 1; i >= 0 && got.length < n; i--) {
            const c = ctx.cards.deck[i];
            if (!pred(c)) continue;
            if (!ctx.cards.fetch(c)) break; // 행동 패가 가득 차면 못 가져온다
            got.push(c);
        }
        return got;
    }

    // 고른 카드들을 버린다 (원한이 터진다). 버린 카드들
    static dump(ctx, cards) {
        const out = [];
        for (const c of cards) if (ctx.cards.hand.includes(c) && ctx.cards.discard(c, true)) out.push(c);
        return out;
    }

    // 고르기 창 설정 만들기 (패에서 min~max장)
    static handPick(title, min, max) {
        return (u, card) => ({ title, cards: u.cards.actions.filter((c) => c !== card), min, max });
    }

    // 구역으로 나눠 고르는 고르기 창 설정 만들기 (picker 안에서 부른다).
    //   zones: [["덱", u.cards.deck], ["묘지", u.cards.graveyard]]  — [머리글, 카드들]
    //   opts.total: [min, max] 전체 선택 장수 (기본 [1, 1])
    //   opts.each: 구역마다 최대 장수 (숫자 하나면 모든 구역, 배열이면 구역별. 생략하면 전체 max)
    // 각 구역은 이름순으로 정렬해 보인다 (덱의 뽑는 순서를 감춘다). 예:
    //   picker: (u) => CardOps.zonePick("가져올 카드를 고른다", [["덱", u.cards.deck], ["묘지", u.cards.graveyard]], { total: [1, 1], each: 1 })
    // 반환은 { title, cards(모든 구역 합), min, max, sections } — Player.requestCard가 CardPicker에 넘긴다
    static zonePick(title, zones, opts = {}) {
        const [min, max] = opts.total ?? [1, 1];
        const byName = (list) => [...list].sort((a, b) => a.def.name.localeCompare(b.def.name, "ko"));
        const sections = zones.map(([zt, cards], i) => ({
            title: zt, cards: byName(cards),
            max: Array.isArray(opts.each) ? (opts.each[i] ?? max) : (opts.each ?? max)
        }));
        return { title, cards: sections.flatMap((s) => s.cards), min, max, sections };
    }
}

// ---------- 짧은 설명 도우미 ----------
const CK = {
    atk: (v) => CardText.tag("atk", v),
    def: (v) => CardText.tag("def", v),
    spd: (v) => CardText.tag("spd", v),
    mana: (v) => CardText.tag("mana", v),
    hp: (v) => CardText.tag("hp", v),
    energy: (v) => CardText.tag("energy", v),
    st: (key, text) => CardText.tag(key, text)
};
const CARD_TAG_NAMES = { attack: "공격", defense: "방어", move: "이동" };
// 지금 플레이어. 시작 화면(도감)처럼 플레이어가 없으면 기본 능력치의 모형을 쓴다
const PL = () => Player.current ?? { x: 0, y: 0, status: {}, statusT: {}, speed: Player.BASE_SPEED, maxMana: Player.MAX_MANA, mana: Player.MAX_MANA, stats: { attack: Player.BASE_ATTACK, defense: Player.BASE_DEFENSE, maxHp: Player.BASE_HP, hp: Player.BASE_HP } };

            u.energy += got;
            MessageLog.add(`기력 ${got} 회복`, "#f29a3a");
            return [[new PopupAnim(u, `기력 +${got}`, "#f29a3a")]];
        },
        short: () => `${CK.energy("기력 +" + (2 + CardOps.spd(PL(), 25)))} 회복`
    },

    chocolate: {
        icon: "heart", color: "#c89060",
        use: (ctx) => [CardOps.draw(ctx, 1)],
        grudge(ctx) {
            const u = ctx.user;
            u.energy = Math.min(u.maxEnergy, u.energy + 1);
            MessageLog.add("원한! 초콜릿 — 기력 1을 되찾았다", "#e8a870");
        },
        short: () => "1장 뽑기 · 버려지면: 기력 +1"
    },

    //   붉은: + 대상 최대 체력 5%(최소 1) 화상 2턴 / 푸른: 고른 옆칸 중심 3x3 모두 / 노란: 기절 2턴
    club: {
        icon: "hammer", color: "#b08860", stunTurns: 1,
        target(card) {
            return card && card.def.area ? { range: 1, radius: 1, taps: 2, verb: "공격", color: "#d8443c" } : { range: 1, radius: 0, entity: true, taps: 1, verb: "공격", color: "#d8443c" };
        },
        use(ctx) {
            const d = ctx.card.def;
            const u = ctx.user;
            const dmg = CardOps.atk(u, 150);
            if (d.area) {
                const t = ctx.target;
                if (!t || CardOps.dist(u, t) !== 1) return CardOps.say("바로 옆 칸을 골라야 한다");
                const foes = CardOps.foesSquare(ctx, t.x, t.y, 1);
                if (!foes.length) return CardOps.say("범위 안에 대상이 없다");
                if (t.x !== u.x) u.flipX = t.x < u.x;
                u.applyFlip();
                const tiles = [];
                for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) tiles.push([t.x + dx, t.y + dy]);
                const hits = [new AttackAnim(u, t, ctx.world.tileSize), new AreaFlashAnim(ctx.world, tiles, ctx.card.def.color, 0.3, false)];
                MessageLog.add(`${josa(u.displayName, "이가")} 몽둥이를 휘둘러 ${foes.length}개 대상에게 ${dmg} 피해`, "#e8d9b8");
                const after = [];
                for (const f of foes) {
                    hits.push(...Combat.hit(f, dmg, u, ctx.world, "physical"));
                    if (f.alive) after.push(CardOps.inflict(f, "stun", d.stunTurns));

                return [hits, after];
            }
            const foe = CardOps.pickAdjacent(ctx);
            if (!foe) return null;
            const steps = Combat.strike(u, foe, ctx.world, dmg, ctx.card.name);
            const out = [steps];
            if (foe.alive) {
                const after = [CardOps.inflict(foe, "stun", d.stunTurns)];
                if (d.burnPct) after.push(CardOps.inflict(foe, "burn", Math.max(1, CardOps.pct(foe.stats.maxHp, d.burnPct)), 2));
                out.push(after);
            }
            return out;
        },

    concentration: {
        icon: "eye", color: "#f0d878",

    },

    // 대시: 이동속도 50% + 1 이동. 붉은: 이동 뒤 옆 적에게 화상 / 푸른: 직선이면 이동속도 100% + 2 / 노란: 덱에서 이동 카드 1장
    dash: {
        icon: "boot", color: "#7cc4e8",
        target(card) {
            const small = CardOps.spd(PL(), 50) + 1;
            if (!(card && card.def.straightBonus)) return { range: small, radius: 0, walk: true, taps: 1, verb: "이동", color: "#7cc4e8" };
            const big = CardOps.spd(PL(), 100) + 2;
            return {
                range: big, radius: 0, walk: true, taps: 1, verb: "이동", color: "#7cc4e8",
                tiles: (w) => {
                    const u = PL();
                    const out = new Set(ActionCards.reachable(w, u, small).keys());
                    for (const k of ActionCards.reachable(w, u, big).keys()) {
                        const [x, y] = k.split(",").map(Number);
                        if (x === u.x || y === u.y) out.add(k); // 직선으로만 멀리
                    }
                    return out;
                }
            };
        },
        use(ctx) {
            const d = ctx.card.def;
            const u = ctx.user;
            const t = ctx.target;
            let n = CardOps.spd(u, 50) + 1;
            if (d.straightBonus && t && (t.x === u.x || t.y === u.y)) n = Math.max(n, CardOps.spd(u, 100) + 2);
            const steps = CardOps.walk(ctx, n);
            if (!steps) return null;
            if (d.burnAround) {
                const burn = CardOps.atk(u, 60);
                const foes = Entity.DIRS.map(([dx, dy]) => CardOps.foeAt(ctx, u.x + dx, u.y + dy)).filter((f, i, a) => f && a.indexOf(f) === i);
                if (foes.length) steps.push(foes.map((f) => CardOps.inflict(f, "burn", burn, 2)));
            }
            if (d.fetchMove) {
                const got = CardOps.fetchWhere(ctx, (c) => (c.def.tags ?? []).includes("move"), 1);
                if (got.length) steps.push([new PopupAnim(u, got[0].name, "#7cc4e8")]);
                else MessageLog.add("덱에 이동 카드가 없다", "#c8b890");
            }
            return steps;
        },
        short: (c) => {
            const d = c.def;
            const base = `${CK.spd(CardOps.spd(PL(), 50) + 1)}칸 이동`;
            if (d.straightBonus) return `${base} · 직선이면 ${CK.spd(CardOps.spd(PL(), 100) + 2)}칸`;
            if (d.burnAround) return `${base} · 옆 적에게 ${CK.st("burn", "화상 " + CardOps.atk(PL(), 60))} 2턴`;
            if (d.fetchMove) return `${base} · 덱에서 이동 카드 1장`;
            return base;
        }
    },

            const had = Status.get(foe, "ice") > 0;
            MessageLog.add(`${josa(foe.displayName, "이가")} 얼어붙는다 (빙결 ${n}, ${turns}턴)`, "#7ab8ff");
            const out = [[fly], [CardOps.inflict(foe, "ice", n, turns)]];
            if (d.repeatIce && had) {
                const hits = CardOps.def(u, 50);
                const anims = [];
                for (let i = 0; i < hits && foe.alive; i++) anims.push(...Combat.hit(foe, 1, u, w, "cold"));
                if (hits) {
                    MessageLog.add(`빙결로 ${hits}번 파고든다`, "#7ab8ff");
                    out.push(anims);
                }
            }
            return out;
        },
        short: (c) => {
            const d = c.def;
            const bonus = d.prepare === "frostIce" ? c.data?.iceBonus ?? 0 : 0;
            return `${CK.st("ice", "빙결 " + CardOps.def(PL(), 60))} ${d.turns + bonus}턴 · ${CK.spd(CARDS.frost.reach(c))}칸${d.repeatIce ? " · 이미 빙결이면 1 피해 ×" + CardOps.def(PL(), 50) : ""}${d.prepare === "frostIce" ? " · 준비" : ""}`;
        }
    },

    // 방어: 방어력 100% 방어도. 붉은(방패치기): 지금 방어도만큼 피해 / 푸른: 2턴 + 모든 방어도 +1턴 / 노란: + 골드 5%
    guard: {
        icon: "shield", color: "#8cc8f0", turns: 1,
        target: (c) => (c && c.def.bash ? { range: 1, radius: 0, entity: true, taps: 1, verb: "방패치기", color: "#d8443c" } : null),
        use(ctx) {
            const u = ctx.user;
            const d = ctx.card.def;
            if (d.bash) {
                if (u.block <= 0) return CardOps.say("방어도가 없다");
                const foe = CardOps.pickAdjacent(ctx);
                if (!foe) return null;
                return [Combat.strike(u, foe, ctx.world, u.block, ctx.card.name)];
            }
            const v = CardOps.def(u, 100) + (d.goldPct ? CardOps.pct(u.money ?? 0, d.goldPct) : 0);
            u.addBlock(v, d.turns);
            if (d.extendAll) for (const b of u.blocks) b.t += 1;
            MessageLog.add(`방어도 +${v} (${d.turns}턴)${d.extendAll ? " · 모든 방어도 +1턴" : ""}`, "#8cc8f0");
            return [[new PopupAnim(u, "+" + v, "#8cc8f0")]];
        },
        short: (c) => {
            const d = c.def;
            if (d.bash) return `지금 방어도(${CK.def(PL() ? PL().block : 0)}) 만큼 피해`;
            const gold = d.goldPct ? CardOps.pct(PL().money ?? 0, d.goldPct) : 0;
            return `방어도 ${CK.def(CardOps.def(PL(), 100) + gold)} · ${d.turns}턴${d.extendAll ? " · 모든 방어도 +1턴" : ""}`;
        }
    },

    // 굳히기: 이번 전투 동안 방어력 20% 경질화. 붉은: 공격력 20% 힘 / 푸른: + 경질화 수치만큼 보호(1턴) / 노란: 신속 1 (소멸)
    harden: {
        icon: "wall", color: "#9ad0e8",
        use(ctx) {
            const u = ctx.user;
            const d = ctx.card.def;
            if (d.swift) {
                Status.add(u, "swift", 1, Status.ENDLESS);
                MessageLog.add("신속 1 (이번 전투 동안 이동속도 +1)", Status.DEFS.swift.color);
                return [[new PopupAnim(u, "신속 1", Status.DEFS.swift.color)]];
            }
            if (d.strength) {
                const n = CardOps.atk(u, 20);
                Status.add(u, "str", n, Status.ENDLESS);
                MessageLog.add(`힘 ${n} (이번 전투 동안 공격력 +${n})`, Status.DEFS.str.color);
                return [[new PopupAnim(u, `힘 ${n}`, Status.DEFS.str.color)]];
            }
            const n = CardOps.def(u, 20);
            Status.add(u, "harden", n, Status.ENDLESS);
            MessageLog.add(`경질화 ${n} (이번 전투 동안 방어력 +${n})`, "#9ad0e8");
            const out = [new PopupAnim(u, `경질화 ${n}`, Status.DEFS.harden.color)];
            if (d.protect && n > 0) {
                Status.add(u, "protect", n, 1);
                MessageLog.add(`보호 ${n}회 (1턴)`, Status.DEFS.protect.color);
                out.push(new PopupAnim(u, `보호 ${n}`, Status.DEFS.protect.color));
            }
            return [out];
        },
        short: (c) => {
            const d = c.def;
            if (d.swift) return `${CK.st("swift", "신속 1")} · 전투 중 · 소멸`;
            if (d.strength) return `${CK.st("str", "힘 " + CardOps.atk(PL(), 20))} · 전투 중`;
            return `${CK.st("harden", "경질화 " + CardOps.def(PL(), 20))} · 전투 중${d.protect ? " · " + CK.st("protect", "보호 " + CardOps.def(PL(), 20)) + " 1턴" : ""}`;
        }
    },

    heavy: {
        icon: "hammer", color: "#e8e0c0",
        target: () => ({ range: 1, radius: 0, entity: true, taps: 1, verb: "공격", color: "#d8443c" }),
        use(ctx) {
            const u = ctx.user;
            const foe = CardOps.pickAdjacent(ctx);
            if (!foe) return null;
            const v = ctx.card.def;
            let dmg = CardOps.atk(u, 250);
            if (v.bonusMaxHp) dmg += Math.floor(foe.stats.maxHp * v.bonusMaxHp / 100);
            const steps = Combat.strike(u, foe, ctx.world, dmg, ctx.card.name);
            const dealt = Combat.last?.dealt ?? 0;
            const killed = !foe.alive;
            const out = [steps];
            if (v.stun && foe.alive) out.push([CardOps.inflict(foe, "stun", 1)]);
            if (v.manaOnKill && killed) {
                const got = CardOps.mana(u, Math.floor(dealt / 2));
                if (got) out.push([new PopupAnim(u, `마나 +${got}`, "#7cb0f0")]);
            }
            return out;
        },
        short: (c) => `${CK.atk(CardOps.atk(PL(), 250))} 피해${c.def.bonusMaxHp ? " + 최대체력 " + c.def.bonusMaxHp + "%" : ""}${c.def.stun ? " · " + CK.st("stun", "기절") : ""}${c.def.manaOnKill ? " · 처치 시 마나" : ""}`
    },

    // 방화: 화상. 붉은: 3턴, 이미 화상이면 그 화상을 소모해 (턴×수치) + 공격력 150% 즉시 피해 / 푸른: 공격력 40%, 방어력 100% 턴
    ignite: {
        icon: "flame", color: "#ff8a40",
        target: () => ({ range: CardOps.spd(PL(), 50) + 1, radius: 0, taps: 1, verb: "시전", color: "#ff8a40" }),
        use(ctx) {
            const u = ctx.user;
            const d = ctx.card.def;
            const foe = CardOps.pickFoe(ctx, CardOps.spd(u, 50) + 1);
            if (!foe) return null;
            const w = ctx.world;
            const fly = new ProjectileAnim(w, "kicons", d.frame, CardOps.px(w, u), CardOps.px(w, foe));
            const n = CardOps.atk(u, d.longBurn ? 40 : 60);
            const turns = d.longBurn ? Math.max(1, CardOps.def(u, 100)) : d.burnTurns ?? 2;
            const out = [[fly]];
            if (d.consume) {
                const b = Status.get(foe, "burn");
                const t = Math.min(Status.turns(foe, "burn"), 9);
                if (b > 0) {
                    const dmg = b * t + CardOps.atk(u, 150);
                    Status.set(foe, "burn", 0);
                    MessageLog.add(`화상을 태워 ${dmg} 피해`, "#ff8a40");
                    out.push(Combat.hit(foe, dmg, u, w, "heat"));
                }
            }
            if (foe.alive) {
                MessageLog.add(`${josa(foe.displayName, "이가")} 불타오른다 (화상 ${n}, ${turns}턴)`, "#ff8a40");
                out.push([CardOps.inflict(foe, "burn", n, turns)]);
            }
            if (d.swiftFromBurn) {
                // 방 안 모든 적의 화상 중 가장 긴 지속시간만큼 자신에게 신속 2
                const T = Math.max(0, ...ctx.world.hostiles(u).map((e) => Status.turns(e, "burn")));
                if (T > 0) {
                    Status.add(u, "swift", 2, T);
                    out.push([new PopupAnim(u, `신속 2`, Status.DEFS.swift.color)]);
                }
            }
            return out;
        },
        short: (c) => {
            const d = c.def;
            const n = CardOps.atk(PL(), d.longBurn ? 40 : 60);
            const turns = d.longBurn ? Math.max(1, CardOps.def(PL(), 100)) : d.burnTurns ?? 2;
            return `${CK.st("burn", "화상 " + n)} ${turns}턴 · ${CK.spd(CardOps.spd(PL(), 50) + 1)}칸${d.consume ? " · 이미 화상이면 소모해 폭발" : ""}${d.swiftFromBurn ? " · 적 화상 최대 턴만큼 " + CK.st("swift", "신속 2") : ""}`;
        }
    },

    insight: {
        icon: "eye", color: "#f0a0ff",
        use: (ctx) => [CardOps.draw(ctx, CardOps.spd(ctx.user, 50) + 3, true)],
        short: () => `${CK.spd(CardOps.spd(PL(), 50) + 3)}장 뽑기 (패 제한 무시)`
    },

    // 점액: 상태이상 카드 (슬라임킹이 패에 끼워 넣는다). 손으로 [묘지로] 버릴 수 없고 (noDiscard), 기력 1을 내고 써서 소멸시킨다.
    // 카드 효과로는 버려진다
    slime: {
        icon: "drop", color: "#7cd47c", noDiscard: true,
        use(ctx) {
            MessageLog.add("점액을 털어냈다", "#7cd47c");
            return [[new PopupAnim(ctx.user, "소멸", "#7cd47c")]];
        },
        short: () => "[묘지로] 사용불가 · 쓰면 소멸"
    },

    // 투척용 단검: 나이프 홀스터가 준다 (임시 카드 — 쓰거나 전투가 끝나면 사라진다)
    throwing_knife: {
        icon: "dagger", color: "#c8c8d8",
        target: () => ({ range: CardOps.spd(PL()), radius: 0, taps: 1, verb: "던지기", color: "#c8c8d8" }),
        use(ctx) {
            const foe = CardOps.pickFoe(ctx, CardOps.spd(ctx.user));
            return foe ? CardOps.shoot(ctx, foe, 2) : null;
        },
        short: () => `2 피해 · ${CK.spd(CardOps.spd(PL()))}칸`
    },

    larry: {
        icon: "skull", color: "#e8e8d0",
        target: () => ({ range: 1, radius: 0, taps: 1, verb: "소환", color: "#7cd47c", tiles: (w) => CardOps.adjacentFree(w, PL()) }),
        use(ctx) {
            const u = ctx.user;
            const t = ctx.target;
            if (!t || !CardOps.adjacentFree(ctx.world, u).includes(`${t.x},${t.y}`)) return CardOps.say("옆 빈칸을 골라야 한다");
            const a = ctx.world.spawn(new Ally(t.x, t.y, "soldier", {
                hp: CardOps.def(u, 100) + 10, attack: 2 + CardOps.atk(u, 50), moves: 1, defense: 0
            }));
            MessageLog.add(`${josa(a.displayName, "을를")} 불렀다 (체력 ${a.stats.maxHp}, 공격 ${a.stats.attack})`, "#a0d0a0");
            return [[new PopupAnim(a, "!", "#7cd47c")]];
        },
        short: () => `해골병사 소환 (체력 ${CK.def(CardOps.def(PL(), 100) + 10)} · 공격 ${CK.atk(2 + CardOps.atk(PL(), 50))})`
    },

    lightning_bolt: {
        icon: "bolt", color: "#f0e070",
        use(ctx) {
            const u = ctx.user;
            const w = ctx.world;
            const foes = CardOps.foesSquare(ctx, u.x, u.y, 1);
            const dmg = CardOps.atk(u, 100);
            const tiles = [];
            for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) tiles.push([u.x + dx, u.y + dy]);
            MessageLog.add(foes.length ? `번쩍! ${foes.length}개 대상에게 ${dmg} 피해 + 기절` : "번쩍! 아무것도 맞지 않았다", "#f0e070");
            const hits = [];
            for (const f of foes) {
                hits.push(...Combat.hit(f, dmg, u, w, "shock"));
                if (f.alive) hits.push(CardOps.inflict(f, "stun", 1));
            }
            return [[new AreaFlashAnim(w, tiles, "#f0e070", 0.3), ...hits]];
        },
        short: () => `주변 3×3 ${CK.atk(CardOps.atk(PL(), 100))} 피해 · ${CK.st("stun", "기절")}`
    },

    // 과부하: [턴 제한(3)] 기력 +2, 무기력 2 (1턴). 붉은: 이번 턴 쓴 기력만큼 힘 1턴 / 푸른: 방어도가 있으면 하나를 없애고 무기력 없음 / 노란: 카드 1장 버리고 기력 +2
    overload: {
        icon: "bolt", color: "#f08040",
        use(ctx) {
            const u = ctx.user;
            const d = ctx.card.def;
            const out = [];
            if (d.discardOne) {
                const [pick] = ctx.picks ?? [];
                if (!pick || !ctx.cards.hand.includes(pick)) return CardOps.say("버릴 카드를 골라야 한다");
                CardOps.dump(ctx, [pick]);
                u.energy += 2;
                MessageLog.add("과부하! 카드를 버리고 기력 +2", "#f0a050");
                return [[new PopupAnim(u, "기력 +2", "#f29a3a")]];
            }
            const spent = u.energySpent ?? 0;
            u.energy += 2;
            out.push(new PopupAnim(u, "기력 +2", "#f29a3a"));
            if (d.shieldSwap && u.blocks.length) {
                u.blocks.sort((a, b) => a.t - b.t);
                const gone = u.blocks.shift();
                MessageLog.add(`과부하! 기력 +2, 방어도 ${gone.v}를 내놓아 무기력이 없다`, "#f0a050");
            } else {
                Status.add(u, "lethargy", 2, 1);
                MessageLog.add("과부하! 기력 +2, 다음 턴 기력이 2 줄어든다 (무기력)", "#f0a050");
            }
            if (d.strengthFromSpent && spent > 0) {
                Status.add(u, "str", spent, 1);
                out.push(new PopupAnim(u, `힘 ${spent}`, Status.DEFS.str.color));
                MessageLog.add(`이번 턴 쓴 기력 ${spent}만큼 힘 (1턴)`, Status.DEFS.str.color);
            }
            return [out];
        },
        short: (c) => {
            const d = c.def;
            if (d.discardOne) return `1장 버리고 ${CK.energy("기력 +2")}`;
            return `${CK.energy("기력 +2")} · ${d.shieldSwap ? "방어도가 있으면 하나 내놓고 무기력 없음" : CK.st("lethargy", "무기력 2") + " 1턴"}${d.strengthFromSpent ? " · 쓴 기력만큼 힘" : ""}`;
        }
    },

    // 기도: [턴 제한(3)] 덱/묘지에서 1장 골라 패로. 붉은: 그 카드 이번 턴 피해 +75% / 푸른: 비용 -(1 + 방어력 10%) / 노란: 덱과 묘지에서 각각 1장
    pray: {
        icon: "star", color: "#f0e8b0",
        picker: (u, card) => CardOps.zonePick(
            card.def.two ? "덱·묘지에서 각 1장 (한쪽만 골라도 된다)" : "덱/묘지에서 패로 가져올 카드를 고른다",
            [["덱", u.cards.deck], ["묘지", u.cards.graveyard]],
            { total: [1, card.def.two ? 2 : 1], each: 1 }
        ),
        use(ctx) {
            const u = ctx.user;
            const d = ctx.card.def;
            const picks = ctx.picks ?? [];
            if (!picks.length) return CardOps.say("가져올 카드를 골라야 한다");
            if (picks.filter((c) => ctx.cards.deck.includes(c)).length > 1 || picks.filter((c) => ctx.cards.graveyard.includes(c)).length > 1) return CardOps.say("덱과 묘지에서 각각 1장까지만 고를 수 있다");
            if (ctx.cards.actionFull) return CardOps.say("행동 패가 가득 찼다");
            const got = [];
            for (const c of picks) {
                if (!ctx.cards.fetch(c)) continue; // 못 가져오면 못 가져온다
                got.push(c);
                if (d.boostPct) { const data = c.ensureData(); data.boostPct = d.boostPct; data.boostTurn = u.turnNo; }
                if (d.cutCost) c.ensureData().costCut = 1 + CardOps.def(u, 10);
            }
            if (!got.length) return CardOps.say("그 카드는 이제 덱·묘지에 없다");
            return [got.map((c) => new PopupAnim(u, c.name, "#f0e8b0"))];
        },
        short: (c) => {
            const d = c.def;
            return `${d.two ? "덱과 묘지에서 각각 1장" : "덱/묘지에서 1장"} 골라 패로${d.boostPct ? " · 이번 턴 피해 +" + d.boostPct + "%" : ""}${d.cutCost ? " · 비용 -" + (1 + CardOps.def(PL(), 10)) : ""}`;
        }
    },

    // 포식: 옆칸 대상 공격력 250% 피해. 처치하면 피해량의 10%(최소 1)만큼 최대 체력을 얻는다 (소멸)
    predation: {
        icon: "skull", color: "#d04050",
        target: () => ({ range: 1, radius: 0, entity: true, taps: 1, verb: "공격", color: "#d8443c" }),
        use(ctx) {
            const u = ctx.user;
            const foe = CardOps.pickAdjacent(ctx);
            if (!foe) return null;
            const steps = Combat.strike(u, foe, ctx.world, CardOps.atk(u, 250), ctx.card.name);
            const out = [steps];
            const dealt = Combat.last?.dealt ?? 0;
            if (!foe.alive) {
                const gain = Math.max(1, CardOps.pct(dealt, 10));
                u.addPerm("maxHp", gain);
                MessageLog.add(`포식! 최대 체력 +${gain}`, "#e06070");
                out.push([new PopupAnim(u, `최대 체력 +${gain}`, "#e06070")]);
            }
            return out;
        },
        short: () => `${CK.atk(CardOps.atk(PL(), 250))} 피해 · 처치하면 피해량의 10%(최소 1)만큼 최대 체력 · 소멸`
    },

    // 리로드: 1장 버리고 2 + 이동속도 25%장 뽑기. 붉은/푸른/노란: 덱에서 공격/방어/이동 카드를 가져온다
    reload: {
        icon: "cycle", color: "#a0d0ff",
        picker: CardOps.handPick("버릴 카드를 한 장 고른다", 1, 1),
        use(ctx) {
            const [pick] = ctx.picks ?? [];
            if (!pick || !ctx.cards.hand.includes(pick)) return CardOps.say("버릴 카드를 골라야 한다");
            CardOps.dump(ctx, [pick]);
            const n = 2 + CardOps.spd(ctx.user, 25);
            const tag = ctx.card.def.fetchTag;
            if (!tag) return [CardOps.draw(ctx, n)];
            const got = CardOps.fetchWhere(ctx, (c) => (c.def.tags ?? []).includes(tag), n);
            if (!got.length) MessageLog.add(`덱에 ${CARD_TAG_NAMES[tag] ?? tag} 카드가 없다`, "#c8b890");
            return [got.length ? [new PopupAnim(ctx.user, `+${got.length}장`, "#a0b8e8")] : []];
        },
        short: (c) => {
            const tag = c.def.fetchTag;
            return `1장 버리고 ${CK.spd(2 + CardOps.spd(PL(), 25))}장 ${tag ? "덱에서 " + (CARD_TAG_NAMES[tag] ?? tag) + " 카드 가져오기" : "뽑기"}`;
        }
    },

    rest: {
        icon: "plus", color: "#7cd47c", heal: false,
        // 2 + 방어력 10%만큼 마나 회복 (초록: 1 + 방어력 25%만큼 체력 회복)
        use(ctx) {
            const u = ctx.user;
            if (ctx.card.def.heal) {
                if (u.stats.hp >= u.stats.maxHp) return CardOps.say("이미 체력이 가득하다");
                const got = CardOps.heal(u, 1 + CardOps.def(u, 25));
                return [[new PopupAnim(u, "+" + got, "#7cd47c")]];
            }
            const paid = ctx.card.cost?.mana ?? 0;
            const n = 2 + CardOps.def(u, 10);
            if (u.mana - paid >= u.maxMana) return CardOps.say("이미 마나가 가득하다");
            // 마나 비용은 쓴 뒤에 나가므로, 그만큼 여유를 두고 채운다
            u.mana = Math.min(u.maxMana + paid, u.mana + n);
            MessageLog.add(`마나 ${n} 회복`, "#7cb0f0");
            return [[new PopupAnim(u, `마나 +${n}`, "#7cb0f0")]];
        },
        short(card) {

};

// 붉은 토템·초록 휴식 등은 설명(short)도 변형 값(def)을 읽는다 (위 CARDS의 short가 c.def를 본다)

// ---------- 데이터 → 카드 정의 ----------
class GameContent {
    static cards = new Map();    // id → 데이터 카드
    static tagNames = new Map();
    static starter = [];         // [[id, n]]
    static iconSeq = 0;

    // 설명글의 "[턴 제한(3)]" → 3 (없으면 0)
    static turnLimitOf(effect) {
        const m = /\[턴 제한\((\d+)\)\]/.exec(effect ?? "");
        return m ? +m[1] : 0;
    }

    static costObject(cost) {
        const out = {};
        for (const k of ["energy", "hp", "mana", "gold"]) if (cost && cost[k]) out[k] = cost[k];
        return out;
    }

    // 공방 카드·강화의 비용 경우들 [{ energy: 2 }, { mana: 2 }, …]. 줄이 없으면 비용 없음 [{}].
    // 옛 데이터(cost 하나)는 자원마다 한 경우로 쪼갠다 (기력 1 + 마나 1 → 기력 1짜리 · 마나 1짜리)
    static costOptions(data) {
        const list = data.costs ?? ["energy", "mana", "hp", "gold"].filter((k) => data.cost?.[k]).map((k) => ({ [k]: data.cost[k] }));
        const out = list.map((c) => GameContent.costObject(c));
        return out.length ? out : [{}];
    }

    // 설명글: 공방 글 그대로, "공격력 60%" 같은 말만 지금 숫자로 바꿔 보여 준다
    static render(effect) {
        const u = Player.current ?? { stats: { attack: Player.BASE_ATTACK, defense: Player.BASE_DEFENSE, maxHp: Player.BASE_HP }, speed: Player.BASE_SPEED, maxMana: Player.MAX_MANA };
        const speed = u.speed !== undefined ? CardOps.speed(u) : Player.BASE_SPEED;
        const names = Object.entries(Status.DEFS).map(([k, d]) => [d.name, k]);
        const statusRe = names.filter(([n]) => n.length > 1).map(([n]) => n).join("|");
        const re = new RegExp(`(공격력|방어력) (\\d+)%|이동속도 (\\d+)%|이동속도(?= 거리| 이내|만큼)|최대체력 (\\d+)%|최대마나의 (\\d+)%|(${statusRe})|(독|힘)(?= \\d| 영구)`, "g");
        const byName = Object.fromEntries(names);
        return String(effect ?? "").replace(re, (m, stat, sp, spd, mh, mm, st, st1) => {
            if (stat) {
                const v = stat === "공격력" ? CardOps.atk(u, +sp) : CardOps.def(u, +sp);
                return CardText.stat(stat === "공격력" ? "atk" : "def", +sp, v);
            }
            if (spd) return CardText.stat("spd", +spd, Math.floor(speed * +spd / 100 + 1e-9));
            if (mh) return CardText.stat("hp", +mh, CardOps.pct(u.stats.maxHp, +mh));
            if (mm) return CardText.stat("mana", +mm, CardOps.pct(u.maxMana ?? Player.MAX_MANA, +mm));
            if (m === "이동속도") return CardText.stat("spd", null, speed);
            const nm = st ?? st1;
            return nm ? `[[${byName[nm]}:${nm}]]` : m;
        });
    }

    // 카드 정의 하나 등록
    // data: 공방 카드 또는 강화 { name, cost, effect, tags }, impl: 합쳐진 동작
    static register(defId, data, impl, extra) {
        const frame = CardKit.list.length;
        const costs = GameContent.costOptions(data);
        const cost = costs[0];
        const total = costs.reduce((a, c) => a + (c.energy ?? 0) + (c.mana ?? 0), 0) / costs.length;
        const def = {
            type: "skill", sprite: "kicons", frame, kit: true, icon: impl.icon ?? "card", color: extra.color ?? impl.color ?? "#e8d9b8",
            name: data.name, cost, costs, price: Math.floor(30 + 14 * total), tags: data.tags ?? [], effect: data.effect ?? "",
            exhaust: !!impl.exhaust || (data.tags ?? []).includes("exhaustion"),
            turnLimit: GameContent.turnLimitOf(data.effect),
            grudge: impl.grudge ?? null, picker: impl.picker ?? null,
            ...impl, ...extra,
            text: () => GameContent.render(data.effect),
            short: (card) => (impl.short ? impl.short(card) : GameContent.render(data.effect).split("\n")[0]),
            target: impl.target ? (card) => impl.target.call(card.def, card) : null
        };
        if (impl.use) def.use = (ctx) => impl.use.call(def, ctx);
        else def.use = null;
        CardDef.register(defId, def);
        CardKit.list.push(CardDef.get(defId));
    }

    static load() {
        const D = GAME_DATA;
        for (const t of D.tags) GameContent.tagNames.set(t.id, t.name);
        CardDef.upgrades = new Map(); // 기본 카드 id → [변형 defId]
        for (const c of D.cards) {
            const impl = CARDS[c.id];
            if (!impl) {
                console.warn("카드 동작이 아직 없다 (data/CardImpl.js에 추가):", c.id);
                continue;
            }
            GameContent.cards.set(c.id, c);
            GameContent.register(c.id, c, impl, { base: c.id, upgradeKey: null, kind: c.kind, rarity: c.kind === "reward" ? (c.rarity ?? "common") : undefined, starter: c.kind === "basic" });
            for (const u of c.upgrades ?? []) {
                const over = VARIANTS[c.id]?.[u.key] ?? {};
                const color = VC[u.key] ?? impl.color;
                GameContent.register(`${c.id}__${u.key}`, u, { ...impl, ...over, icon: impl.icon }, {
                    base: c.id, upgradeKey: u.key, upgradeFrom: u.from ?? "default", color, kind: "upgrade"
                });
                if (!CardDef.upgrades.has(c.id)) CardDef.upgrades.set(c.id, []);
                CardDef.upgrades.get(c.id).push(`${c.id}__${u.key}`);
            }
        }
        // 시작 덱: 기본(basic) 카드 3장씩
        GameContent.starter = D.cards.filter((c) => c.kind === "basic" && CARDS[c.id]).map((c) => [c.id, 3]);
        CardSystem.STARTER = GameContent.starter;
        GameContent.buildTerms();
    }

    // 지금 카드(defId)에서 할 수 있는 강화들 [{ defId, def }]
    static upgradesOf(defId) {
        const def = CardDef.get(defId);
        if (!def || !def.base) return [];
        const from = def.upgradeKey ?? "default";
        return (CardDef.upgrades.get(def.base) ?? []).map((id) => CardDef.get(id)).filter((d) => (d.upgradeFrom ?? "default") === from);
    }

    // 용어 풀이: 데이터 태그의 설명 (상태 이상 · 원한 · 도발)
    static buildTerms() {
        const keyOf = { burning: "burn", ice: "ice", lethargy: "lethargy", hardening: "harden", slowness: "slow", strength: "str", root: "root", sturn: "stun", taunt: "taunt", poison: "poison", swift: "swift", protect: "protect" };
        const terms = [];
        for (const t of GAME_DATA.tags) {
            if (!t.note) continue;
            if (keyOf[t.id] || t.id === "grudge") terms.push([t.name, keyOf[t.id] ?? null, t.note]);
        }
        for (const [id, name] of [["exhaustion", "소멸"], ["prepare", "준비"], ["turn_limit", "턴 제한"]]) {
            const t = GAME_DATA.tags.find((x) => x.id === id);
            if (t && t.note) terms.push([t.name ?? name, null, t.note]);
        }
        terms.push(["방어도", "def", "받는 피해를 먼저 막아 주는 수치. 정해진 턴이 지나면 사라진다. (곧 끝나는 것부터 깎인다)"]);
        terms.push(["소멸", null, "쓰면 이 방에서는 다시 나오지 않는다. 다음 방에서 덱으로 돌아온다."]);
        CardText.TERMS = terms;
    }
}

// ---------- 준비 (패에 들고 있는 동안 발동하는 카드 효과) ----------
//   strikeUp: 다른 카드를 쓸 때마다 이 카드(공격 푸른 변형)의 피해 +25% (data.prep), 턴이 끝나면 초기화
//   frostIce: 턴이 끝날 때마다 이 카드(서리 푸른 변형)의 빙결 지속시간 +방어력 20% (data.iceBonus), 쓰면 초기화
class CardPrep {
    static used(user) {
        if (!user || !user.cards) return;
        for (const c of user.cards.hand) if (c.def.prepare === "strikeUp") c.ensureData().prep = (c.data.prep ?? 0) + 1;
    }

    static turnEnd(player) {
        if (!player || !player.cards) return;
        for (const c of player.cards.hand) {
            const kind = c.def.prepare;
            if (kind === "strikeUp") c.ensureData().prep = 0;
            else if (kind === "frostIce") c.ensureData().iceBonus = (c.data.iceBonus ?? 0) + CardOps.def(player, 20);
        }
    }
}

/* ===== assets/dat/data/EquipImpl.js ===== */
// 카드 공방 데이터(GameData.equipment)의 장비를 게임 장비로 만든다.
//   - 이름·부위·희귀도·값·설명(효과 글)·태그는 데이터에서 읽는다.
//   - 실제 동작은 이 파일의 EQUIP[장비 id]에 짜 둔다. 새 장비가 데이터에 생기면 EQUIP에 한 덩어리를 추가한다
//     (tools/import_data.py가 빠진 id를 알려 준다).
//
// 장비는 소지품(인벤토리) 패의 카드다. 장착해도 소모되거나 사라지지 않고 패에 그대로 남아 있으면서(착용 중 표시) 효과를 준다.
// 해제하면 그 순간부터 효과가 없다. 장착·해제는 턴을 쓰지 않는다 (전투 중에는 아래 패, 지도 화면에서는 [장비] 창).
// 효과는 "장착한 동안 읽는" 방식이라 장착·해제할 때 따로 되돌릴 것이 없다:
//   stats      — 능력치 (공격력·방어력·이동속도·행동 패·인벤토리 패·최대 체력). Gear.sum이 장착한 장비만 더한다
//   dealt      — dealt(피해, 공격자, 대상) → 바뀐 피해. 플레이어가 주는 피해가 정해질 때 (Status.modify)
//   turnStart  — turnStart(플레이어, 월드) → 연출 배열. 새 턴이 시작될 때
//   roomStart  — roomStart(플레이어, 월드). 전투방에 들어갈 때 (방어도·마나가 채워진 다음)
//   moved      — moved(플레이어). 이동 카드로 움직였을 때 (걷기·순간이동)
//   hit        — hit(플레이어, 맞은 대상, 월드). 플레이어가 적에게 피해를 입혔을 때 (체력이 깎인 경우)
//   kill       — kill(플레이어, 쓰러뜨린 대상). 플레이어가 적을 쓰러뜨렸을 때
//   (icon: card_glyphs 칸 이름, color)
const EQUIP = {
    // 배낭: 소지품 패 +3
    bag: { icon: "chain", color: "#b08860", stats: { invHand: 3 } },

    // 구부러진 동전: 적에게 피해를 입힐 때마다 내 주변 3x3 칸에 동전이 1개 떨어진다. 그 칸으로 가면 5G, 턴이 끝나면 사라진다
    bent_coin: {
        icon: "coin", color: "#e8c040",
        hit(user, target, world) {
            Equip.dropCoin(user, world);
        }
    },

    // 조잡한 방패: 방어력 +20%
    crude_shield: { icon: "shield", color: "#a8a090", stats: { defensePct: 20 } },

    // 녹슨 단검: 옆칸 대상에게 입히는 피해 +35%
    rusty_dagger: {
        icon: "dagger", color: "#b08a6a",
        dealt(dmg, user, target) {
            return Equip.adjacent(user, target) ? Math.floor(dmg * 135 / 100 + 1e-9) : dmg;
        }
    },

    // 나이프 홀스터: 이동할 때마다 투척용 단검 1장 (임시 카드)
    knife_holster: {
        icon: "dagger", color: "#a8a8b8",
        moved(user) {
            // 카드의 드로우가 다 끝난 뒤(Equip.flushMoved) 불린다: 패에 자리가 남을 때만 얻는다 (자리가 없으면 못 얻는다)
            const c = new Card("throwing_knife");
            c.ensureData().temp = true;
            if (user.cards.addToHand(c)) MessageLog.add("투척용 단검을 얻었다", "#c8c8d8");
            else MessageLog.add("패가 가득 차서 투척용 단검을 얻지 못했다", "#c8b890");
        }
    },

    // 튼튼한 장화: 이동속도 +1
    sturdy_boots: { icon: "chain", color: "#a07850", stats: { speed: 1 } },

    // 공구허리띠: 행동 패 +1
    tool_belt: { icon: "chain", color: "#c0a060", stats: { actionHand: 1 } }
};

// 장착한 장비의 효과를 부르는 곳 (규칙 코드가 부른다)
class Equip {
    // 지금 장착 중인 장비들의 동작 [EQUIP 항목]
    static active(player) {
        const p = player ?? Player.current;
        if (!p || !p.cards) return [];
        return [...p.cards.equippedCards.map((c) => EQUIP[c.defId]).filter(Boolean)];
    }

    // 내 주변 3x3 칸 중 빈 칸 하나에 동전을 떨어뜨린다 (구부러진 동전)
    static dropCoin(user, world) {
        if (!world || !user) return;
        const spots = [];
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const x = user.x + dx;
            const y = user.y + dy;
            if (!(dx || dy) || !world.getChunkAt(x, y) || !world.isWalkable(x, y)) continue;
            if (world.entitiesAt(x, y).some((o) => o.isHazard || o.solid)) continue;
            spots.push([x, y]);
        }
        if (!spots.length) return;
        const [x, y] = spots[Math.floor(Math.random() * spots.length)];
        world.spawn(new Hazard(x, y, "coin", { life: 1, name: "동전" }));
    }

    // 플레이어가 (칸 이동으로) 새 칸에 섰다: 그 칸의 동전을 줍는다 (ChunkManager.moveEntity · 순간이동)
    static stepped(player, world) {
        for (const o of [...world.entitiesAt(player.x, player.y)]) {
            if (!(o instanceof Hazard) || o.kind !== "coin" || !o.world) continue;
            o.remove(world);
            player.money += 5;
            MessageLog.add("동전을 주웠다: +5G", "#f0d060");
            const q = world.run ? world.run.queue : null;
            if (q) q.play(new PopupAnim(player, "+5G", "#f0d060"));
        }
    }

    static adjacent(a, b) {
        return !!a && !!b && Math.abs(a.x - b.x) + Math.abs(a.y - b.y) === 1;
    }

    // 플레이어가 주는 피해 보정 (Status.modify가 부른다)
    static dealt(dmg, source, target) {
        if (!(source instanceof Player) || dmg <= 0) return dmg;
        for (const e of Equip.active(source)) if (e.dealt) dmg = e.dealt(dmg, source, target);
        return dmg;
    }

    // 이동 카드를 썼다 (ActionCards.move · 순간이동)
    // 카드를 쓰는 동안(Card.use)이면 끝난 뒤로 미룬다: 이동 + 드로우 카드는 드로우를 먼저 하고, 패가 남으면 장비(나이프 홀스터)가 준다
    static moved(player) {
        if (player._cardUsing) player._movedPending = true;
        else Equip.movedNow(player);
    }

    static movedNow(player) {
        for (const e of Equip.active(player)) if (e.moved) e.moved(player);
    }

    // 카드 사용이 끝났다: 미뤄 둔 이동 효과를 지금 한다
    static flushMoved(player) {
        if (!player._movedPending) return;
        player._movedPending = false;
        Equip.movedNow(player);
    }

    // 새 턴 시작 (TurnManager). 연출 배열
    static turnStart(player, world) {
        const out = [];
        for (const e of Equip.active(player)) if (e.turnStart) out.push(...(e.turnStart(player, world) ?? []));
        return out;
    }

    // 전투방에 들어갈 때 (Run.enter)
    static roomStart(player, world) {
        for (const e of Equip.active(player)) if (e.roomStart) e.roomStart(player, world);
    }
}

Events.on(GameEvent.DAMAGED, ({ target, source, world, dealt }) => {
    if (!(source instanceof Player) || target === source || !(dealt > 0) || target.attitude !== "hostile") return;
    for (const e of Equip.active(source)) if (e.hit) e.hit(source, target, world);
});

// 전투가 끝나면 남은 동전은 사라진다
Events.on(GameEvent.ROOM_CLEARED, () => {
    const w = Game.world;
    if (!w) return;
    for (const h of [...(w.hazards ?? [])]) if (h.kind === "coin") h.remove(w);
});

Events.on(GameEvent.KILLED, ({ target, killer, world }) => {
    if (!(killer instanceof Player) || target === killer) return;
    for (const e of Equip.active(killer)) if (e.kill) e.kill(killer, target, world);
});

// ---------- 데이터 → 카드 정의 ----------
class EquipContent {
    static ids = [];

    static load() {
        EquipContent.ids = [];
        for (const e of GAME_DATA.equipment ?? []) {
            const impl = EQUIP[e.id];
            if (!impl) {
                console.warn("장비 동작이 아직 없다 (data/EquipImpl.js에 추가):", e.id);
                continue;
            }
            const frame = CardKit.list.length;
            CardDef.register(e.id, {
                type: "item", sprite: "kicons", frame, kit: true, icon: impl.icon ?? "star", color: impl.color ?? "#e8d9b8",
                // slot "gear"는 장비라는 표시일 뿐 부위가 아니다 (몇 개든 겹쳐 입는다)
                name: e.name, slot: "gear", rarity: e.rarity, price: e.price ?? 50, tags: e.tags ?? [],
                stats: impl.stats ?? null, gear: true, noLines: true, // 설명은 공방 글 그대로 (능력치 줄을 따로 안 붙인다)
                effect: e.effect ?? "",
                text: () => GameContent.render(e.effect),
                short: () => GameContent.render(e.effect).split("\n")[0]
            });
            CardKit.list.push(CardDef.get(e.id));
            EquipContent.ids.push(e.id);
        }
    }

    // 장비 카드 한 장
    static create(id) {
        return new Card(id);
    }
}

/* ===== assets/dat/data/EnemyImpl.js ===== */
// 카드 공방 데이터(GameData.js)의 적을 게임 몬스터로 만든다.
//   - 체력·공격·방어·이동속도·드랍·층·태그·"무리지어 다닌다 (2~3마리)" 같은 말은 데이터에서 읽는다.
//   - 행동(패턴)은 이 파일의 SPECS[적 id]에 데이터의 pattern 글을 읽고 짜 둔 것이다 (EnemyAI.js 머리말 참고).
//     새 적이 데이터에 생기면 SPECS에 한 덩어리를 추가한다 (tools/import_data.py가 빠진 id를 알려 준다). 없으면 그냥 다가와서 친다.
// 규칙: 피해 = 공격력(또는 방어력) × %, 방어력은 피해를 줄이지 않는다 (방어도만 막는다). "N턴" 방어도는 자기 턴이 N번 시작될 때까지.
const ATK = (pct = 100, extra = {}) => ({ kind: "approach", pct, stat: "atk", ...extra });

EnemyMoves.SPECS = {
    basic: { brain: () => ATK() },

    // 들쥐: A 반복
    rat: { brain: () => ATK() },

    // 늑대: A(달려들어 물고 피해 절반 회복) / B(쉬기) / C(울부짖어 힘 +1 영구)
    //   사거리 5 안이면 항상 A. 밖에 3턴 이상 있으면 C, 이후 안으로 들어올 때까지 A를 5회 반복. 4번 행동하면 다음은 B
    wolf: {
        brain(ai, ctx, e, foe) {
            const m = ai.mem;
            m.acts ??= 0;
            m.far ??= 0;
            m.forceA ??= 0;
            const bite = ATK(100, { lifesteal: 0.5 });
            if (m.acts >= 4) {
                m.acts = 0;
                return { kind: "idle" };
            }
            m.acts++;
            if (EnemyMoves.dist(e, foe) <= 5) {
                m.far = 0;
                m.forceA = 0;
                return bite;
            }
            if (m.forceA > 0) {
                m.forceA--;
                return bite;
            }
            m.far++;
            if (m.far >= 3) {
                m.far = 0;
                m.forceA = 5;
                return { kind: "howl", n: 1 };
            }
            return bite;
        }
    },

    // 고블린: A(같은 줄이고 벽이 없으면 이동속도의 500%칸 돌진, 공격력 200%) 뒤에는 항상 B(쉬기).
    //   A를 못 하면 C(A를 할 수 있는 칸으로 이동속도 거리 안에서 자리 잡기)를 하고, 다음 턴 A. C를 반복
    goblin: {
        brain(ai, ctx, e, foe) {
            const m = ai.mem;
            const w = ctx.world;
            if (m.rest) {
                m.rest = false;
                return { kind: "idle" };
            }
            if (EnemyMoves.canCharge(w, e, foe)) {
                m.rest = true;
                return EnemyMoves.chargeIntent(ctx, e, foe, 200, e.speedNow * 5);
            }
            const tiles = EnemyMoves.reach(w, e, e.speedNow);
            let best = null;
            for (const t of tiles) {
                if (!(t.x === foe.x || t.y === foe.y) || (t.x === foe.x && t.y === foe.y)) continue;
                if (!EnemyMoves.clearBetween(w, t, foe)) continue;
                const d = EnemyMoves.dist(t, foe);
                if (!best || t.path.length < best.len || (t.path.length === best.len && d > best.d)) best = { ...t, len: t.path.length, d };
            }
            if (best) return { kind: "move", to: { x: best.x, y: best.y }, name: "자리 잡기" };
            return ATK();
        }
    },

    // 미니 돌 골렘: [AB] 로테이션
    //   A 다가가거나 옆칸이면 방어력 100% 피해 / B 방어력 100% 방어도 1턴
    mini_stone_golem: {
        rotations: ["AB"],
        actions: {
            A: () => ATK(100, { stat: "def", name: "박치기" }),
            B: () => ({ kind: "block", pct: 100, turns: 1 })
        }
    },

    // 오우거: [AABCD, ABACD] 중 하나
    //   A 다가가거나 옆칸이면 공격력 100% / B 이동속도 300% 이내로 도약해 주변 2칸 공격력 100% (벽이 막으면 못 쓴다, 한가운데 플레이어는 밀어낸다)
    //   C 쉼 / D 음식을 먹어 방어력 100%만큼 회복
    ogre: {
        rotations: ["AABCD", "ABACD"],
        fallback: { B: "A" },
        actions: {
            A: () => ATK(),
            B(ai, ctx, e, foe) {
                const w = ctx.world;
                const range = e.speedNow * 3;
                const d = EnemyMoves.dist(e, foe);
                let to;
                if (d <= range) to = { x: foe.x, y: foe.y };
                else {
                    to = { x: Math.round(e.x + (foe.x - e.x) * range / d), y: Math.round(e.y + (foe.y - e.y) * range / d) };
                    if (!w.isWalkable(to.x, to.y)) return null;
                }
                if (!EnemyMoves.sightLine(w, e, to)) return null; // 벽이 있으면 못 쓴다
                return { kind: "leap", to, tiles: EnemyMoves.around(w, to.x, to.y, 2), r: 2, dmg: EnemyMoves.val(e, "atk", 100), name: "도약" };
            },
            C: () => ({ kind: "idle" }),
            D: () => ({ kind: "eat", pct: 100 })
        }
    },

    // 해골: [AABC, ABAC, AACB] 중 하나
    //   A 다가가거나 옆칸이면 공격력 100% / B 사거리 5, 플레이어 칸 + 3거리 안 무작위 두 칸에 뼈 3개 (각 공격력 80%) — 사거리 밖이면 이전과 같은 행동
    //   C 방어력 100% 방어도 1턴
    skeleton: {
        rotations: ["AABC", "ABAC", "AACB"],
        fallback: { B: "prev" },
        actions: {
            A: () => ATK(),
            B(ai, ctx, e, foe) {
                if (EnemyMoves.dist(e, foe) > 5) return null;
                const w = ctx.world;
                const near = EnemyMoves.around(w, foe.x, foe.y, 3).filter(([x, y]) => x !== foe.x || y !== foe.y);
                const extra = Rng.shuffle(EnemyMoves.rng(ctx), near).slice(0, 2);
                return { kind: "area", name: "뼈 던지기", tiles: [[foe.x, foe.y], ...extra], dmg: EnemyMoves.val(e, "atk", 80), thrown: true, color: "#e8e0c0" };
            },
            C: () => ({ kind: "block", pct: 100, turns: 1 })
        }
    },

    // 슬라임: [ABCD, ACBD, ACDB] 중 하나
    //   A 다가가거나 옆칸이면 공격력 100% / B 방어력 100% 방어도 1턴 / C 쉼
    //   D 사거리 5 (벽에 막힌다), 플레이어 위치로 점액을 던진다: 공격력 80% + 둔화(33%, 1턴) — 못 쓰면 A
    slime: {
        rotations: ["ABCD", "ACBD", "ACDB"],
        fallback: { D: "A" },
        actions: {
            A: () => ATK(),
            B: () => ({ kind: "block", pct: 100, turns: 1 }),
            C: () => ({ kind: "idle" }),
            D(ai, ctx, e, foe) {
                if (EnemyMoves.dist(e, foe) > 5 || !EnemyMoves.sightLine(ctx.world, e, foe)) return null;
                return { kind: "area", name: "점액 던지기", tiles: [[foe.x, foe.y]], dmg: EnemyMoves.val(e, "atk", 80), slow: { v: 33, t: 1 }, thrown: true, color: "#7cd47c" };
            }
        }
    },

    // 거미: [BBCA, BCBA] 중 하나
    //   A 사거리 5 (벽에 막힌다) 이동속도 500% 거리 안의 플레이어 칸에 실을 쏴 방어력 75%턴 속박 — 못 닿으면 B / B 다가가거나 옆칸이면 공격력 100%의 독 / C 쉼
    spider: {
        rotations: ["BBCA", "BCBA"],
        fallback: { A: "B" },
        actions: {
            A(ai, ctx, e, foe) {
                if (EnemyMoves.dist(e, foe) > e.speedNow * 5 || !EnemyMoves.sightLine(ctx.world, e, foe)) return null;
                return { kind: "area", name: "거미줄", tiles: [[foe.x, foe.y]], dmg: 0, root: Math.floor(e.stats.defense * 0.75 + 1e-9), thrown: true, color: "#e8e8f0" };
            },
            B: () => ATK(100, { poison: 100, name: "독니" }),
            C: () => ({ kind: "idle" })
        }
    },

    // 해골 기사: [AABC, ABAC, AACB] 중 하나
    //   A 다가가거나 옆칸이면 공격력 100% / B 방어력 100% 방어도 2턴 + 이동속도 300% 거리 안에서 플레이어에게 돌진
    //     (닿으면 충돌 공격력 200%) + 돌진 뒤 주변 3x3에 공격력 150%
    //   C 플레이어 쪽으로 길이(이동속도 300%) × 두께(이동속도 100%)의 직선 범위, 공격력 150%
    skeleton_kinght: {
        rotations: ["AABC", "ABAC", "AACB"],
        actions: {
            A: () => ATK(),
            B(ai, ctx, e, foe) {
                const w = ctx.world;
                const range = e.speedNow * 3;
                // 이동속도 300% 걸음 안에서 플레이어에게 가장 가까워지는 칸 (가장 적게 걷는 곳)
                let best = null;
                for (const t of EnemyMoves.reach(w, e, range)) {
                    const d = EnemyMoves.dist(t, foe);
                    if (!best || d < best.d || (d === best.d && t.path.length < best.path.length)) best = { ...t, d };
                }
                const path = best && best.d < EnemyMoves.dist(e, foe) ? best.path : [];
                const to = best && path.length ? { x: best.x, y: best.y } : { x: e.x, y: e.y };
                return {
                    kind: "rush", to, path, pathTiles: EnemyMoves.pathTiles(e, path), block: { pct: 100, turns: 2 },
                    col: EnemyMoves.val(e, "atk", 200), swing: EnemyMoves.val(e, "atk", 150), name: "돌진 베기",
                    tiles: EnemyMoves.square(w, to.x, to.y, 1).filter(([x, y]) => x !== to.x || y !== to.y), color: "#c8c8d8"
                };
            },
            C(ai, ctx, e, foe) {
                const w = ctx.world;
                const len = e.speedNow * 3;
                const thick = Math.max(1, e.speedNow);
                const dx = foe.x - e.x;
                const dy = foe.y - e.y;
                const horiz = Math.abs(dx) >= Math.abs(dy);
                const dir = horiz ? [Math.sign(dx) || 1, 0] : [0, Math.sign(dy) || 1];
                const side = horiz ? [0, 1] : [1, 0];
                const tiles = [];
                const lo = -Math.floor((thick - 1) / 2);
                for (let i = 1; i <= len; i++) {
                    const cx = e.x + dir[0] * i;
                    const cy = e.y + dir[1] * i;
                    if (!EnemyMoves.walkableTile(w, cx, cy)) break; // 벽에 막힌다
                    for (let k = lo; k < lo + thick; k++) {
                        const x = cx + side[0] * k;
                        const y = cy + side[1] * k;
                        if (EnemyMoves.walkableTile(w, x, y)) tiles.push([x, y]);
                    }
                }
                if (!tiles.length) return null;
                return { kind: "area", name: "검 휘두르기", tiles, dmg: EnemyMoves.val(e, "atk", 150), color: "#c8c8d8" };
            }
        },
        fallback: { C: "A" }
    },

    // 서큐버스: [AAAB] 로테이션 (시작 위치 무작위)
    //   A 다가가거나 옆칸이면 매료(2칸) 3턴, 이미 매료 상태면 공격력 100% 피해
    //     (피해를 입히면 방어력 100% 체력 회복 · 힘 1 · 경질화 1 · 성장 1) / B 방어력 100% 방어도 2턴
    succubus: {
        rotations: ["AAAB"],
        actions: {
            A: () => ATK(100, { charm: { n: 2, turns: 3, heal: 100, str: 1, harden: 1, growth: 1 }, name: "흡정" }),
            B: () => ({ kind: "block", pct: 100, turns: 2 })
        }
    },

    // 돌 골렘: [ABCDBD, ADCBDB] 중 하나
    //   A 사거리 5, 플레이어 칸에 돌 공격력 100% — 안 닿으면 D / B 다가가거나 옆칸이면 방어력 100% 피해
    //   C 경질화(방어력 20%) + 방어력 100% 방어도 2턴 / D 쉼
    // 슬라임킹 (2x2): [ABCDEFG, ACGEFBD, GACDEBF] 중 하나. 동작은 entity/SlimeKing.js (F는 SlimeKingPull.js)
    //   A 점액 돌진(충돌 160%, 지나간 자리에 장판 2턴) / B 점액 던지기(플레이어 칸 + 주변 6곳, 80%) / C 다가가기·공격 (걸음마다 장판)
    //   D 방어도 / E 슬라임 소환(체력 15%, 공격·방어 40%) / F 점액 손 / G 휴식(체력 5 회복)
    slime_king: {
        rotations: ["ABCDEFG", "ACGEFBD", "GACDEBF"],
        fallback: { A: "C", B: "C", E: "D", F: "C" },
        actions: {
            A: (ai, ctx, e, foe) => SlimeKing.chargeIntent(ctx, e, foe),
            B: (ai, ctx, e, foe) => SlimeKing.throwIntent(ctx, e, foe),
            C: (ai, ctx, e, foe) => SlimeKing.biteIntent(ctx, e, foe),
            D: () => ({ kind: "block", pct: 100, turns: 1 }),
            E: (ai, ctx, e) => SlimeKing.summonIntent(ctx, e),
            F: (ai, ctx, e, foe) => SlimeKingPull.intent(ctx, e, foe),
            G: (ai, ctx, e) => SlimeKing.restIntent(ctx, e)
        }
    },

    // 슬라임퀸 (2x2): [ABCDEFG]. 동작은 entity/SlimeQueen.js
    //   A 점액 뒤덮기(방 전체 장판 3턴, 맞으면 취소) / B 점액 손(60%, 속박, 당기기) / C 유혹(매료 + 100%) / D 공격(100% + 점액 카드)
    //   E 기 모으기 / F 연타(60%, 기를 모았으면 이동속도 300%번) / G 가두기 (못 하면 바로 다음 행동)
    slime_queen: {
        rotations: ["ABCDEFG"],
        fallback: { G: "next" },
        actions: {
            A: (ai, ctx, e) => SlimeQueen.floodIntent(ctx, e),
            B: (ai, ctx, e, foe) => SlimeQueen.handIntent(ctx, e, foe),
            C: (ai, ctx, e) => SlimeQueen.charmIntent(ctx, e),
            D: (ai, ctx, e) => SlimeQueen.biteIntent(ctx, e),
            E: (ai, ctx, e) => SlimeQueen.focusIntent(ctx, e),
            F: (ai, ctx, e) => SlimeQueen.flurryIntent(ctx, e),
            G: (ai, ctx, e, foe) => SlimeQueen.holdIntent(ctx, e, foe)
        }
    },

    stone_golem: {
        rotations: ["ABCDBD", "ADCBDB"],
        fallback: { A: "D" },
        actions: {
            A(ai, ctx, e, foe) {
                if (EnemyMoves.dist(e, foe) > 5) return null;
                return { kind: "area", name: "돌 던지기", tiles: [[foe.x, foe.y]], dmg: EnemyMoves.val(e, "atk", 100), thrown: true, color: "#a89878" };
            },
            B: () => ATK(100, { stat: "def", name: "내려치기" }),
            C: () => ({ kind: "block", pct: 100, turns: 2, harden: 20 }),
            D: () => ({ kind: "idle" })
        }
    }
};

// ---------- 데이터 → 몬스터 종류 ----------
class EnemyData {
    static rooms = []; // 방에 나올 수 있는 적 { id, min, max, floors:[a,b], threat, group:[min,max] }

    // "1-..." → [1, Infinity], "3-8" → [3, 8], "5" → [5, 5]
    static floors(text) {
        const m = String(text ?? "1-...").trim().match(/^(\d+)\s*(?:-\s*(\d+|\.{2,}|…))?$/);
        if (!m) return [1, Infinity];
        const a = +m[1];
        if (m[2] === undefined) return [a, a];
        return [a, /^\d+$/.test(m[2]) ? +m[2] : Infinity];
    }

    // 몬스터 등급 small(소형)·medium(중형)·large(대형)·boss(보스). 비어 있으면 중형
    static GRADES = { small: "소형", medium: "중형", large: "대형", boss: "보스" };
    static grade(g) {
        return EnemyData.GRADES[g] ? g : "medium";
    }

    // 설명(note)의 "2x2의 크기" → 한 변 2칸 (없으면 1)
    static size(note) {
        const m = String(note ?? "").match(/(\d+)\s*[xX×]\s*(\d+)\s*의?\s*크기/);
        return m ? Math.max(1, Math.min(+m[1], +m[2])) : 1;
    }

    // 설명(note)의 "(2~3마리)" / "(2마리)"
    static group(note) {
        const m = String(note ?? "").match(/\((\d+)\s*(?:~\s*(\d+))?\s*마리\)/);
        if (!m) return [1, 1];
        return [+m[1], +(m[2] ?? m[1])];
    }

    static load() {
        EnemyData.rooms = [];
        for (const e of GAME_DATA.enemies) {
            if (!EnemyMoves.SPECS[e.id]) console.warn("적 패턴이 아직 없다 (data/EnemyImpl.js에 추가). 그때까지 방에는 나오지 않는다:", e.id);
            Monster.KINDS[e.id] = {
                name: e.name, hp: e.hp, attack: e.atk, defense: e.def, moves: e.speed ?? 1, size: EnemyData.size(e.note), grade: EnemyData.grade(e.grade),
                tags: e.tags ?? [], pattern: e.pattern ?? "", note: e.note ?? ""
            };
            EntityTypes.register(e.id, (x, y, d) => new Monster(x, y, e.id, d));
            if (!EnemyMoves.SPECS[e.id]) continue; // 패턴이 없는 적은 방에 안 내보낸다
            EnemyData.rooms.push({
                id: e.id, grade: EnemyData.grade(e.grade), floors: EnemyData.floors(e.floors), group: EnemyData.group(e.note),
                threat: e.hp + e.atk * 2 + e.def
            });
        }
    }

    // 이 층(1부터)에 나올 수 있는 적들
    static at(floor) {
        return EnemyData.rooms.filter((r) => floor >= r.floors[0] && floor <= r.floors[1]);
    }
}

// 시드로 굴리는 난수 (mulberry32). 같은 시드면 같은 지도·같은 방이 나온다
class Rng {
    static make(seed) {
        let a = seed >>> 0;
        return () => {
            a = (a + 0x6d2b79f5) >>> 0;
            let t = a;
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
    }

    // 두 수를 섞어 새 시드 (런 시드 + 층·칸 → 방 시드)
    static mix(a, b) {
        let h = (a ^ Math.imul(b + 0x9e3779b9, 0x85ebca6b)) >>> 0;
        h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
        return (h ^ (h >>> 16)) >>> 0;
    }

    static int(rng, min, max) {
        return min + Math.floor(rng() * (max - min + 1));
    }

    static pick(rng, list) {
        return list[Math.floor(rng() * list.length)];
    }

    // [[값, 무게], ...]에서 하나
    static weighted(rng, table) {
        const total = table.reduce((s, [, w]) => s + w, 0);
        let x = rng() * total;
        for (const [v, w] of table) {
            if (x < w) return v;
            x -= w;
        }
        return table[table.length - 1][0];
    }

    static shuffle(rng, list) {
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
        return list;
    }
}

// 층 지도 (아이작식): 한 층은 격자 위에 이어 붙인 방들이다. 시작 방에서 출발해 옆 방으로 탐색해 나가고, 막다른 방들 중
// 가장 먼 곳이 우두머리 방이다. 우두머리를 쓰러뜨리면 다음 층으로 내려갈 수 있고, 남은 방을 더 둘러봐도 된다.
//   start 시작(비어 있다) · battle 전투 · elite 정예 · shop 상점 · rest 휴식 · treasure 보물 · boss 우두머리
// 격자에서 붙어 있는 방끼리는 문으로 이어진다. 지도에는 가 본 방과 그 옆 방(종류가 보인다)만 나타난다.
// 특수 방(상점·보물·휴식·정예)은 막다른 방에 놓이고, 우두머리는 시작에서 가장 먼 막다른 방이다.
// 난이도(row)는 층과 시작에서의 거리로 정해진다: 층마다 5단계 (시작에서 멀수록 세다, 가장 먼 방이 5단계째).
class RunMap {
    static FLOORS = 3;
    static ROOMS = [16, 20, 24];  // 층마다 방 수 (시작·우두머리·특수 방 포함)
    static RANGE = 6;             // 격자 범위 |x|,|y| ≤ RANGE
    static STEPS = 5;             // 층마다 난이도 단계
    static DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
    static TYPES = {
        battle: { name: "전투", icon: 0, color: "#c8b890" },
        elite: { name: "정예", icon: 1, color: "#e06050" },
        shop: { name: "상점", icon: 2, color: "#e8c860" },
        rest: { name: "휴식", icon: 3, color: "#f0a050" },
        treasure: { name: "보물", icon: 4, color: "#e8b840" },
        boss: { name: "우두머리", icon: 5, color: "#ff6040" },
        start: { name: "시작", icon: 6, color: "#a0d0f0" }
    };

    // seed: 런 시드, floor: 1부터
    constructor(seed, floor = 1) {
        this.seed = seed;
        this.floor = floor;
        this.nodes = new Map(); // id "x,y" → { id, x, y(격자), row(난이도), col(번호), dist, type, next: [이웃 id] }
        this.generate();
    }

    static id(x, y) {
        return x + "," + y;
    }

    static get lastFloor() {
        return RunMap.FLOORS;
    }

    get(id) {
        return this.nodes.get(id);
    }

    get start() {
        return this.nodes.get(RunMap.id(0, 0));
    }

    get boss() {
        return [...this.nodes.values()].find((n) => n.type === "boss");
    }

    generate() {
        for (let tries = 0; tries < 400; tries++) {
            if (this.build(Rng.make(Rng.mix(this.seed, this.floor * 1000 + tries)))) return;
        }
        throw new Error("층 지도를 만들지 못했다");
    }

    // 방들을 이어 붙인다 (붙는 칸은 이웃이 하나뿐인 빈 칸만 → 고리 없이 가지 뻗기). 조건이 안 맞으면 false
    build(rng) {
        const count = RunMap.ROOMS[this.floor - 1] ?? RunMap.ROOMS[RunMap.ROOMS.length - 1];
        const cells = new Map();
        const add = (x, y) => cells.set(RunMap.id(x, y), { id: RunMap.id(x, y), x, y, type: "battle", next: [] });
        const degree = (x, y) => RunMap.DIRS.filter(([dx, dy]) => cells.has(RunMap.id(x + dx, y + dy))).length;
        add(0, 0);
        let queue = [[0, 0]];
        for (let guard = 0; cells.size < count && guard < 1500; guard++) {
            if (!queue.length) queue = [...cells.values()].map((c) => [c.x, c.y]);
            const [cx, cy] = queue.shift();
            for (const [dx, dy] of Rng.shuffle(rng, RunMap.DIRS.slice())) {
                const nx = cx + dx;
                const ny = cy + dy;
                if (cells.size >= count) break;
                if (cells.has(RunMap.id(nx, ny)) || Math.abs(nx) > RunMap.RANGE || Math.abs(ny) > RunMap.RANGE) continue;
                if (degree(nx, ny) !== 1 || rng() < 0.45) continue;
                add(nx, ny);
                queue.push([nx, ny]);
            }
        }
        if (cells.size < count) return false;
        for (const c of cells.values()) for (const [dx, dy] of RunMap.DIRS) {
            const id = RunMap.id(c.x + dx, c.y + dy);
            if (cells.has(id)) c.next.push(id);
        }
        // 막다른 방 (시작 제외) 중 우두머리·상점·보물·휴식이 들어갈 자리가 모자라면 다시
        const leaves = [...cells.values()].filter((c) => c.next.length === 1 && c.id !== "0,0");
        if (leaves.length < 5) return false;
        // 시작에서의 거리
        cells.get("0,0").dist = 0;
        const queue2 = [cells.get("0,0")];
        while (queue2.length) {
            const c = queue2.shift();
            for (const id of c.next) {
                const n = cells.get(id);
                if (n.dist === undefined) {
                    n.dist = c.dist + 1;
                    queue2.push(n);
                }
            }
        }
        const far = Math.max(...leaves.map((c) => c.dist));
        if (far < 3) return false; // 우두머리는 시작에서 3칸 이상
        const boss = Rng.pick(rng, leaves.filter((c) => c.dist === far));
        const rest = Rng.shuffle(rng, leaves.filter((c) => c !== boss));
        cells.get("0,0").type = "start";
        boss.type = "boss";
        rest[0].type = "shop";
        rest[1].type = "treasure";
        // 휴식: 남는 막다른 방이 있으면 거기, 없으면 시작 옆이 아닌 안쪽 전투 방
        const restSpot = rest[2] ?? Rng.pick(rng, [...cells.values()].filter((c) => c.type === "battle" && c.dist >= 2));
        if (!restSpot) return false;
        restSpot.type = "rest";
        // 정예: 남은 막다른 방 먼저, 모자라면 시작에서 3칸 이상 떨어진 방. 층이 깊을수록 하나 더
        const eliteWant = this.floor >= 2 ? 2 : 1;
        const spots = [...rest.slice(5), ...Rng.shuffle(rng, [...cells.values()].filter((c) => c.type === "battle" && c.dist >= 3 && !rest.slice(5).includes(c)))];
        for (const c of spots.slice(0, eliteWant)) c.type = "elite";
        // 난이도·번호
        // 방이 많아도 층 전체의 난이도 범위는 5단계 그대로: 거리를 가장 먼 일반 방 기준으로 눌러 담는다
        const base = (this.floor - 1) * RunMap.STEPS;
        const maxD = Math.max(1, ...[...cells.values()].filter((c) => c.type !== "boss").map((c) => c.dist));
        let i = 0;
        for (const c of [...cells.values()].sort((a, b) => a.dist - b.dist || a.id.localeCompare(b.id))) {
            c.row = c.type === "boss" ? base + RunMap.STEPS - 1 : base + Math.max(0, Math.min(RunMap.STEPS - 1, Math.floor((c.dist - 1) * RunMap.STEPS / maxD)));
            c.col = i++;
        }
        this.nodes = cells;
        return true;
    }

    // 지도에 보이는 방 id들: 가 본 방과 그 옆 방
    revealed(visited) {
        const out = new Set();
        for (const id of visited) {
            const n = this.get(id);
            if (!n) continue;
            out.add(id);
            for (const c of n.next) out.add(c);
        }
        return out;
    }

    // 지금 고를 수 있는 방: 지도에 보이는 방 전부 (방금 나온 방도 다시 들어갈 수 있다). 아직 한 곳도 안 갔으면 시작 방
    choices(currentId, visited) {
        if (!currentId && !visited.length) return [this.start];
        return [...this.revealed(visited)].map((id) => this.get(id));
    }

    // 지도 전체가 차지하는 격자 범위 { minX, maxX, minY, maxY }
    bounds() {
        const xs = [...this.nodes.values()].map((n) => n.x);
        const ys = [...this.nodes.values()].map((n) => n.y);
        return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
    }
}

// 방 설계도. 지도에서 고른 칸(노드)마다 방 하나를 만든다: 입구 → 공간 → 출구.
// 방은 무적 벽 타일로 둘러싸인 직사각형이다. 안쪽 칸은 x 1..w, y 1..h (0과 w+1, h+1이 벽). 크기(w,h)는 방 종류의 범위 안에서 방 시드로 정한다.
// 입구는 왼쪽 벽 가운데 안쪽, 출구는 오른쪽 벽 가운데 안쪽. 플레이어는 입구 바로 오른쪽에서 시작한다.
// 전투·정예·우두머리 방은 구조 템플릿(SHAPES: 열린 아레나, 기둥, 섬, 칸막이, 기역자, 십자, 두 칸, 감실, 링)을 시드로 골라 벽 타일을 세우고,
// 입구에서 모든 칸까지 길이 이어지는지·적과 보상이 놓일 자리가 있는지 확인한다 (안 되면 다른 템플릿으로 다시).
// ChunkManager의 generator로 쓴다: fillTiles(chunk), populate(chunk)
class RoomPlan {
    // 방 종류별 크기 범위(w, h: [최소, 최대])·바닥·구조 템플릿 무게 (SHAPES 이름: 무게)
    static STYLE = {
        start: { w: [9, 11], h: [6, 7], floor: TileDef.FLOOR, wall: TileDef.WALL, shapes: { arena: 1 } },
        battle: {
            w: [9, 15], h: [6, 10], floor: TileDef.FLOOR, wall: TileDef.WALL, ref: 77,
            shapes: { arena: 3, scatter: 3, island: 3, divider: 3, lshape: 3, cross: 2, chambers: 2, alcoves: 2, ring: 2 }
        },
        elite: {
            w: [11, 15], h: [7, 10], floor: TileDef.CAVE_FLOOR, wall: TileDef.CAVE_WALL, ref: 104,
            shapes: { arena: 2, scatter: 3, island: 3, divider: 2, lshape: 3, cross: 2, chambers: 2, alcoves: 2, ring: 3 }
        },
        boss: {
            w: [13, 17], h: [9, 11], floor: TileDef.CAVE_FLOOR, wall: TileDef.CAVE_WALL, ref: 117,
            shapes: { arena: 3, scatter: 2, island: 3, lshape: 1, cross: 2, chambers: 1, alcoves: 3, ring: 3 }
        },
        shop: { w: [9, 11], h: [6, 7], floor: TileDef.PLANKS, wall: TileDef.WALL, shapes: { arena: 1 } },
        rest: { w: [9, 11], h: [6, 7], floor: TileDef.GRASS, wall: TileDef.CAVE_WALL, shapes: { arena: 1 } },
        treasure: { w: [9, 11], h: [6, 7], floor: TileDef.FLOOR, wall: TileDef.WALL, shapes: { arena: 1 } }
    };

    // 구조 템플릿: 안쪽 칸에 벽 타일을 세운다 (this.walls). 이 방에 안 맞는 크기면 false.
    // 입구·출구 쪽 길(가운데 줄 양 끝)은 layout이 따로 검사한다 (길이 막히면 다른 템플릿으로 다시 굴린다).
    static SHAPES = {
        // 열린 아레나: 기둥 0~3개
        arena(p, rng) {
            if (!p.combat) return true; // 상점·휴식·보물·시작 방은 기둥 없이 비어 있다
            p.pillars(Rng.int(rng, 0, 3));
            return true;
        },
        // 흩어진 기둥: 방 크기에 비례해 여러 개
        scatter(p, rng) {
            p.pillars(Rng.int(rng, 4, 4 + Math.floor(p.w * p.h / 30)));
            return true;
        },
        // 가운데 벽 섬: 작은 덩어리 하나 (+ 기둥 몇 개)
        island(p, rng) {
            if (p.w < 9 || p.h < 6) return false;
            const bw = Rng.int(rng, 2, p.w >= 13 ? 4 : 3);
            const bh = Rng.int(rng, 1, p.h >= 8 ? 3 : 2);
            const x0 = Rng.int(rng, 4, p.w - 3 - bw + 1);
            const y0 = Rng.int(rng, 2, p.h - bh);
            p.block(x0, y0, x0 + bw - 1, y0 + bh - 1);
            p.pillars(Rng.int(rng, 0, 2));
            return true;
        },
        // 칸막이: 세로 벽(통로 1~2칸) 한두 개, 또는 가로 벽(한쪽 끝이 열린 S자 길)
        divider(p, rng) {
            if (p.w < 9 || p.h < 6) return false;
            if (rng() < 0.5) {
                const xs = [Rng.int(rng, 4, p.w - 3)];
                if (p.w >= 14 && rng() < 0.6) { const x2 = xs[0] <= 8 ? Rng.int(rng, xs[0] + 4, p.w - 3) : Rng.int(rng, 4, xs[0] - 4); xs.push(x2); }
                let prevGap = -9;
                for (const x of xs) {
                    const g = Rng.int(rng, 1, 2);
                    let gy = Rng.int(rng, 1, p.h - g + 1);
                    if (Math.abs(gy - prevGap) < 3) gy = gy <= p.h / 2 ? p.h - g + 1 : 1; // 두 칸막이의 통로는 서로 멀리
                    prevGap = gy;
                    p.block(x, 1, x, p.h);
                    for (let k = 0; k < g; k++) p.walls.delete(x + "," + (gy + k));
                }
            } else {
                const mid = Math.ceil(p.h / 2);
                const rows = [];
                for (let y = 2; y <= p.h - 1; y++) if (y !== mid) rows.push(y);
                const y = Rng.pick(rng, rows);
                const len = Rng.int(rng, Math.floor(p.w / 2), p.w - 5);
                const left = rng() < 0.5;
                p.block(left ? 3 : p.w - 2 - len + 1, y, left ? 3 + len - 1 : p.w - 2, y);
                if (p.h >= 8) { // 가운데 줄 건너편에 반대쪽에서 오는 벽을 하나 더 (S자)
                    const y2 = y < mid ? Rng.int(rng, mid + 1, p.h - 1) : Rng.int(rng, 2, mid - 1);
                    if (Math.abs(y2 - y) >= 3 && y2 !== mid) p.block(left ? p.w - 2 - len + 1 : 3, y2, left ? p.w - 2 : 3 + len - 1, y2);
                }
            }
            return true;
        },
        // 기역자: 한쪽 모서리(드물게 마주 보는 두 모서리)를 막는다
        lshape(p, rng) {
            const mid = Math.ceil(p.h / 2);
            const maxTop = p.h - mid - 1; // 가운데 줄 위쪽으로 여유를 한 줄 남긴다
            const maxBot = mid - 2;
            if (p.w < 9 || maxTop < 1 || maxBot < 1) return false;
            const corner = (right, top) => {
                const bw = Rng.int(rng, Math.max(2, Math.floor(p.w / 4)), Math.max(2, Math.floor(p.w / 2) - 1));
                const bh = Rng.int(rng, Math.min(2, top ? maxTop : maxBot), top ? maxTop : maxBot);
                const x0 = right ? p.w - bw + 1 : 1;
                p.block(x0, top ? p.h - bh + 1 : 1, x0 + bw - 1, top ? p.h : bh);
            };
            const right = rng() < 0.5;
            const top = rng() < 0.5;
            corner(right, top);
            if (p.w >= 13 && p.h >= 8 && rng() < 0.25) corner(!right, !top);
            return true;
        },
        // 십자: 네 모서리를 막아 가운데 줄과 가운데 세로 줄만 남긴다
        cross(p, rng) {
            const mid = Math.ceil(p.h / 2);
            const bhMax = Math.min(p.h - mid - 1, mid - 2);
            if (p.w < 11 || bhMax < 1) return false;
            const bw = Rng.int(rng, 2, Math.floor(p.w / 2) - 2);
            const bh = Rng.int(rng, 1, bhMax);
            for (const right of [false, true]) for (const top of [false, true]) {
                const x0 = right ? p.w - bw + 1 : 1;
                p.block(x0, top ? p.h - bh + 1 : 1, x0 + bw - 1, top ? p.h : bh);
            }
            return true;
        },
        // 방 두 칸: 가운데쯤 세로 벽에 문(1~2칸)이 가운데 줄에 뚫려 있다 (+ 가끔 위나 아래에 작은 쪽문)
        chambers(p, rng) {
            if (p.w < 10 || p.h < 6) return false;
            const mid = Math.ceil(p.h / 2);
            const x = Math.ceil(p.w / 2) + Rng.int(rng, -1, 1);
            const g = Rng.int(rng, 1, 2);
            p.block(x, 1, x, p.h);
            for (let k = 0; k < g; k++) p.walls.delete(x + "," + (mid + k));
            if (p.h >= 8 && rng() < 0.4) p.walls.delete(x + "," + (rng() < 0.5 ? 1 : p.h));
            p.pillars(Rng.int(rng, 0, 2));
            return true;
        },
        // 옆 감실: 위·아래 벽에서 벽 조각이 튀어나와 움푹 들어간 자리(감실)가 줄지어 생긴다
        alcoves(p, rng) {
            if (p.w < 9 || p.h < 6) return false;
            const depthMax = Math.max(1, Math.floor((p.h - 4) / 2));
            for (const top of [false, true]) {
                if (rng() < 0.15) continue; // 한쪽만 감실인 방도 있다
                const t = Rng.int(rng, 1, depthMax);
                const bw = Rng.int(rng, 1, 2);
                const gap = Rng.int(rng, 2, 3);
