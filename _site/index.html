                for (let x = 3 + Rng.int(rng, 0, 2); x <= p.w - 2; x += bw + gap) {
                    p.block(x, top ? p.h - t + 1 : 1, Math.min(x + bw - 1, p.w - 2), top ? p.h : t);
                }
            }
            return true;
        },
        // 링: 가운데 벽 덩어리와 그 둘레를 도는 길
        ring(p, rng) {
            if (p.w < 11 || p.h < 6) return false;
            const bw = Rng.int(rng, 3, Math.min(p.w - 8, 6));
            const m = Math.max(Rng.int(rng, 1, p.h >= 9 ? 2 : 1), Math.ceil((p.h - 5) / 2)); // 둘레 길 너비. 덩어리 높이는 5 이하
            const cx = Math.ceil(p.w / 2) + Rng.int(rng, -1, 1);
            const x0 = Math.max(4, Math.min(cx - Math.floor(bw / 2), p.w - 3 - bw + 1));
            p.block(x0, 1 + m, x0 + bw - 1, p.h - m);
            return true;
        }
    };

    // 방에 나오는 적은 공방 데이터(EnemyData)에서 고른다: 층에 맞는 적들 중, 위험도(threat) 예산 안에서 무작위로.
    // 설명(note)의 "(2~3마리)" 같은 말은 무리 크기가 된다.
    // 몬스터 등급(공방 '등급'): 소형·중형은 일반 방의 주력, 대형은 방마다 한 마리까지 (정예 방의 대장), 보스는 우두머리 방에만 나온다.
    //   일반 방: 소형·중형 + 대형 최대 1  / 정예 방: 대장은 대형(없으면 중형), 곁에 소형·중형 최대 2
    //   우두머리 방: 대장은 보스(없으면 대형), 곁에 소형 최대 2 (없으면 중형)
    static BUDGET = { battle: [40, 4], elite: [22, 2] }; // [기본, 층(row)마다 +]
    static MAX_ENEMIES = 5; // 기준 방(RoomPlan.STYLE의 ref 면적)에서의 수. 방 면적에 따라 완만히 늘고 준다 (scale)

    // 예산 안에서 적 id 목록 (한 번에 무리 단위로 더한다)
    // grades: 나올 수 있는 등급들, maxLarge: 대형은 이 수까지만
    static pickEnemies(rng, floor, budget, maxCount = RoomPlan.MAX_ENEMIES, grades = ["small", "medium", "large"], maxLarge = 1) {
        const pool = RoomPlan.poolOf(floor, grades);
        const out = [];
        let spent = 0;
        let large = 0;
        for (let tries = 0; tries < 16 && out.length < maxCount && pool.length; tries++) {
            const r = Rng.pick(rng, pool);
            const n = Math.min(maxCount - out.length, Rng.int(rng, r.group[0], r.group[1]));
            if (r.grade === "large" && large + n > maxLarge) continue;
            const cost = r.threat * n;
            if (spent + cost > budget) continue;
            for (let i = 0; i < n; i++) out.push(r.id);
            if (r.grade === "large") large += n;
            spent += cost;
            if (spent >= budget * 0.8) break;
        }
        if (out.length) return out;
        const weakest = pool.slice().sort((a, b) => a.threat - b.threat)[0];
        return [weakest ? weakest.id : "rat"];
    }

    // 이 층에 나오는 적 중 등급이 grades 안인 것 (없으면 보스가 아닌 아무 적)
    static poolOf(floor, grades) {
        const all = EnemyData.at(floor);
        const pool = all.filter((r) => grades.includes(r.grade));
        return pool.length ? pool : all.filter((r) => r.grade !== "boss");
    }

    // 대장 후보: 등급 우선순위대로 처음으로 비지 않은 등급의 적들 (위험도 큰 순)
    static leadPool(floor, order) {
        const all = EnemyData.at(floor);
        for (const g of order) {
            const list = all.filter((r) => r.grade === g);
            if (list.length) return list.slice().sort((a, b) => b.threat - a.threat);
        }
        return all.slice().sort((a, b) => b.threat - a.threat);
    }

    // node: RunMap 칸, seed: 방 시드, state: 이미 다녀간 방의 기록 { cleared, used, sold:[…], extra } (없으면 처음 들어가는 방), floorNo: 층 번호
    constructor(node, seed, state = null, floorNo = 1) {
        this.node = node;
        this.seed = seed;
        this.floorNo = floorNo;
        this.state = state ?? {};
        this.type = node.type;
        this.rng = Rng.make(seed);
        const st = RoomPlan.STYLE[this.type];
        this.w = Rng.int(this.rng, st.w[0], st.w[1]);
        this.h = Rng.int(this.rng, st.h[0], st.h[1]);
        this.style = st;
        this.shape = "arena"; // 고른 구조 템플릿 이름
        const mid = Math.ceil(this.h / 2);
        this.entrance = { x: 1, y: mid };
        this.start = { x: 2, y: mid };
        this.exit = { x: this.w, y: mid };
        this.lv = 1 + Math.floor(node.row / 5) + (this.type === "boss" ? 1 : 0);
        this.walls = new Set(); // 안쪽 벽 타일(기둥·칸막이 …) "x,y"
        this.spawns = [];       // [{ type, x, y, data }]
        this.layout();
    }

    // 몬스터·주민 유무
    get combat() {
        return this.type === "battle" || this.type === "elite" || this.type === "boss";
    }

    // 방 전체 경계 (카메라용, 월드 단위). 타일 중심이 x*t라서 반 칸씩 넓힌다
    bounds(t) {
        return { minX: -t / 2, minY: -t / 2, maxX: (this.w + 1) * t + t / 2, maxY: (this.h + 1) * t + t / 2 };
    }

    inside(x, y) {
        return x >= 1 && x <= this.w && y >= 1 && y <= this.h;
    }

    isWall(x, y) {
        return !this.inside(x, y) || this.walls.has(x + "," + y);
    }

    // 면적에 따른 적 수·예산 배율 (기준 방 1.0, 완만히 0.8 ~ 1.35)
    get scale() {
        const ref = this.style.ref ?? this.w * this.h;
        return Math.max(0.8, Math.min(1.35, Math.sqrt(this.w * this.h / ref)));
    }

    // (x0,y0)~(x1,y1) 직사각형을 벽으로 (방 안쪽만)
    block(x0, y0, x1, y1) {
        for (let y = Math.max(1, y0); y <= Math.min(this.h, y1); y++) for (let x = Math.max(1, x0); x <= Math.min(this.w, x1); x++) this.walls.add(x + "," + y);
    }

    // 기둥 n개: 입구·출구 근처는 비우고, 놓아도 모든 바닥이 이어질 때만
    pillars(n) {
        const rng = this.rng;
        const reserved = this.reservedKeys();
        for (let tries = 0, added = 0; added < n && tries < 80; tries++) {
            const x = Rng.int(rng, 3, this.w - 2);
            const y = Rng.int(rng, 1, this.h);
            const k = x + "," + y;
            if (reserved.has(k) || this.walls.has(k)) continue;
            this.walls.add(k);
            if (this.connected()) added++;
            else this.walls.delete(k);
        }
    }

    // 늘 비워 둘 칸: 입구, 시작, 출구, 출구 옆
    reservedKeys() {
        return new Set([this.entrance, this.start, this.exit, { x: this.exit.x - 1, y: this.exit.y }].map((p) => p.x + "," + p.y));
    }

    // 벽이 아닌 칸 중 size x size 칸이 통째로 비어 있는 왼쪽 아래 칸들 (filter: 그 칸에서 시작하는 사각형을 거를 때)
    openSquares(size, filter = null) {
        const out = [];
        const reserved = this.reservedKeys();
        for (let y = 1; y + size - 1 <= this.h; y++) for (let x = 1; x + size - 1 <= this.w; x++) {
            let ok = true;
            for (let dy = 0; dy < size && ok; dy++) for (let dx = 0; dx < size && ok; dx++) {
                const k = (x + dx) + "," + (y + dy);
                if (this.walls.has(k) || reserved.has(k)) ok = false;
            }
            if (ok && (!filter || filter(x, y))) out.push({ x, y });
        }
        return out;
    }

    // 이 구조가 쓸 만한가: 길이 이어지고, 벽이 너무 많지 않고, 적(2x2 포함)·보상이 놓일 자리가 있다
    usable() {
        const reserved = this.reservedKeys();
        for (const k of reserved) if (this.walls.has(k)) return false;
        if (!this.connected()) return false;
        if (this.walls.size === 0) return true;
        if (this.walls.size > this.w * this.h * 0.3) return false;
        const half = Math.ceil(this.w / 2) + 1;
        const right = this.openSquares(1, (x) => x >= half).length;
        if (right < 8) return false; // 오른쪽 절반의 빈 칸 (적 자리)
        if (this.openSquares(2, (x) => x >= half - 1).length < 3) return false; // 큰 몬스터·우두머리 자리
        if (this.openSquares(1).length < 12) return false; // 보상 물건 자리
        return true;
    }

    layout() {
        const rng = this.rng;
        const reserved = this.reservedKeys();
        // 구조 템플릿: 시드로 하나 고르고, 쓸 만하지 않으면 다시 (끝내 안 되면 빈 아레나)
        const names = Object.keys(this.style.shapes);
        const bag = [];
        for (const n of names) for (let i = 0; i < this.style.shapes[n]; i++) bag.push(n);
        let ok = false;
        for (let tries = 0; tries < 12 && !ok; tries++) {
            this.walls.clear();
            this.shape = Rng.pick(rng, bag);
            ok = RoomPlan.SHAPES[this.shape](this, rng) !== false && this.usable();
        }
        if (!ok) { this.walls.clear(); this.shape = "arena"; }
        const free = [];
        for (let y = 1; y <= this.h; y++) for (let x = 1; x <= this.w; x++) {
            const k = x + "," + y;
            if (!this.walls.has(k) && !reserved.has(k)) free.push({ x, y });
        }
        const half = Math.ceil(this.w / 2) + 1;
        const right = Rng.shuffle(rng, free.filter((p) => p.x >= half));
        // 오른쪽 절반이 모자랄 때 쓸 자리: 나머지 칸 중 시작 칸에서 4칸 넘게 떨어진 곳
        const rest = Rng.shuffle(rng, free.filter((p) => p.x < half && Math.abs(p.x - this.start.x) + Math.abs(p.y - this.start.y) > 3));
        const center = { x: half, y: Math.ceil(this.h / 2) };
        // 적 놓을 자리. 오른쪽 절반(right)에서 먼저, 모자라면 나머지(rest)에서. 큰 적(2x2)은 비어 있는 size×size 칸을 통째로 쓴다
        const take = (list, size) => {
            if (size === 1) return list.pop();
            const open = new Set(list.map((p) => p.x + "," + p.y));
            for (let i = list.length - 1; i >= 0; i--) {
                const q = list[i];
                const cells = [];
                for (let dy = 0; dy < size; dy++) for (let dx = 0; dx < size; dx++) cells.push((q.x + dx) + "," + (q.y + dy));
                if (!cells.every((c) => open.has(c))) continue;
                for (const c of cells) { const k = list.findIndex((p) => p.x + "," + p.y === c); if (k >= 0) list.splice(k, 1); }
                return { x: q.x, y: q.y };
            }
            return null;
        };
        const place = (kind) => {
            const size = (Monster.KINDS[kind] && Monster.KINDS[kind].size) || 1;
            const at = take(right, size) ?? take(rest, size) ?? take(right, 1) ?? take(rest, 1);
            return at; // (자리가 정말 없으면 null → 그 적은 안 놓는다)
        };
        const put = (kind, data) => { const at = place(kind); if (at) this.spawns.push({ type: kind, x: at.x, y: at.y, data }); };
        const sc = this.scale;

        this.spawns.push({ type: "entrance", ...this.entrance }, { type: "exit", ...this.exit });
        const lv = this.lv;
        const floor = this.node.row + 1;
        // 소품(상인 등)에 넘기는 공통 데이터: 저장된 상태, 방 난수 씨, 층 번호
        const common = { extra: this.state.extra, seed: Rng.mix(this.seed, 4242), floor: this.floorNo };
        const done = !!this.state.cleared; // 이미 정리한 방은 적이 없다
        if (done && this.combat) {
            // 적 없음
        } else if (this.type === "battle") {
            const [base, per] = RoomPlan.BUDGET.battle;
            for (const kind of RoomPlan.pickEnemies(rng, floor, Math.floor((base + per * this.node.row) * sc), Math.round(RoomPlan.MAX_ENEMIES * sc))) put(kind, { lv });
        } else if (this.type === "elite") {
            const lead = Rng.pick(rng, RoomPlan.leadPool(floor, ["large", "medium", "small"]));
            put(lead.id, { lv, rank: "elite" });
            const [base, per] = RoomPlan.BUDGET.elite;
            for (const m of RoomPlan.pickEnemies(rng, floor, Math.floor((base + per * this.node.row) * sc), Math.round(2 * sc), ["small", "medium"], 0)) put(m, { lv });
        } else if (this.type === "boss") {
            const lead = Rng.pick(rng, RoomPlan.leadPool(floor, ["boss", "large", "medium", "small"]));
            const bigBoss = ((Monster.KINDS[lead.id] && Monster.KINDS[lead.id].size) || 1) > 1;
            const fixed = { x: this.w - 2, y: center.y };
            // 우두머리는 오른쪽 가운데. 기둥이 있거나 큰 몸이면 비어 있는 자리를 찾는다
            const fixedOk = !bigBoss && !this.isWall(fixed.x, fixed.y) && !reserved.has(fixed.x + "," + fixed.y);
            const bossAt = fixedOk ? fixed : place(lead.id) ?? fixed;
            if (fixedOk) { // 고정 자리는 곁의 적 후보에서 뺀다
                for (const list of [right, rest]) { const i = list.findIndex((q) => q.x === fixed.x && q.y === fixed.y); if (i >= 0) list.splice(i, 1); }
            }
            this.spawns.push({ type: lead.id, x: bossAt.x, y: bossAt.y, data: { lv, rank: "boss" } });
            for (const m of RoomPlan.pickEnemies(rng, floor, 40, Math.round(2 * sc), ["small"], 0)) {
                // 곁의 적은 서로·우두머리와 겹치지 않는 자리에 (뽑은 자리는 목록에서 뺀다)
                const at = take(right, 1) ?? take(rest, 1);
                if (at) this.spawns.push({ type: m, x: at.x, y: at.y, data: { lv } });
            }
        } else if (this.type === "shop") {
            const stock = RoomPlan.rollStock(rng, this.node.row);
            stock.forEach((offer, i) => { offer.sold = !!(this.state.sold && this.state.sold.includes(i)); }); // 이미 산 물건
            this.spawns.push({ type: "merchant", x: center.x, y: this.h, data: { name: Rng.pick(rng, Merchant.NAMES), stock, money: Rng.int(rng, 40, 90), ...common } });
        } else if (this.type === "rest") {
            this.spawns.push({ type: "campfire", x: center.x, y: center.y, data: { used: !!this.state.used } });
        }
        // (보물 방의 물건은 방을 만든 뒤 Run이 바닥에 놓는다: Run.spawnPickups)
    }

    // 입구 옆 시작 칸에서 모든 바닥 칸에 갈 수 있는가
    connected() {
        const seen = new Set([this.start.x + "," + this.start.y]);
        const queue = [this.start];
        while (queue.length) {
            const p = queue.shift();
            for (const [dx, dy] of Entity.DIRS) {
                const x = p.x + dx;
                const y = p.y + dy;
                const k = x + "," + y;
                if (seen.has(k) || this.isWall(x, y)) continue;
                seen.add(k);
                queue.push({ x, y });
            }
        }
        return seen.size === this.w * this.h - this.walls.size;
    }

    // ---------- ChunkManager 생성기 ----------
    fillTiles(chunk) {
        const n = chunk.manager.chunkSize;
        for (let ly = 0; ly < n; ly++) {
            for (let lx = 0; lx < n; lx++) {
                const x = chunk.cx * n + lx;
                const y = chunk.cy * n + ly;
                let tile = TileDef.VOID;
                if (x >= 0 && x <= this.w + 1 && y >= 0 && y <= this.h + 1) tile = this.isWall(x, y) ? this.style.wall : this.style.floor;
                chunk.tiles[ly * n + lx] = tile;
            }
        }
    }

    populate(chunk) {
        const n = chunk.manager.chunkSize;
        const list = [];
        for (const s of this.spawns) {
            if (Math.floor(s.x / n) !== chunk.cx || Math.floor(s.y / n) !== chunk.cy) continue;
            list.push(EntityTypes.create(s.type, s.x, s.y, s.data ?? {}));
        }
        return list;
    }

    // ---------- 상점 물건 ----------
    // 행동 카드 6장 (보상 풀에서). 값은 카드마다 정해진 값 ±10%
    static rollStock(rng, row) {
        const stock = [];
        for (const card of Rewards.cards(rng, 6, "shop")) stock.push({ card, price: Math.max(1, Math.floor(Rewards.cardPrice(card) * (0.9 + rng() * 0.2))) });
        for (const card of Rewards.gear(rng, 2, "shop")) stock.push({ card, price: Math.max(1, Math.floor(Rewards.cardPrice(card) * (0.9 + rng() * 0.2))) });
        return stock;
    }
}

// 보상 굴리기 (전투 보상, 상점, 보물). 카드는 공방 데이터의 보상(reward) 카드들 중에서 (기본 카드와 강화 카드는 안 나온다)
class Rewards {
    // 보상에 나오는 행동 카드 id들
    static pool() {
        return [...CardDef.defs.values()].filter((d) => d.kind === "reward" && d.type === "skill" && !d.upgradeKey).map((d) => d.id);
    }

    // 카드 희귀도 무게 (카드가 나오는 곳마다 다르다): 전투 보상은 흔한 카드가 많고, 정예·보물은 귀한 카드 비중이 높다
    static CARD_WEIGHTS = {
        battle: { common: 60, uncommon: 30, rare: 10 },
        elite: { common: 40, uncommon: 40, rare: 20 },
        shop: { common: 55, uncommon: 33, rare: 12 },
        treasure: { common: 30, uncommon: 45, rare: 25 }
    };

    // 서로 다른 카드 n장 (희귀도 무게대로 뽑는다)
    static cards(rng, n, where = "battle") {
        const w = Rewards.CARD_WEIGHTS[where] ?? Rewards.CARD_WEIGHTS.battle;
        const pool = Rewards.pool().map((id) => ({ id, w: w[CardDef.get(id).rarity] ?? w.common }));
        const out = [];
        for (let k = 0; k < n && pool.length; k++) {
            let roll = rng() * pool.reduce((s, c) => s + c.w, 0);
            let i = 0;
            for (; i < pool.length - 1; i++) {
                roll -= pool[i].w;
                if (roll < 0) break;
            }
            out.push(pool.splice(i, 1)[0].id);
        }
        return out.map((id) => Card.create(id, rng));
    }

    // 장비 희귀도 무게 (장비가 나오는 곳마다 다르다)
    static GEAR_WEIGHTS = {
        shop: { common: 5, uncommon: 3, rare: 1 },
        elite: { common: 2, uncommon: 3, rare: 2 },
        treasure: { common: 2, uncommon: 3, rare: 2 },
        boss: { rare: 3, boss: 3 }
    };

    // 장비 카드 n장 (서로 다른 것, 이미 가진 것(owned: 장비 id들)은 뺀다). 무게는 희귀도별
    static gear(rng, n, where = "shop", owned = []) {
        const weights = Rewards.GEAR_WEIGHTS[where];
        const pool = [...CardDef.defs.values()].filter((d) => d.gear && weights[d.rarity] && !owned.includes(d.id));
        const out = [];
        for (let k = 0; k < n && pool.length; k++) {
            let roll = rng() * pool.reduce((s, d) => s + weights[d.rarity], 0);
            let i = 0;
            for (; i < pool.length - 1; i++) {
                roll -= weights[pool[i].rarity];
                if (roll < 0) break;
            }
            out.push(new Card(pool.splice(i, 1)[0].id));
        }
        return out;
    }

    static cardPrice(card) {
        return card.def.price ?? 50;
    }

    // 전투 보상: 돈 + 카드 3장 중 하나
    // 정예는 장비도 하나 준다 (owned: 이미 가진 장비 id들)
    static battle(rng, type, row, owned = []) {
        const elite = type === "elite";
        const gold = elite ? Rng.int(rng, 28, 40) : Rng.int(rng, 12, 20);
        return { gold, cards: Rewards.cards(rng, 3, elite ? "elite" : "battle"), items: elite ? Rewards.gear(rng, 1, "elite", owned) : [] };
    }

    // 보물 상자: 돈 + 카드 3장 중 하나 + 장비 하나
    static treasure(rng, row, owned = []) {
        const gold = Rng.int(rng, 30, 50);
        return { gold, cards: Rewards.cards(rng, 3, "treasure"), items: Rewards.gear(rng, 1, "treasure", owned) };
    }

    // 우두머리: 돈 + 장비 하나
    static boss(rng, row, owned = []) {
        return { gold: Rng.int(rng, 60, 90), cards: [], items: Rewards.gear(rng, 1, "boss", owned) };
    }
}

/* ===== assets/dat/run/Run.js ===== */
// 런 하나 (던전 3층, 층마다 우두머리). 아이작식: 한 층은 격자로 이어진 방들이고, 시작 방에서 출발해 지도에서 갈 방을 고르며 탐색한다.
//   지도(MapScreen) → 방 입장(enter) → 전투·거래·휴식 → 적을 다 쓰러뜨리면 출구가 열리고 보상(RewardDialog) → 출구(leaveRoom) → 지도 …
// 지도에는 가 본 방과 그 옆 방만 보이고 (RunMap.choices), 보인 방은 어디든 다시 갈 수 있다. 정리한 방은 적이 없고, 쓴 휴식·상자·산 물건은 그대로다 (rooms).
// 우두머리를 쓰러뜨리면 지도에서 [다음 층으로] 내려갈 수 있다 (descend). 남은 방을 더 둘러봐도 된다. 마지막 층 우두머리를 쓰러뜨리고 나가면 이긴다.
// 방은 들어갈 때마다 새로 만들고(RoomPlan + ChunkManager), 나가면 버린다. 저장은 방 사이에서만 한다 (방 안에서 끄면 그 방에 다시 들어간다).
// 모든 무작위는 런 시드에서 나온다: 지도, 방 모양·적·상점 물건, 보상, 덱 섞기(room 마다), 전투 중 무작위(room.rng).
// 그래서 방 안에서 새로고침하면 그 방에 처음 들어온 때와 똑같이 다시 시작한다.
// 쓰러지면 런이 끝나고 저장본이 지워진다. 우두머리를 쓰러뜨리면 이긴다.
class Run extends Component {
    static OPENING_HAND = 3; // 전투방에 들어가면 뽑는 처음 패
    static ROOM_MANA = 5;    // 전투방에 들어갈 때 차는 마나
    static REMOVE_BASE = 50; // 상점 카드 빼기 값: 한 상점에서 뺄 때마다 +25 (50 → 75 → 100 …), 다른 상점에 가면 다시 50

    // options: { engine, player, queue, follow(CameraFollow), meta: { seed, debug }, save }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.queue = options.queue;
        this.follow = options.follow;
        this.seed = options.meta.seed;
        this.debug = !!options.meta.debug;
        this.floorNo = 1;      // 지금 층 (1~RunMap.FLOORS)
        this.map = new RunMap(this.seed, 1);
        this.rooms = {};       // 이 층에서 다녀간 방의 기록 id → { cleared, used, sold:[…], taken:[…], left }
        this.taken = new Set(); // 지금 방에서 이미 가진 바닥의 것들 (Pickup key)
        Pickups.run = this;
        this.current = null;   // 마지막으로 들어간(끝낸) 칸 id
        this.visited = [];     // 이 층에서 가 본 칸 id들
        this.pending = null;   // 고르고 아직 못 끝낸 칸 (방 안에서 저장하고 껐을 때 다시 들어간다)
        this.removeCount = 0;  // 이 상점에서 카드 빼기를 한 횟수 (값이 오른다, 방에 들어갈 때 0)
        this.room = null;      // 지금 방 (ChunkManager)
        this.plan = null;      // 지금 방 설계도
        this.node = null;      // 지금 방의 칸
        this.cleared = false;
        this.state = "map";    // map | room | over | won
        this.ui = {};          // { map, reward, shop, rest, end } — main.js가 채운다
        this.view = Run.worldView(this);
        if (options.save) this.load(options.save);
    }

    // TurnManager·UI가 들고 있는 world: 지금 방(ChunkManager)으로 이어진다. 방이 바뀌어도 그대로 쓴다
    static worldView(run) {
        return new Proxy({}, {
            get(t, key) {
                const room = run.room;
                if (key === "run") return run;
                if (!room) return key === "tileSize" ? 16 : key === "hostiles" ? () => [] : undefined;
                const value = room[key];
                return typeof value === "function" ? value.bind(room) : value;
            },
            set(t, key, value) {
                if (run.room) run.room[key] = value;
                return true;
            }
        });
    }

    get floor() {
        return this.floorNo;
    }

    // 방마다 다른 숫자 (시드 섞기용). 층과 방 번호
    salt(node) {
        return this.floorNo * 1000 + node.col + 1;
    }

    // 이 층의 우두머리를 쓰러뜨렸는가
    get bossCleared() {
        const b = this.map.boss;
        return !!(b && this.rooms[b.id] && this.rooms[b.id].cleared);
    }

    // 지도에서 다음 층으로 내려갈 수 있는가 (우두머리를 쓰러뜨렸고 마지막 층이 아니다)
    get canDescend() {
        return this.state === "map" && this.bossCleared && this.floorNo < RunMap.FLOORS;
    }

    // 카드 빼기 값
    get removeCost() {
        return Run.REMOVE_BASE + 25 * this.removeCount;
    }

    // 지금 고를 수 있는 칸들
    choices() {
        return this.state === "map" ? this.map.choices(this.current, this.visited) : [];
    }

    // 게임 시작: 저장본에 못 끝낸 방이 있으면 그 방으로, 아니면 지도
    begin() {
        if (this.pending) this.enter(this.pending, true);
        else if (!this.visited.length) {
            this.enter(this.map.start.id, true); // 새 층: 시작 방에서
        }
        else this.showMap();
    }

    showMap() {
        this.state = "map";
        if (this.ui.map) this.ui.map.open(true);
    }

    // 방 들어가기
    enter(id, resumed = false) {
        const node = this.map.get(id);
        if (!node) return false;
        if (!resumed && !this.choices().some((n) => n.id === id)) return false;
        if (this.ui.map) this.ui.map.close();
        this.pending = id;
        this.node = node;
        this.cleared = false;
        this.state = "room";
        this.save();

        this.removeCount = 0; // 카드 빼기 값은 상점마다 처음부터
        // 이전 방을 버리고 새 방
        const player = this.player;
        if (this.room) {
            if (player.world === this.room) this.room.removeEntity(player);
            this.room.gameObject.destroy();
        }
        const salt = this.salt(node);
        const known = this.rooms[id] ?? null;
        this.taken = new Set(known && known.taken ? known.taken : []);
        const plan = new RoomPlan(node, Rng.mix(this.seed, salt), known, this.floorNo);
        this.plan = plan;
        const room = new ChunkManager({ chunkSize: 16, tileSize: 16, renderDistance: 48, generator: plan });
        room.plan = plan;
        room.rng = Rng.make(Rng.mix(this.seed, 11000 + salt));          // 전투 중 무작위 (무작위 대상, 바위 던지기 …)
        player.cards.rng = Rng.make(Rng.mix(this.seed, 9000 + salt));   // 덱 섞기
        const go = new GameObject("room " + id);
        go.addComponent(room);
        this.engine.add(go);
        room.loadAround(plan.start.x, plan.start.y);
        this.room = room;

        player.x = plan.start.x;
        player.y = plan.start.y;
        player.flipX = false;
        room.addEntity(player);
        room.focus = player;
        player.sync();
        player.applyFlip();
        player.enterRoom();
        this.exit = room.entitiesAt(plan.exit.x, plan.exit.y).find((e) => e instanceof Exit) ?? null;

        const info = RunMap.TYPES[node.type];
        MessageLog.add(`${this.floorNo}층 · ${info.name}`, info.color);
        if (plan.combat && known && known.cleared) {
            // 이미 정리한 방: 적 없이 출구가 열려 있다
            this.cleared = true;
            if (this.exit) this.exit.setOpen(true);
            MessageLog.add("이미 정리한 방이다", "#a0d0a0");
            this.spawnPickups(this.rewardItems(), true); // 못 가진 보상이 남아 있으면 그대로 바닥에
        } else if (plan.combat) {
            player.mana = Math.min(player.maxMana, player.mana + Run.ROOM_MANA);
            player.cards.resetForRoom(Run.OPENING_HAND);
            Equip.roomStart(player, room); // 장착한 장비 (철모, 마력석 마법서 …)
            MessageLog.add(node.type === "boss" ? "우두머리다! 쓰러뜨리면 다음 층으로 내려갈 수 있다" : "적을 모두 쓰러뜨리면 출구가 열린다", "#e8b860");
        } else {
            this.cleared = true;
            if (this.exit) this.exit.setOpen(true);
            MessageLog.add({ shop: "상인이 있다. 말을 걸어 보자 (탭하면 걸어간다)", rest: "모닥불이 있다. 한 번 쉴 수 있다", treasure: "보물 상자가 있다!", start: "던전의 시작이다. 출구로 나가 지도에서 갈 방을 고르자" }[node.type] ?? "", "#a0d0f0");
        }
        if (node.type === "treasure") this.spawnPickups(this.rewardItems(), true); // 보물 방: 물건이 바닥에 놓여 있다
        if (node.type === "shop") this.spawnPickups(this.shopItems(), false);    // 상점: 진열대
        EnemyMoves.planAll(room, player, 0); // 적의 첫 의도
        this.fitCamera(true);
        Events.emit(GameEvent.ROOM_ENTERED, { node, room });
        return true;
    }

    // 출구로 나가기 (열린 출구를 쓰면 Exit.interact가 부른다)
    leaveRoom() {
        if (!this.cleared || this.state !== "room") return false;
        const node = this.node;
        this.rooms[node.id] = this.captureRoom();
        this.current = node.id;
        if (!this.visited.includes(node.id)) this.visited.push(node.id);
        this.pending = null;
        if (node.type === "boss" && this.floorNo >= RunMap.FLOORS) return this.end(true); // 마지막 층 우두머리: 이겼다
        this.save();
        this.showMap();
        return true;
    }

    // 지금 방의 기록 (나갈 때 남긴다): 정리했는가, 휴식·상자를 썼는가, 산 물건
    captureRoom() {
        const st = { ...(this.rooms[this.node.id] ?? {}) };
        if (this.plan.combat && this.cleared) st.cleared = true;
        for (const e of this.room.actors) {
            if (e instanceof Merchant) {
                st.sold = e.stock.map((o, i) => (o.sold ? i : -1)).filter((i) => i >= 0);
                st.shopLeft = e.stock.some((o) => !o.sold); // 아직 안 산 물건이 있다
            }
        }
        // roomState()를 가진 엔티티(방에 하나뿐)가 남기는 상태 → extra
        const holders = new Set(this.room.actors);
        for (const s of this.plan.spawns) for (const e of this.room.entitiesAt(s.x, s.y)) holders.add(e);
        for (const e of holders) if (typeof e.roomState === "function") { st.extra = e.roomState(); break; }
        // 바닥에 남은 것 (가진 건 taken). 남았으면 지도에 느낌표
        st.taken = [...this.taken];
        st.left = [...this.room.hazards].filter((h) => h instanceof Pickup).length;
        delete st.reward;
        for (const s of this.plan.spawns) {
            if (s.type !== "campfire" && s.type !== "treasure") continue;
            for (const e of this.room.entitiesAt(s.x, s.y)) if ((e instanceof Campfire && e.used) || (e instanceof TreasureChest && e.opened)) st.used = true;
        }
        return st;
    }

    // 지도에 "아직 뭔가 있다" 표시를 할 방인가: 못 받은 보상, 안 연 상자, 안 쓴 모닥불, 안 산 물건이 남은 상점 (가 본 방만)
    roomPending(id) {
        const st = this.rooms[id];
        if (!st) return false;
        if (st.left > 0) return true;
        return this.map.get(id).type === "rest" && !st.used;
    }

    // 그 층의 시작 방으로 (디버그: 우두머리를 안 잡아도, 층을 건너뛰어도 된다)
    gotoFloor(n) {
        this.floorNo = Math.max(1, Math.min(RunMap.FLOORS, n));
        this.map = new RunMap(this.seed, this.floorNo);
        this.rooms = {};
        this.visited = [];
        this.current = null;
        this.pending = null;
        this.state = "map";
        this.enter(this.map.start.id, true);
    }

    // 다음 층으로 (지도에서 [다음 층으로])
    descend() {
        if (!this.canDescend) return false;
        this.floorNo++;
        this.map = new RunMap(this.seed, this.floorNo);
        this.rooms = {};
        this.visited = [];
        this.current = null;
        this.pending = null;
        MessageLog.add(`${this.floorNo}층으로 내려왔다`, "#f0d878");
        this.enter(this.map.start.id, true);
        return true;
    }

    // 이미 가진 장비 id들 (보상에 같은 장비가 또 나오지 않게)
    ownedGear() {
        return this.player.cards.hand.filter((c) => c.def.gear).map((c) => c.defId);
    }

    // ---------- 바닥에 떨어진 것들 (아이작식) ----------
    // 이 방의 보상 물건들 (시드로 굴려서 다시 들어와도 같다). 보물 방은 처음부터, 전투방은 정리했을 때
    rewardItems() {
        const node = this.node;
        const salt = this.salt(node);
        const own = this.ownedGear();
        let r;
        if (node.type === "treasure") r = Rewards.treasure(Rng.make(Rng.mix(this.seed, 7000 + salt)), node.row, own);
        else if (node.type === "boss") r = Rewards.boss(Rng.make(Rng.mix(this.seed, 5000 + salt)), node.row, own);
        else r = Rewards.battle(Rng.make(Rng.mix(this.seed, 5000 + salt)), node.type, node.row, own);
        const items = [];
        if (r.gold) items.push({ key: "gold", kind: "gold", gold: r.gold });
        r.cards.forEach((c, i) => items.push({ key: "c" + i, kind: "card", card: c, group: "cards" })); // 카드 3장 중 하나
        r.items.forEach((c, i) => items.push({ key: "g" + i, kind: "gear", card: c }));
        return items;
    }

    // 상점 진열대: 안 팔린 물건마다 값표
    shopItems() {
        const m = [...this.room.actors].find((e) => e instanceof Merchant);
        if (!m) return [];
        return m.stock.map((o, i) => ({ key: "s" + i, kind: "card", card: o.card, price: o.price, offer: o })).filter((it) => !it.offer.sold);
    }

    // 정리한 방의 바닥에 보상을 떨어뜨린다
    dropRewards() {
        this.spawnPickups(this.rewardItems(), true);
        MessageLog.add("보상이 바닥에 떨어졌다. 물건 위에 올라서서 상호작용(손 버튼)으로 가져가자 (지나가기만 하면 줍지 않는다, 카드는 하나만)", "#f0d878");
    }

    // 놓을 자리: scatter면 방 가운데 근처에 흩어 놓고 (출구로 가는 가운데 줄은 되도록 피한다), 아니면 상점 진열대 두 줄
    pickupSpots(n, scatter) {
        const plan = this.plan;
        const room = this.room;
        const mid = plan.entrance.y;
        const bad = new Set([plan.entrance, plan.start, plan.exit, { x: plan.exit.x - 1, y: plan.exit.y }].map((p) => p.x + "," + p.y));
        const free = (x, y) => !plan.isWall(x, y) && !bad.has(x + "," + y) && room.entitiesAt(x, y).length === 0;
        const out = [];
        if (!scatter) {
            for (const y of [mid - 1, mid + 1]) for (let x = 2; x <= plan.w - 1; x += 2) if (free(x, y)) out.push({ x, y });
            return out.slice(0, n);
        }
        const cx = (plan.w + 1) / 2;
        const cy = (plan.h + 1) / 2;
        const tiles = [];
        for (let y = 1; y <= plan.h; y++) for (let x = 1; x <= plan.w; x++) if (free(x, y)) tiles.push({ x, y, d: Math.abs(x - cx) + Math.abs(y - cy) + (y === mid ? 3 : 0) });
        tiles.sort((a, b) => a.d - b.d || a.x - b.x || a.y - b.y);
        for (const t of tiles) if (out.length < n && out.every((o) => Math.abs(o.x - t.x) + Math.abs(o.y - t.y) >= 2)) out.push(t); // 서로 한 칸 이상 띄운다
        for (const t of tiles) if (out.length < n && !out.includes(t)) out.push(t);
        return out;
    }

    // items를 바닥에 놓는다 (이미 가진 key는 빼고, 한 묶음에서 이미 가졌으면 그 묶음 전체를 뺀다)
    spawnPickups(items, scatter) {
        const left = items.filter((it) => !this.taken.has(it.key) && !(it.group && items.some((o) => o.group === it.group && this.taken.has(o.key))));
        const spots = this.pickupSpots(left.length, scatter);
        left.forEach((it, i) => {
            if (spots[i]) this.room.spawn(new Pickup(spots[i].x, spots[i].y, { item: it }));
        });
    }

    // 런 끝 (won: 우두머리를 쓰러뜨렸다)
    end(won) {
        if (this.state === "over" || this.state === "won") return;
        this.state = won ? "won" : "over";
        RunStore.clear();
        Events.emit(GameEvent.RUN_ENDED, { won, floor: this.floor });
        if (this.ui.end) this.ui.end.open(won, this);
        return true;
    }

    update() {
        if (!this.started) {
            if (!this.ui.map || !this.ui.map.root) return; // UI가 아직 안 만들어졌다
            this.started = true;
            this.begin();
        }
        if (this.state !== "room" || !this.room) return;
        const p = this.player;
        if (!p.alive) {
            if (!this.queue.busy) this.end(false);
            return;
        }
        this.fitCamera();
        // 적을 모두 쓰러뜨렸다: 출구가 열리고 보상
        if (!this.cleared && this.plan.combat && !this.queue.busy && this.room.hostiles(p).length === 0) {
            this.cleared = true;
            if (this.exit) this.exit.setOpen(true);
            Events.emit(GameEvent.ROOM_CLEARED, { node: this.node, room: this.room });
            if (this.node.type === "boss") {
                const last = this.floorNo >= RunMap.FLOORS;
                MessageLog.add(last ? "우두머리를 쓰러뜨렸다! 출구로 나가면 던전을 클리어한다" : "우두머리를 쓰러뜨렸다! 남은 방을 둘러봐도 되고, 지도에서 다음 층으로 내려갈 수 있다", "#f0d878");
                this.rooms[this.node.id] = this.captureRoom(); // 우두머리 처치를 바로 기록 (지도에서 내려갈 수 있게)
                this.dropRewards();
                return;
            }
            MessageLog.add("방을 정리했다. 출구가 열렸다", "#a0d0a0");
            this.dropRewards();
        }
    }

    // ---------- 카메라 ----------
    // 방 전체가 화면(위 HUD와 아래 패 사이)에 들어오게 배율과 위치를 맞춘다. 크기가 바뀔 때만 (force면 늘)
    fitCamera(force = false) {
        if (!this.plan) return;
        const e = this.engine;
        const key = e.canvas.width + "x" + e.canvas.height;
        if (!force && key === this._fitKey) return;
        this._fitKey = key;
        const s = e.uiRoot.scale;
        const W = e.canvas.width;
        const H = e.canvas.height;
        const top = Run.TOP_RESERVE * s;
        const bottom = (typeof HandBar !== "undefined" ? HandBar.HEIGHT : 150) * s;
        const t = 16;
        const roomW = (this.plan.w + 2) * t;
        const roomH = (this.plan.h + 2) * t;
        const avail = Math.max(H * 0.35, H - top - bottom);
        // 도트가 깨지지 않게 배율은 정수(화면 픽셀 기준)로 내린다. 방이 한 배에도 안 들어가는 아주 작은 화면만 소수 배율
        const fit = Math.min(W / roomW, avail / roomH);
        const whole = Math.floor(fit);
        // (정수로 내리면 방이 70%도 안 차는 낮은 해상도 화면은 어쩔 수 없이 소수 배율)
        const z = whole >= 1 && whole / fit >= 0.7 ? whole : Math.max(0.5, fit * 0.96);
        Camera.main.setPixelZoom(z);
        const cx = (this.plan.w + 1) * t / 2;
        const cy = (this.plan.h + 1) * t / 2;
        const availCenter = top + avail / 2; // 화면 위에서부터 (기기 픽셀)
        const shift = (H / 2 - availCenter) / z;
        this.follow.follow = false;
        this.follow.bounds = null;
        this.follow.transform.setPosition(cx, cy - shift);
    }

    static TOP_RESERVE = 64; // 위 HUD가 차지하는 높이 (UI 단위)

    // ---------- 저장 ----------
    snapshot() {
        return {
            version: RunStore.VERSION, seed: this.seed, debug: this.debug,
            floorNo: this.floorNo, rooms: this.rooms,
            current: this.current, visited: this.visited, pending: this.pending, removeCount: this.removeCount,
            player: this.player.save()
        };
    }

    save() {
        if (this.state === "over" || this.state === "won") return false;
        return RunStore.save(this.snapshot());
    }

    load(data) {
        this.floorNo = data.floorNo ?? 1;
        this.map = new RunMap(this.seed, this.floorNo);
        this.rooms = data.rooms ?? {};
        this.current = data.current ?? null;
        this.visited = data.visited ?? [];
        this.pending = data.pending ?? null;
        this.removeCount = data.removeCount ?? 0;
        this.player.load(data.player);
    }
}

/* ===== assets/dat/run/UpgradeFlow.js ===== */
// 카드 강화 흐름 (모닥불·상인이 같이 쓴다). 담당: UpgradeFlow 에이전트가 채운다.
// 강화 색: red 붉은 · blue 푸른 · yellow 노란 (쉬움), green 초록 · purple 보라 (어려움).
// 계약 (다른 코드가 이 모양으로 부른다):
//   UpgradeFlow.COLORS[key] = { name: "붉은", css: "#e8584a", hard: false }
//   UpgradeFlow.EASY = ["red","blue","yellow"], UpgradeFlow.HARD = ["green","purple"]
//   UpgradeFlow.candidates(player, colors = null) → 그 색(null이면 아무 색) 강화를 지금 받을 수 있는 행동 카드들 (Card[])
//   UpgradeFlow.open({ colors = null, title = "강화", onDone = null })
//       ① Game.deckView로 카드를 먼저 고른다(colors가 있으면 그 색 강화를 받을 카드만)
//       ② 강화 선택 창(UpgradeOptionDialog): 지금 카드 + 그 카드가 받을 수 있는 강화들(colors가 있으면 그 색만)을 현재→강화 후로 비교해 보이고, 하나 골라 [강화한다]. 하나뿐이어도 확인을 거친다.
//       상점용: shop = { prices: { 색: 값 }, sold: { 색: true }, money: 숫자 또는 () => 숫자, note }. prices에 있는 색(품절 아님)만 고를 수 있고 값이 보인다.
//       그 밖의 색은 흐리게 "이 상점에서는 팔지 않는다"/"품절"로 보이기만 한다. 카드 후보도 파는 색을 받을 수 있는 것만. 확정 버튼은 값을 보이고 돈이 모자라면 꺼진다.
//       바꿨으면 onDone(바뀐 Card, 고른 색 키), 취소하거나 후보가 없으면 onDone(null). 부르는 쪽은 onDone(card)일 때만 값·기회를 쓴다.
class UpgradeFlow {
    static COLORS = {
        red: { name: "붉은", css: "#e8584a", hard: false },
        blue: { name: "푸른", css: "#58a0f0", hard: false },
        yellow: { name: "노란", css: "#f0d040", hard: false },
        green: { name: "초록", css: "#5cc86c", hard: true },
        purple: { name: "보라", css: "#b078e0", hard: true }
    };
    static EASY = ["red", "blue", "yellow"];
    static HARD = ["green", "purple"];

    // 그 카드가 지금 받을 수 있는 강화들 (변형 키가 colors 안인 것. null이면 전부)
    static optionsOf(card, colors = null) {
        return GameContent.upgradesOf(card.defId).filter((d) => !colors || colors.includes(d.upgradeKey));
    }

    static candidates(player, colors = null) {
        return player.cards.allActions.filter((c) => UpgradeFlow.optionsOf(c, colors).length > 0);
    }

    // 제목: 색이 하나면 그 색 이름을 앞에 붙인다 ("붉은 강화")
    static headline(title, colors) {
        const base = title.split(" · ")[0];
        const c = colors && colors.length === 1 ? UpgradeFlow.COLORS[colors[0]] : null;
        return c ? `${c.name} ${base}` : base;
    }

    // deckView.pick에 "취소" 알림을 덧붙인다 (그만두기·닫기·Esc로 닫히면 onCancel)
    static pick(deckView, title, cards, onPick, onCancel) {
        let picked = false;
        const release = () => delete deckView.close;
        const orig = deckView.close.bind(deckView);
        deckView.close = () => {
            release();
            orig();
            Promise.resolve().then(() => { if (!picked) onCancel(); });
        };
        deckView.pick(title, cards, (card) => {
            picked = true;
            onPick(card);
        });
    }

    // 카드 먼저 → 그 카드의 강화 전부와 바뀌는 효과 보기 → 하나 고르기 → [강화한다].
    // 강화 선택 창에서 [뒤로]는 카드 고르기로, 닫기·배경·Esc는 취소(onDone(null)).
    static open({ colors = null, title = "강화", onDone = null, shop = null } = {}) {
        const done = (card, color = null) => { if (onDone) onDone(card, color); };
        if (shop) colors = UpgradeFlow.shopColors(shop);
        const cards = UpgradeFlow.candidates(Game.player, colors);
        if (cards.length === 0) {
            MessageLog.add("강화할 수 있는 카드가 없다", "#c8b890");
            return done(null);
        }
        const head = UpgradeFlow.headline(title, colors);
        const first = title.includes("카드를 고른다") ? (colors && colors.length === 1 ? `${UpgradeFlow.COLORS[colors[0]].name} ${title}` : title) : `${head} · 카드를 고른다`;
        const choose = () => {
            UpgradeFlow.pick(Game.deckView, first, cards, (card) => {
                const opts = UpgradeFlow.optionsOf(card, shop ? null : colors);
                if (opts.length === 0 || (shop && UpgradeFlow.optionsOf(card, colors).length === 0)) return done(null);
                UpgradeFlow.optionDialog().open(card, opts, {
                    title: `${head} · 무엇이 바뀌나`,
                    shop,
                    onApply: (def) => UpgradeFlow.apply(card, def, (c) => done(c, def.upgradeKey)),
                    onBack: choose,
                    onCancel: () => done(null)
                });
            }, () => done(null));
        };
        choose();
    }

    // 상점이 지금 파는 색들 (값이 있고 품절 아닌 것)
    static shopColors(shop) {
        return Object.keys(shop.prices).filter((k) => !(shop.sold && shop.sold[k]));
    }

    // 강화 적용: 정의를 바꾸고 비용 경우를 다시 정한다
    static apply(card, def, done) {
        const before = card.name;
        card.defId = def.id;
        card.rollCost();
        Game.player.cards._changed();
        MessageLog.add(`${before} → ${card.name} 강화했다`, "#f0c080");
        done(card);
    }

    // 강화 선택 창 (처음 필요할 때 만든다)
    static optionDialog() {
        const deckView = Game.deckView;
        if (!UpgradeFlow._dialog || UpgradeFlow._dialog.engine !== deckView.engine) {
            UpgradeFlow._dialog = deckView.gameObject.addComponent(new UpgradeOptionDialog({ engine: deckView.engine }));
        }
        return UpgradeFlow._dialog;
    }

    // ---------- 바뀌는 효과 비교 ----------
    // 강조 글자색 키 (CardText.STATS에 올려 [[upnew:글]]로 칠한다)
    static ensureKeys() {
        if (!CardText.STATS.upnew) CardText.STATS.upnew = { name: "강화", light: "#ffdc50", dark: "#a06000" };
    }

    // 설명글을 낱말로: [{ w, key, sp }] (sp: 앞에 공백이 있었나). [[키:글]] 안의 글도 낱말로 나누고 키를 달고 간다
    static tokens(line) {
        const out = [];
        const re = /\[\[(\w+):([^\]]*)\]\]/g;
        let sp = false;
        const add = (text, key) => {
            for (const part of text.split(/(\s+)/)) {
                if (part === "") continue;
                if (/^\s+$/.test(part)) sp = true;
                else {
                    out.push({ w: part, key, sp });
                    sp = false;
                }
            }
        };
        let last = 0;
        let m;
        while ((m = re.exec(line))) {
            add(line.slice(last, m.index), null);
            add(m[2], m[1]);
            last = re.lastIndex;
        }
        add(line.slice(last), null);
        return out;
    }

    // 최장 공통 부분열로 짝을 맞춘다: 같은 항목끼리의 [i, j] 목록
    static lcs(a, b, same) {
        const n = a.length, m = b.length;
        const t = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
        for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) t[i][j] = same(a[i], b[j]) ? t[i + 1][j + 1] + 1 : Math.max(t[i + 1][j], t[i][j + 1]);
        const pairs = [];
        let i = 0, j = 0;
        while (i < n && j < m) {
            if (same(a[i], b[j])) pairs.push([i++, j++]);
            else if (t[i + 1][j] >= t[i][j + 1]) i++;
            else j++;
        }
        return pairs;
    }

    // 낱말을 다시 글로. mark(i)가 참인 낱말은 강조색으로
    // plain이면 그대로인 낱말의 색 표시를 벗겨 강조가 돋보이게 한다
    static render(toks, mark, plain = false) {
        return toks.map((t, i) => {
            const body = mark(i) ? `[[upnew:${t.w}]]` : t.key && !plain ? `[[${t.key}:${t.w}]]` : t.w;
            return (i > 0 && t.sp ? " " : "") + body;
        }).join("");
    }

    // 현재 효과글 → 강화 후 효과글 비교. 반환: { lines: [{ text, kind: "same"|"changed"|"added" }], removed: [글…] }
    //   같은 줄: 색 표시를 벗기고 흐리게 / 바뀐 줄: 달라진 낱말만 강조 / 새 줄: 낱말 전부 강조 / 없어진 줄: removed
    static diff(oldText, newText) {
        UpgradeFlow.ensureKeys();
        const A = String(oldText ?? "").split("\n").filter((l) => l.trim() !== "");
        const B = String(newText ?? "").split("\n").filter((l) => l.trim() !== "");
        const P = (l) => CardText.strip(l).trim();
        const anchors = UpgradeFlow.lcs(A, B, (x, y) => P(x) === P(y));
        anchors.push([A.length, B.length]);
        const lines = [];
        const removed = [];
        let ai = 0, bi = 0;
        for (const [ea, eb] of anchors) {
            const oldGap = A.slice(ai, ea);
            const newGap = B.slice(bi, eb);
            // 새 줄마다 옛 줄 중 낱말이 가장 많이 겹치는 것과 (순서를 지키며) 짝지어 달라진 낱말만 강조. 겹침이 적으면 새 줄
            let from = 0;
            const usedOld = new Set();
            newGap.forEach((line) => {
                const toks = UpgradeFlow.tokens(line);
                let best = -1, bestKeep = null, bestN = 0;
                for (let j = from; j < oldGap.length; j++) {
                    const old = UpgradeFlow.tokens(oldGap[j]);
                    const pairs = UpgradeFlow.lcs(old, toks, (x, y) => x.w === y.w);
                    if (pairs.length > bestN) { best = j; bestN = pairs.length; bestKeep = new Set(pairs.map((q) => q[1])); }
                }
                if (best >= 0 && bestN * 2 >= Math.min(toks.length, UpgradeFlow.tokens(oldGap[best]).length)) {
                    usedOld.add(best);
                    from = best + 1;
                    const keep = bestKeep;
                    lines.push({ text: UpgradeFlow.render(toks, (i) => !keep.has(i), true), kind: "changed" });
                } else lines.push({ text: UpgradeFlow.render(toks, () => true), kind: "added" });
            });
            oldGap.forEach((l, j) => { if (!usedOld.has(j)) removed.push(CardText.strip(l)); });
            if (ea < A.length) lines.push({ text: P(B[eb]), kind: "same" });
            ai = ea + 1;
            bi = eb + 1;
        }
        return { lines, removed };
    }

    // 강화 후 이 카드가 낼 수 있는 비용들 (비용 경우가 여럿이고 지금 고른 경우가 새 정의에서도 유효하면 그것 하나, 아니면 모두 "그중 하나")
    static costsAfter(card, def) {
        const opts = Card.costOptions(def);
        if (opts.length < 2) return [opts[0]];
        const pay = card.data?.pay;
        return Number.isInteger(pay) && pay >= 0 && pay < opts.length ? [opts[pay]] : opts;
    }

    static costLabel(cost) {
        return CardDef.costText(cost) || "비용 없음";
    }

    // 비용 비교 글 (rich): 같으면 "기력 2 (같음)", 달라지면 "기력 2 → [[upnew:마나 2]]", 여럿이면 "… / …  중 하나"
    static costLine(card, def) {
        const now = UpgradeFlow.costLabel(card.cost);
        const after = UpgradeFlow.costsAfter(card, def).map(UpgradeFlow.costLabel);
        const same = after.length === 1 && after[0] === now;
        if (same) return `비용 ${now} (같음)`;
        const shown = after.length === 1 ? after[0] : `${after.join(" / ")} 중 하나`;
        return `비용 ${now} → [[upnew:${shown}]]`;
    }
}

// 강화 선택 창: 위에 "지금 카드", 아래에 그 카드가 받을 수 있는 강화들(효과 변화 강조). 줄을 눌러 고르고 [강화한다].
//   세로로 끌거나 휠로 스크롤한다. [뒤로] 카드 고르기로 / [닫기]·배경·Esc 취소.
class UpgradeOptionDialog extends Component {
    static W = 420;
    static H = 600;
    static PAD = 8;

    constructor(options) {
        super();
        this.engine = options.engine;
        this.card = null;
        this.opts = [];
        this.handlers = null;
        this.selected = null;
        this.rows = [];
        this.views = [];
        this.armed = false;
        this._ctx = document.createElement("canvas").getContext("2d");
    }

    get isOpen() {
        return this.handlers !== null;
    }

    start() {
        this.build();
    }

    build() {
        if (this.root) return;
        const { root, box } = Modal.create(this.engine, "upgradeOption", UpgradeOptionDialog.W, UpgradeOptionDialog.H, () => this.finish("cancel"));
        this.root = root;
        this.box = box;
        this.title = UIKit.label(box, "title", "", 14, 10, null, 18, { fontSize: 14, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.sub = UIKit.label(box, "sub", "강화를 하나 고르면 효과가 어떻게 바뀌는지 보인다.", 14, 31, null, 14, { fontSize: 11, color: "#c8b890" });

        const list = box.createChild("list");
        this.list = list.getComponent(RectTransform);
        this.list.setAnchor(0, 0, 1, 1);
        this.list.setOffsets(12, 52, 12, 116);
        list.addComponent(new UIRect({ color: "rgba(0, 0, 0, 0.25)" }));
        list.addComponent(new UIMask());
        this.content = this.list.createChild("content").getComponent(RectTransform);
        const bar = this.list.createChild("scrollbar");
        bar.addComponent(new UIRect({ color: "rgba(232, 217, 184, 0.45)" }));
        this.scroll = list.addComponent(new UIScrollView({
            content: this.content, bar: bar.getComponent(RectTransform),
            onTap: (pointer) => {
                const v = this.views.find((v) => UIKit.contains(v.rt, pointer.position));
                if (v) this.select(v.def);
            }
        }));
        this.measurer = UIKit.label(box, "measure", "", 0, 0, 10, 10, { fontSize: 12, wrap: true, lineHeight: 1.35, rich: true });

        // 아래: 큰 [강화한다], 그 아래 [뒤로] [닫기]
        this.confirmButton = UIKit.button(box, "confirm", "", () => this.confirm(), { fontSize: 15 });
        this.confirmButton.rt.setAnchor(0, 1, 1, 1);
        this.confirmButton.rt.setOffsets(12, -108, 12, 46);
        this.backButton = UIKit.button(box, "back", "뒤로 (카드 다시 고르기)", () => this.finish("back"), { fontSize: 12 });
        this.backButton.rt.setAnchor(0, 1, 0.65, 1);
        this.backButton.rt.setOffsets(12, -40, 3, 10);
        const close = UIKit.button(box, "close", "닫기", () => this.finish("cancel"), { fontSize: 12 });
        close.rt.setAnchor(0.65, 1, 1, 1);
        close.rt.setOffsets(3, -40, 12, 10);
    }

    // handlers: { title, onApply(def), onBack(), onCancel() }
    open(card, opts, handlers) {
        this.build();
        this.card = card;
        this.opts = opts;
        this.handlers = handlers;
        this.armed = false;
        this.shop = handlers.shop ?? null;
        const pickable = opts.filter((d) => this.canPick(d));
        this.selected = pickable.length === 1 ? pickable[0] : null; // 하나뿐이면 미리 골라 둔다 (그래도 [강화한다]를 눌러야 한다)
        this.title.setText(handlers.title ?? "강화");
        this.sub.setText(this.shop ? (this.shop.note ?? "이 상점이 파는 색만 고를 수 있다. 값은 강화할 때 낸다.") : "강화를 하나 고르면 효과가 어떻게 바뀌는지 보인다.");
        const size = Modal.fit(this.engine, this.box, UpgradeOptionDialog.W, UpgradeOptionDialog.H);
        this.scroll.scrollTo(0);
        Modal.show(this.root, true);
        this._width = null;
        this.layoutAfterShow = true;
        this.rebuild();
    }

    // 상점이면 파는(품절 아닌) 색만 고를 수 있다
    canPick(def) {
        return !this.shop || (def.upgradeKey in this.shop.prices && !(this.shop.sold && this.shop.sold[def.upgradeKey]));
    }

    shopMoney() {
        const m = this.shop.money;
        return typeof m === "function" ? m() : m;
    }

    select(def) {
        if (!this.canPick(def)) return;
        this.selected = def;
        this.rebuild();
    }

    confirm() {
        if (!this.selected) return;
        this.finish("apply");
    }

    finish(kind) {
        const h = this.handlers;
        if (!h) return;
        const def = this.selected;
        this.handlers = null;
        Modal.show(this.root, false);
        if (kind === "apply") h.onApply(def);
        else if (kind === "back") h.onBack();
        else h.onCancel();
    }

    // 글이 width 안에서 몇 줄인가
    lines(text, size, width, bold = false) {
        const t = this.measurer;
        t.fontSize = size;
        t.fontWeight = bold ? "bold" : "normal";
        t.setText(text);
        const n = t.measureLines(this._ctx, width);
        t.setText("");
        return Math.max(1, n);
    }

    // 글 칸 하나 만들기: 높이를 재서 놓고 쓴 높이를 돌려준다
    text(parent, name, text, x, y, w, size, opt = {}) {
        const h = Math.ceil(this.lines(text, size, w, opt.bold) * size * 1.35);
        UIKit.label(parent, name, text, x, y, w, h, { fontSize: size, color: opt.color ?? UIKit.COLORS.text, fontWeight: opt.bold ? "bold" : "normal", wrap: true, lineHeight: 1.35, rich: true, align: opt.align ?? "left" });
        return h;
    }

    rebuild() {
        if (!this.handlers) return;
        for (const go of this.rows) go.destroy();
        this.rows = [];
        this.views = [];
        UpgradeFlow.ensureKeys();
        const PAD = UpgradeOptionDialog.PAD;
        const width = Math.floor(this.list.rect.width / this.list.uiRoot.scale) - 6; // 스크롤바 자리
        const tw = width - PAD * 2;
        const card = this.card;
        const nowText = card.text(true);
        let y = 6;

        // ---- 지금 카드 ----
        {
            const go = this.content.createChild("now");
            const rt = UIKit.place(go, 3, y, width, 40);
            go.addComponent(new UIRect({ color: "rgba(30, 40, 52, 0.95)", borderColor: "#5a7a9a", borderWidth: 1 }));
            UIKit.icon(rt, "icon", card.def, PAD, PAD, 36);
            UIKit.label(rt, "tag", "지금 카드", PAD + 44, PAD - 1, null, 13, { fontSize: 10, color: "#8ab4d8" });
            UIKit.label(rt, "name", card.name, PAD + 44, PAD + 13, tw - 44, 17, { fontSize: 14, fontWeight: "bold", color: UIKit.COLORS.text });
            const cost = UpgradeFlow.costLabel(card.cost);
            const rarity = card.def.rarity ? ` · ${UpgradeOptionDialog.RARITY[card.def.rarity] ?? card.def.rarity}` : "";
            let by = PAD + 36 + 8;
            by += this.text(rt, "cost", `비용 ${cost}${rarity}`, PAD, by, tw, 11, { color: "#c8b890" }) + 3;
            by += this.text(rt, "text", nowText, PAD, by, tw, 12, { color: "#efe2c4" });
            const h = by + PAD;
            rt.setOffsets(3, y, -(3 + width), -(y + h));
            this.rows.push(go);
            y += h + 8;
        }

        // ---- 머리글 ----
        {
            const go = this.content.createChild("head");
            const rt = UIKit.place(go, 3, y, width, 18);
            UIKit.label(rt, "t", `이 카드가 받을 수 있는 강화 ${this.opts.length}개 · 하나를 고른다`, 2, 2, null, 15, { fontSize: 12, fontWeight: "bold", color: UIKit.COLORS.gold });
            const line = rt.createChild("line");
            UIKit.place(line, 0, 17, null, 1);
            line.addComponent(new UIRect({ color: UIKit.COLORS.border }));
            this.rows.push(go);
            y += 22;
        }

        // ---- 강화 줄들 (붉·푸·노·초·보라 순) ----
        const order = [...UpgradeFlow.EASY, ...UpgradeFlow.HARD];
        const sorted = [...this.opts].sort((a, b) => order.indexOf(a.upgradeKey) - order.indexOf(b.upgradeKey));
        for (const def of sorted) {
            const c = UpgradeFlow.COLORS[def.upgradeKey] ?? { name: "", css: UIKit.COLORS.dim, hard: false };
            const on = this.selected === def;
            const sold = !!(this.shop && this.shop.sold && this.shop.sold[def.upgradeKey]);
            const off = !this.canPick(def);
            const price = this.shop ? this.shop.prices[def.upgradeKey] : null;
            const preview = Object.assign(new Card(def.id), { data: card.data ? { ...card.data } : null });
            const diff = UpgradeFlow.diff(nowText, preview.text(true));
            const go = this.content.createChild("opt");
            const rt = UIKit.place(go, 3, y, width, 40);
            const bg = go.addComponent(new UIRect({
                color: off ? "rgba(30, 26, 22, 0.8)" : on ? "rgba(80, 62, 28, 0.98)" : "rgba(42, 35, 30, 0.95)",
                borderColor: on ? UIKit.COLORS.gold : UIKit.COLORS.border, borderWidth: on ? 3 : 1
            }));
            const chip = rt.createChild("chip");
            UIKit.place(chip, PAD + 1, PAD + 1, 22, 22);
            chip.addComponent(new UIRect({ color: off ? UIKit.COLORS.faint : c.css, borderColor: on ? UIKit.COLORS.gold : "#1e1610", borderWidth: on ? 2 : 1 }));
            const tag = c.hard ? "어려움" : "";
            let mark = on ? (tag ? "어려움 · 선택됨" : "선택됨") : tag;
            if (this.shop) mark = sold ? "품절" : off ? "이 상점에서는 팔지 않는다" : `${price} G${on ? " · 선택됨" : ""}`;
            UIKit.label(rt, "mark", mark, PAD, PAD + 4, null, 14, { fontSize: 11, fontWeight: "bold", align: "right", color: off ? UIKit.COLORS.faint : on ? UIKit.COLORS.gold : "#e89060" });
            UIKit.label(rt, "name", preview.name, PAD + 30, PAD + 3, tw - 30 - (this.shop ? 0 : 52), 17, { fontSize: 14, fontWeight: "bold", color: off ? UIKit.COLORS.faint : on ? "#fff0c8" : UIKit.COLORS.text });
            let by = PAD + 28;
            by += this.text(rt, "cost", UpgradeFlow.costLine(card, def), PAD, by, tw, 11, { color: off ? "#7a6e5c" : "#c8b890" }) + 3;
            diff.lines.forEach((ln, k) => {
                const dim = ln.kind === "same" || off;
                const text = ln.kind === "added" ? `+ ${ln.text}` : ln.text;
                by += this.text(rt, "l" + k, text, PAD, by, tw, 12, { color: dim ? "#8a7c66" : "#f4ead0" });
            });
            if (diff.lines.length === 0) by += this.text(rt, "none", "(효과글 없음)", PAD, by, tw, 12, { color: "#8a7c66" });
            diff.removed.forEach((line, k) => {
                by += 1 + this.text(rt, "r" + k, `(없어짐) ${line}`, PAD, by + 1, tw, 11, { color: "#c06a58" });
            });
            const h = by + PAD;
            rt.setOffsets(3, y, -(3 + width), -(y + h));
            this.rows.push(go);
            this.views.push({ def, rt });
            y += h + 6;
        }
        this.scroll.contentHeight = y + 4;
        this.scroll.scrollTo(this.scroll.scroll);

        // 확정 버튼
        const sel = this.selected;
        let ok = !!sel;
        let label = sel ? `[ 강화한다 ▶ ${sel.name} ]` : "위에서 강화를 하나 고른다";
        if (this.shop && sel) {
            const price = this.shop.prices[sel.upgradeKey];
            const money = this.shopMoney();
            if (money < price) {
                ok = false;
                label = `돈이 모자란다 (${price} G 필요 · 내 돈 ${money} G)`;
            } else label = `[ 강화한다 · ${price} G ]`;
        } else if (this.shop) label = "위에서 파는 강화를 하나 고른다";
        this.confirmButton.text.setText(label);
        this.confirmButton.text.color = ok ? UIKit.COLORS.gold : UIKit.COLORS.faint;
        this.confirmButton.text.fontWeight = ok ? "bold" : "normal";
        this.confirmButton.rect.color = ok ? "#6a4a1c" : UIKit.COLORS.buttonOff;
        this.confirmButton.rect.borderColor = ok ? UIKit.COLORS.gold : UIKit.COLORS.border;
        this.confirmButton.ui.enabled = ok;
    }

    update() {
        if (!this.handlers) return;
        if (!this.armed) { this.armed = true; return; }
        if (Input.getButtonDown("cancel")) return this.finish("cancel");
        // 창 크기가 바뀌면(화면 회전·크기 조절) 다시 맞춘다
        const w = Math.floor(this.list.rect.width / this.list.uiRoot.scale);
        if (w !== this._width) {
            this._width = w;
            if (!this.layoutAfterShow) Modal.fit(this.engine, this.box, UpgradeOptionDialog.W, UpgradeOptionDialog.H);
            this.layoutAfterShow = false;
            this.rebuild();
        }
    }

    static RARITY = { common: "흔함", uncommon: "드묾", rare: "희귀", boss: "우두머리" };
}

/* ===== assets/dat/ui/UIKit.js ===== */
// 게임 UI를 만들 때 자주 쓰는 조각들. 엔진 UI(RectTransform, UIRect, UIText, UIButton)를 조합한다.
class UIKit {
    static COLORS = {
        panel: "rgba(18, 13, 10, 0.92)",
        border: "#5a4a3a",
        gold: "#e8b840",
        text: "#e8d9b8",
        dim: "#a89878",
        faint: "#6a5a48",
        button: "#3a332d",
        buttonOn: "#6a5a48",
        buttonOff: "#2a231e"
    };

    // 글자 버튼: 바탕 UIRect + UIButton + 가운데 글자. { go, rt, rect, text }
    static button(parentRT, name, label, onTap, options = {}) {
        const go = parentRT.createChild(name);
        const rect = go.addComponent(new UIRect({ color: UIKit.COLORS.button, borderColor: UIKit.COLORS.border, borderWidth: 1 }));
        const ui = go.addComponent(new UIButton({ onTap }));
        const t = go.getComponent(RectTransform).createChild("label");
        t.getComponent(RectTransform).setAnchor(0, 0, 1, 1);
        const text = t.addComponent(new UIText(label, { fontSize: options.fontSize ?? 12, color: UIKit.COLORS.text }));
        return { go, rt: go.getComponent(RectTransform), rect, text, ui };
    }

    // 버튼을 켜고 끈 모양으로 (누를 수 없을 때 흐리게, 눌러도 반응 없음)
    static setEnabled(button, enabled) {
        button.text.color = enabled ? UIKit.COLORS.text : UIKit.COLORS.faint;
        button.ui.enabled = enabled;
    }

    // 글자 (부모 왼쪽 위 기준 x, y, w, h. w가 null이면 오른쪽 여백 x까지 꽉 차게)
    static label(parentRT, name, text, x, y, w, h, options = {}) {
        const go = parentRT.createChild(name);
        UIKit.place(go, x, y, w, h);
        return go.addComponent(new UIText(text, { fontSize: 12, color: UIKit.COLORS.text, align: "left", verticalAlign: "top", ...options }));
    }

    // 부모 왼쪽 위 기준으로 x, y, w, h (UI 단위). w가 null이면 좌우 여백 x로 꽉 차게
    static place(go, x, y, w, h) {
        const rt = go.getComponent(RectTransform);
        if (w === null) {
            rt.setAnchor(0, 0, 1, 0);
            rt.setOffsets(x, y, x, -(y + h));
        } else {
            rt.setAnchor(0, 0, 0, 0);
            rt.setOffsets(x, y, -(x + w), -(y + h));
        }
        return rt;
    }

    // 카드 그림 하나 (시트의 16x16 칸)
    static icon(parentRT, name, def, x, y, size) {
        const go = parentRT.createChild(name);
        UIKit.place(go, x, y, size, size);
        go.addComponent(new UIRect({ color: "#3a332d", borderColor: "#1e1610", borderWidth: 1 }));
        go.addComponent(new UIImage(Resource.image(def.sprite), { region: { x: def.frame * 16, y: 0, width: 16, height: 16 } }));
        return go;
    }

    // 점 위치가 사각형 안인가 (화면 좌표)
    // p: 포인터 좌표 (CSS px). pixelRatio는 엔진이 맞춘다
    // 창이 열릴 때 살짝 나타나게 (그룹 투명도 0 → 1). 누르기는 바로 된다
    static fadeIn(go, duration = 0.12) {
        const rt = go.getComponent(RectTransform);
        if (!rt) return;
        Tween.killTweensOf(rt);
        rt.alpha = 0;
        Tween.to(rt, { alpha: 1 }, duration, { ease: "outQuad", unscaled: true, owner: go });
    }

    static contains(rt, p) {
        return rt.containsPoint(p.x, p.y);
    }
}

// 끌어서 옮기는 UI (창 손잡이). onMove(dx, dy): UI 단위 이동량. 살짝 누르기만 하면 onTap
class UIDrag extends UIElement {
    constructor(options = {}) {
        super();
        this.onMove = options.onMove ?? null;
        this.onTap = options.onTap ?? null;
        this._last = null;
        this._moved = 0;
    }

    onPointerDown(pointer) {
        this._last = pointer.position.clone();
        this._moved = 0;
    }

    onDrag(pointer) {
        if (!this._last) return;
        const rt = this.getComponent(RectTransform);
        const k = Input.pixelRatio / (rt && rt.uiRoot ? rt.uiRoot.scale : 1);
        const dx = (pointer.position.x - this._last.x) * k;
        const dy = (pointer.position.y - this._last.y) * k;
        this._last = pointer.position.clone();
        this._moved += Math.abs(dx) + Math.abs(dy);
        if (this.onMove && (dx || dy)) this.onMove(dx, dy);
    }

    onPointerUp() {
        this._last = null;
    }

    onClick() {
        if (this._moved < 6 && this.onTap) this.onTap();
    }
}

// UI 층 (최상위 UI의 RectTransform.sortOrder). 큰 값이 위에 그려지고 먼저 눌린다
const UILayer = {
    HUD: 0,        // 체력바, 메시지, 오른쪽 위 버튼, 디버그 / 버튼
    HAND: 10,      // 아래 패와 그 위 설명 칸
    TARGET: 20,    // 칸 지정 안내줄, [보상 받기] 버튼
    PANEL: 50,     // 오른쪽 패널 (상태)
    MODAL: 100     // 화면을 막는 창. 열 때마다 1씩 올라가서 나중에 연 창이 위에 온다
};

// 화면을 막는 창(대화, 거래, 메뉴)이 떠 있는지. 떠 있는 동안 플레이어는 움직이지 않는다.
// 창은 화면 전체를 덮는 반투명 막 + 가운데 상자로 만든다. 막을 누르면 닫힌다 (onBackdrop).
class Modal {
    static openCount = 0;
    static seq = 0; // 연 순서 (나중에 연 창이 위)

    static get isOpen() {
        return Modal.openCount > 0;
    }

    // engine.createUI로 막과 상자를 만든다. 반환: { root, box(RectTransform) }
    static create(engine, name, width, height, onBackdrop) {
        const root = engine.createUI(name);
        const rrt = root.getComponent(RectTransform);
        rrt.setAnchor(0, 0, 1, 1);
        rrt.setOffsets(0, 0, 0, 0);
        root.addComponent(new UIRect({ color: "rgba(0, 0, 0, 0.45)" }));
        root.addComponent(new UIButton({ onTap: () => onBackdrop && onBackdrop() }));

        const box = rrt.createChild("box");
        const brt = box.getComponent(RectTransform);
        brt.setAnchor(0.5, 0.5, 0.5, 0.5);
        brt.setSizeAndPosition(width, height, 0, 0);
        box.addComponent(new UIRect({ color: UIKit.COLORS.panel, borderColor: UIKit.COLORS.gold, borderWidth: 1 }));
        box.addComponent(new UIElement()); // 상자 안을 눌러도 막으로 새지 않게
        root.setActive(false);
        return { root, box: brt };
    }

    // 상자 크기를 화면에 맞춘다 (UI 단위)
    static fit(engine, boxRT, width, height, margin = 12) {
        const scale = engine.uiRoot.scale;
        const w = Math.min(width, engine.canvas.width / scale - margin * 2);
        const h = Math.min(height, engine.canvas.height / scale - margin * 2);
        boxRT.setSizeAndPosition(w, h, 0, 0);
        return { width: w, height: h };
    }

    static show(go, value) {
        if (go.isActive === value) return;
        if (value) go.getComponent(RectTransform).sortOrder = UILayer.MODAL + ++Modal.seq;
        go.setActive(value);
        Modal.openCount += value ? 1 : -1;
        if (value) UIKit.fadeIn(go);
    }
}

/* ===== assets/dat/ui/CardView.js ===== */
// 카드 한 장을 그리는 UI. 3:5 비율이고, 위에서부터 정사각형 그림(가로 전체) → 제목 → 종류 → 설명.
// 종류에 따라 바탕색이 다르다: 스킬은 푸른 종이, 아이템은 누런 종이, 도구는 회색 종이. 선택되면 테두리가 금색으로 두꺼워진다.
// 묶음(count > 1)이면 그림 오른쪽 아래에 "x3"이 붙는다.
// 2열 목록에서는 카드가 좁아서 설명이 다 안 들어간다. 잘린 설명은 패널 아래 상세 칸에서 본다.
// RectTransform이 있는 오브젝트에 붙이고, 크기는 layout(width)로 정한다 (UI 단위).
class CardView extends Component {
    static BORDER = 2;
    static INSET = 4;
    static STYLE = {
        skill: { paper: "#cfd8e8", ink: "#1e2638", sub: "#46506a", tag: "#3a5a9a" },
        item: { paper: "#e8d9b8", ink: "#2a1e16", sub: "#5a4a3a", tag: "#8a6a2a" },
        tool: { paper: "#d4d0c8", ink: "#24221e", sub: "#4a4640", tag: "#5a5a6a" },
        gem: { paper: "#ddd0e8", ink: "#261e30", sub: "#4e4260", tag: "#6a4a9a" }
    };

    static styleOf(def) {
        if (def.gem) return CardView.STYLE.gem;
        return def.slot ? CardView.STYLE.tool : CardView.STYLE[def.type];
    }

    // equipped: 장착 중이면 true (위에 "장착" 딱지)
    constructor(card, equipped = false) {
        super();
        this.card = card;
        this.equipped = equipped;
        this.width = 0;
        this.height = 0;
        this.selected = false;
    }

    awake() {
        const rt = this.getComponent(RectTransform);
        const def = this.card.def;
        const style = CardView.styleOf(def);

        this.frame = this.addComponent(new UIRect({ color: style.paper, borderColor: style.ink, borderWidth: CardView.BORDER }));
        this.addComponent(new UIMask());

        this.well = rt.createChild("image");
        this.well.addComponent(new UIRect({ color: "#3a332d", borderColor: style.ink, borderWidth: 1 }));
        this.well.addComponent(new UIImage(Resource.image(def.sprite), {
            region: { x: def.frame * 16, y: 0, width: 16, height: 16 }
        }));

        this.badge = rt.createChild("count");
        this.badgeBack = this.badge.addComponent(new UIRect({ color: "rgba(20, 14, 10, 0.85)" }));
        this.badgeText = this.badge.getComponent(RectTransform).createChild("text").addComponent(new UIText("", {
            fontSize: 11, fontWeight: "bold", color: "#ffffff"
        }));
        this.badgeText.getComponent(RectTransform).setAnchor(0, 0, 1, 1);

        // 장착 중 표시 (그림 왼쪽 위)
        this.worn = rt.createChild("equipped");
        this.worn.addComponent(new UIRect({ color: "rgba(232, 184, 64, 0.95)", borderColor: "#2a1e16", borderWidth: 1 }));
        const wt = this.worn.getComponent(RectTransform).createChild("text").addComponent(new UIText("착용 중", {
            fontSize: 10, fontWeight: "bold", color: "#2a1e16"
        }));
        wt.getComponent(RectTransform).setAnchor(0, 0, 1, 1);
        this.worn.setActive(!!this.equipped);

        this.title = rt.createChild("title");
        this.titleText = this.title.addComponent(new UIText(this.card.name, {
            fontSize: 13, fontWeight: "bold", color: style.ink, align: "left", verticalAlign: "top"
        }));

        this.tag = rt.createChild("kind");
        const cost = CardDef.costText(this.card.cost);
        this.tag.addComponent(new UIText(CardDef.kindName(def) + (cost ? " · " + cost : ""), {
            fontSize: 10, color: style.tag, align: "left", verticalAlign: "top"
        }));

        // 비용 딱지 (그림 왼쪽 아래). 좁은 카드는 종류 줄 대신 이것만 보인다
        this.costBadge = rt.createChild("cost");
        this.costBadge.addComponent(new UIRect({ color: "rgba(20, 14, 10, 0.85)", borderColor: "#e8b840", borderWidth: 1 }));
        this.costText = this.costBadge.getComponent(RectTransform).createChild("text").addComponent(new UIText(CardDef.costShort(this.card.cost), {
            fontSize: 9, fontWeight: "bold", color: "#f0d090"
        }));
        this.costText.getComponent(RectTransform).setAnchor(0, 0, 1, 1);
        this.costBadge.setActive(!!this.costText.text);

        this.desc = rt.createChild("description");
        this.desc.addComponent(new UIText(this.card.summary, {
            fontSize: 10, color: style.sub, align: "left", verticalAlign: "top", wrap: true, lineHeight: 1.3, rich: true, palette: "dark"
        }));

        this.setSelected(this.selected);
        if (this.width) this._placeChildren();
    }

    setSelected(value) {
        this.selected = value;
        if (!this.frame) return;
        this.frame.borderColor = value ? "#e8b840" : this.equipped ? "#b07820" : CardView.styleOf(this.card.def).ink;
        this.frame.borderWidth = value ? 4 : CardView.BORDER;
    }

    // width를 받아 3:5 높이를 정해 돌려준다. 카드 자신의 위치는 부모(목록)가 정한다.
    // awake 전에 불려도 되도록, 안쪽 배치는 자식이 만들어진 뒤에 한다.
    layout(width) {
        this.width = width;
        this.height = Math.round(width * 5 / 3);
        if (this.well) this._placeChildren();
        return this.height;
    }

    // 묶음 개수가 바뀌면 다시 그린다 (목록 전체를 다시 만들지 않고)
    refreshCount() {
        const count = this.card.count;
        this.badge.setActive(count > 1);
        if (count <= 1) return;
        const text = "x" + count;
        this.badgeText.setText(text);
        const inset = CardView.INSET;
        const image = this.width - inset * 2;
        const w = 8 + text.length * 7;
        CardView.place(this.badge, inset + image - w - 2, inset + image - 18, w, 16);
    }

    // 좁은 카드(패)는 그림을 줄이고 종류 줄을 빼서 설명이 두 줄 들어가게 한다
    get narrow() {
        return this.width < 76;
    }

    _placeChildren() {
        const inset = CardView.INSET;
        const full = this.width - inset * 2;
        const image = this.narrow ? Math.min(full, Math.round(this.height * 0.4)) : full;
        const text = this.width - inset * 2 - 4;
        const textTop = inset + image + 3;
        const ix = Math.round((this.width - image) / 2);

        CardView.place(this.well, ix, inset, image, image);
        CardView.place(this.worn, ix + 2, inset + 2, 44, 15);
        CardView.place(this.title, inset + 2, textTop, text, 16);
        this.tag.setActive(!this.narrow);
        const cw = Math.min(image - 2, 8 + this.costText.text.length * 6);
        CardView.place(this.costBadge, ix + 1, inset + image - 14, cw, 13);
        this.costBadge.setActive(!!this.costText.text && this.narrow);
        const descTop = this.narrow ? textTop + 16 : textTop + 30;
        if (!this.narrow) CardView.place(this.tag, inset + 2, textTop + 16, text, 13);
        CardView.place(this.desc, inset + 2, descTop, text, this.height - descTop - inset);
        this.refreshCount();
    }

    // 부모 왼쪽 위 기준으로 x, y, w, h (UI 단위)
    static place(go, x, y, w, h) {
        const rt = go.getComponent(RectTransform);
        rt.setPivot(0, 0);
        rt.setSizeAndPosition(w, h, x, y);
    }
}

/* ===== assets/dat/ui/CardInspector.js ===== */
// 카드 크게 보기: 카드 이름·비용·설명 전체와 설명에 나온 용어 풀이를 큰 글자로 띄운다.
//   상점·보상·덱 보기에서 카드를 고르면 뜨고, 마우스를 카드 위에 올려도 뜬다 (손을 떼거나 닫으면 사라진다).
//   설정 "카드 정보 창"을 끄면 뜨지 않는다.
//   창은 누르기를 막지 않는다 (아래 버튼이 그대로 눌린다).
//   고정된 창(탭해서 연 것)은 창 바깥을 탭하면 닫힌다 (끌어서 스크롤하는 건 닫지 않는다). 다른 카드를 탭하면 그 카드로 바뀐다.
// 쓰기: CardInspector.show(card, { verbose, near: RectTransform, onHide }) / CardInspector.hide(owner)
//       onHide: 창이 닫힐 때(바깥 탭 포함) 부르는 함수 — 부르는 쪽이 "고른 카드" 표시를 지울 때 쓴다
//       CardInspector.track(owner, rt, card, verbose) — 마우스를 올리면 뜨는 카드 (owner가 바뀌면 untrack(owner))
class CardInspector extends Component {
    static current = null;
    static W = 320;

    constructor(options) {
        super();
        this.engine = options.engine;
        this.card = null;
        this.owner = null;
        this.tracked = new Map(); // owner → [{ rt, card, verbose }]
        CardInspector.current = this;
    }

    static enabled() {
        return Settings.get("cardInfo") !== false;
    }

    static show(card, opts = {}) {
        const I = CardInspector.current;
        if (!I) return;
        if (!card || !CardInspector.enabled()) return I._hide();
        I._unpin(); // 바뀌기 전 것의 onHide (다른 카드를 탭하면 앞 카드의 고른 표시가 풀린다)
        I.pinned = { card, verbose: opts.verbose ?? true, near: opts.near ?? null, owner: opts.owner ?? null, onHide: opts.onHide ?? null };
        I._justPinned = true; // 이번 프레임의 탭은 바깥 탭으로 치지 않는다
    }

    static hide(owner = null) {
        const I = CardInspector.current;
        if (!I || !I.pinned) return;
        if (owner && I.pinned.owner !== owner) return;
        I._unpin();
    }

    _unpin() {
        const p = this.pinned;
        this.pinned = null;
        if (p && p.onHide) p.onHide();
    }

    static track(owner, rt, card, verbose = true) {
        const I = CardInspector.current;
        if (!I) return;
        if (!I.tracked.has(owner)) I.tracked.set(owner, []);
        I.tracked.get(owner).push({ rt, card, verbose });
    }

    static untrack(owner) {
        const I = CardInspector.current;
        if (I) I.tracked.delete(owner);
    }

    start() {
        this.root = this.engine.createUI("cardInspector");
        const rt = this.root.getComponent(RectTransform);
        rt.sortOrder = 900;
        rt.setAnchor(0.5, 0, 0.5, 0);
        this.root.addComponent(new UIRect({ color: "rgba(24, 18, 14, 0.97)", borderColor: UIKit.COLORS.gold, borderWidth: 2 }));
        this.rt = rt;
        this.iconGo = rt.createChild("icon");
        this.iconGo.addComponent(new UIRect({ color: "#3a332d", borderColor: "#1e1610", borderWidth: 1 }));
        this.icon = this.iconGo.addComponent(new UIImage(Resource.image("cards"), { region: { x: 0, y: 0, width: 16, height: 16 } }));
        this.nameText = UIKit.label(rt, "name", "", 0, 0, 10, 18, { fontSize: 15, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.kind = UIKit.label(rt, "kind", "", 0, 0, 10, 15, { fontSize: 12, color: "#c8b890", rich: true });
        this.desc = UIKit.label(rt, "desc", "", 0, 0, 10, 10, { fontSize: 13, color: "#efe2c4", wrap: true, lineHeight: 1.4, rich: true });
        this.line = rt.createChild("line");
        this.line.addComponent(new UIRect({ color: "rgba(232, 184, 64, 0.35)" }));
        this.terms = UIKit.label(rt, "terms", "", 0, 0, 10, 10, { fontSize: 11, color: "#bfb090", wrap: true, lineHeight: 1.4, rich: true });
        this.root.setActive(false);
        this._ctx = document.createElement("canvas").getContext("2d");
    }

    _hide() {
        this.card = null;
        this.root.setActive(false);
    }

    // 마우스가 올라간 추적 카드 (마지막에 등록된 것 = 위에 그려진 것 우선)
    hovered() {
        const p = Input.pointer;
        if (!p || p.type !== "mouse") return null;
        let hit = null;
        for (const list of this.tracked.values()) {
            for (const t of list) {
                if (!t.rt.gameObject || !t.rt.gameObject.activeInHierarchy) continue;
                if (t.rt.containsPoint(p.position.x, p.position.y)) hit = t;
            }
        }
        return hit;
    }

    update() {
        if (!CardInspector.enabled()) return this.card && this._hide();
        // 추적 목록에서 사라진(파괴된) 카드 정리
        for (const [owner, list] of this.tracked) {
            const alive = list.filter((t) => t.rt.gameObject && !t.rt.gameObject.isDestroyed);
            if (alive.length !== list.length) this.tracked.set(owner, alive);
        }
        // 고정된 창: 창 바깥을 탭(끌지 않고 뗌)하면 닫는다
        if (this.pinned && !this._justPinned) {
            for (const p of Input.pointers) {
                if (p.released && p.dragDistance <= Input.dragThreshold && !this.rt.containsPoint(p.position.x, p.position.y)) {
                    this._unpin();
                    break;
                }
            }
        }
        this._justPinned = false;
        const h = this.hovered();
        const want = h ? { card: h.card, verbose: h.verbose, near: h.rt } : this.pinned;
        if (!want) return this.card && this._hide();
        const key = `${want.card.id}:${want.verbose}:${want.card.description}:${Math.round(this.engine.width)}x${Math.round(this.engine.height)}:${want.near ? Math.round(want.near.rect.y) : ""}`;
        this.root.setActive(true);
        if (key === this._key && this.card === want.card) return;
        this._key = key;
        this.card = want.card;
        this.layout(want);
    }

    layout(want) {
        const card = want.card;
        const def = card.def;
        const scale = this.engine.uiRoot.scale;
        const screenW = this.engine.canvas.width / scale;
        const screenH = this.engine.canvas.height / scale;
        const W = Math.min(CardInspector.W, screenW - 16);
        const pad = 12;
        const text = card.text(want.verbose);
        const terms = CardInspector.enabled() ? CardText.glossary(text) : "";

        this.icon.setSprite(Resource.image(def.sprite), { x: def.frame * 16, y: 0, width: 16, height: 16 });
        UIKit.place(this.iconGo, pad, pad, 40, 40);
        const cost = CardDef.costText(card.cost);
        const rarity = def.rarity ? ` · ${ShopDialog.RARITY[def.rarity]}` : "";
        this.nameText.setText(card.name);
        this.kind.setText(`${CardDef.kindName(def)}${rarity}${cost ? " · " + cost : ""}`);
        UIKit.place(this.nameText.gameObject, pad + 48, pad + 2, W - pad * 2 - 48, 18);
        UIKit.place(this.kind.gameObject, pad + 48, pad + 23, W - pad * 2 - 48, 15);

        let y = pad + 48;
        const tw = W - pad * 2;
        this.desc.setText(text);
        const dl = this.desc.measureLines(this._ctx, tw);
        const dh = Math.ceil(dl * 13 * 1.4);
        UIKit.place(this.desc.gameObject, pad, y, tw, dh);
        y += dh + 6;
        this.line.setActive(!!terms);
        this.terms.gameObject.setActive(!!terms);
        if (terms) {
            UIKit.place(this.line, pad, y, tw, 1);
            y += 7;
            this.terms.setText(terms);
            const tl = this.terms.measureLines(this._ctx, tw);
            const th = Math.ceil(tl * 11 * 1.4);
            UIKit.place(this.terms.gameObject, pad, y, tw, th);
            y += th + 4;
        }
        const H = Math.min(y + pad - 4, screenH - 16);
        // 자리: 기준 카드가 화면 아래쪽이면 그 위에, 위쪽이면 그 아래에. 없으면 화면 위쪽
        let top = 56;
        if (want.near && want.near.rect) {
            const r = want.near.rect;
            const cy = (r.y + r.height / 2) / scale;
            const above = r.y / scale - H - 8;
            const below = (r.y + r.height) / scale + 8;
            top = cy > screenH / 2 ? above : below;
            if (top < 8) top = 8;
            if (top + H > screenH - 8) top = Math.max(8, screenH - 8 - H);
        }
        this.rt.setAnchor(0.5, 0, 0.5, 0);
        this.rt.setPivot(0.5, 0);
        this.rt.setSizeAndPosition(W, H, 0, top);
    }
}

/* ===== assets/dat/ui/SidePanel.js ===== */
// 오른쪽 위 토글 버튼 + 화면 오른쪽 패널(제목 줄 + 본문). 인벤토리, 상태창 같은 패널의 공통 틀.
// 같은 자리를 쓰므로 한 번에 하나만 열린다. 상속해서 build(body)로 본문을 만들고 refresh()로 매 프레임 갱신한다.
// UI 루트 오브젝트를 만들어야 해서 엔진을 받는다. 이 컴포넌트는 일반 GameObject에 붙인다.
class SidePanel extends Component {
    static current = null;
    static BUTTON = 48;
    static TOP = 72;
    static SLOTS = 4;   // 오른쪽 위 버튼 수 (상태 · 지도 · 덱 · 메뉴)

    // 좁은 화면(세로 폰)이면 버튼 5개가 체력바와 겹친다: 다섯 번째(slot 4)는 둘째 줄로 내리고 패널은 그만큼 아래에서 시작
    static twoRows(engine) {
        const w = engine.canvas.width / engine.uiRoot.scale;
        return w < 16 + SidePanel.SLOTS * (SidePanel.BUTTON + 8) + 110 + 24;
    }

    static top(engine) {
        return SidePanel.twoRows(engine) ? SidePanel.TOP + SidePanel.BUTTON + 8 : SidePanel.TOP;
    }

    // 버튼 자리 (오른쪽 위 기준 중심). slot 4는 좁은 화면에서 둘째 줄 맨 오른쪽
    static buttonPos(engine, slot) {
        const size = SidePanel.BUTTON;
        const two = slot >= 4 && SidePanel.twoRows(engine);
        const col = two ? slot - 4 : slot;
        const row = two ? 1 : 0;
        return { x: -16 - size / 2 - col * (size + 8), y: 16 + size / 2 + row * (size + 8) };
    }

    // options: { engine, action, keys, icon(버튼 시트 칸), slot(오른쪽부터 0,1,..), title, width, open }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.action = options.action;
        this.keys = options.keys ?? [];
        this.icon = options.icon;
        this.slot = options.slot ?? 0;
        this.title = options.title ?? "";
        this.panelWidth = options.width ?? 200;
        this.margin = options.margin ?? 8;
        this.startOpen = options.open ?? false;
        this.open = false;
    }

    start() {
        Input.defineButton(this.action, this.keys);

        const size = SidePanel.BUTTON;
        const toggle = this.engine.createUI(this.action + "Toggle");
        const trt = toggle.getComponent(RectTransform);
        trt.setAnchor(1, 0, 1, 0);
        this.toggleRT = trt;
