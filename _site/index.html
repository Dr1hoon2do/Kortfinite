// 젬 끼우기 창 (턴 안 씀). 아래 패에서 연다. 젬은 패·덱·묘지 어디에 있는 스킬 카드에든 끼울 수 있다.
//   카드 보기 (스킬 카드를 골라 [젬]): 그 카드의 젬 칸들 — 끼운 젬은 [빼기](깨진다, 두 번 눌러 확인),
//                                       아래에 패의 젬들 — [끼우기] (효과가 없거나 칸이 차면 흐리게, 이유 표시)
//   젬 보기 (젬을 골라 [끼우기]): 패·덱·묘지의 스킬 카드들 — [끼우기] (어디에 있는지 같이 보인다)
// 끼운 젬은 직접 빼면 깨진다.
class GemDialog extends Component {
    static ROW = 46;

    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.card = null;   // 카드 보기: 이 스킬 카드
        this.gem = null;    // 젬 보기: 이 젬
        this.rows = [];
        this.confirm = null; // 빼기 확인 중인 젬 칸 번호
        this._key = null;
    }

    get cards() {
        return this.player.cards;
    }

    get isOpen() {
        return !!(this.card || this.gem);
    }

    start() {
        const { root, box } = Modal.create(this.engine, "gemDialog", 340, 420, () => this.close());
        this.root = root;
        this.box = box;
        this.title = UIKit.label(box, "title", "", 14, 10, null, 18, { fontSize: 13, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.sub = UIKit.label(box, "sub", "", 14, 30, null, 30, { fontSize: 11, color: "#c8b890", wrap: true, lineHeight: 1.3 });

        const list = box.createChild("list");
        this.list = list.getComponent(RectTransform);
        this.list.setAnchor(0, 0, 1, 1);
        this.list.setOffsets(12, 64, 12, 52);
        list.addComponent(new UIRect({ color: "rgba(0, 0, 0, 0.25)" }));
        list.addComponent(new UIMask());
        this.content = this.list.createChild("content").getComponent(RectTransform);
        const bar = this.list.createChild("scrollbar");
        bar.addComponent(new UIRect({ color: "rgba(232, 217, 184, 0.45)" }));
        this.scroll = list.addComponent(new UIScrollView({ content: this.content, bar: bar.getComponent(RectTransform) }));

        const close = UIKit.button(box, "close", "닫기", () => this.close(), { fontSize: 13 });
        close.rt.setAnchor(0, 1, 1, 1);
        close.rt.setOffsets(12, -44, 12, 10);
    }

    openCard(card) {
        this.card = card;
        this.gem = null;
        this._open();
    }

    openGem(gem) {
        this.gem = gem;
        this.card = null;
        this._open();
    }

    _open() {
        this.confirm = null;
        this._key = null;
        this.scroll.scrollTo(0);
        Modal.fit(this.engine, this.box, 340, 420);
        Modal.show(this.root, true);
    }

    close() {
        if (!this.isOpen) return;
        this.card = null;
        this.gem = null;
        Modal.show(this.root, false);
    }

    update() {
        if (!this.isOpen) return;
        if (Input.getButtonDown("cancel") || !this.player.alive) return this.close();
        const hand = this.cards.hand;
        // 고른 카드가 패에서 사라졌으면 닫는다 (젬을 끼워 젬이 사라진 경우는 카드 보기로 바뀐다)
        if (this.card && !this.cards.allActions.includes(this.card)) return this.close();
        if (this.gem && !hand.includes(this.gem)) return this.close();
        const key = this.cards.version + ":" + this.confirm;
        if (key !== this._key) {
            this._key = key;
            this.rebuild();
        }
    }

    addRow(y, { def, name, info, button, ok, onTap, warn = false }) {
        const h = GemDialog.ROW;
        const go = this.content.createChild("row");
        const rt = UIKit.place(go, 6, y, null, h - 6);
        go.addComponent(new UIRect({ color: "rgba(42, 35, 30, 0.95)", borderColor: UIKit.COLORS.border, borderWidth: 1 }));
        if (def) UIKit.icon(rt, "icon", def, 4, 4, 32);
        const x = def ? 44 : 10;
        UIKit.label(rt, "name", name, x, 5, null, 15, { fontSize: 12, fontWeight: "bold" });
        UIKit.label(rt, "info", info, x, 22, null, 14, { fontSize: 10, color: "#c8b890" });
        if (button) {
            const b = UIKit.button(rt, "act", button, onTap, { fontSize: 11 });
            b.rt.setAnchor(1, 0, 1, 0);
            b.rt.setOffsets(-66, 6, 6, -34);
            UIKit.setEnabled(b, ok);
            if (warn) b.rect.color = "#7a3a2a";
        }
        this.rows.push(go);
        return y + h;
    }

    header(y, text) {
        const go = this.content.createChild("header");
        UIKit.place(go, 6, y, null, 18);
        go.addComponent(new UIText(text, { fontSize: 11, fontWeight: "bold", color: UIKit.COLORS.gold, align: "left", verticalAlign: "top" }));
        this.rows.push(go);
        return y + 20;
    }

    rebuild() {
        for (const row of this.rows) row.destroy();
        this.rows = [];
        let y = 6;
        if (this.card) y = this.buildCard(y);
        else y = this.buildGem(y);
        this.scroll.contentHeight = y + 2;
    }

    // 카드 보기: 젬 칸 + 패의 젬
    buildCard(y) {
        const card = this.card;
        const { sockets, gems } = Spell.data(card);
        this.title.setText(`젬 · ${card.name} (칸 ${gems.length}/${sockets}) · ${this.zoneOf(card)}`);
        this.sub.setText(Spell.short(card) + ` · 비용 ${Spell.costText(Spell.payCost(card))}`);

        y = this.header(y, "젬 칸");
        for (let i = 0; i < sockets; i++) {
            const saved = gems[i];
            if (!saved) {
                y = this.addRow(y, { def: null, name: `${i + 1}번 칸 · 비어 있음`, info: "아래 젬을 골라 끼운다" });
                continue;
            }
            const gem = Card.load(saved);
            const confirming = this.confirm === i;
            y = this.addRow(y, {
                def: gem.def, name: gem.name, info: confirming ? "한 번 더 누르면 깨뜨리며 뺀다" : Gem.summary(gem),
                button: confirming ? "깨뜨리기" : "빼기(깨짐)", ok: true, warn: confirming,
                onTap: () => {
                    if (this.confirm !== i) {
                        this.confirm = i;
                        return;
                    }
                    this.confirm = null;
                    Gem.unsocket(this.cards, card, i, false);
                }
            });
        }

        y = this.header(y + 4, "패의 젬");
        const owned = this.cards.hand.filter((c) => c.def.gem);
        if (!owned.length) y = this.addRow(y, { def: null, name: "패에 젬이 없다", info: "상점·보물·정예 보상에서 얻는다" });
        for (const gem of owned) {
            const why = Gem.whyNot(card, gem);
            y = this.addRow(y, {
                def: gem.def, name: gem.name, info: why || Gem.summary(gem),
                button: "끼우기", ok: !why, onTap: () => Gem.socket(this.cards, card, gem)
            });
        }
        return y;
    }

    // 카드가 있는 곳 이름
    zoneOf(card) {
        const c = this.cards;
        return c.hand.includes(card) ? "패" : c.deck.includes(card) ? "덱" : c.graveyard.includes(card) ? "묘지" : "소멸";
    }

    // 젬 보기: 패·덱·묘지의 스킬 카드 (끼울 수 있는 것부터)
    buildGem(y) {
        const gem = this.gem;
        this.title.setText(`끼우기 · ${gem.name}`);
        this.sub.setText(Gem.summary(gem) + " — 끼울 스킬 카드를 고른다 (패·덱·묘지 어디든)");
        const spells = this.cards.allActions.filter((c) => c.def.spell);
        spells.sort((a, b) => (Gem.whyNot(a, gem) ? 1 : 0) - (Gem.whyNot(b, gem) ? 1 : 0));
        if (!spells.length) y = this.addRow(y, { def: null, name: "덱에 스킬 카드가 없다", info: "주문 카드(마법 화살 등)에 젬 칸이 있다" });
        for (const card of spells) {
            const why = Gem.whyNot(card, gem);
            const { sockets, gems } = Spell.data(card);
            y = this.addRow(y, {
                def: card.def, name: `${card.name} · 칸 ${gems.length}/${sockets} · ${this.zoneOf(card)}`,
                info: why || Spell.short(card),
                button: "끼우기", ok: !why,
                onTap: () => {
                    if (Gem.socket(this.cards, card, gem)) this.openCard(card);
                }
            });
        }
        return y;
    }
}

/* ===== assets/dat/ui/dialog/DeckViewer.js ===== */
// 카드 격자 창. 덱 보기(덱 / 묘지 / 전체), 내 카드(가진 행동 카드 전부), "카드 고르기"(카드 빼기 등)에 같이 쓴다.
//   open()                     — 전투용 덱 보기: [덱] [묘지] [전체] 탭. 덱은 순서를 감추려고 이름순. 설명 수치는 짧게 ("5 피해")
//   openOwned()                — 내 카드 (오른쪽 위 [덱] 버튼): 장비 카드·임시 카드·소지품을 뺀 행동 카드. 설명 수치는 자세히 ("공격력 100%(5) 피해")
//   pick(title, cards, onPick) — 카드를 하나 고르면 onPick(card)를 부르고 닫힌다
//   pickMany(title, cards, { min, max, sections }, onDone) — 카드를 여러 장 눌러 고르고 [확정]하면 onDone([카드…])를 부르고 닫힌다 (그만두면 부르지 않는다)
//     sections: [{ title, cards, max }] 를 주면 구역(덱/묘지 등)별 머리글("덱 (12장)")로 나눠 보이고, 구역마다 max장까지만 고른다.
//     창 위쪽에 "덱 1/1 · 묘지 0/1" 식으로 고른 현황을 한 줄로 보인다. 구역이 비면 "비어 있다". (카드를 만들 때는 CardOps.zonePick)
// 카드를 누르면 아래 칸에 설명이 나온다 (고르기 모드면 [고르기] 버튼, 덱 보기에서 젬 칸이 있는 스킬 카드면 [젬] 버튼).
class DeckViewer extends Component {
    static TABS = [["deck", "덱"], ["graveyard", "묘지"], ["all", "전체"]];
    static CARD_W = 80;

    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.gems = options.gems ?? null; // GemDialog: 덱·묘지의 스킬 카드에도 젬을 끼운다
        this.mode = null;  // "view" | "owned" | "pick"
        this.tab = "deck";
        this.views = [];
        this.selected = null;
        this.picked = [];  // 여러 장 고르기에서 고른 카드들
        this.sections = null; // 구역으로 나눠 고르기: [{ title, cards, max }]
        this.headers = [];    // 구역 머리글 [{ go, text, empty, sec }]
    }

    get isOpen() {
        return this.mode !== null;
    }

    start() {
        const { root, box } = Modal.create(this.engine, "deckViewer", 420, 560, () => this.close());
        this.root = root;
        this.box = box;
        this.title = UIKit.label(box, "title", "", 14, 10, null, 18, { fontSize: 13, fontWeight: "bold", color: UIKit.COLORS.gold });

        const tabs = box.createChild("tabs");
        this.tabsRT = tabs.getComponent(RectTransform);
        this.tabsRT.setAnchor(0, 0, 1, 0);
        this.tabsRT.setOffsets(12, 34, 12, -60);
        this.tabButtons = {};
        DeckViewer.TABS.forEach(([id, label], i) => {
            const n = DeckViewer.TABS.length;
            const b = UIKit.button(this.tabsRT, id, label, () => this.setTab(id));
            b.rt.setAnchor(i / n, 0, (i + 1) / n, 1);
            b.rt.setOffsets(i === 0 ? 0 : 2, 0, i === n - 1 ? 0 : 2, 0);
            this.tabButtons[id] = b;
        });

        const list = box.createChild("list");
        this.list = list.getComponent(RectTransform);
        this.list.setAnchor(0, 0, 1, 1);
        list.addComponent(new UIRect({ color: "rgba(0, 0, 0, 0.25)" }));
        list.addComponent(new UIMask());
        this.content = this.list.createChild("content").getComponent(RectTransform);
        const bar = this.list.createChild("scrollbar");
        bar.addComponent(new UIRect({ color: "rgba(232, 217, 184, 0.45)" }));
        this.scroll = list.addComponent(new UIScrollView({
            content: this.content, bar: bar.getComponent(RectTransform),
            onTap: (pointer) => {
                const v = this.views.find((v) => UIKit.contains(v.go.getComponent(RectTransform), pointer.position));
                if (!v) return;
                if (this.mode === "multi") return this.toggle(v.card);
                this.select(v.card === this.selected ? null : v.card);
            }
        }));
        this.status = UIKit.label(box, "status", "", 14, 30, null, 16, { fontSize: 11, color: "#d8c8a0" });
        this.emptyText = UIKit.label(this.list, "empty", "", 0, 20, null, 16, { fontSize: 11, color: UIKit.COLORS.dim, align: "center" });

        // 아래: 설명 + 버튼
        this.info = UIKit.label(box, "info", "", 14, 0, null, 50, { fontSize: 12, color: "#d8c8a0", wrap: true, lineHeight: 1.35, rich: true });
        this.pickButton = UIKit.button(box, "pick", "고르기", () => this.confirm(), { fontSize: 13 });
        this.closeButton = UIKit.button(box, "close", "닫기", () => this.close(), { fontSize: 13 });
    }

    open() {
        this.mode = "view";
        this.onPick = null;
        this.sections = null;
        this.title.setText("덱 보기 (이번 전투)");
        this.setTab("deck");
        this.show();
    }

    // 내가 가진 행동 카드 (장비 카드·임시 카드 제외)
    openOwned() {
        this.mode = "owned";
        this.onPick = null;
        this.sections = null;
        this.title.setText(`내 카드 ${this.ownedCards().length}장`);
        this.selected = null;
        this.scroll.scrollTo(0);
        this.rebuild();
        this.show();
    }

    ownedCards() {
        return this.player.cards.allActions.filter((k) => !k.isToken && !k.isTemp);
    }

    // 설명 수치를 자세히 쓰는가 (전투 중 패·덱·묘지만 짧게)
    get verbose() {
        return this.mode !== "view";
    }

    // 카드 하나 고르기
    pick(title, cards, onPick) {
        this.mode = "pick";
        this.onPick = onPick;
        this.sections = null;
        this.pickCards = cards;
        this.title.setText(title);
        this.selected = null;
        this.rebuild();
        this.show();
    }

    // 카드 여러 장 고르기 (min 이상 max 이하). 고른 카드는 눌린 채로 보인다
    pickMany(title, cards, { min = 0, max = 1, sections = null } = {}, onDone) {
        this.mode = "multi";
        this.onDone = onDone;
        this.sections = sections && sections.length ? sections.map((s) => ({ title: s.title, cards: s.cards, max: s.max ?? max })) : null;
        this.pickCards = this.sections ? this.sections.flatMap((s) => s.cards) : cards;
        this.range = { min, max };
        this.picked = [];
        this.title.setText(title);
        this.selected = null;
        this.rebuild();
        this.show();
    }

    toggle(card) {
        const i = this.picked.indexOf(card);
        if (i >= 0) this.picked.splice(i, 1);
        else {
            const sec = this.sections?.find((s) => s.cards.includes(card));
            // 구역 한도: 가득 찼으면 한 장짜리 구역은 그 구역의 이전 선택을 바꾸고, 아니면 막는다
            if (sec && this.sectionCount(sec) >= sec.max) {
                if (sec.max !== 1) return this.select(card);
                this.picked = this.picked.filter((c) => !sec.cards.includes(c));
            }
            if (this.picked.length < this.range.max) this.picked.push(card);
            else if (this.range.max === 1) this.picked = [card];
        }
        this.select(card);
    }

    sectionCount(sec) {
        return this.picked.filter((c) => sec.cards.includes(c)).length;
    }

    show() {
        const { width, height } = Modal.fit(this.engine, this.box, 420, 560);
        this.size = { width, height };
        const pick = this.mode === "pick" || this.mode === "multi";
        const tabs = this.mode === "view";
        const sectioned = this.mode === "multi" && !!this.sections;
        this.status.gameObject.setActive(sectioned);
        this.tabsRT.gameObject.setActive(tabs);
        // 아래 설명 칸: 4줄 (넘치는 글은 카드 정보 창이 보여 준다)
        const infoH = 74;
        this.list.setOffsets(12, tabs ? 64 : sectioned ? 50 : 34, 12, 56 + infoH + 6);
        this.info.getComponent(RectTransform).setOffsets(14, height - 56 - infoH, 14, -(height - 56));
        this.closeButton.text.setText(pick ? "그만두기" : "닫기");
        this.layoutButtons(pick);
        this.select(this.selected);
        Modal.show(this.root, true);
        this._width = null;
    }

    // 아래 버튼: 두 개면 반씩, 하나면 꽉 차게
    layoutButtons(two) {
        this.pickButton.go.setActive(two);
        if (two) {
            this.pickButton.rt.setAnchor(0, 1, 0.5, 1);
            this.pickButton.rt.setOffsets(12, -46, 3, 10);
            this.closeButton.rt.setAnchor(0.5, 1, 1, 1);
            this.closeButton.rt.setOffsets(3, -46, 12, 10);
        } else {
            this.closeButton.rt.setAnchor(0, 1, 1, 1);
            this.closeButton.rt.setOffsets(12, -46, 12, 10);
        }
    }

    // 덱 보기에서 젬을 끼울 수 있는 카드인가
    socketable(card) {
        return !!(card && this.gems && card.def.spell && Spell.data(card).sockets > 0);
    }

    close() {
        if (!this.mode) return;
        this.mode = null;
        CardInspector.hide(this);
        CardInspector.untrack(this);
        Modal.show(this.root, false);
    }

    setTab(id) {
        this.tab = id;
        this.selected = null;
        this.scroll.scrollTo(0);
        this.rebuild();
    }

    entries() {
        if (this.mode === "pick" || this.mode === "multi") return this.pickCards;
        const c = this.player.cards;
        if (this.mode === "owned") return [...this.ownedCards()].sort((a, b) => a.def.name.localeCompare(b.def.name, "ko"));
        const byName = (list) => [...list].sort((a, b) => a.def.name.localeCompare(b.def.name, "ko"));
        if (this.tab === "deck") return byName(c.deck);
        if (this.tab === "graveyard") return [...c.graveyard].reverse();
        return byName([...c.hand.filter((k) => k.isSkill), ...c.deck, ...c.graveyard]);
    }

    select(card) {
        this.selected = card;
        const multi = this.mode === "multi";
        for (const v of this.views) v.view.setSelected(multi ? this.picked.includes(v.card) : v.card === card);
        const hint = multi ? `카드를 눌러 고른다 (${this.range.min === this.range.max ? this.range.min : this.range.min + "~" + this.range.max}장)` : this.mode === "pick" ? "카드를 눌러 고른다" : "카드를 누르면 설명이 나온다";
        this.info.setText(card ? `${card.name} · ${CardDef.kindName(card.def)}${card.cost ? " · " + CardDef.costText(card.cost) : ""}\n${card.text(this.verbose)}` : hint);
        const v = card && this.views.find((x) => x.card === card);
        if (card) CardInspector.show(card, { verbose: this.verbose, near: v ? this.info.getComponent(RectTransform) : null, owner: this });
        else CardInspector.hide(this);
        if (multi) {
            this.pickButton.text.setText(`확정 (${this.picked.length}장)`);
            if (this.sections) this.status.setText(`${this.sections.map((s) => `${s.title} ${this.sectionCount(s)}/${s.max}`).join(" · ")}  (합계 ${this.picked.length}/${this.range.min === this.range.max ? this.range.max : this.range.min + "~" + this.range.max})`);
            UIKit.setEnabled(this.pickButton, this.picked.length >= this.range.min && this.picked.length <= this.range.max);
        } else if (this.mode === "pick") UIKit.setEnabled(this.pickButton, !!card);
        else {
            const gem = this.socketable(card);
            this.layoutButtons(gem);
            if (gem) {
                const d = Spell.data(card);
                this.pickButton.text.setText(`젬 ${d.gems.length}/${d.sockets}`);
                UIKit.setEnabled(this.pickButton, true);
            }
        }
    }

    confirm() {
        if (this.mode === "view" && this.socketable(this.selected)) {
            const card = this.selected;
            this.close();
            this.gems.openCard(card);
            return;
        }
        if (this.mode === "multi") {
            if (this.picked.length < this.range.min) return;
            const picks = [...this.picked];
            const done = this.onDone;
            this.close();
            if (done) done(picks);
            return;
        }
        if (this.mode !== "pick" || !this.selected) return;
        const card = this.selected;
        const fn = this.onPick;
        this.close();
        if (fn) fn(card);
    }

    rebuild() {
        for (const v of this.views) v.go.destroy();
        for (const h of this.headers) { h.go.destroy(); h.emptyGo?.destroy(); }
        this.views = [];
        this.headers = [];
        CardInspector.untrack(this);
        const add = (card, sec) => {
            const go = this.content.createChild("card");
            const view = go.addComponent(new CardView(card));
            this.views.push({ go, view, card, sec });
            CardInspector.track(this, go.getComponent(RectTransform), card, this.verbose);
        };
        if (this.mode === "multi" && this.sections) {
            this.sections.forEach((sec, si) => {
                const text = UIKit.label(this.content, "header", `${sec.title} (${sec.cards.length}장)`, 8, 0, 100, 14, { fontSize: 12, fontWeight: "bold", color: UIKit.COLORS.gold });
                const empty = sec.cards.length ? null : UIKit.label(this.content, "empty", "비어 있다", 8, 0, 100, 14, { fontSize: 11, color: UIKit.COLORS.dim });
                this.headers.push({ go: text.gameObject, text, empty, emptyGo: empty?.gameObject, sec: si });
                for (const card of sec.cards) add(card, si);
            });
        } else for (const card of this.entries()) add(card, -1);
        this.emptyText.setText(this.views.length || this.sections ? "" : "카드가 없다");
        if (this.mode === "view") {
            const c = this.player.cards;
            const counts = { deck: c.deck.length, graveyard: c.graveyard.length, all: c.hand.filter((k) => k.isSkill).length + c.deck.length + c.graveyard.length };
            for (const [id, label] of DeckViewer.TABS) {
                const b = this.tabButtons[id];
                b.text.setText(`${label} ${counts[id]}`);
                b.rect.color = id === this.tab ? UIKit.COLORS.buttonOn : UIKit.COLORS.buttonOff;
            }
        }
        this.select(null);
        this._width = null;
    }

    update() {
        if (!this.mode) return;
        if (Input.getButtonDown("cancel")) return this.close();
        const width = Math.round(this.list.rect.width / this.list.uiRoot.scale);
        if (width === this._width || width <= 0) return;
        this._width = width;
        const w = DeckViewer.CARD_W;
        const gap = 8;
        const cols = Math.max(2, Math.floor((width - gap) / (w + gap)));
        const left = Math.floor((width - (cols * w + (cols - 1) * gap)) / 2);
        if (this.sections && this.mode === "multi") return this.layoutSections(width, w, gap, cols, left);
        let h = 0;
        this.views.forEach((v, i) => {
            h = v.view.layout(w);
            CardView.place(v.go, left + (i % cols) * (w + gap), gap + Math.floor(i / cols) * (h + gap), w, h);
        });
        this.scroll.contentHeight = this.views.length ? gap + Math.ceil(this.views.length / cols) * (h + gap) : 0;
    }

    // 구역별 배치: 머리글 한 줄, 그 아래 카드 격자 (비면 "비어 있다")
    layoutSections(width, w, gap, cols, left) {
        let y = gap;
        this.headers.forEach((hd) => {
            UIKit.place(hd.go, 8, y, width - 16, 14);
            y += 18;
            const vs = this.views.filter((v) => v.sec === hd.sec);
            if (!vs.length) {
                UIKit.place(hd.emptyGo, 8 + 6, y, width - 24, 14);
                y += 22;
                return;
            }
            let h = 0;
            vs.forEach((v, i) => {
                h = v.view.layout(w);
                CardView.place(v.go, left + (i % cols) * (w + gap), y + Math.floor(i / cols) * (h + gap), w, h);
            });
            y += Math.ceil(vs.length / cols) * (h + gap) + 4;
        });
        this.scroll.contentHeight = y;
    }
}

// 카드 고르기 창구: 카드가 쓰는 도중 "버릴 카드를 골라라" 같은 것을 DeckViewer에게 부탁한다 (main.js가 viewer를 정한다)
class CardPicker {
    static viewer = null;

    // opts.sections: [{ title, cards, max }] — 구역별로 나눠 보이고 구역마다 max장까지 (CardOps.zonePick이 만든다)
    static open(title, cards, min, max, done, opts = {}) {
        CardPicker.viewer.pickMany(title, cards, { min, max, sections: opts.sections ?? null }, done);
    }
}

/* ===== assets/dat/ui/dialog/RewardDialog.js ===== */
// 보상 창: 전투에서 이기거나 보물 상자를 열면 뜬다.
//   돈은 창이 뜰 때 바로 들어온다. 카드 3장 중 하나를 골라 덱에 넣는다(건너뛸 수 있다). 물건은 하나씩 [가져가기] (패에 자리가 있어야).
// 창을 닫아도 못 가진 보상은 남는다: 화면 위 가운데 [보상] 버튼으로 다시 연다 (다음 방에 들어가면 사라진다).
class RewardDialog extends Component {
    static CARD_W = 84;

    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.reward = null; // { title, gold, cards, items, picked }
        this.views = [];
        this.rows = [];
        this.choice = null;
    }

    get isOpen() {
        return this.root && this.root.isActive;
    }

    // 아직 안 가진 게 남았는가
    get unclaimed() {
        const r = this.reward;
        return !!r && ((!r.picked && r.cards.length > 0) || r.items.length > 0);
    }

    start() {
        const { root, box } = Modal.create(this.engine, "reward", 340, 460, () => this.close());
        this.root = root;
        this.box = box;
        this.title = UIKit.label(box, "title", "", 14, 10, null, 18, { fontSize: 14, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.goldText = UIKit.label(box, "gold", "", 14, 32, null, 16, { fontSize: 12, color: "#f0d878" });
        this.cardLabel = UIKit.label(box, "cardLabel", "카드 한 장을 골라 덱에 넣는다", 14, 54, null, 14, { fontSize: 11, color: "#c8b890" });
        this.cardRow = box.createChild("cards").getComponent(RectTransform);
        this.cardRow.setAnchor(0, 0, 1, 0);
        this.cardRow.setOffsets(0, 72, 0, -(72 + 150));
        this.takeCard = UIKit.button(box, "takeCard", "이 카드를 덱에 넣기", () => this.pickCard(), { fontSize: 12 });
        this.itemsRT = box.createChild("items").getComponent(RectTransform);
        this.itemsRT.setAnchor(0, 0, 1, 0);
        this.closeButton = UIKit.button(box, "close", "닫기", () => this.close(), { fontSize: 13 });
        this.closeButton.rt.setAnchor(0, 1, 1, 1);
        this.closeButton.rt.setOffsets(12, -44, 12, 10);

        // 다시 열기 버튼 (위 가운데)
        this.reopen = this.engine.createUI("rewardReopen");
        const rrt = this.reopen.getComponent(RectTransform);
        rrt.sortOrder = UILayer.TARGET;
        rrt.setAnchor(0.5, 0, 0.5, 0);
        rrt.setSizeAndPosition(110, 30, 0, 86);
        const b = UIKit.button(rrt, "button", "보상 받기", () => this.show(), { fontSize: 12 });
        b.rt.setAnchor(0, 0, 1, 1);
        b.rect.borderColor = UIKit.COLORS.gold;
        this.reopen.setActive(false);
        Events.on(GameEvent.ROOM_ENTERED, () => {
            this.reward = null;
            this.reopen.setActive(false);
        }, { owner: this });
    }

    // reward: { title, gold, cards: [Card], items: [Card] }
    open(reward) {
        this.reward = { ...reward, picked: false };
        if (reward.gold) {
            this.player.money += reward.gold;
            MessageLog.add(`${reward.gold} G를 얻었다`, "#f0d878");
        }
        this.show();
    }

    // 다른 방에 갔다가 돌아왔을 때: 못 받은 보상을 되살린다 (돈은 이미 받았다). 창은 안 띄우고 [보상 받기] 버튼만
    restore(saved) {
        this.reward = { title: saved.title, gold: 0, picked: !!saved.picked, cards: (saved.cards ?? []).map((id) => new Card(id)), items: (saved.items ?? []).map((id) => new Card(id)) };
        this.reopen.setActive(this.unclaimed);
        if (this.unclaimed) MessageLog.add("받지 않은 보상이 남아 있다 ([보상 받기])", "#f0d878");
    }

    show() {
        if (!this.reward) return;
        const r = this.reward;
        this.choice = null;
        this.title.setText(r.title);
        this.goldText.setText(r.gold ? `돈 +${r.gold} G (지금 ${this.player.money} G)` : "");
        this.build();
        Modal.show(this.root, true);
        this.reopen.setActive(false);
    }

    close() {
        if (!this.isOpen) return;
        CardInspector.hide(this);
        CardInspector.untrack(this);
        Modal.show(this.root, false);
        this.reopen.setActive(this.unclaimed);
    }

    build() {
        const r = this.reward;
        for (const v of this.views) v.go.destroy();
        for (const row of this.rows) row.destroy();
        this.views = [];
        this.rows = [];
        CardInspector.untrack(this);
        CardInspector.hide(this);
        const showCards = !r.picked && r.cards.length > 0;
        this.cardLabel.gameObject.setActive(showCards);
        this.takeCard.go.setActive(showCards);
        const w = RewardDialog.CARD_W;
        const h = Math.round(w * 5 / 3);
        let y = 72;
        if (showCards) {
            const boxW = Modal.fit(this.engine, this.box, 340, 460).width;
            const gap = 10;
            const total = r.cards.length * w + (r.cards.length - 1) * gap;
            r.cards.forEach((card, i) => {
                const go = this.cardRow.createChild("card");
                const view = go.addComponent(new CardView(card));
                view.layout(w);
                CardView.place(go, (boxW - total) / 2 + i * (w + gap), 0, w, h);
                go.addComponent(new UIButton({ onTap: () => this.choose(card) }));
                this.views.push({ go, view, card });
                CardInspector.track(this, go.getComponent(RectTransform), card, true);
            });
            this.cardRow.setOffsets(0, y, 0, -(y + h));
            y += h + 8;
            this.takeCard.rt.setAnchor(0, 0, 1, 0);
            this.takeCard.rt.setOffsets(40, y, 40, -(y + 30));
            y += 40;
        }
        UIKit.setEnabled(this.takeCard, false);
        this.itemsRT.setOffsets(12, y, 12, -(y + r.items.length * 46));
        r.items.forEach((card, i) => {
            const go = this.itemsRT.createChild("item");
            const rt = UIKit.place(go, 0, i * 46, null, 40);
            go.addComponent(new UIRect({ color: "rgba(42, 35, 30, 0.95)", borderColor: UIKit.COLORS.border, borderWidth: 1 }));
            go.addComponent(new UIButton({ onTap: () => CardInspector.show(card, { verbose: true, owner: this, near: rt }) }));
            CardInspector.track(this, rt, card, true);
            UIKit.icon(rt, "icon", card.def, 4, 4, 32);
            UIKit.label(rt, "name", card.name, 44, 5, null, 15, { fontSize: 12, fontWeight: "bold" });
            UIKit.label(rt, "info", card.summary.split("\n")[0], 44, 21, null, 14, { fontSize: 10, color: "#c8b890", rich: true });
            const fits = this.player.cards.canAdd(card);
            const b = UIKit.button(rt, "take", fits ? "가져가기" : "패가 가득", () => this.take(card), { fontSize: 11 });
            b.rt.setAnchor(1, 0, 1, 0);
            b.rt.setOffsets(-78, 6, 6, -34);
            UIKit.setEnabled(b, fits);
            this.rows.push(go);
        });
        y += r.items.length * 46;
        if (!showCards && !r.items.length) {
            this.cardLabel.gameObject.setActive(true);
            this.cardLabel.setText(r.picked ? "보상을 모두 받았다" : "받을 것이 없다");
        } else this.cardLabel.setText("카드 한 장을 골라 덱에 넣는다 (건너뛰어도 된다)");
        Modal.fit(this.engine, this.box, 340, Math.max(200, y + 60));
    }

    choose(card) {
        this.choice = card;
        for (const v of this.views) v.view.setSelected(v.card === card);
        UIKit.setEnabled(this.takeCard, true);
        this.takeCard.text.setText(`[${card.name}] 덱에 넣기`);
        const v = this.views.find((x) => x.card === card);
        CardInspector.show(card, { verbose: true, owner: this, near: v ? v.go.getComponent(RectTransform) : null });
    }

    pickCard() {
        const r = this.reward;
        if (!r || r.picked || !this.choice) return;
        r.picked = true;
        this.player.cards.addToDeck(this.choice);
        MessageLog.add(`${josa(this.choice.name, "을를")} 덱에 넣었다`, "#a0b8e8");
        this.build();
    }

    take(card) {
        const r = this.reward;
        if (!this.player.cards.addToHand(card)) {
            MessageLog.add("패가 가득 찼다", "#c8b890");
            return;
        }
        r.items.splice(r.items.indexOf(card), 1);
        MessageLog.add(`${josa(card.name, "을를")} 얻었다`, "#e8c860");
        this.build();
    }

    update() {
        if (this.isOpen && Input.getButtonDown("cancel")) this.close();
        if (!this.isOpen && this.reopen.isActive && !this.unclaimed) this.reopen.setActive(false);
    }
}

/* ===== assets/dat/ui/dialog/ShopDialog.js ===== */
// 상점 창 (상인에게 말을 걸면). 물건마다 한 줄: 그림, 이름, 짧은 설명, 값 [사기].
//   목록은 페이지식이다: 한 쪽에 들어가는 만큼만 보이고, 아래 [▲]/[▼]로 쪽을 넘긴다 (끌어서 스크롤하지 않는다).
//   행동 카드(주문 포함)는 사면 덱에 들어간다. 장비·소모품·젬은 패에 들어간다 (자리가 있어야).
//   위쪽 "카드 강화": 상인이 파는 강화 3개 (붉은·푸른·노란 중 2 + 초록·보라 중 1). 사면 카드 한 장을 골라 강화한다 (UpgradeFlow). 살 때마다 값이 50%씩 오른다.
//   아래쪽 "카드 정리": [카드 빼기]: 덱에서 카드 한 장을 아주 없앤다 (상점마다 한 번, 값은 할 때마다 오른다).
// 거래는 턴을 쓰지 않는다.
class ShopDialog extends Component {
    static ROW = 64;
    static HEAD = 24;

    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.run = options.run;
        this.deckView = options.deckView;

        this._key = null;
    }

    get isOpen() {
        return this.npc !== null;
    }

    start() {
        const { root, box } = Modal.create(this.engine, "shop", 360, 520, () => this.close());
        this.root = root;
        this.box = box;
        this.title = UIKit.label(box, "title", "", 14, 10, null, 18, { fontSize: 13, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.line = UIKit.label(box, "line", "", 14, 30, null, 30, { fontSize: 11, color: "#e8d9b8", wrap: true, lineHeight: 1.3 });
        this.moneyText = UIKit.label(box, "money", "", 14, 60, null, 16, { fontSize: 12, color: "#f0d878" });

        const list = box.createChild("list");
        this.list = list.getComponent(RectTransform);
        this.list.setAnchor(0, 0, 1, 1);
        this.list.setOffsets(12, 82, 12, 94);
        list.addComponent(new UIRect({ color: "rgba(0, 0, 0, 0.25)" }));
        list.addComponent(new UIMask());
        this.content = this.list.createChild("content").getComponent(RectTransform);
        this.content.setAnchor(0, 0, 1, 1);
        this.content.setOffsets(0, 0, 0, 0);

        // 쪽 넘기기: [▲] 1/2 쪽 [▼]
        this.page = 0;
        this.prevButton = UIKit.button(box, "prev", "▲ 위", () => this.turnPage(-1), { fontSize: 12 });
        this.prevButton.rt.setAnchor(0, 1, 0.4, 1);
        this.prevButton.rt.setOffsets(12, -86, 3, 52);
        this.pageText = UIKit.label(box, "page", "", 0, 0, null, 18, { fontSize: 12, color: "#c8b890", align: "center", verticalAlign: "middle" });
        const prt = this.pageText.gameObject.getComponent(RectTransform);
        prt.setAnchor(0.4, 1, 0.6, 1);
        prt.setOffsets(0, -86, 0, 52);
        this.nextButton = UIKit.button(box, "next", "▼ 아래", () => this.turnPage(1), { fontSize: 12 });
        this.nextButton.rt.setAnchor(0.6, 1, 1, 1);
        this.nextButton.rt.setOffsets(3, -86, 12, 52);

        const close = UIKit.button(box, "close", "나가기", () => this.close(), { fontSize: 13 });
        close.rt.setAnchor(0, 1, 1, 1);
        close.rt.setOffsets(12, -44, 12, 10);
    }

    open(npc) {
        this.npc = npc;
        this.title.setText(`상점 · ${npc.displayName}`);
        this.line.setText(`"${npc.line()}"`);
        this._key = null;
        this.page = 0;
        Modal.fit(this.engine, this.box, 360, 520);
        Modal.show(this.root, true);
    }

    close() {
        if (!this.npc) return;
        this.npc = null;
        CardInspector.hide(this);
        CardInspector.untrack(this);
        Modal.show(this.root, false);
    }

    update() {
        if (!this.npc) return;
        if (Input.getButtonDown("cancel")) return this.close();
        if (!this.npc.alive || this.npc.angry || !this.player.alive) return this.close();
        this.moneyText.setText(`내 돈 ${this.player.money} G`);
        const key = [this.player.money, this.player.cards.version, this.npc.stock.map((s) => s.sold ? 1 : 0).join(""), this.npc.upgrades.map((u) => u.sold ? 1 : 0).join("") + this.npc.buys, this.run.removeCount, this.page, this.pageSize()].join("|");
        if (key !== this._key) {
            this._key = key;
            this.rebuild();
        }
    }

    addRow(y, { def, chip, name, info, button, ok, onTap, faded, card, poor }) {
        const h = ShopDialog.ROW - 6;
        const go = this.content.createChild("row");
        const rt = UIKit.place(go, 6, y, null, h);
        const bg = go.addComponent(new UIRect({ color: faded ? "rgba(30, 26, 22, 0.8)" : "rgba(42, 35, 30, 0.95)", borderColor: UIKit.COLORS.border, borderWidth: 1 }));
        // 줄을 누르면 카드 정보 창 (마우스를 올려도)
        if (card) {
            go.addComponent(new UIButton({ onTap: () => this.inspect(card, rt, bg) }));
            CardInspector.track(this, rt, card, true);
        }
        if (chip) {
            // 색 칩: 강화 색 사각형
            const c = rt.createChild("chip");
            UIKit.place(c, 8, 9, 28, 28);
            c.addComponent(new UIRect({ color: faded ? UIKit.COLORS.faint : chip, borderColor: "rgba(0, 0, 0, 0.6)", borderWidth: 2 }));
        } else UIKit.icon(rt, "icon", def, 4, 5, 36);
        // 글자 칸: 오른쪽 값 버튼과 겹치지 않게 잘라서 보인다
        const box = rt.createChild("text");
        const brt = box.getComponent(RectTransform);
        brt.setAnchor(0, 0, 1, 1);
        brt.setOffsets(48, 0, 80, 0);
        box.addComponent(new UIMask());
        UIKit.label(brt, "name", name, 0, 6, null, 15, { fontSize: 12, fontWeight: "bold", color: faded ? UIKit.COLORS.faint : UIKit.COLORS.text });
        UIKit.label(brt, "info", info, 0, 22, null, 30, { fontSize: 10, color: faded ? UIKit.COLORS.faint : "#c8b890", rich: !faded, wrap: true, lineHeight: 1.3 });
        const b = UIKit.button(rt, "deal", button, onTap, { fontSize: 11 });
        b.rt.setAnchor(1, 0, 1, 0);
        b.rt.setOffsets(-70, (h - 30) / 2, 6, -((h - 30) / 2 + 30));
        UIKit.setEnabled(b, ok);
        if (poor) b.text.color = "#e85a4a"; // 돈이 모자라면 값이 빨갛다
        this.rows.push(go);
        return y + ShopDialog.ROW;
    }

    // 이 상점이 파는 강화 3종: 색 칩 + 이름 + 값 (품절은 흐림, 돈이 모자라면 값이 빨강)
    addUpgradeInfo(y) {
        const p = this.player;
        const go = this.content.createChild("upinfo");
        const rt = UIKit.place(go, 6, y, null, 64);
        go.addComponent(new UIRect({ color: "rgba(42, 35, 30, 0.95)", borderColor: UIKit.COLORS.border, borderWidth: 1 }));
        this.npc.upgrades.forEach((u, i) => {
            const c = UpgradeFlow.COLORS[u.color];
            const price = this.npc.upgradePrice(u.color);
            const ly = 5 + i * 19;
            const chip = rt.createChild("chip");
            UIKit.place(chip, 8, ly + 1, 14, 14);
            chip.addComponent(new UIRect({ color: u.sold ? UIKit.COLORS.faint : c.css, borderColor: "rgba(0, 0, 0, 0.6)", borderWidth: 1 }));
            UIKit.label(rt, "n" + i, `${c.name} 강화${c.hard ? " (어려움)" : ""}`, 30, ly + 1, null, 15, { fontSize: 12, fontWeight: "bold", color: u.sold ? UIKit.COLORS.faint : UIKit.COLORS.text });
            const priceText = u.sold ? "품절" : `${price} G`;
            const l = UIKit.label(rt, "p" + i, priceText, 0, ly + 1, 70, 15, { fontSize: 12, fontWeight: "bold", align: "right", color: u.sold ? UIKit.COLORS.faint : p.money < price ? "#e85a4a" : "#f0d878" });
            l.gameObject.getComponent(RectTransform).setAnchor(1, 0, 1, 0);
            l.gameObject.getComponent(RectTransform).setOffsets(-78, ly + 1, 8, -(ly + 16));
        });
        this.rows.push(go);
        return y + 70;
    }

    // 상점이 파는 색을 받을 수 있는 카드가 있나 (없으면 이유 글)
    upgradeBlock() {
        const colors = this.npc.upgrades.filter((u) => !u.sold).map((u) => u.color);
        if (colors.length === 0) return "강화가 모두 품절이다";
        if (UpgradeFlow.candidates(this.player, colors).length === 0) return "파는 색 강화를 받을 카드가 없다";
        return null;
    }

    addUpgradePick(y) {
        const why = this.upgradeBlock();
        const b = UIKit.button(this.content, "pick", why ?? "[ 강화 고르기 ]", () => this.buyUpgrade(), { fontSize: 14 });
        b.rt.setAnchor(0, 0, 1, 0);
        b.rt.setOffsets(6, y, 6, -(y + 32));
        UIKit.setEnabled(b, !why);
        if (!why) b.text.color = UIKit.COLORS.gold;
        this.rows.push(b.go);
        const sub = UIKit.label(this.content, "pickhint", why ? "" : "카드를 고르면 받을 수 있는 강화와 효과 변화를 본다", 10, y + 34, null, 13, { fontSize: 10, color: "#c8b890" });
        this.rows.push(sub.gameObject);
        return y + 52;
    }

    // 목록 높이 (논리 단위)
    pageSize() {
        return Math.floor(this.list.rect.height / this.list.uiRoot.scale);
    }

    // 구분 글자 줄 (낮다)
    addHeader(y, text) {
        const go = this.content.createChild("head");
        const rt = UIKit.place(go, 6, y, null, ShopDialog.HEAD);
        UIKit.label(rt, "t", text, 4, 5, null, 16, { fontSize: 12, fontWeight: "bold", color: UIKit.COLORS.gold });
        const line = rt.createChild("line");
        UIKit.place(line, 0, ShopDialog.HEAD - 2, null, 1);
        line.addComponent(new UIRect({ color: UIKit.COLORS.border }));
        this.rows.push(go);
        return y + ShopDialog.HEAD;
    }

    // 높이를 채워 가며 쪽으로 나눈다 (구분 글자 줄은 낮다)
    paginate(entries, height) {
        const pages = [[]];
        let used = 6;
        for (const e of entries) {
            const h = e.h ?? (e.head ? ShopDialog.HEAD : ShopDialog.ROW);
            if (used + h > height && pages[pages.length - 1].length > 0) {
                pages.push([]);
                used = 6;
            }
            pages[pages.length - 1].push(e);
            used += h;
        }
        return pages;
    }

    turnPage(d) {
        CardInspector.hide(this);
        this.page += d;
        this._key = null; // 다음 update에서 다시 그린다 (쪽이 범위를 넘으면 rebuild가 바로잡는다)
    }

    // 목록의 줄: 카드 강화 3개, 카드 빼기 (물건은 진열대에 바닥에 놓여 있고 옆에서 상호작용하면 산다: Run.shopItems)
    entries() {
        const list = [{ head: "카드 강화" }];
        list.push({ upgradeInfo: true, h: 70 }, { upgradePick: true, h: 52 });
        list.push({ head: "카드 정리" }, { remove: true });
        return list;
    }

    rebuild() {
        for (const row of this.rows) row.destroy();
        this.rows = [];
        CardInspector.untrack(this);
        const p = this.player;
        const entries = this.entries();
        const chunks = this.paginate(entries, this.pageSize());
        const pages = chunks.length;
        this.page = Math.max(0, Math.min(pages - 1, this.page));
        this.pageText.setText(`${this.page + 1} / ${pages} 쪽`);
        UIKit.setEnabled(this.prevButton, this.page > 0);
        UIKit.setEnabled(this.nextButton, this.page < pages - 1);
        let y = 6;
        for (const entry of chunks[this.page]) {
            if (entry.head) {
                y = this.addHeader(y, entry.head);
                continue;
            }
            if (entry.upgradeInfo) {
                y = this.addUpgradeInfo(y);
                continue;
            }
            if (entry.upgradePick) {
                y = this.addUpgradePick(y);
                continue;
            }
            if (entry.remove) {
                const cost = this.run.removeCost;
                y = this.addRow(y, {
                    def: { sprite: "cards", frame: 9 }, name: "카드 빼기",
                    info: `덱에서 카드 한 장을 아주 없앤다 (이 상점에서 뺄 때마다 +25 G${this.run.removeCount ? `, ${this.run.removeCount}번 뺐다` : ""})`,
                    button: `${cost} G`, ok: p.money >= cost && p.cards.allActions.length > 1, poor: p.money < cost,
                    onTap: () => this.remove()
                });
                continue;
            }
            const offer = entry.offer;
            const card = offer.card;
            const where = card.isSkill ? "덱에" : "패에";
            const kind = CardDef.kindName(card.def) + (card.def.rarity ? ` · ${ShopDialog.RARITY[card.def.rarity]}` : "");
            const fits = card.isSkill || p.cards.canAdd(card);
            y = this.addRow(y, {
                def: card.def, name: offer.sold ? `${card.name} (팔림)` : card.name,
                info: `${kind}${card.cost ? " · " + CardDef.costText(card.cost) : ""} · ${card.summary.split("\n")[0]}`,
                button: offer.sold ? "팔림" : fits ? `${offer.price} G` : "패가 가득",
                ok: !offer.sold && fits && p.money >= offer.price,
                faded: offer.sold,
                card,
                onTap: () => this.buy(offer, where)
            });
        }
    }

    static RARITY = { common: "흔함", uncommon: "드묾", rare: "희귀", boss: "우두머리" };

    // 물건 줄을 누르면 크게 보기 (다시 누르면 닫기)
    inspect(card, rt, bg) {
        const same = this.selected === card;
        CardInspector.hide(this); // 앞에 고른 줄 표시를 푼다 (onHide)
        if (same) return;
        this.selected = card;
        this._selBg = bg;
        if (bg) bg.borderColor = UIKit.COLORS.gold;
        CardInspector.show(card, {
            verbose: true, owner: this, near: rt,
            onHide: () => {
                if (this._selBg) this._selBg.borderColor = UIKit.COLORS.border;
                this._selBg = null;
                this.selected = null;
            }
        });
    }

    buy(offer, where) {
        const p = this.player;
        if (offer.sold || p.money < offer.price) return;
        const card = offer.card;
        if (card.isSkill) p.cards.addToDeck(card);
        else if (!p.cards.addToHand(card)) {
            MessageLog.add("패가 가득 차서 살 수 없다", "#c8b890");
            return;
        }
        p.money -= offer.price;
        this.npc.money += offer.price;
        offer.sold = true;
        MessageLog.add(`${josa(card.name, "을를")} ${offer.price} G에 샀다 (${where})`, "#e8c860");
    }

    // 카드 강화 사기: 상점 창을 닫고 강화 흐름을 연다 (카드 → 가능한 강화 전부 보며 고르기).
    // 실제로 강화됐을 때(onDone(카드, 색))만 그 색의 값을 내고 품절로 한다. 끝나면 상점 창을 다시 연다
    buyUpgrade() {
        const p = this.player;
        const npc = this.npc;
        if (this.upgradeBlock()) return;
        const prices = {};
        const sold = {};
        for (const u of npc.upgrades) {
            prices[u.color] = npc.upgradePrice(u.color);
            if (u.sold) sold[u.color] = true;
        }
        this.close();
        UpgradeFlow.open({
            title: "강화 · 카드를 고른다",
            shop: { prices, sold, money: () => p.money },
            onDone: (card, color) => {
                const u = card && npc.upgrades.find((x) => x.color === color);
                if (u && !u.sold) {
                    const price = prices[color];
                    p.money -= price;
                    npc.money += price;
                    u.sold = true;
                    npc.buys++;
                    MessageLog.add(`${UpgradeFlow.COLORS[color].name} 강화를 ${price} G에 샀다`, "#e8c860");
                }
                if (npc.alive && !npc.angry && p.alive) this.open(npc);
            }
        });
    }

    remove() {
        const p = this.player;
        const cost = this.run.removeCost;
        if (p.money < cost || p.cards.allActions.length <= 1) return;
        const npc = this.npc;
        this.deckView.pick(`카드 빼기 (${cost} G) · 없앨 카드를 고른다`, p.cards.allActions, (card) => {
            if (p.money < cost || this.run.removeCost !== cost) return;
            if (!p.cards.removeCard(card)) return;
            p.money -= cost;
            npc.money += cost;
            this.run.removeCount++;
            MessageLog.add(`${josa(card.name, "을를")} 덱에서 뺐다 (${cost} G)`, "#e8c860");
        });
    }
}

/* ===== assets/dat/ui/dialog/RestDialog.js ===== */
// 모닥불 창 (휴식처). 넷 중 하나만 고른다:
//   쉬기   — 최대 체력의 30%를 회복한다
//   명상   — 마나를 가득 채운다
//   정리   — 덱에서 카드 한 장을 아주 없앤다 (공짜)
//   강화   — 카드를 먼저 고르면(UpgradeFlow) 그 카드가 받을 수 있는 강화와 바뀌는 효과를 보여 주고, 하나를 골라 강화 카드로 바꾼다
// 고르면 모닥불은 다 쓴 것이 되고, 출구로 나가면 된다.
class RestDialog extends Component {
    static HEAL = 0.3;

    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.deckView = options.deckView;
        this.fire = null;
        this.buttons = [];
    }

    get isOpen() {
        return this.fire !== null;
    }

    start() {
        const { root, box } = Modal.create(this.engine, "rest", 360, 296, () => this.close());
        this.root = root;
        this.box = box;
        UIKit.label(box, "title", "모닥불", 14, 10, null, 18, { fontSize: 14, fontWeight: "bold", color: UIKit.COLORS.gold });
        UIKit.label(box, "sub", "따뜻하다. 하나만 고를 수 있다.", 14, 32, null, 14, { fontSize: 11, color: "#c8b890" });
        this.options = [
            ["heal", () => `쉬기 · 체력 +${this.healAmount()} (최대의 30%)`, () => this.heal()],
            ["mana", () => `명상 · 마나를 가득 (${this.player.mana}/${this.player.maxMana})`, () => this.meditate()],
            ["purge", () => "정리 · 덱에서 카드 한 장 빼기", () => this.purge()],
            ["upgrade", () => `강화 · 카드를 고르면 가능한 강화와 바뀌는 효과를 보고 고른다 (${this.upgradable().length}장)`, () => this.upgrade()]
        ];
        this.options.forEach(([id, , fn], i) => {
            const b = UIKit.button(box, id, "", fn, { fontSize: 12 });
            b.rt.setAnchor(0, 0, 1, 0);
            b.rt.setOffsets(14, 58 + i * 44, 14, -(58 + i * 44 + 36));
            b.text.wrap = true; // 긴 글은 줄바꿈 (좁은 창)
            b.text.lineHeight = 1.2;
            this.buttons.push(b);
        });
        const close = UIKit.button(box, "close", "나중에", () => this.close(), { fontSize: 12 });
        close.rt.setAnchor(0, 1, 1, 1);
        close.rt.setOffsets(14, -42, 14, 10);
    }

    healAmount() {
        const s = this.player.stats;
        return Math.min(s.maxHp - s.hp, Math.floor(s.maxHp * RestDialog.HEAL + 1e-9));
    }

    open(fire) {
        this.fire = fire;
        this.options.forEach(([, label], i) => this.buttons[i].text.setText(label()));
        UIKit.setEnabled(this.buttons[0], this.healAmount() > 0);
        UIKit.setEnabled(this.buttons[1], this.player.mana < this.player.maxMana);
        UIKit.setEnabled(this.buttons[2], this.player.cards.allActions.length > 1);
        UIKit.setEnabled(this.buttons[3], this.upgradable().length > 0);
        Modal.fit(this.engine, this.box, 360, 296);
        Modal.show(this.root, true);
    }

    close() {
        if (!this.fire) return;
        this.fire = null;
        Modal.show(this.root, false);
    }

    done(message) {
        if (this.fire) this.fire.used = true;
        MessageLog.add(message, "#f0c080");
        this.close();
    }

    heal() {
        const n = this.healAmount();
        if (n <= 0) return;
        this.player.stats.hp += n;
        this.player.overlay && (this.player.overlay.popup = null);
        this.done(`푹 쉬었다. 체력 ${n} 회복`);
    }

    meditate() {
        const p = this.player;
        if (p.mana >= p.maxMana) return;
        const n = p.maxMana - p.mana;
        p.mana = p.maxMana;
        this.done(`명상했다. 마나 ${n} 회복`);
    }

    purge() {
        const fire = this.fire;
        this.close();
        this.deckView.pick("정리 · 없앨 카드를 고른다", this.player.cards.allActions, (card) => {
            if (!this.player.cards.removeCard(card)) return;
            fire.used = true;
            MessageLog.add(`${josa(card.name, "을를")} 모닥불에 던졌다 (덱에서 빠졌다)`, "#f0c080");
        });
    }

    // 강화할 수 있는 카드들
    upgradable() {
        return UpgradeFlow.candidates(this.player);
    }

    // 강화: 공용 흐름(UpgradeFlow)에 맡긴다. 창을 먼저 닫고(겹침 방지) 연다
    upgrade() {
        const fire = this.fire;
        this.close();
        UpgradeFlow.open({ colors: null, title: "강화 · 카드를 고른다", onDone: (c) => { if (c) fire.used = true; } });
    }

    update() {
        if (this.fire && Input.getButtonDown("cancel")) this.close();
    }
}

/* ===== assets/dat/ui/dialog/EquipDialog.js ===== */
// 장비 창: 소지품 패에 있는 장비를 장착·해제한다 (턴을 쓰지 않는다).
//   전투 중에는 아래 패에서 장비 카드를 눌러 [장착]/[해제] 하면 되고, 지도 화면(HandBar가 가려진 곳)에서는 이 창을 쓴다.
//   장비는 장착해도 패에 그대로 남는다. 착용 중인 것은 위에, 그 아래에 안 입은 것. 부위 없이 몇 개든 겹쳐 입을 수 있다
//   패가 넘치게 되는 장착·해제는 막힌다 (Card.js CardSystem).
class EquipDialog extends Component {
    static ROW = 56;

    // options: { engine, player }
    constructor(options) {
        super();
        this.engine = options.engine;
        this.player = options.player;
        this.rows = [];
        this._key = null;
        this.opened = false;
    }

    get isOpen() {
        return this.opened;
    }

    start() {
        const { root, box } = Modal.create(this.engine, "equip", 340, 460, () => this.close());
        this.root = root;
        this.box = box;
        UIKit.label(box, "title", "장비", 14, 10, null, 18, { fontSize: 14, fontWeight: "bold", color: UIKit.COLORS.gold });
        this.info = UIKit.label(box, "info", "", 14, 32, null, 30, { fontSize: 11, color: "#c8b890", wrap: true, lineHeight: 1.3 });
        const list = box.createChild("list");
        this.list = list.getComponent(RectTransform);
        this.list.setAnchor(0, 0, 1, 1);
        this.list.setOffsets(12, 66, 12, 52);
        list.addComponent(new UIRect({ color: "rgba(0, 0, 0, 0.25)" }));
        list.addComponent(new UIMask());
        this.content = this.list.createChild("content").getComponent(RectTransform);
        const bar = this.list.createChild("scrollbar");
        bar.addComponent(new UIRect({ color: "rgba(232, 217, 184, 0.45)" }));
        this.scroll = list.addComponent(new UIScrollView({ content: this.content, bar: bar.getComponent(RectTransform) }));
        const close = UIKit.button(box, "close", "닫기", () => this.close(), { fontSize: 13 });
        close.rt.setAnchor(0, 1, 1, 1);
        close.rt.setOffsets(12, -44, 12, 10);
    }

    open() {
        if (this.opened) return;
        this.opened = true;
        this._key = null;
        Modal.fit(this.engine, this.box, 340, 460);
        Modal.show(this.root, true);
        this.scroll.scrollTo(0);
    }

    close() {
        if (!this.opened) return;
        this.opened = false;
        CardInspector.hide(this);
        CardInspector.untrack(this);
        Modal.show(this.root, false);
    }

    update() {
        if (!this.opened) return;
        if (Input.getButtonDown("cancel")) return this.close();
        const cards = this.player.cards;
        const key = cards.version + ":" + cards.hand.length;
        if (key !== this._key) {
            this._key = key;
            this.rebuild();
        }
    }

    rebuild() {
        for (const row of this.rows) row.destroy();
        this.rows = [];
        CardInspector.untrack(this);
        const cards = this.player.cards;
        const gear = cards.hand.filter((c) => c.def.slot);
        const worn = gear.filter((c) => cards.isEquipped(c));
        const rest = gear.filter((c) => !cards.isEquipped(c));
        this.info.setText("장비는 장착해도 패에 남는다. 장착·해제는 턴을 쓰지 않고, 해제하면 그 효과도 바로 사라진다.");
        let y = 6;
        const section = (text) => {
            UIKit.label(this.content, "sec", text, 8, y, null, 14, { fontSize: 11, fontWeight: "bold", color: "#c8b890" });
            y += 18;
        };
        section(`착용 중 (${worn.length})`);
        if (!worn.length) {
            UIKit.label(this.content, "none", "입은 장비가 없다", 8, y, null, 14, { fontSize: 11, color: UIKit.COLORS.faint });
            y += 20;
        }
        for (const card of worn) y = this.addRow(y, card, true);
        y += 6;
        section(`패에 있는 장비 (${rest.length})`);
        if (!rest.length) {
            UIKit.label(this.content, "none2", "더 가진 장비가 없다 (상점, 정예, 보물, 우두머리에서 얻는다)", 8, y, null, 14, { fontSize: 11, color: UIKit.COLORS.faint });
            y += 20;
        }
        for (const card of rest) y = this.addRow(y, card, false);
        this.scroll.contentHeight = y + 6;
    }

    addRow(y, card, worn) {
        const h = EquipDialog.ROW - 6;
        const go = this.content.createChild("row");
        const rt = UIKit.place(go, 6, y, null, h);
        const bg = go.addComponent(new UIRect({ color: worn ? "rgba(58, 46, 24, 0.95)" : "rgba(42, 35, 30, 0.95)", borderColor: worn ? "#b07820" : UIKit.COLORS.border, borderWidth: 1 }));
        go.addComponent(new UIButton({ onTap: () => CardInspector.show(card, { verbose: true, owner: this, near: rt }) }));
        CardInspector.track(this, rt, card, true);
        UIKit.icon(rt, "icon", card.def, 4, 5, 36);
        const box = rt.createChild("text");
        const brt = box.getComponent(RectTransform);
        brt.setAnchor(0, 0, 1, 1);
        brt.setOffsets(48, 0, 80, 0);
        box.addComponent(new UIMask());
        UIKit.label(brt, "name", card.name, 0, 5, null, 15, { fontSize: 12, fontWeight: "bold" });
        UIKit.label(brt, "info", card.summary.split("\n")[0], 0, 21, null, 26, { fontSize: 10, color: "#c8b890", rich: true, wrap: true, lineHeight: 1.3 });
        const b = UIKit.button(rt, "toggle", worn ? "해제" : "장착", () => this.toggle(card), { fontSize: 11 });
        b.rt.setAnchor(1, 0, 1, 0);
        b.rt.setOffsets(-70, (h - 30) / 2, 6, -((h - 30) / 2 + 30));
        this.rows.push(go);
        return y + EquipDialog.ROW;
    }

    toggle(card) {
        const cards = this.player.cards;
        if (cards.isEquipped(card)) cards.unequip(card);
        else cards.equip(card);
    }
}
