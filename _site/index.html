/* ===== assets/dat/entity/Pickups.js ===== */
// 바닥에 떨어진 것: 전투 보상, 보물 방의 물건, 상점 진열대. 길을 막지 않아서 위를 지나다닐 수 있고, 지나가기만 해서는 줍지 않는다.
// 그 칸 바로 위에 서서 상호작용(손 버튼·E, 서 있는 칸을 다시 탭해도 된다)해야 가진다 (interact → Pickups.collect). 옆칸에서는 안 된다.
//   gold  돈 더미 (상호작용하면 바로)
//   card  카드 (행동 카드는 덱에, 물건·장비는 패에). price가 있으면 그 값을 내고 산다 (돈이 모자라면 못 가진다)
//   gear  장비 (패에, 자리가 있어야)
//   group 같은 group인 것들은 하나만 가질 수 있다 (하나를 가지면 나머지는 사라진다: 전투 보상 카드 3장 중 1장)
// item: { key(그 방에서 겹치지 않는 이름), kind, gold, card, price, group }
// 방을 나갔다 다시 와도 이미 가진 것(key)은 다시 안 나온다 (Run.rooms[id].taken).
// 그림은 HazardOverlay가 그린다 (받침 + 아이콘 + 이름·값).
class Pickup extends Hazard {
    constructor(x, y, data = {}) {
        super(x, y, "pickup", {});
        this.item = data.item;
        this.displayName = data.item.kind === "gold" ? `${data.item.gold} G` : data.item.card.name;
        this.stoodMsg = false;
    }

    // 플레이어가 이 칸 위에 서 있을 때만 상호작용할 수 있다 (옆칸에서는 안 된다)
    get interactable() {
        const p = Player.current;
        return !!p && p.x === this.x && p.y === this.y;
    }

    // 상호작용: 줍기·사기 (돈이 모자라거나 패가 가득 차면 메시지만)
    interact(ctx) {
        if (!this.world) return false;
        Pickups.collect(ctx.player, this, ctx.world);
        return true;
    }

    // 설치물 틱: 아무것도 안 한다
    tick() {
        return [];
    }
}
EntityTypes.register("pickup", (x, y, d) => new Pickup(x, y, d));

class Pickups {
    static run = null; // 지금 런 (Run 생성자가 넣는다)

    // 플레이어가 (x, y)에 섰다 (걷기·순간이동): 줍지는 않고, 물건 위에 서면 한 번 안내만 한다 (실수로 줍지 않게)
    static stepped(player, world) {
        for (const o of world.entitiesAt(player.x, player.y)) {
            if (!(o instanceof Pickup) || !o.world || o.stoodMsg) continue;
            o.stoodMsg = true;
            MessageLog.add(`${o.displayName} 위에 섰다. 상호작용(손 버튼·E)으로 가진다`, "#c8b890");
        }
    }

    static say(text) {
        MessageLog.add(text, "#c8b890");
    }

    static collect(player, pickup, world) {
        const it = pickup.item;
        const run = Pickups.run;
        if (it.kind === "gold") {
            player.money += it.gold;
            MessageLog.add(`${it.gold} G를 주웠다`, "#f0d878");
        } else {
            const card = it.card;
            if (it.price && player.money < it.price) {
                Pickups.say(`${card.name}: ${it.price} G가 필요하다 (지금 ${player.money} G)`);
                return;
            }
            if (card.isSkill) player.cards.addToDeck(card);
            else if (!player.cards.addToHand(card)) {
                Pickups.say(`패가 가득 차서 ${josa(card.name, "을를")} 가질 수 없다`);
                return;
            }
            if (it.price) {
                player.money -= it.price;
                MessageLog.add(`${josa(card.name, "을를")} ${it.price} G에 샀다`, "#e8c860");
                if (it.offer) it.offer.sold = true;
            } else MessageLog.add(`${josa(card.name, "을를")} ${card.isSkill ? "덱에" : ""} 얻었다`.replace("  ", " "), "#e8c860");
        }
        if (run) run.taken.add(it.key);
        pickup.remove(world);
        // 한 묶음에서 하나를 가졌다: 나머지는 사라진다
        if (it.group) {
            for (const o of [...world.hazards]) {
                if (o === pickup || !(o instanceof Pickup) || o.item.group !== it.group) continue;
                if (run) run.taken.add(o.item.key);
                o.remove(world);
            }
            MessageLog.add("나머지는 사라졌다", "#a89878");
        }
        const q = world.run ? world.run.queue : run ? run.queue : null;
        if (q) q.play(new PopupAnim(player, it.kind === "gold" ? `+${it.gold}G` : it.card.name, "#f0d878"));
    }
}

/* ===== assets/dat/card/CardText.js ===== */
// 카드 설명글의 색 글자와 용어 풀이.
//
// 설명글 안에 [[키:글자]]를 넣으면 그 글자를 키의 색으로 칠한다 (UIText의 rich 옵션).
//   능력치 키: hp 체력 · mana 마나 · energy 기력 · atk 공격력 · def 방어력 · spd 이동속도 · gold 돈
//   상태 이상 키: Status.DEFS의 키 (poison, burn, weak ...)
// 숫자가 능력치에서 나오면 CardText.stat으로 쓴다:
//   자세히 (덱 보기·상점·보상)  "공격력 100%(5)"
//   짧게   (전투 중 패·덱·묘지)  "5"
// 어느 쪽으로 쓸지는 CardText.verbose가 정한다. 화면이 card.text(true/false)로 골라 읽는다.
class CardText {
    static verbose = false;

    // 색: light = 어두운 바탕(설명 칸)용, dark = 카드 종이(밝은 바탕)용
    static STATS = {
        hp: { name: "체력", light: "#7cd47c", dark: "#257025" },
        mana: { name: "마나", light: "#7aaaf2", dark: "#24509e" },
        energy: { name: "기력", light: "#f29a3a", dark: "#a85200" },
        atk: { name: "공격력", light: "#f5bf8c", dark: "#9a4a14" },
        def: { name: "방어력", light: "#b6c6d6", dark: "#455a70" },
        spd: { name: "이동속도", light: "#f0e08a", dark: "#7d6a00" },
        gold: { name: "돈", light: "#f0d060", dark: "#866400" }
    };

    // 능력치 비례 수치. pct가 없으면 "이동속도(3)"처럼
    static stat(key, pct, value) {
        const s = CardText.STATS[key];
        if (!CardText.verbose) return `[[${key}:${value}]]`;
        return pct === null || pct === undefined ? `[[${key}:${s.name}(${value})]]` : `[[${key}:${s.name} ${pct}%(${value})]]`;
    }

    // 그냥 색만 칠하기
    static tag(key, text) {
        return `[[${key}:${text}]]`;
    }

    // 자세히 볼 때만 붙는 글 (공식 설명 등)
    static more(text) {
        return CardText.verbose ? text : "";
    }

    // 상태 이상 이름에 색 ("독 3")
    static status(key, text = null) {
        return `[[${key}:${text ?? Status.DEFS[key].name}]]`;
    }

    static with(verbose, fn) {
        const old = CardText.verbose;
        CardText.verbose = verbose;
        try {
            return fn();
        } finally {
            CardText.verbose = old;
        }
    }

    static strip(text) {
        return String(text ?? "").replace(/\[\[(\w+):([^\]]*)\]\]/g, "$2");
    }

    static color(key, palette = "light") {
        const s = CardText.STATS[key];
        if (s) return s[palette];
        const d = typeof Status !== "undefined" && Status.DEFS[key];
        if (!d) return null;
        return palette === "light" ? d.color : CardText.darken(d.color);
    }

    // 밝은 상태 색을 종이 위에서도 읽히게 어둡게 (흰색 계열은 회색으로)
    static darken(hex) {
        const n = parseInt(hex.slice(1), 16);
        let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
        const k = 0.5;
        r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
        return "#" + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
    }

    // "가 [[atk:5]] 피해" → [{ text: "가 " }, { text: "5", color }, { text: " 피해" }]
    static parse(text, palette = "light") {
        const out = [];
        const re = /\[\[(\w+):([^\]]*)\]\]/g;
        let last = 0;
        let m;
        while ((m = re.exec(text))) {
            if (m.index > last) out.push({ text: text.slice(last, m.index), color: null });
            out.push({ text: m[2], color: CardText.color(m[1], palette), bold: true });
            last = re.lastIndex;
        }
        if (last < text.length) out.push({ text: text.slice(last), color: null });
        return out;
    }

    // ---------- 용어 풀이 ----------
    // 카드 설명에 나오면 상세 칸 아래에 풀이를 붙인다 (설정에서 끌 수 있다)
    static TERMS = [
        ["독", "poison", "턴이 지날 때마다 수치만큼 피해를 받고, 수치가 1 줄어든다."],
        ["화상", "burn", "턴이 지날 때마다 3 피해를 받는다. 남은 턴이 1씩 줄어든다."],
        ["약화", "weak", "주는 피해가 25% 줄어든다 (남은 턴 동안)."],
        ["취약", "vuln", "받는 피해가 50% 늘어난다 (남은 턴 동안)."],
        ["기절", "stun", "그 턴에는 아무것도 하지 못한다."],
        ["속박", "root", "움직이지 못한다. 이동 카드를 쓸 수 없다 (남은 턴 동안)."],
        ["재생", "regen", "턴이 지날 때마다 체력을 2 회복한다 (남은 턴 동안)."],
        ["힘", "str", "공격력이 수치만큼 오른다 (이 방 동안)."],
        ["가시", "thorns", "나를 때린 적이 수치만큼 피해를 받는다 (이 방 동안)."],
        ["방어도", "def", "받는 피해를 먼저 막아 주는 수치. 정해진 턴이 지나면 사라진다."],
        ["소멸", null, "쓰면 이 방에서는 다시 나오지 않는다. 다음 방에서 덱으로 돌아온다."],
        ["임시 카드", null, "쓰거나 버리면 사라지고, 방을 나가면 없어진다."],
        ["쉼", null, "쓰고 나면 그만큼의 턴 동안 카드를 뽑을 수 없다."],
        ["위력", null, "주문의 세기. 비용으로 낸 자원과 증폭 젬으로 정해진다."],
        ["젬 칸", null, "젬을 끼울 수 있는 자리. 젬은 주문을 강하게 한다."],
        ["밀어", null, "대상을 밀어낸다. 벽이나 다른 적에 부딪히면 3 피해."],
        ["장판", null, "바닥에 깔려 몇 턴 동안 남는다. 밟은 적에게 효과를 준다."],
        ["지뢰", null, "적이 그 칸이나 바로 옆에 오면 터진다."],
        ["장벽", null, "몇 턴 동안 칸을 막는 벽. 적도 나도 지나갈 수 없다."]
    ];

    // 설명글에 나온 용어들 [{ name, key, text }]
    static terms(text) {
        const plain = CardText.strip(text);
        return CardText.TERMS.filter(([name]) => plain.includes(name)).map(([name, key, t]) => ({ name, key, text: t }));
    }

    // 풀이를 한 덩어리 글로 ("[[poison:독]]: 턴이 지날 때마다 …")
    static glossary(text) {
        return CardText.terms(text).map((t) => `${t.key ? `[[${t.key}:${t.name}]]` : t.name}: ${t.text}`).join("\n");
    }
}

UIText.colorOf = (key, palette) => CardText.color(key, palette);

/* ===== assets/dat/card/CardDef.js ===== */
// 카드 종류 정의표. TileDef처럼 id로 성질을 찾는다. 실제로 들고 있는 한 장은 Card.
//
// type: "item"  — 아이템(소지품). 인벤토리 패에 있고 덱/묘지로 가지 않는다. 바닥에 떨어뜨리거나 주울 수 있다.
//                 consumable이면 쓰면 사라지고(소모품), 아니면 쓸 수 없는 재료다.
//       "skill" — 행동 카드. 덱 → 행동 패 → 묘지를 돈다. 덱에서 뽑아야 패에 들어오고, 쓰면 묘지로 간다.
//                 플레이어의 모든 행동(이동, 공격, 방어, 주문)은 행동 카드로 한다. 가방(인벤토리)에는 못 넣는다.
//
// use(ctx): 카드 효과. ctx = { user, world, cards, turns, card, target }. 연출 단계 배열(AnimQueue 스텝들)을 돌려주고,
//           쓸 수 없으면 null. use가 없는 카드는 쓸 수 없다. 카드를 쓰는 것은 턴을 쓰지 않는다 (턴은 뽑기·대기로만 지난다).
//
// slot: 장착 부위 ("hand" 손, "waist" 허리, "back" 등). 부위마다 한 장만. 장착해도 패(인벤토리 패)에 남아 한 자리를 차지한다.
// stats: 장착하면 오르는 능력치 { attack, defense, speed, actionHand, invHand } (Gear.js)
// grants: 장착하면 덱에 들어오는 행동 카드 [{ id, n }]. 해제하면 그 카드들이 빠지고, 다시 장착하면 있던 자리(패/덱/묘지)로 돌아온다.
// strike: 공격 카드 { pct(공격력의 %), vs: { tags, mult }(그 태그 대상에게 배수), push(밀어내는 칸) } (ActionCards.js)
// 모든 카드는 1장씩이다 (묶이지 않는다). stack은 1로 고정 (Card.count도 늘 1).
// cost: 카드 비용 { energy } | { mana } | { hp } | { rest }. 주문은 카드마다 다르다 (Spell.js, card.cost)
//       energy(기력)는 턴마다 가득 찬다. rest n은 n턴 동안 카드를 못 뽑는다.
// price: 상점에서 살 때 기준 값.
// rarity: 보상·상점에 나오는 행동 카드의 희귀도 ("common" | "uncommon" | "rare"). 없으면 보상에 안 나온다 (시작 카드, 장비 카드).
//
// target: 칸을 골라서 쓰는 카드면 { range, radius, walk?, entity? }. 쓸 때 대상 지정 모드로 들어가고, 고른 칸이 ctx.target { x, y }로 온다.
//         range  — 플레이어에서 고를 수 있는 칸까지의 거리 (맨해튼). walk면 걸어서 갈 수 있는 칸만 (이동 카드)
//         radius — 고른 칸을 중심으로 효과가 닿는 범위 (정사각형, 1이면 3x3)
class CardDef {
    static defs = new Map();

    static register(id, def) {
        const material = def.type === "item" && !def.consumable && !def.use && !def.slot;
        CardDef.defs.set(id, { id, consumable: false, use: null, target: null, cost: null, slot: null, stats: null, grants: null, material, price: 1, ...def, stack: 1 });
    }

    // 장착 부위 이름 (새 부위는 여기 한 줄)
    static SLOTS = { hand: "손", head: "머리", body: "몸", waist: "허리", back: "등", feet: "발", trinket: "장신구" };

    static slotName(slot) {
        return CardDef.SLOTS[slot] ?? slot;
    }

    // 예전에 이름이 바뀐 변형 id → 지금 id (옛 저장본 호환)
    static ALIASES = { guard__purple: "guard__red" };

    static resolve(id) {
        return CardDef.ALIASES[id] ?? id;
    }

    static RESOURCE_NAMES = { energy: "기력", mana: "마나", hp: "체력", gold: "돈" };

    // 비용 { mana: 5 } → "마나 5" / "기력 1" / "포만감 20" / "체력 3" / "쉼 2" / 0이면 "비용 없음". 비용이 없는 카드는 ""
    static costText(cost) {
        if (!cost) return "";
        const list = Object.entries(cost).filter(([, n]) => n);
        if (!list.length) return Object.keys(cost).length ? "비용 없음" : "";
        return list.map(([r, n]) => (r === "rest" ? `쉼 ${n}` : `${CardDef.RESOURCE_NAMES[r] ?? r} ${n}`)).join(" · ");
    }

    // 좁은 카드 딱지용: "기1 마1 체1"
    static costShort(cost) {
        if (!cost) return "";
        const short = { energy: "기", mana: "마", hp: "체", gold: "G", rest: "쉼" };
        const list = Object.entries(cost).filter(([, n]) => n);
        if (!list.length) return Object.keys(cost).length ? "무료" : "";
        return list.map(([r, n]) => `${short[r] ?? r}${n}`).join(" ");
    }

    static inRange(def, user, x, y) {
        return Math.abs(x - user.x) + Math.abs(y - user.y) <= def.target.range;
    }

    // 고른 칸 (x, y) 주변 radius 안의 칸들
    static area(def, x, y) {
        const r = def.target.radius;
        const tiles = [];
        for (let dy = -r; dy <= r; dy++) {
            for (let dx = -r; dx <= r; dx++) tiles.push([x + dx, y + dy]);
        }
        return tiles;
    }

    static get(id) {
        return CardDef.defs.get(id);
    }

    // 카드에 붙는 종류 이름
    static kindName(def) {
        if (def.spell) return "주문";
        if (def.type === "skill") return def.token ? "장비 카드" : "행동";
        if (def.gem) return "젬";
        if (def.slot) return "장비";
        return def.consumable ? "소모품" : "물건";
    }
}

/* ===== assets/dat/card/CardEffects.js ===== */
// 카드 효과에서 같이 쓰는 동작들. 새 카드는 여기 함수를 조합하거나 직접 use를 쓰면 된다. (주문 효과는 Spell.js)
class CardEffects {
    static heal(ctx, amount) {
        const s = ctx.user.stats;
        if (s.hp >= s.maxHp) {
            MessageLog.add("이미 체력이 가득하다", "#c8b890");
            return null;
        }
        const healed = Math.min(amount, s.maxHp - s.hp);
        s.hp += healed;
        MessageLog.add(`체력 ${healed} 회복`, "#7cd47c");
        return [[new PopupAnim(ctx.user, "+" + healed, "#7cd47c")]];
    }

    // 마나 회복 (물약, 명상)
    static mana(ctx, amount) {
        const u = ctx.user;
        if (u.mana >= u.maxMana) {
            MessageLog.add("이미 마나가 가득하다", "#c8b890");
            return null;
        }
        const n = Math.min(amount, u.maxMana - u.mana);
        u.mana += n;
        MessageLog.add(`마나 ${n} 회복`, "#7cb0f0");
        return [[new PopupAnim(u, "+" + n, "#7cb0f0")]];
    }

    static elixir(ctx) {
        const u = ctx.user;
        const s = u.stats;
        if (s.hp >= s.maxHp && u.mana >= u.maxMana) {
            MessageLog.add("이미 체력과 마나가 가득하다", "#c8b890");
            return null;
        }
        s.hp = s.maxHp;
        u.mana = u.maxMana;
        MessageLog.add("체력과 마나가 가득 찼다", "#f0d878");
        return [[new PopupAnim(u, "MAX", "#f0d878")]];
    }

    static draw(ctx, count) {
        const drawn = ctx.cards.draw(count);
        return drawn.length > 0 ? [] : null;
    }

    // 폭탄 따위: 고른 칸 주변 radius 안 모든 생물에게 피해 (던지는 사람은 빼고)
    static explode(ctx, damage, radius, frame) {
        const at = ctx.target;
        const u = ctx.user;
        const range = ctx.card.target.range;
        if (!at || Math.abs(at.x - u.x) + Math.abs(at.y - u.y) > range) {
            MessageLog.add(`${range}칸 안의 칸을 골라야 한다`, "#c8b890");
            return null;
        }
        const tiles = Spell.square(at.x, at.y, radius);
        const targets = [];
        for (const [x, y] of tiles) for (const e of ctx.world.entitiesAt(x, y)) if (e !== u && e.alive && !e.invulnerable && !targets.includes(e)) targets.push(e);
        const size = ctx.world.tileSize;
        const fly = new ProjectileAnim(ctx.world, "cards", frame, new Vector(u.x * size, u.y * size), new Vector(at.x * size, at.y * size));
        MessageLog.add(targets.length ? `펑! ${targets.length}개 대상에게 ${damage} 피해` : "펑! 아무것도 맞지 않았다", "#ff9a50");
        const hits = [];
        for (const e of targets) hits.push(...Combat.hit(e, damage, u, ctx.world, "heat"));
        return [[fly], [new AreaFlashAnim(ctx.world, tiles, "#ff8a30"), ...hits]];
    }

    static recall(ctx) {
        const card = ctx.cards.recall();
        return card ? [] : null;
    }
}

/* ===== assets/dat/card/defs/ActionCards.js ===== */
// 행동 카드가 같이 쓰는 이동·줄 계산 도우미. (카드 자체는 data/CardImpl.js가 공방 데이터에서 만든다)
class ActionCards {
    // from에서 걸어서 steps칸 안에 갈 수 있는 빈칸들: Map(키 "x,y" → 그 칸까지의 경로 [[dx, dy], ...])
    // 막는 엔티티가 있는 칸은 못 지나간다. 벽 타일도 못 지나간다
    static reachable(world, mover, steps) {
        const out = new Map();
        const start = `${mover.x},${mover.y}`;
        const prev = new Map([[start, null]]);
        let frontier = [[mover.x, mover.y]];
        for (let d = 0; d < steps; d++) {
            const next = [];
            for (const [x, y] of frontier) {
                for (const [dx, dy] of Entity.DIRS) {
                    const nx = x + dx;
                    const ny = y + dy;
                    const k = `${nx},${ny}`;
                    if (prev.has(k) || !world.getChunkAt(nx, ny) || !world.canEnter(mover, nx, ny)) continue;
                    prev.set(k, [`${x},${y}`, dx, dy]);
                    next.push([nx, ny]);
                }
            }
            frontier = next;
        }
        for (const k of prev.keys()) {
            if (k === start) continue;
            const [kx, ky] = k.split(",").map(Number);
            if (Status.charmBlocks(mover, kx, ky)) continue; // 매료: 건 상대에게서 n칸 안의 칸만 갈 수 있다
            const path = [];
            let at = k;
            while (prev.get(at)) {
                const [from, dx, dy] = prev.get(at);
                path.push([dx, dy]);
                at = from;
            }
            out.set(k, path.reverse());
        }
        return out;
    }

    // 고른 칸까지 걸어간다 (이동속도 칸 안, 빈칸만). 한 칸씩 미끄러지는 연출 단계들
    static move(ctx, steps) {
        const u = ctx.user;
        const t = ctx.target;
        if (u.root > 0) {
            MessageLog.add(`속박되어 움직일 수 없다 (${u.root}턴 남음)`, "#c8b890");
            return null;
        }
        if (!t) {
            MessageLog.add("갈 칸을 골라야 한다", "#c8b890");
            return null;
        }
        const path = ActionCards.reachable(ctx.world, u, steps).get(`${t.x},${t.y}`);
        if (!path) {
            MessageLog.add(`걸어서 ${steps}칸 안의 빈칸만 갈 수 있다`, "#c8b890");
            return null;
        }
        const size = ctx.world.tileSize;
        const anims = [];
        for (const [dx, dy] of path) {
            const fx = u.x;
            const fy = u.y;
            if (!ctx.world.moveEntity(u, dx, dy)) break;
            anims.push([new MoveAnim(u, new Vector(fx * size, fy * size), new Vector(u.x * size, u.y * size))]);
            if (Goo.stuck(u)) break; // 점액 장판을 밟으면 거기서 멈춘다
        }
        if (!anims.length) return null;
        if (u instanceof Player) Equip.moved(u); // 나이프 홀스터
        return anims;
    }

    // t가 u에서 상하좌우 일직선 reach칸 안인가
    static inLine(u, t, reach) {
        const dx = t.x - u.x;
        const dy = t.y - u.y;
        if (dx && dy) return false;
        const d = Math.abs(dx) + Math.abs(dy);
        return d >= 1 && d <= reach;
    }

    // u에서 t 쪽으로 가면서 처음 만나는 막는 엔티티 (벽 타일에 막히면 없음)
    static firstInLine(world, u, t, reach) {
        const dx = Math.sign(t.x - u.x);
        const dy = Math.sign(t.y - u.y);
        for (let i = 1; i <= reach; i++) {
            const x = u.x + dx * i;
            const y = u.y + dy * i;
            const e = world.entityAt(x, y);
            if (e && e !== u) return e;
            if (!ChunkManager.tileOk(world.getTile(x, y))) return null;
        }
        return null;
    }
}

/* ===== assets/dat/card/Card.js ===== */
// 실제로 들고 있는 카드 한 장. 모든 카드는 1장씩이다 (count는 늘 1).
class Card {
    static _nextId = 1;

    constructor(defId, count = 1) {
        this.id = Card._nextId++;
        this.defId = CardDef.resolve(defId);
        this.count = count;
        // 카드마다 다른 데이터 (장비: uid·장비 카드 자리 — Gear.js / 장비 카드: src / 주문: 비용, 젬 — Spell.js / 젬: 품질)
        this.data = null;
        this._drawn = 0; // 패에 들어온 순서 (자동 이동 중 버릴 카드 고르기). 저장하지 않는다
    }

    ensureData() {
        if (!this.data) this.data = {};
        return this.data;
    }

    get name() {
        if (this.def.gem) return Gem.name(this);
        return this.def.name;
    }

    // 값: 주문·젬은 카드마다, 나머지는 정의의 값
    get price() {
        if (this.def.spell) return Spell.price(this);
        if (this.def.gem) return Gem.price(this);
        return this.def.price;
    }

    // 쓸 때 내는 비용 { energy: 1 } / { mana: 5 } 등. 주문은 카드마다 다르다 (Spell.js)
    get cost() {
        if (this.def.spell) return Spell.costObject(this);
        const opts = Card.costOptions(this.def);
        const base = opts.length < 2 ? this.def.cost : opts[this.costIndex]; // 비용 경우가 여럿인 카드는 "그중 하나": 카드 한 장마다 하나로 정해져 있다 (data.pay = 몇 번째 경우)
        const cut = this.data && this.data.costCut;
        if (!cut || !base) return base;
        // 기도 푸른 변형: 가져온 카드의 비용이 종류 상관없이 줄어든다 (0까지)
        const out = {};
        for (const [k, v] of Object.entries(base)) out[k] = Math.max(0, v - cut);
        return out;
    }

    // 정의에 적힌 비용의 경우들 [{ energy: 2 }, { mana: 2 }, { energy: 1, mana: 1 }]. 공방 카드의 costs. 없으면 def.cost 하나
    static costOptions(def) {
        return def.costs?.length ? def.costs : [def.cost];
    }

    // 이 카드가 낼 비용이 정의의 몇 번째 경우인가
    get costIndex() {
        const n = Card.costOptions(this.def).length;
        const i = this.data?.pay;
        return Number.isInteger(i) && i >= 0 && i < n ? i : 0;
    }

    // 비용 경우가 여럿이면 이 카드가 낼 경우를 정한다 (이미 정해져 있으면 그대로, 강화로 정의가 바뀌어 범위를 벗어나면 다시)
    rollCost(rng = Math.random) {
        const n = Card.costOptions(this.def).length;
        if (n > 1 && !(Number.isInteger(this.data?.pay) && this.data.pay >= 0 && this.data.pay < n)) this.ensureData().pay = Math.floor(rng() * n);
        return this;
    }

    // 칸을 골라 쓰는 카드면 { range, radius, ... }. 주문·행동 카드는 플레이어 능력치에 따라 달라진다
    get target() {
        if (this.def.spell) return Spell.target(this);
        return typeof this.def.target === "function" ? this.def.target(this) : this.def.target;
    }

    // 새 카드 한 장. 주문과 젬은 무작위로 굴린다 (상점, 던전 보상 등). 저장본 불러오기는 Card.load
    static create(id, rng = Math.random) {
        id = CardDef.resolve(id);
        if (Spell.kinds.has(id)) return Spell.roll(id, rng);
        if (CardDef.get(id)?.gem) return Gem.roll(id, Gem.rollTier(1, 3, rng), rng);
        return new Card(id).rollCost(rng);
    }

    // 설명 전체
    get description() {
        if (this.def.spell) return Spell.describe(this);
        if (this.def.gem) return Gem.describe(this);
        const lines = [];
        if (this.def.slot) lines.push(...Gear.lines(this));
        const text = typeof this.def.text === "function" ? this.def.text(this) : this.def.description;
        if (text) lines.push(text);
        if (this.isToken) lines.push(`(장비 카드: ${this.def.from ?? "장비"}를 해제하면 덱에서 빠진다)`);
        return lines.join("\n");
    }

    // 설명 (verbose: 자세히 "공격력 100%(5)", 아니면 "5"). [[키:글자]] 색 표시가 들어 있다
    text(verbose = CardText.verbose) {
        return CardText.with(verbose, () => this.description);
    }

    // 짧은 설명 (카드 그림 아래 좁은 칸)
    get summary() {
        if (this.def.spell) return Spell.summary(this);
        if (this.def.gem) return Gem.summary(this);
        if (typeof this.def.short === "function") return this.def.short(this);
        if (this.def.slot) return Gear.lines(this).map((l) => l.slice(2)).join(" / ");
        return this.def.description;
    }

    get def() {
        return CardDef.get(this.defId);
    }

    // 임시 카드 (카드 효과로 패에 생긴 것): 쓰거나 버리면 사라지고, 방을 나가면 없어진다
    get isTemp() {
        return !!(this.data && this.data.temp);
    }

    // 행동 카드 (덱 → 행동 패 → 묘지)
    get isSkill() {
        return this.def.type === "skill";
    }

    get isAction() {
        return this.isSkill;
    }

    // 장비에서 나온 행동 카드 (장비를 해제하면 빠진다. 상자에 넣거나 팔 수 없다)
    get isToken() {
        return !!this.def.token;
    }

    get maxStack() {
        return this.def.stack;
    }

    get stackable() {
        return this.maxStack > 1;
    }

    get label() {
        return this.count > 1 ? `${this.name} x${this.count}` : this.name;
    }

    save() {
        const data = { d: this.defId };
        if (this.count > 1) data.c = this.count;
        if (this.data) data.x = this.data;
        return data;
    }

    static load(data) {
        const card = new Card(data.d);
        if (data.x) card.data = JSON.parse(JSON.stringify(data.x));
        return card;
    }

    static loadAll(list) {
        return list.map((data) => Card.load(data));
    }
}

// 플레이어의 카드 존: 패(hand), 덱(deck, 드로우 더미), 묘지(graveyard). equipped는 패 안에서 장착한 카드 표시.
// - 패는 행동 패와 인벤토리 패로 나뉜다 (한 배열 hand에 같이 들어 있고 종류로 나눈다):
//     행동 카드(스킬)는 행동 패에만 (최대 actionLimit장)
//     아이템은 인벤토리 패에 먼저 들어가고(최대 invLimit장), 넘치면 행동 패의 빈자리를 쓴다
//     예) 행동 5 · 인벤토리 3: 나무 4 + 행동 카드 4 → 됨 / 나무 2 + 행동 카드 6 → 안 됨
//   CardSystem.fits(행동 장수, 아이템 장수)가 이 규칙이다.
// - 아이템은 줍기로 들어오고, 버리면 바닥에 떨어지고, 소모품은 쓰면 사라진다.
// - 행동 카드는 덱 → 패 → 묘지를 돈다. 덱이 비면 묘지를 섞어 덱으로 되돌린다 (순환).
// - 뽑기는 플레이어의 "뽑기" 행동(1턴)이나 카드 효과(통찰)로만 일어난다.
// - 장착: 장비(def.slot은 장비라는 표시일 뿐 부위는 없다)는 패(인벤토리 패)에 있는 채로 몇 개든 겹쳐 장착된다. 장착해도 패 한 자리를 차지한다.
//   장착한 장비의 능력치(행동 패·인벤토리 패 크기 포함)가 오르고, 장비 카드(grants)가 덱에 들어온다 (Gear.js).
//   장착·해제·빼기 뒤 패가 넘치게 되면 막는다. 장착한 카드를 패에서 빼면(버리기, 팔기, 상자) 저절로 해제된다.
// 바뀔 때마다 version이 올라서 UI가 다시 그릴 때를 안다.
class CardSystem {
    static ACTION_HAND = 4;
    static INV_HAND = 4;

    constructor(options = {}) {
        this.baseAction = options.actionHand ?? CardSystem.ACTION_HAND;
        this.baseInv = options.invHand ?? CardSystem.INV_HAND;
        this.hand = [];
        this.equipped = [];   // 장착한 장비 카드들 (패 안의 카드). 부위 없이 몇 개든 겹쳐 입는다
        this.deck = [];       // 맨 뒤가 맨 위 (pop으로 뽑는다)
        this.graveyard = [];  // 맨 뒤가 가장 최근
        this.exhausted = [];  // 소멸: 이번 방에서 다시 안 나온다 (다음 방에 들어가면 덱으로 돌아온다)
        this.rules = options.rules ?? [];
        this.version = 0;
        this.drawSeq = 0;
    }

    // ---------- 패 크기 ----------
    get actionLimit() {
        return this.baseAction + Gear.sum(this, "actionHand");
    }

    get invLimit() {
        return this.baseInv + Gear.sum(this, "invHand");
    }

    // 패 전체 크기 (행동 + 인벤토리)
    get handLimit() {
        return this.actionLimit + this.invLimit;
    }

    get actions() {
        return this.hand.filter((c) => c.isSkill);
    }

    get items() {
        return this.hand.filter((c) => !c.isSkill);
    }

    counts() {
        let a = 0;
        for (const c of this.hand) if (c.isSkill) a++;
        return { a, i: this.hand.length - a };
    }

    // 인벤토리 패를 넘쳐 행동 패 자리를 쓰는 아이템 수
    get overflow() {
        return Math.max(0, this.counts().i - this.invLimit);
    }

    // 행동 카드 a장, 아이템 i장이 패에 들어가는가
    static fits(a, i, actionLimit, invLimit) {
        return a + Math.max(0, i - invLimit) <= actionLimit;
    }

    fitsNow(a, i) {
        return CardSystem.fits(a, i, this.actionLimit, this.invLimit);
    }

    // 이 카드 한 장이 더 들어가는가
    canAdd(card) {
        const { a, i } = this.counts();
        return card.isSkill ? this.fitsNow(a + 1, i) : this.fitsNow(a, i + 1);
    }

    // 행동 카드를 더 못 받는다 (뽑기·회수가 실패한다)
    get actionFull() {
        const { a, i } = this.counts();
        return !this.fitsNow(a + 1, i);
    }

    // 아이템을 더 못 받는다 (줍기·사기·제작이 실패한다)
    get invFull() {
        const { a, i } = this.counts();
        return !this.fitsNow(a, i + 1);
    }

    // 예전 이름: 아이템을 더 못 받는다
    get handFull() {
        return this.invFull;
    }

    // ---------- 장착 ----------
    isEquipped(card) {
        return this.equipped.includes(card);
    }

    get equippedCards() {
        return [...this.equipped];
    }

    // card를 입으면(on) / 벗으면 패 최대가 어떻게 되는가 { a: 행동 패, i: 인벤토리 패 }
    _limitsWith(card, on) {
        const st = (k) => (card.def.stats ? card.def.stats[k] ?? 0 : 0);
        const d = on ? 1 : -1;
        return { a: this.actionLimit + d * st("actionHand"), i: this.invLimit + d * st("invHand") };
    }

    // 장착 (패의 장비. 부위 없이 몇 개든 겹쳐 입는다). 성공하면 true
    equip(card) {
        if (!card.def.slot || !this.hand.includes(card)) return false;
        if (this.isEquipped(card)) return true;
        const lim = this._limitsWith(card, true);
        const { a, i } = this.counts();
        if (!CardSystem.fits(a, i, lim.a, lim.i)) {
            MessageLog.add(`패가 넘쳐서 ${josa(card.name, "을를")} 장착할 수 없다`, "#c8b890");
            return false;
        }
        this.equipped.push(card);
        this._pushTokens(card);
        MessageLog.add(`${josa(card.name, "을를")} 장착했다`, "#e8c860");
        this._changed();
        return true;
    }

    // 해제 (장비는 패에 남는다). 패가 넘치게 되면 막는다. force면 그냥 푼다 (쓰러졌을 때)
    unequip(card, force = false) {
        if (!this.isEquipped(card)) return false;
        if (!force && !this.canUnequip(card, true)) return false;
        this.equipped = this.equipped.filter((c) => c !== card);
        const pulled = this._pullTokens(card);
        if (!force) MessageLog.add(`${josa(card.name, "을를")} 해제했다${pulled ? ` (장비 카드 ${pulled}장이 빠졌다)` : ""}`, "#c8b890");
        this._changed();
        return true;
    }

    // 이 장비를 풀어도(stays: 패에 남는다 / 아니면 패에서도 빠진다) 패가 넘치지 않는가
    canUnequip(card, stays) {
        const lim = this._limitsWith(card, false);
        const { a, i } = this.counts();
        const ok = CardSystem.fits(a - this.tokensInHand(card), i - (stays ? 0 : 1), lim.a, lim.i);
        if (!ok) MessageLog.add(`패가 넘쳐서 ${josa(card.name, "을를")} ${stays ? "해제할" : "뺄"} 수 없다 (먼저 카드를 줄이자)`, "#c8b890");
        return ok;
    }

    // 패에 있는 이 장비의 장비 카드 수
    tokensInHand(gear) {
        if (!gear.def.grants || !gear.data?.uid) return 0;
        return this.hand.filter((c) => Gear.isFrom(c, gear.data.uid)).length;
    }

    // 이 장비에서 나온 카드를 패·덱·묘지에서 모두 빼고, 어디에 몇 장 있었는지 장비에 적어 둔다. 뺀 장수
    _pullTokens(gear) {
        if (!gear.def.grants) return 0;
        const uid = Gear.uid(gear);
        const stash = {};
        let n = 0;
        for (const zone of ["hand", "deck", "graveyard"]) {
            const list = this[zone];
            for (let k = list.length - 1; k >= 0; k--) {
                const c = list[k];
                if (!Gear.isFrom(c, uid)) continue;
                list.splice(k, 1);
                const s = (stash[c.defId] ??= { hand: 0, deck: 0, graveyard: 0 });
                s[zone]++;
                n++;
            }
        }
        gear.data.stash = stash;
        return n;
    }

    // 장비 카드를 넣는다: 적어 둔 자리가 있으면 그대로, 처음이면 덱에 섞는다. 패에 자리가 없으면 덱으로
    _pushTokens(gear) {
        if (!gear.def.grants) return;
        const uid = Gear.uid(gear);
        const stash = gear.data.stash ?? null;
        let shuffle = false;
        for (const { id, n } of gear.def.grants) {
            const s = stash?.[id] ?? { hand: 0, deck: n, graveyard: 0 };
            const where = [...Array(Math.min(s.hand, n)).fill("hand"), ...Array(Math.min(s.graveyard, n)).fill("graveyard")].slice(0, n);
            while (where.length < n) where.push("deck");
            for (const zone of where) {
                const card = new Card(id);
                card.data = { src: uid };
                if (zone === "hand" && this.canAdd(card)) {
                    card._drawn = ++this.drawSeq;
                    this.hand.push(card);
                } else if (zone === "graveyard") this.graveyard.push(card);
                else {
                    this.deck.push(card);
                    shuffle = true;
                }
            }
        }
        delete gear.data.stash;
        if (shuffle) this.shuffle(this.deck);
    }

    _changed() {
        // 패에서 빠진 장비는 장착도 풀린다 (장비 카드도 빠진다)
        for (const card of [...this.equipped]) {
            if (this.hand.includes(card)) continue;
            this.equipped = this.equipped.filter((c) => c !== card);
            this._pullTokens(card);
        }
        this.version++;
        // 슬라임퀸에게 갇힌 동안: 패의 점액 카드 유무에 따라 속박·둔화가 걸리고 풀린다
        if (typeof SlimeQueen !== "undefined" && Player.current && Player.current.cards === this) SlimeQueen.refresh(Player.current);
    }

    // ---------- 패 ----------
    // 패에 넣기 (줍기, 회수, 사기 등). 자리가 없으면 false
    addToHand(card) {
        if (!this.canAdd(card)) return false;
        card._drawn = ++this.drawSeq;
        this.hand.push(card);
        this._changed();
        // 공방 장비는 패에 들어오면 자동으로 입는다 (자리가 있으면. 패가 넘치면 못 입고 직접 입어야 한다)
        if (card.def.gear && !this.isEquipped(card)) this.equip(card);
        return true;
    }

    // 패에 이 종류가 몇 장 있는가
    countOf(defId) {
        let n = 0;
        for (const card of this.hand) if (card.defId === defId) n += card.count;
        return n;
    }

    // 패에서 이 종류를 count장 덜어낸다 (제작 재료 등). 모자라면 아무것도 안 하고 false
    takeFromHand(defId, count) {
        if (this.countOf(defId) < count) return false;
        for (let i = this.hand.length - 1; i >= 0 && count > 0; i--) {
            const card = this.hand[i];
            if (card.defId !== defId) continue;
            const used = Math.min(count, card.count);
            card.count -= used;
            count -= used;
            if (card.count === 0) this.hand.splice(i, 1);
        }
        this._changed();
        return true;
    }

    // 패의 카드 한 장을 떼어 돌려준다 (팔기 등). 장비 카드는 뗄 수 없다
    takeOne(card) {
        if (!this.hand.includes(card) || card.isToken) return null;
        if (this.removeFromHand(card) < 0) return null;
        return card;
    }

    // 패에서 빼기. 빠진 자리(index)를 돌려준다 (없으면 -1)
    // 장착한 장비를 빼서 패가 넘치게 되면 막는다 (-1). force면 그냥 뺀다 (쓰러졌을 때)
    removeFromHand(card, force = false) {
        const i = this.hand.indexOf(card);
        if (i < 0) return -1;
        if (!force && this.isEquipped(card) && !this.canUnequip(card, false)) return -1;
        if (this.isEquipped(card)) this.unequip(card, true);
        this.hand.splice(i, 1);
        this._changed();
        return i;
    }

    // 행동 카드를 덱에 넣고 섞는다
    addToDeck(card) {
        this.deck.push(card);
        this.shuffle(this.deck);
        this._changed();
    }

    exhaust(card) {
        this.exhausted.push(card);
        MessageLog.add(`${josa(card.name, "이가")} 소멸했다 (이번 방에서는 다시 안 나온다)`, "#a0b8e8");
        this._changed();
    }

    toGraveyard(card) {
        this.graveyard.push(card);
        this._changed();
    }

    // 섞기: 방에 들어갈 때 Run이 시드 난수(rng)를 넣어 준다 (새로고침해도 같은 순서)
    shuffle(list) {
        const rng = this.rng ?? Math.random;
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
        return list;
    }

    // 뽑을 카드가 있는가 (덱이나 묘지에)
    get canDraw() {
        return this.deck.length > 0 || this.graveyard.length > 0;
    }

    // 덱에서 count장 뽑는다. 덱이 비면 묘지를 섞어 덱으로 돌린다. 행동 패가 차면 멈춘다. 뽑은 카드들을 돌려준다.
    // over: 행동 패 제한을 넘어서도 뽑는다 (통찰)
    draw(count = 1, over = false) {
        const drawn = [];
        for (let i = 0; i < count; i++) {
            if (!over && this.actionFull) {
                MessageLog.add("행동 패가 가득 차서 뽑지 못했다", "#c8b890");
                break;
            }
            if (this.deck.length === 0) {
                if (this.graveyard.length === 0) {
                    MessageLog.add("덱도 묘지도 비어 있다", "#c8b890");
                    break;
                }
                this.deck = this.shuffle(this.graveyard);
                this.graveyard = [];
                MessageLog.add("묘지를 섞어 덱으로 되돌렸다", "#a0b8e8");
            }
            const card = this.deck.pop();
            card._drawn = ++this.drawSeq;
            this.hand.push(card);
            drawn.push(card);
            MessageLog.add(`${josa(card.name, "을를")} 뽑았다`, "#a0b8e8");
        }
        if (drawn.length) this._changed();
        return drawn;
    }

    // 덱·묘지에 있는 이 카드를 패로 가져온다 (기도). 못 하면 false
    fetch(card) {
        for (const zone of ["deck", "graveyard"]) {
            const i = this[zone].indexOf(card);
            if (i < 0) continue;
            if (this.actionFull) return false;
            this[zone].splice(i, 1);
            card._drawn = ++this.drawSeq;
            this.hand.push(card);
            this._changed();
            MessageLog.add(`${josa(card.name, "을를")} ${zone === "deck" ? "덱" : "묘지"}에서 가져왔다`, "#a0b8e8");
            return true;
        }
        return false;
    }

    // 묘지에서 가장 최근 카드 1장을 패로
    recall() {
        if (this.graveyard.length === 0) {
            MessageLog.add("묘지가 비어 있다", "#c8b890");
            return null;
        }
        if (this.actionFull) {
            MessageLog.add("행동 패가 가득 찼다", "#c8b890");
            return null;
        }
        const card = this.graveyard.pop();
        card._drawn = ++this.drawSeq;
        this.hand.push(card);
        this._changed();
        MessageLog.add(`${josa(card.name, "을를")} 묘지에서 가져왔다`, "#a0b8e8");
        return card;
    }

    // 패의 카드를 쓴다 (턴은 쓰지 않는다). 효과를 고르는 동안 카드는 패에서 빠져 있다 (회수가 자기 자신을 가져오지 않게).
    // 못 쓰면 원래 자리로 돌아가고 null.
    use(card, ctx) {
        const def = card.def;
        if (!def.use) {
            MessageLog.add(`${josa(def.name, "은는")} 쓸 수 없다`, "#c8b890");
            return null;
        }
        if (!this.hand.includes(card)) return null; // 고르는 사이에 버린 카드
        const cost = card.cost;
        if (cost && ctx.user && !ctx.user.canPay(cost)) {
            MessageLog.add(`${card.name}: ${ctx.user.lackText(cost)}`, "#c8b890");
            return null;
        }
        if (ctx.user && ctx.user.turnLimited && ctx.user.turnLimited(card)) {
            MessageLog.add(`${card.name}: 이번 턴에는 더 쓸 수 없다 (턴 제한 ${def.turnLimit})`, "#c8b890");
            return null;
        }
        const index = this.removeFromHand(card);
        // 기도 붉은 변형으로 가져온 카드는 이번 턴 피해가 늘어난다
        if (ctx.user && card.data && card.data.boostTurn === ctx.user.turnNo && card.data.boostPct) ctx.user.dmgBoost = 1 + card.data.boostPct / 100;
        let steps;
        if (ctx.user) ctx.user._cardUsing = true; // 이동 효과(나이프 홀스터)는 카드의 드로우 뒤로 미룬다
        try {
            steps = def.use({ ...ctx, cards: this, card });
        } finally {
            if (ctx.user) {
                ctx.user.dmgBoost = 0;
                ctx.user._cardUsing = false;
            }
        }
        if (!steps) {
            this.hand.splice(index, 0, card);
            this._changed();
            return null;
        }
        if (!ctx.quiet) MessageLog.add(`${josa(card.name, "을를")} 썼다${cost ? ` (${CardDef.costText(cost)})` : ""}`, card.isSkill ? "#a0b8e8" : "#e8c860");
        if (cost && ctx.user) ctx.user.pay(cost, ctx.turns);
        if (ctx.user && def.turnLimit && !def.limitDraw) ctx.user.turnUses[card.defId] = (ctx.user.turnUses[card.defId] ?? 0) + 1;
        if (card.data) { delete card.data.costCut; delete card.data.boostPct; delete card.data.boostTurn; } // 가져올 때 얹힌 효과는 한 번 쓰면 끝
        if (card.isSkill) {
            if (card.isTemp) this._changed(); // 임시 카드는 쓰면 사라진다
            else if (card.def.exhaust) this.exhaust(card);
            else this.toGraveyard(card);
        }
        if (ctx.user) Equip.flushMoved(ctx.user); // 드로우가 다 끝났다: 미뤄 둔 이동 효과(나이프 홀스터)는 패가 남으면 준다
        Events.emit(GameEvent.CARD_USED, { card, user: ctx.user });
        return steps;
    }

    // 패에서 버리기: 행동 카드는 묘지로 가고, 아이템은 돌려준다 (바닥에 떨어뜨리는 건 호출한 쪽에서)
    // byEffect: 카드 효과로 버려진 것 (원한은 이때만 터진다. 손으로 [묘지로] 하면 안 터진다)
    discard(card, byEffect = false) {
        if (this.removeFromHand(card) < 0) return null;
        if (card.isSkill && card.isTemp) return card;
        if (card.isSkill) {
            this.toGraveyard(card);
            MessageLog.add(`${josa(card.name, "을를")} 묘지에 버렸다`, "#a0b8e8");
            // 원한: 버려질 때 터지는 효과
            if (byEffect && card.def.grudge) card.def.grudge({ user: Player.current, cards: this, card, world: Player.current ? Player.current.world : null });
        }
        return card;
    }

    // 드로우 조건에 사건을 알린다 ("turn", "kill" 등). 조건들이 말한 만큼 뽑는다. (지금은 조건 없음)
    notify(event, data = {}) {
        if (!this.rules.length || !this.canDraw) return [];
        let count = 0;
        for (const rule of this.rules) count += rule.on(event, data, this);
        return count > 0 ? this.draw(count) : [];
    }

    // 시작 덱: [기본이동] 3, [기본공격] 3
    static starterDeck() {
        const cards = [];
        for (const [id, n] of CardSystem.STARTER) for (let i = 0; i < n; i++) cards.push(new Card(id));
        return cards;
    }

    static STARTER = [["step", 3], ["strike", 3]];

    // 방에 들어갈 때: 패·묘지의 행동 카드를 모두 덱으로 되돌려 섞고, 처음 패 count장을 뽑는다 (턴 안 씀).
    // 아이템(소모품·장비)은 패에 그대로 남는다
    resetForRoom(count) {
        const back = this.hand.filter((c) => c.isSkill);
        this.hand = this.hand.filter((c) => !c.isSkill);
        this.deck.push(...back, ...this.graveyard, ...this.exhausted);
        this.graveyard = [];
        this.exhausted = [];
        this.deck = this.deck.filter((c) => !c.isTemp);
        this.shuffle(this.deck);
        this._changed();
        return count > 0 ? this.draw(count) : [];
    }

    // 덱 전체 (패·덱·묘지의 행동 카드). 카드 빼기·덱 보기에 쓴다. 장비 카드는 뺀다
    get allActions() {
        return [...this.hand.filter((c) => c.isSkill), ...this.deck, ...this.graveyard, ...this.exhausted].filter((c) => !c.isToken && !c.isTemp);
    }

    // 덱에서 행동 카드 한 장을 아주 없앤다 (상점·모닥불 카드 빼기). 패·덱·묘지 어디에 있든
    removeCard(card) {
        for (const zone of ["hand", "deck", "graveyard", "exhausted"]) {
            const i = this[zone].indexOf(card);
            if (i < 0) continue;
            this[zone].splice(i, 1);
            this._changed();
            return true;
        }
        return false;
    }

    // 시작 덱 넣기 (새 런)
    giveStarter() {
        for (const card of CardSystem.starterDeck()) this.deck.push(card);
        this.shuffle(this.deck);
        this._changed();
    }

    // 저장/불러오기. 장착은 패 자리 목록
    save() {
        const list = (cards) => cards.map((c) => c.save());
        const eq = this.equipped.map((card) => this.hand.indexOf(card)).filter((i) => i >= 0);
        const keep = (cards) => cards.filter((c) => !c.isTemp);
        return { act: this.baseAction, inv: this.baseInv, eq, hand: list(keep(this.hand)), deck: list(keep([...this.deck, ...this.exhausted])), graveyard: list(keep(this.graveyard)) };
    }

    load(data) {
        this.baseAction = data.act ?? CardSystem.ACTION_HAND;
        this.baseInv = data.inv ?? CardSystem.INV_HAND;
        this.hand = Card.loadAll(data.hand);
        this.deck = Card.loadAll(data.deck);
        this.graveyard = Card.loadAll(data.graveyard);
        this.equipped = [];
        for (const i of Object.values(data.eq ?? {})) if (this.hand[i]?.def.slot && !this.equipped.includes(this.hand[i])) this.equipped.push(this.hand[i]); // (예전 저장본은 부위 → 자리)
        this.drawSeq = 0;
        for (const card of this.hand) card._drawn = ++this.drawSeq;
        this._changed();
    }
}

/* ===== assets/dat/card/CardKit.js ===== */
// 카드 만들기 도구: 카드 한 장을 한 줄로 만든다. 효과는 작은 조각(Fx)을 이어 붙인 글로 적고, 설명글은 저절로 만들어진다.
//
//   CardKit.card("venom_stab", { name: "독 찌르기", rarity: "common", cost: "1", tgt: "adj",
//                                fx: "dmg:80; poison:3", icon: "dagger", color: "#9ce05c" });
//
// cost: "1" 기력 1 · "0" 공짜 · "m4" 마나 4 · "h3" 체력 3 · "g15" 돈 15 · "r1" 쉼 1
// tgt (대상, TARGETS):
//   self(기본) 고르지 않음 · adj 바로 옆 적 · line:n 일직선 n칸 안의 첫 적 · shot:n n칸 안의 적 하나(날린다)
//   area:n:r n칸 안 칸을 중심으로 반경 r 안의 적 모두 · around 주변 8칸의 적 모두 · all 방의 적 모두 · rand:k 무작위 적 k번
//   tile:n n칸 안의 빈칸 (소환·설치) · walk:n 걸어서 n칸 이동 · tp:n n칸 안의 빈칸으로 순간이동 · charge:n 일직선으로 달려가 첫 적 바로 앞까지
// fx: "이름:값:값; 이름:값" — 순서대로 한다. 앞에 "조건>"을 붙이면 조건이 맞을 때만 (CONDS):
//   kill> 이 카드로 적을 쓰러뜨렸으면 · low> 내 체력이 절반 이하 · block> 방어도가 있으면 · pois> 대상이 독에 걸렸으면
//   clear> 이 방을 정리하면 (방이 끝날 때 한다. 영구 능력치 등)
// 효과 (FX): 적에게(foe) 하는 것은 대상들 하나하나에, 나머지는 한 번. 새 효과는 FX에 한 줄 { foe?, run, text }.
// exhaust: true면 쓰면 이 방에서는 사라진다 (소멸, 방을 나가면 돌아온다). desc: 설명글을 직접 쓸 때, short: 짧은 설명을 직접 쓸 때
class CardKit {
    // 아이콘 틀 순서 (images/card_glyphs.png, 생성기 gen_card_glyphs.py와 같아야 한다)
    static GLYPHS = ["sword", "axe", "dagger", "spear", "arrow", "fist", "shield", "heart", "potion", "skull", "flame", "drop", "bolt",
        "chain", "down", "crack", "boot", "wing", "star", "spike", "coin", "card", "cards", "cycle", "bomb", "mine", "wall",
        "totem", "paw", "bone", "blob", "book", "plus", "wind", "magnet", "crown", "eye", "hammer", "swirl", "claw"];

    static list = []; // 만든 카드 정의 (아이콘 시트 순서)

    // ---------- 등록 ----------
    static card(id, spec) {
        if (CardDef.get(id) || (typeof Spell !== "undefined" && Spell.kinds.has(id))) throw new Error(`CardKit: 이미 있는 카드 id ${id}`);
        const fx = CardKit.parse(spec.fx ?? "");
        const [tname, ...targs] = (spec.tgt ?? "self").split(":");
        const T = CardKit.TARGETS[tname];
        if (!T) throw new Error(`CardKit: 모르는 대상 ${spec.tgt} (${id})`);
        const tg = targs.map(Number);
        const frame = CardKit.list.length;
        const def = {
            type: "skill", price: 0, sprite: "kicons", frame, kit: true,
            name: spec.name, rarity: spec.rarity, exhaust: !!spec.exhaust, kitSpec: { cost: spec.cost ?? "1", tgt: spec.tgt ?? "self", fx: spec.fx ?? "" },
            cost: CardKit.cost(spec.cost ?? "1"),
            icon: spec.icon ?? "card", color: spec.color ?? "#e8d9b8",
            target: T.pick ? () => T.pick(tg, Player.current) : null,
            text: () => CardKit.describe(T, tg, fx, spec),
            short: () => spec.short ?? [T.brief ? T.brief(tg) : "", CardKit.brief(fx)].filter(Boolean).join(" · "),
            use: (ctx) => CardKit.run(ctx, T, tg, fx)
        };
        CardDef.register(id, def);
        CardKit.list.push(CardDef.get(id));
    }

    static cost(s) {
        const kinds = { m: "mana", h: "hp", g: "gold", r: "rest" };
        const k = kinds[s[0]];
        return k ? { [k]: Number(s.slice(1)) } : { energy: Number(s) };
    }

    // "kill>gold:5; dmg:120" → [{ cond: "kill", name: "gold", args: [5] }, ...]
    static parse(text) {
        return text.split(";").map((s) => s.trim()).filter(Boolean).map((s) => {
            let cond = null;
            const gt = s.indexOf(">");
            if (gt >= 0) {
                cond = s.slice(0, gt).trim();
                s = s.slice(gt + 1).trim();
            }
            const [name, ...args] = s.split(":");
            if (!CardKit.FX[name]) throw new Error(`CardKit: 모르는 효과 ${name}`);
            if (cond && cond !== "clear" && !CardKit.CONDS[cond]) throw new Error(`CardKit: 모르는 조건 ${cond}`);
            return { cond, name, args: args.map((a) => (isNaN(Number(a)) ? a : Number(a))) };
        });
    }

    // ---------- 수치 ----------
    static atk(user = Player.current) {
        return user ? user.stats.attack : Player.BASE_ATTACK;
    }

    static dmg(pct, user = Player.current) {
        return Math.floor(CardKit.atk(user) * pct / 100 + 1e-9);
    }

    static blk(pct, user = Player.current) {
        const d = user ? user.stats.defense : Player.BASE_DEFENSE;
        return Math.floor(d * pct / 100 + 1e-9);
    }

    static isFoe(user, e) {
        return e && e !== user && e.alive && !e.invulnerable && e.ai && e.attitude === "hostile";
    }

    static foesIn(world, user, tiles) {
        const out = [];
        for (const [x, y] of tiles) {
            const e = world.entityAt(x, y);
            if (CardKit.isFoe(user, e) && !out.includes(e)) out.push(e);
        }
        return out;
    }

    static squareTiles(x, y, r) {
        const t = [];
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) t.push([x + dx, y + dy]);
        return t;
    }

    static freeTiles(world, user, n) {
        const out = [];
        for (let dy = -n; dy <= n; dy++) for (let dx = -n; dx <= n; dx++) {
            const x = user.x + dx;
            const y = user.y + dy;
            if ((dx || dy) && Math.abs(dx) + Math.abs(dy) <= n && world.isWalkable(x, y) && !world.entitiesAt(x, y).some((e) => e.isHazard)) out.push(`${x},${y}`);
        }
        return out;
    }

    static px(world, e) {
        const t = world.tileSize;
        return new Vector(e.x * t, e.y * t);
    }

    static say(text) {
        MessageLog.add(text, "#c8b890");
        return null;
    }

    // ---------- 대상 ----------
    // pick(args, player): 칸 고르기 설정 (없으면 바로 쓴다) / resolve(ctx, args): { foes, tile } 또는 null(못 씀) / text(args)
    static TARGETS = {
        self: {
            resolve: (ctx) => ({ foes: [], tile: { x: ctx.user.x, y: ctx.user.y } }),
            text: () => ""
        },
        adj: {
            pick: () => ({ range: 1, radius: 0, line: true, taps: 1, verb: "공격", color: "#d8443c" }),
            resolve: (ctx) => CardKit.lineFoe(ctx, 1),
            text: () => "바로 옆 적에게"
        },
        line: {
            brief: ([n]) => `${n}칸`,
            pick: ([n]) => ({ range: n, radius: 0, line: true, taps: 1, verb: "공격", color: "#d8443c" }),
            resolve: (ctx, [n]) => CardKit.lineFoe(ctx, n),
            text: ([n]) => `일직선 ${n}칸 안의 첫 적에게`
        },
        shot: {
            brief: ([n]) => `${n}칸`,
            pick: ([n]) => ({ range: n, radius: 0, taps: 1, verb: "쏘기", color: "#e8a040" }),
            resolve: (ctx) => {
                const e = ctx.target && ctx.world.entityAt(ctx.target.x, ctx.target.y);
                if (!CardKit.isFoe(ctx.user, e)) return CardKit.say("적이 있는 칸을 골라야 한다");
                ctx.fly = true;
                return { foes: [e], tile: { x: e.x, y: e.y } };
            },
            text: ([n]) => `${n}칸 안의 적 하나에게`
        },
        area: {
            brief: ([n, r]) => `범위 ${r * 2 + 1}×${r * 2 + 1}`,
            pick: ([n, r]) => ({ range: n, radius: r, taps: 2, verb: "시전", color: "#ff8a30" }),
            resolve: (ctx, [n, r]) => {
                if (!ctx.target) return CardKit.say("칸을 골라야 한다");
                const tiles = CardKit.squareTiles(ctx.target.x, ctx.target.y, r);
                ctx.flash = tiles;
                return { foes: CardKit.foesIn(ctx.world, ctx.user, tiles), tile: ctx.target };
            },
            text: ([n, r], foe) => (foe ? `${n}칸 안의 칸을 골라 ${r * 2 + 1}×${r * 2 + 1} 안의 적 모두에게` : `${n}칸 안의 칸을 골라`)
        },
        around: {
            brief: () => "주변",
            resolve: (ctx) => {
                const u = ctx.user;
                const tiles = CardKit.squareTiles(u.x, u.y, 1);
                const foes = CardKit.foesIn(ctx.world, u, tiles);
                if (!foes.length) return CardKit.say("주변에 적이 없다");
                ctx.flash = tiles;
                return { foes, tile: { x: u.x, y: u.y } };
            },
            text: () => "주변 8칸의 적 모두에게"
        },
        all: {
            brief: () => "모두",
            resolve: (ctx) => {
                const foes = ctx.world.hostiles(ctx.user).filter((e) => !e.invulnerable);
                if (!foes.length) return CardKit.say("적이 없다");
                return { foes, tile: { x: ctx.user.x, y: ctx.user.y } };
            },
            text: () => "방의 적 모두에게"
        },
        rand: {
            brief: ([k]) => `무작위 ${k}`,
            resolve: (ctx, [k]) => {
                const all = ctx.world.hostiles(ctx.user).filter((e) => !e.invulnerable);
                if (!all.length) return CardKit.say("적이 없다");
                const foes = [];
                const rng = ctx.world.rng ?? Math.random;
                for (let i = 0; i < k; i++) foes.push(all[Math.floor(rng() * all.length)]);
                ctx.fly = true;
                return { foes, tile: { x: ctx.user.x, y: ctx.user.y } };
            },
            text: ([k]) => `무작위 적에게 ${k}번`
        },
        tile: {
            pick: ([n], p) => ({ range: n, radius: 0, taps: 1, verb: "놓기", color: "#7cd47c", tiles: (w) => CardKit.freeTiles(w, p, n) }),
            resolve: (ctx, [n]) => {
                const t = ctx.target;
                if (!t || !CardKit.freeTiles(ctx.world, ctx.user, n).includes(`${t.x},${t.y}`)) return CardKit.say(`${n}칸 안의 빈칸을 골라야 한다`);
                return { foes: [], tile: t };
            },
            text: ([n]) => `${n}칸 안의 빈칸에`
        },
        walk: {
            brief: ([n]) => `${n}칸 이동`,
            pick: ([n]) => ({ range: n, radius: 0, walk: true, taps: 1, verb: "이동", color: "#7cc4e8" }),
            resolve: (ctx, [n]) => {
                const steps = ActionCards.move(ctx, n);
                if (!steps) return null;
                ctx.steps.push(...steps);
                return { foes: [], tile: { x: ctx.user.x, y: ctx.user.y } };
            },
            text: ([n]) => `걸어서 ${n}칸 안의 빈칸으로 간 뒤`
        },
        tp: {
            brief: ([n]) => `순간이동 ${n}`,
            pick: ([n], p) => ({ range: n, radius: 0, taps: 1, verb: "이동", color: "#c8a0f8", tiles: (w) => CardKit.freeTiles(w, p, n) }),
            resolve: (ctx, [n]) => {
                const t = ctx.target;
                const u = ctx.user;
                if (!t || !CardKit.freeTiles(ctx.world, u, n).includes(`${t.x},${t.y}`)) return CardKit.say(`${n}칸 안의 빈칸을 골라야 한다`);
                if (u.root > 0) return CardKit.say("속박되어 움직일 수 없다");
                const from = CardKit.px(ctx.world, u);
                ctx.world.teleport(u, t.x, t.y);
                ctx.steps.push([new MoveAnim(u, from, CardKit.px(ctx.world, u), 0.1), new PopupAnim(u, "휙", "#c8a0f8")]);
                return { foes: [], tile: { x: u.x, y: u.y } };
            },
            text: ([n]) => `${n}칸 안의 빈칸으로 순간이동한 뒤`
        },
        charge: {
            brief: ([n]) => `돌진 ${n}`,
            pick: ([n]) => ({ range: n, radius: 0, line: true, taps: 1, verb: "돌진", color: "#d8443c" }),
            resolve: (ctx, [n]) => {
                const r = CardKit.lineFoe(ctx, n);
                if (!r) return null;
                const u = ctx.user;
                if (u.root > 0) return CardKit.say("속박되어 돌진할 수 없다");
                const e = r.foes[0];
                const dx = Math.sign(e.x - u.x);
                const dy = Math.sign(e.y - u.y);
                const size = ctx.world.tileSize;
                while (Math.abs(e.x - u.x) + Math.abs(e.y - u.y) > 1) {
                    const fx = u.x;
                    const fy = u.y;
                    if (!ctx.world.moveEntity(u, dx, dy)) break;
                    ctx.steps.push([new MoveAnim(u, new Vector(fx * size, fy * size), new Vector(u.x * size, u.y * size), 0.07)]);
                }
                return r;
            },
            text: ([n]) => `일직선 ${n}칸 안의 첫 적에게 달려가`
        }
    };

    static lineFoe(ctx, n) {
        const u = ctx.user;
        const t = ctx.target;
        if (!t || !ActionCards.inLine(u, t, n)) return CardKit.say(n > 1 ? `상하좌우 일직선 ${n}칸 안을 골라야 한다` : "바로 옆 칸을 골라야 한다");
        const e = ActionCards.firstInLine(ctx.world, u, t, n);
        if (!CardKit.isFoe(u, e)) return CardKit.say("그 방향에는 칠 적이 없다");
        if (e.x !== u.x) u.flipX = e.x < u.x;
        u.applyFlip();
        return { foes: [e], tile: { x: e.x, y: e.y } };
    }

    // ---------- 조건 ----------
    static CONDS = {
        kill: { ok: (c) => c.kills > 0, text: "쓰러뜨리면" },
        low: { ok: (c) => c.user.stats.hp * 2 <= c.user.stats.maxHp, text: "내 체력이 절반 이하면" },
        block: { ok: (c) => c.user.block > 0, text: "방어도가 있으면" },
        pois: { ok: (c) => c.foes.some((f) => Status.get(f, "poison") > 0), text: "대상이 독에 걸렸으면" },
        rich: { ok: (c) => c.user.money >= 100, text: "돈이 100 G 이상이면" }
    };

    // ---------- 효과 ----------
    // run(ctx, args, foe?) → 연출 배열. text(args) → 설명 조각. brief(args) → 짧은 설명 조각 (없으면 안 보인다)
    static STATUS_FX(key, verb) {
        return {
            foe: true,
            run: (c, [n], f) => {
                Status.add(f, key, n);
                if (key === "stun" && f.ai && f.ai.plan) f.ai.intent = { kind: "stunned" };
                return [new PopupAnim(f, `${Status.DEFS[key].name}+${n}`, Status.DEFS[key].color)];
            },
            text: ([n]) => `${CardText.status(key, Status.DEFS[key].name + " " + n)}${verb}`,
            brief: ([n]) => CardText.status(key, `${Status.DEFS[key].name} ${n}`)
        };
    }

    static SELF_STATUS(key) {
        return {
            run: (c, [n]) => {
                Status.add(c.user, key, n);
                return [new PopupAnim(c.user, `${Status.DEFS[key].name}+${n}`, Status.DEFS[key].color)];
            },
            text: ([n]) => `내 ${CardText.status(key, Status.DEFS[key].name + " +" + n)}`,
            brief: ([n]) => CardText.status(key, `${Status.DEFS[key].name}+${n}`)

    static PERM = { attack: "공격력", defense: "방어력", maxHp: "최대 체력", speed: "이동속도", maxMana: "최대 마나", summon: "소환수 힘" };

    // 소환·지뢰 자리: 고른 칸이 비었으면 거기, 아니면 내 옆 빈칸
    static spot(c, allowHazard = false) {
        const t = c.tile;
        const free = (x, y) => c.world.isWalkable(x, y) && (allowHazard || !c.world.entitiesAt(x, y).some((e) => e.isHazard));
        if (t && free(t.x, t.y)) return t;
        return EnemyMoves.freeNear(c.world, c.user.x, c.user.y, 2);
    }

    static hit(c, f, dmg, type = "physical") {
        if (!f.alive) return [];
        if (c.fly && !c.bump) c.steps.push([new ProjectileAnim(c.world, "kicons", c.card.def.frame, CardKit.px(c.world, c.user), CardKit.px(c.world, f))]);
        let out;
        const near = Math.max(Math.abs(f.x - c.user.x), Math.abs(f.y - c.user.y)) <= 1;
        if (type === "physical" && near && !c.fly && !c.bump) out = Combat.strike(c.user, f, c.world, dmg, c.card.name);
        else {
            if (dmg > 0) MessageLog.add(`${f.displayName}에게 ${Status.modify(dmg, c.user, f)} 피해 (${c.card.name})`, "#e8d9b8");
            out = dmg > 0 ? Combat.hit(f, dmg, c.user, c.world, type) : [];
        }
        if (!f.alive) c.kills++;
        return out;
    }

    static heal(user, n) {
        const before = user.stats.hp;
        user.stats.hp = Math.min(user.stats.maxHp, user.stats.hp + n);
        const got = user.stats.hp - before;
        return got ? [new PopupAnim(user, `+${got}`, "#7cd47c")] : [];
    }

    // 밀기(dir 1)·당기기(dir -1). 밀다가 막히면 3 피해
    static shove(c, f, n, dir) {
        if (!f.alive || !f.world || f.invulnerable) return [];
        const u = c.user;
        let dx = Math.sign(f.x - u.x) * dir;
        let dy = Math.sign(f.y - u.y) * dir;
        if (dx && dy) dy = 0;
        const size = c.world.tileSize;
        const slides = [];
        let bumped = false;
        for (let i = 0; i < n; i++) {
            if (dir < 0 && Math.abs(f.x - u.x) + Math.abs(f.y - u.y) <= 1) break;
            const fx = f.x;
            const fy = f.y;
            if (!c.world.moveEntity(f, dx, dy)) {
                bumped = dir > 0;
                break;
            }
            f.flipX = u.x > f.x;
            f.applyFlip();
            slides.push(new MoveAnim(f, new Vector(fx * size, fy * size), new Vector(f.x * size, f.y * size)));
        }
        if (slides.length) c.steps.push(slides);
        if (bumped) {
            MessageLog.add(`${josa(f.displayName, "이가")} 부딪혔다!`, "#e8d9b8");
            c.bump = true;
            const out = CardKit.hit(c, f, 3);
            c.bump = false;
            return out;
        }
        return [];
    }

    // ---------- 쓰기 ----------
    static run(ctx, T, targs, fx) {
        const c = { ...ctx, steps: [], kills: 0, fly: false, flash: null };
        const r = T.resolve(c, targs);
        if (!r) return null;
        c.foes = r.foes;
        c.tile = r.tile;
        if (c.flash) c.steps.push([new AreaFlashAnim(c.world, c.flash, c.card.def.color, 0.25, false)]);
        for (const f of fx) {
            if (f.cond === "clear") {
                CardKit.onClear(c, f);
                continue;
            }
            if (f.cond && !CardKit.CONDS[f.cond].ok(c)) continue;
            const F = CardKit.FX[f.name];
            const out = [];
            if (F.foe) {
                for (const foe of c.foes) if (foe.alive) out.push(...F.run(c, f.args, foe));
            } else out.push(...F.run(c, f.args));
            if (out.length) c.steps.push(out);
        }
        if (!c.steps.length) c.steps.push([new PopupAnim(c.user, c.card.name, c.card.def.color)]);
        return c.steps;
    }

    // 방을 정리하면 할 일 (player.onClear)
    static onClear(c, f) {
        const F = CardKit.FX[f.name];
        const user = c.user;
        const cards = c.cards;
        const name = c.card.name;
        user.onClear.push({
            text: `${name}: ${F.text(f.args)}`,
            run: () => F.run({ user, cards, world: user.world, foes: [], steps: [], tile: user, card: c.card, kills: 0 }, f.args)
        });
        MessageLog.add(`방을 정리하면: ${F.text(f.args)}`, "#f0d878");
    }

    static clearRoom(player) {
        const list = player.onClear ?? [];
        player.onClear = [];
        for (const job of list) {
            MessageLog.add(job.text, "#f0d878");
            job.run();
        }
    }

    // ---------- 설명 ----------
    static describe(T, targs, fx, spec) {
        const parts = [];
        let line = [];
        let cond = null;
        const flush = () => {
            if (!line.length) return;
            if (cond === "clear") parts.push(`이 방을 정리하면 ${line.join(", ")}.`);
            else if (cond) parts.push(`${CardKit.CONDS[cond].text} ${line.join(", ")}.`);
            else parts.push(line.join(", ") + ".");
            line = [];
        };
        for (const f of fx) {
            if (f.cond !== cond) {
                flush();
                cond = f.cond;
            }
            line.push(CardKit.FX[f.name].text(f.args));
        }
        flush();
        if (spec.desc) return spec.desc + (spec.exhaust ? " (소멸: 이 방에서는 한 번만)" : "");
        let head = T.text(targs, fx.some((f) => CardKit.FX[f.name].foe));
        // "…간 뒤" 다음에 할 일이 없거나 조건부면 문장을 끝낸다
        if (/ 뒤$/.test(head) && (!fx.length || fx[0].cond)) head = head.replace(/한 뒤$/, "한다.").replace(/간 뒤$/, "간다.").replace(/달려가$/, "달려간다.");
        let text = head ? `${head} ${parts.join(" ")}`.trim() : parts.join(" ");
        if (spec.note) text += ` ${spec.note}`;
        if (spec.exhaust) text += " (소멸: 이 방에서는 한 번만)";
        return text;
    }

    static brief(fx) {
        const main = fx.filter((f) => !f.cond);
        return (main.length ? main : fx).slice(0, 3).map((f) => CardKit.FX[f.name].brief(f.args)).join(" · ");
    }

    // ---------- 아이콘 ----------
    // 흑백 틀(card_glyphs)을 카드 색으로 물들여 카드마다 한 칸짜리 아이콘 시트 "kicons"를 만든다 (불러온 뒤 한 번)
    static buildIcons() {
        const src = Resource.image("card_glyphs");
        const n = CardKit.list.length;
        const sheet = document.createElement("canvas");
        sheet.width = Math.max(16, n * 16);
        sheet.height = 16;
        const g = sheet.getContext("2d");
        const tmp = document.createElement("canvas");
        tmp.width = tmp.height = 16;
        const t = tmp.getContext("2d");
        for (const def of CardKit.list) {
            const gi = Math.max(0, CardKit.GLYPHS.indexOf(def.icon));
            t.globalCompositeOperation = "source-over";
            t.clearRect(0, 0, 16, 16);
            t.drawImage(src, gi * 16, 0, 16, 16, 0, 0, 16, 16);
            t.globalCompositeOperation = "multiply";
            t.fillStyle = def.color;
            t.fillRect(0, 0, 16, 16);
            t.globalCompositeOperation = "destination-in";
            t.drawImage(src, gi * 16, 0, 16, 16, 0, 0, 16, 16);
            g.drawImage(tmp, def.frame * 16, 0);
        }
        Resource.setImage("kicons", sheet);
    }
}

/* ===== assets/dat/card/Gear.js ===== */
// 장비 체계: 장착하면 능력치가 오르고, 장비의 행동 카드(grants)가 덱에 들어온다.
//
// 장비 카드 정의 (CardDef):
//   slot:   장비라는 표시 ("gear"). 부위는 없고 몇 개든 겹쳐 장착된다
//   stats:  { attack, defense, defensePct(방어력 %), speed, actionHand, invHand } — 장착하는 동안 오르는 능력치·패 크기
//   grants: [{ id, n }] — 장착하면 덱에 섞여 들어오는 행동 카드 (장비 카드, def.token)
//
// 장비 카드 흐름 (CardSystem.equip / unequip):
//   - 처음 장착: 장비 카드 n장을 새로 만들어 덱에 섞는다. 카드마다 data.src = 장비의 uid
//   - 해제: 패·덱·묘지에서 그 장비의 카드를 모두 빼고, 어디에 몇 장 있었는지(data.stash)를 장비에 적어 둔다
//   - 다시 장착: 적어 둔 자리(패 2장, 묘지 1장 …)로 그대로 돌려놓는다. 패에 자리가 없으면 남는 건 덱으로
// 장비 카드는 상자에 넣거나 팔 수 없다 (장비에서 나온 카드라서).
// 무작위 옵션은 없다 (장비는 종류마다 고정). 내구도도 없다.
class Gear {
    static STATS = {
        attack: "공격력", defense: "방어력", speed: "이동속도", actionHand: "행동 패", invHand: "인벤토리 패", maxHp: "최대 체력", defensePct: "방어력 %"
    };

    // 장착한 장비들의 능력치 합 (key: attack, defense, speed, actionHand, invHand, maxHp)
    static sum(cards, key) {
        let n = 0;
        for (const card of cards.equippedCards) n += card.def.stats?.[key] ?? 0;
        return n;
    }

    // 장비 카드 설명 줄: "· 공격력 +3", "· 덱에 [채굴] 3장"
    static lines(card) {
        const def = card.def;
        const lines = [];
        if (def.noLines) return lines; // 공방 장비: 설명 글이 이미 능력치를 말한다
        for (const [key, v] of Object.entries(def.stats ?? {})) if (v) lines.push(`· ${Gear.STATS[key] ?? key} ${v > 0 ? "+" : ""}${v}`);
        for (const g of def.grants ?? []) lines.push(`· 덱에 [${CardDef.get(g.id)?.name ?? g.id}] ${g.n}장`);
        return lines;
    }

    // 장비 한 장의 고유 번호 (저장된다). 장비 카드가 어느 장비에서 나왔는지 이걸로 안다
    static uid(card) {
        const data = card.ensureData();
        if (!data.uid) data.uid = Gear.newUid();
        return data.uid;
    }

    static newUid() {
        return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    // 이 장비에서 나온 카드인가
    static isFrom(card, uid) {
        return !!card.data && card.data.src === uid;
    }

    // 고정 장비 전부 (우두머리 보상 등)
    static all() {
        return [...CardDef.defs.values()].filter((d) => d.slot && d.type === "item").map((d) => d.id);
    }

    // 무작위 장비 한 장
    static random(rng = Math.random, ids = Gear.all()) {
        return new Card(ids[Math.floor(rng() * ids.length)]);
    }
}

/* ===== assets/dat/card/Spell.js ===== */
// 스킬 카드(주문) 체계. 주문 종류(파이어볼, 마법 화살 …)는 정해져 있고, 카드 한 장마다 비용이 다르다.
//
// 카드 한 장의 데이터 (card.data):
//   cost:    { r: 자원, n: 양 } — 카드마다 고정. 상점·던전에서 나올 때 무작위로 정해진다 (Spell.roll)
//   sockets: 젬 칸 수 0~3 (Gem.js). 1칸까지는 흔하고, 2칸은 드물고, 3칸은 아주 드물다
//   gems:    끼운 젬들 (젬 카드의 저장 형태 { d, x })
//
// 위력 계산 (모든 주문 공통):
//   포인트 P = 비용의 양 × 자원 가치(VALUE) + 증폭 젬
//     자원 가치: 마나 1, 체력 2, 쉼 1 (쉼 n = n턴 동안 카드를 못 뽑는다)
//       → "마나 6 = 체력 3 = 쉼 6"
//   효과 수치: 능력치를 쓰는 주문은 floor(능력치 × (base + k × P)), 아니면 floor(base + k × P) (calc로 정한다)
//     예) 파이어볼 = 공격력 × (40% + 15% × P) → 공격력 5, 마나 6이면 floor(5 × 1.3) = 6 피해
//   절약 젬은 내는 비용만 줄이고 위력(P)은 그대로 둔다.
// 주문은 기력을 쓰지 않는다 (비용은 카드에 적힌 자원만).
//
// 값: 주문 기본 값 × PRICE_GROWTH^P × 젬 칸 배수 + 끼운 젬 값. 포인트가 높을수록, 칸이 많을수록 지수로 오른다.
//
// 새 주문: Spell.register(id, spec)
//   spec: name, frame, price, resources(쓸 수 있는 자원들), points [최소, 최대], base, k, min?, max?, calc(P, user)?,
//         target(v) → { range, radius, taps?, verb? } | null, area(범위 피해인가), damage(피해 주문인가),
//         text(v, target) 긴 설명, short(v, target) 카드 위 짧은 설명, effect(ctx, v, target) → 연출 단계 | null,
//         legacy: 카드 데이터 없이 만든 카드(new Card(id))의 비용
class Spell {
    static RESOURCES = {
        mana: { name: "마나", value: 1 },
        hp: { name: "체력", value: 2 }, // 체력은 아껴야 하는 자원이라 체력 비용 카드는 위력이 크다
        rest: { name: "쉼", value: 1 }
    };
    // 카드를 굴릴 때 자원이 뽑힐 비중 (쉼은 드물게)
    static WEIGHT = { mana: 1.4, hp: 1, rest: 0.4 };
    static PRICE_GROWTH = 1.12;
    static SOCKET_ODDS = [0.5, 0.42, 0.07, 0.01]; // 젬 칸 0, 1, 2, 3칸이 나올 확률
    static SOCKET_PRICE = [1, 1.5, 3, 7];         // 젬 칸 수에 따른 값 배수
    static kinds = new Map();

    static register(id, spec) {
        const s = { min: 1, max: 99, base: 1, k: 1, area: false, damage: false, ...spec };
        Spell.kinds.set(id, s);
        CardDef.register(id, {
            type: "skill", name: s.name, spell: true, rarity: s.rarity ?? "uncommon",
            description: "", price: s.price, sprite: "cards", frame: s.frame,
            use: (ctx) => Spell.cast(ctx)
        });
    }

    static spec(card) {
        return Spell.kinds.get(card.defId);
    }

    // 카드 데이터 (데이터 없이 만든 카드는 그 주문의 기본 비용 legacy)
    static data(card) {
        const s = Spell.spec(card);
        const d = card.data ?? {};
        return { cost: d.cost ?? s.legacy, sockets: d.sockets ?? 0, gems: d.gems ?? [] };
    }

    // 끼운 젬들 [{ id, v }]
    static gems(card) {
        return Spell.data(card).gems.map((g) => ({ id: CardDef.resolve(g.d), v: Gem.valueOf(g) }));
    }

    static gemSum(card, id) {
        return Spell.gems(card).reduce((s, g) => s + (g.id === id ? g.v : 0), 0);
    }

    // 실제로 내는 비용 { r, n } (절약 젬 적용)
    static payCost(card) {
        const { cost } = Spell.data(card);
        const thrift = cost.r === "mana" ? Spell.gemSum(card, "gem_thrift") : 0; // 마나 젬은 마나 비용만 (0까지)
        return { r: cost.r, n: Math.max(0, cost.n - thrift) };
    }

    // Player.canPay / pay에 넘기는 형태 { mana: 5 } 등
    static costObject(card) {
        const c = Spell.payCost(card);
        return { [c.r]: c.n };
    }

    // 포인트: 원래 비용(절약 전) × 자원 가치 + 증폭 젬
    static points(card) {
        const { cost } = Spell.data(card);
        return cost.n * Spell.RESOURCES[cost.r].value + Spell.gemSum(card, "gem_power");
    }

    // 효과 수치 (피해, 회복량, 뽑는 장수, 거리 …). user의 능력치를 쓰는 주문은 user (기본: 지금 플레이어)
    static value(card, user = Player.current) {
        const s = Spell.spec(card);
        const P = Spell.points(card);
        const raw = s.calc ? s.calc(P, user ?? Spell.BASE_USER) : s.base + s.k * P;
        const v = Math.floor(raw + 1e-9);
        return Math.max(s.min, Math.min(s.max, v));
    }

    // 플레이어가 없을 때(카드 미리보기) 쓰는 기본 능력치
    static BASE_USER = { stats: { attack: 5, defense: 5 }, speed: 3 };

    // 칸을 고르는 주문이면 { range, radius, ... }
    static target(card, user = Player.current) {
        const s = Spell.spec(card);
        if (!s.target) return null;
        return { radius: 0, ...s.target(Spell.value(card, user), user ?? Spell.BASE_USER) };
    }

    // 범위 젬이 닿는 반경 (서리 폭발처럼 칸을 고르지 않는 범위 주문)
    static radius(card, base) {
        return base;
    }

    // 원거리 젬이 붙는가 (칸을 골라 멀리 쏘는 주문)
    static ranged(card) {
        const s = Spell.spec(card);
        return !!s.target && !s.adjacent;
    }

    static price(card) {
        const s = Spell.spec(card);
        const { sockets, gems } = Spell.data(card);
        const base = s.price * Spell.PRICE_GROWTH ** Spell.points(card) * Spell.SOCKET_PRICE[sockets];
        return Math.max(1, Math.floor(base + gems.reduce((sum, g) => sum + Gem.priceOf(g), 0)));
    }

    // "마나 5" / "체력 3" / "쉼 3" / "비용 없음"
    static costText(cost) {
        if (!cost.n) return "비용 없음";
        return `${Spell.RESOURCES[cost.r].name} ${cost.n}`;
    }

    static describe(card) {
        const s = Spell.spec(card);
        const v = Spell.value(card);
        const t = Spell.target(card);
        const { cost, sockets, gems } = Spell.data(card);
        const lines = [s.text(v, t, card)];
        const pay = Spell.payCost(card);
        const thrift = pay.n !== cost.n ? ` (원래 ${cost.n})` : "";
        const gemPoints = Spell.gemSum(card, "gem_power");
        lines.push(`비용 ${Spell.costText(pay)}${thrift} · 위력 ${Spell.fmt(Spell.points(card))}${gemPoints ? ` (젬 +${gemPoints})` : ""}`);
        if (cost.r === "rest") lines.push(`(쉼 ${pay.n}: 쓰면 ${pay.n}턴 동안 카드를 뽑지 못한다)`);
        if (sockets) {
            lines.push(`젬 칸 ${gems.length}/${sockets}`);
            for (const g of gems) lines.push("◆ " + Gem.lineOf(g));
        }
        return lines.join("\n");
    }

    // 한 줄 효과 ("5 피해 · 반경 1 · 5칸")
    static short(card) {
        return Spell.spec(card).short(Spell.value(card), Spell.target(card), card);
    }

    static summary(card) {
        const { sockets, gems } = Spell.data(card);
        const text = Spell.short(card);
        return sockets ? `${text}\n젬 ${gems.length}/${sockets}` : text;
    }

    static fmt(n) {
        return Number.isInteger(n) ? String(n) : n.toFixed(1);
    }

    // 무작위 카드 한 장: 자원과 양, 젬 칸
    static roll(id, rng = Math.random) {
        const s = Spell.kinds.get(id);
        const total = s.resources.reduce((sum, r) => sum + Spell.WEIGHT[r], 0);
        let x = rng() * total;
        let r = s.resources[s.resources.length - 1];
        for (const res of s.resources) {
            if (x < Spell.WEIGHT[res]) {
                r = res;
                break;
            }
            x -= Spell.WEIGHT[res];
        }
        const p = s.points[0] + Math.floor(rng() * (s.points[1] - s.points[0] + 1));
        const n = p === 0 ? 0 : Math.max(1, Math.round(p / Spell.RESOURCES[r].value));
        const card = new Card(id);
        card.data = { cost: { r, n }, sockets: Spell.rollSockets(rng), gems: [] };
        return card;
    }

    static rollSockets(rng = Math.random) {
        let x = rng();
        for (let i = 0; i < Spell.SOCKET_ODDS.length; i++) {
            if (x < Spell.SOCKET_ODDS[i]) return i;
            x -= Spell.SOCKET_ODDS[i];
        }
        return 0;
    }

    // ---------- 쓰기 ----------
    // CardSystem.use가 부른다 (비용 확인·지불은 거기서). 효과 + 젬 추가 효과(환원, 치유)
    static cast(ctx) {
        const card = ctx.card;
        const s = Spell.spec(card);
        ctx.spell = {};
        const steps = s.effect(ctx, Spell.value(card, ctx.user), Spell.target(card, ctx.user));
        if (!steps) return null;
        const extra = [];
        const refund = Spell.gemSum(card, "gem_refund");
        if (refund) {
            const u = ctx.user;
            const n = Math.min(refund, u.maxMana - u.mana);
            if (n > 0) {
                u.mana += n;
                MessageLog.add(`젬(환원): 마나 ${n} 회복`, "#7cb0f0");
                extra.push(new PopupAnim(u, "+" + n, "#7cb0f0"));
            }
        }
        const heal = Spell.gemSum(card, "gem_heal");
        if (heal) {
            const s = ctx.user.stats;
            const n = Math.min(heal, s.maxHp - s.hp);
            if (n > 0) {
                s.hp += n;
                MessageLog.add(`젬(치유): 체력 ${n} 회복`, "#7cd47c");
                extra.push(new PopupAnim(ctx.user, "+" + n, "#7cd47c"));
            }
        }
        if (extra.length) steps.push(extra);
        return steps;
    }

    // 대상들에게 피해. 피해 유형은 주문의 element (바닥 아이템은 안 다치고 센 열이면 익는다)
    static hitAll(ctx, targets, damage) {
        const anims = [];
        const type = Spell.spec(ctx.card)?.element ?? "physical";
        for (const e of targets) anims.push(...Combat.hit(e, damage, ctx.user, ctx.world, type));
        return anims;
    }

    // "열 " / "냉기 " … (물리면 "")
    static typeName(card) {
        const el = Spell.spec(card)?.element;
        return el && el !== "physical" ? Combat.TYPES[el] + " " : "";
    }

    static inRange(user, t, range) {
        return Math.abs(t.x - user.x) + Math.abs(t.y - user.y) <= range;
    }

    static square(cx, cy, r, skipCenter = false) {
        const tiles = [];
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (!skipCenter || dx || dy) tiles.push([cx + dx, cy + dy]);
        return tiles;
    }

    // 고른 칸으로 투사체 → 범위 안 모든 엔티티(시전자 제외)에게 피해
    static blast(ctx, damage, t, { frame, color }) {
        const name = ctx.card.name;
        const at = ctx.target;
        if (!at) {
            MessageLog.add("대상 칸을 골라야 한다", "#c8b890");
            return null;
        }
        if (!Spell.inRange(ctx.user, at, t.range)) {
            MessageLog.add("사거리 밖이다", "#c8b890");
            return null;
        }
        const tiles = Spell.square(at.x, at.y, t.radius);
        const targets = [];
        for (const [x, y] of tiles) for (const e of ctx.world.entitiesAt(x, y)) if (e !== ctx.user && e.alive && !targets.includes(e)) targets.push(e);
        const hits = targets.length;
        const size = ctx.world.tileSize;
        const fly = new ProjectileAnim(ctx.world, "cards", frame,
            new Vector(ctx.user.x * size, ctx.user.y * size), new Vector(at.x * size, at.y * size));
        MessageLog.add(hits ? `${name}: ${hits}개 대상에게 ${damage} ${Spell.typeName(ctx.card)}피해` : `${name}: 아무것도 맞지 않았다`, "#ff9a50");
        return [[fly], [new AreaFlashAnim(ctx.world, tiles, color), ...Spell.hitAll(ctx, targets, damage)]];
    }


    static heal(ctx, amount) {
        return CardEffects.heal(ctx, amount);
    }

    static blink(ctx, t) {
        const at = ctx.target;
        const u = ctx.user;
        if (!at || !Spell.inRange(u, at, t.range) || (at.x === u.x && at.y === u.y)) {
            MessageLog.add(`${t.range}칸 안의 다른 칸을 골라야 한다`, "#c8b890");
            return null;
        }
        if (!ctx.world.isWalkable(at.x, at.y)) {
            MessageLog.add("그 칸으로는 갈 수 없다", "#c8b890");
            return null;
        }
        const from = [[u.x, u.y]];
        ctx.world.teleport(u, at.x, at.y);
        u.clearGoal && u.clearGoal();
        return [[new AreaFlashAnim(ctx.world, from, "#c8a0f8"), new AreaFlashAnim(ctx.world, [[at.x, at.y]], "#c8a0f8")]];
    }


    // 방어도 (수호)
    static ward(ctx, v, turns) {
        ctx.user.addBlock(v, turns);
        MessageLog.add(`방어도 +${v} (${turns}턴)`, "#8cc8f0");
        return [[new PopupAnim(ctx.user, "+" + v, "#8cc8f0"), new AreaFlashAnim(ctx.world, [[ctx.user.x, ctx.user.y]], "#8cc8f0")]];
    }

    // 기력 회복 (숙고). 최대를 넘지 않는다. 이미 가득하면 못 쓴다
    static energy(ctx, v) {
        const u = ctx.user;
        if (u.energy >= u.maxEnergy) {
            MessageLog.add("기력이 이미 가득하다", "#c8b890");
            return null;
        }
        const n = Math.min(v, u.maxEnergy - u.energy);
        u.energy += n;
        MessageLog.add(`기력 ${n} 회복`, "#f0d060");
        return [[new PopupAnim(u, "+" + n, "#f0d060")]];
    }

    static recall(ctx, count) {
        let n = 0;
        for (let i = 0; i < count; i++) {
            if (!ctx.cards.recall()) break;
            n++;
        }
        return n ? [] : null;
    }
}
