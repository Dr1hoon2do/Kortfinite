// 장판을 땅에 그린다 (반투명 색 칸)
class HazardOverlay extends Renderer {
    constructor(run) {
        super();
        this.run = run;
        this.sortingLayer = "Default";
        this.orderInLayer = 1;
    }

    getBounds() {
        return null;
    }

    render(ctx, camera) {
        const room = this.run.room;
        if (!room || this.run.state !== "room") return;
        const t = room.tileSize;
        const m = camera.viewMatrix;
        ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 300);
        for (const h of room.hazards ?? []) {
            if (h.kind === "pickup" && h.world) {
                // 떨어진 것: 받침 + 아이콘 + 이름·값. 월드는 y가 위로 자라서 칸마다 뒤집어서(y 아래로 +) 그린다
                const it = h.item;
                const bob = Math.sin(performance.now() / 400 + h.x * 1.7) * 0.8;
                ctx.save();
                ctx.translate(h.x * t, h.y * t);
                ctx.scale(1, -1);
                ctx.globalAlpha = 1;
                ctx.fillStyle = "rgba(20, 14, 10, 0.75)";
                ctx.fillRect(-7, 3, 14, 4);
                ctx.fillStyle = it.price ? "#c8a050" : "#8a7a60";
                ctx.fillRect(-6, 3, 12, 3);
                if (it.kind === "gold") ctx.drawImage(Resource.image("cards"), 17 * 16, 0, 16, 16, -8, -8 + bob, 16, 16);
                else {
                    const d = it.card.def;
                    ctx.drawImage(Resource.image(d.sprite), d.frame * 16, 0, 16, 16, -8, -8 + bob, 16, 16);
                }
                ctx.font = "bold 5px monospace";
                ctx.textAlign = "center";
                ctx.textBaseline = "top";
                const name = it.kind === "gold" ? `${it.gold}G` : it.card.name;
                const nw = Math.ceil(ctx.measureText(name).width) + 3;
                ctx.fillStyle = "rgba(20, 14, 10, 0.8)";
                ctx.fillRect(-nw / 2, 7.5, nw, 6);
                ctx.fillStyle = "#f0e6cc";
                ctx.fillText(name, 0, 8);
                if (it.price) {
                    const price = `${it.price}G`;
                    const pw = Math.ceil(ctx.measureText(price).width) + 3;
                    ctx.fillStyle = "rgba(20, 14, 10, 0.85)";
                    ctx.fillRect(-pw / 2, -15, pw, 6);
                    ctx.fillStyle = "#f0d060";
                    ctx.fillText(price, 0, -14.5);
                }
                ctx.restore();
                continue;
            }
            if (h.kind === "coin" && h.world) {
                ctx.globalAlpha = 1;
                ctx.fillStyle = "#6a4a10";
                ctx.fillRect(h.x * t - 3, h.y * t - 3, 6, 6);
                ctx.fillStyle = "#f0c840";
                ctx.fillRect(h.x * t - 2, h.y * t - 4 + pulse, 4, 6);
                ctx.fillRect(h.x * t - 3, h.y * t - 3 + pulse, 6, 4);
                ctx.fillStyle = "#fff0a0";
                ctx.fillRect(h.x * t - 1, h.y * t - 3 + pulse, 1, 2);
                continue;
            }
            if (h.kind === "goo" && h.world) {
                // 점액 장판: 초록 점액 칸. 곧 사라질수록 옅다
                const fade = h.life >= 3 ? 1 : h.life === 2 ? 0.8 : 0.6;
                ctx.globalAlpha = (0.38 + 0.08 * pulse) * fade;
                ctx.fillStyle = "#5fae4a";
                ctx.fillRect(h.x * t - t / 2, h.y * t - t / 2, t, t);
                ctx.globalAlpha = 0.75 * fade;
                ctx.fillStyle = "#a6e68c";
                ctx.fillRect(h.x * t - 5, h.y * t - 4 + pulse, 3, 2);
                ctx.fillRect(h.x * t + 1, h.y * t + 2 - pulse, 4, 2);
                ctx.fillRect(h.x * t - 1, h.y * t - 6, 2, 1);
                ctx.globalAlpha = 0.9 * fade;
                ctx.strokeStyle = "#2f6a2a";
                ctx.lineWidth = 1;
                ctx.strokeRect(h.x * t - t / 2 + 0.5, h.y * t - t / 2 + 0.5, t - 1, t - 1);
                continue;
            }
            if (h.kind !== "field" || !h.world) continue;
            ctx.globalAlpha = 0.25 + 0.1 * pulse;
            ctx.fillStyle = h.color;
            ctx.fillRect(h.x * t - t / 2, h.y * t - t / 2, t, t);
            ctx.globalAlpha = 0.6;
            ctx.fillRect(h.x * t - 3, h.y * t - 1 + pulse * 2, 2, 2);
            ctx.fillRect(h.x * t + 2, h.y * t + 3 - pulse * 2, 2, 2);
        }
        ctx.globalAlpha = 1;
    }
}

// 점액 장판 (슬라임킹): 밟으면 이동이 멈추고, 위에 서 있으면 이동속도가 절반이다. 슬라임 종류는 영향받지 않는다.
class Goo {
    static at(world, x, y) {
        return world.entitiesAt(x, y).find((h) => h.kind === "goo" && h.isHazard);
    }

    static affects(e) {
        return !(e instanceof Monster && (e.kind === "slime" || e.kind === "slime_king" || e.kind === "slime_queen"));
    }

    // e가 지금 장판 위에 있는가
    static on(e) {
        return !!(e.world && e.size === 1 && Goo.affects(e) && Goo.at(e.world, e.x, e.y));
    }

    // 걷다가 장판을 밟았으면 true (그 자리에서 멈춘다)
    static stuck(e) {
        if (!Goo.on(e)) return false;
        MessageLog.add(`${josa(e.displayName, "이가")} 점액에 붙잡혔다`, "#7cd47c");
        return true;
    }

    // (x, y)에 장판을 깐다 (이미 있으면 남은 턴을 다시 채운다)
    static lay(world, x, y, life = 3) {
        if (!world.getChunkAt(x, y) || !ChunkManager.tileOk(world.getTile(x, y))) return;
        const old = Goo.at(world, x, y);
        if (old) old.life = Math.max(old.life, life);
        else world.spawn(new Hazard(x, y, "goo", { life }));
    }
}

/* ===== assets/dat/entity/SlimeKing.js ===== */
// 슬라임킹 (공방 데이터 slime_king, 2x2). 행동 하나하나가 의도(intent)를 만들고, kind "custom"은 run/view/describe를 스스로 가진다.
//   A 점액 돌진 — 플레이어 쪽으로 벽·무언가에 부딪힐 때까지 돌진. 충돌 공격력 160% + 점액 카드 (이동속도 200%)
//   B 점액 던지기 — 플레이어 자리와 그 주변 무작위 6곳에 한 칸씩. 공격력 80%, 맞으면 점액 카드(이동속도 100%), 떨어진 칸마다 점액 장판 2턴
//   C 다가가기 — 이동속도만큼 다가가거나 옆이면 공격력 100%. 맞히면 점액 카드
//   D 방어 — 방어력 100% 방어도 1턴
//   E 슬라임 소환 — 현재 체력 15%를 체력으로, 공격·방어는 킹의 40%인 슬라임을 곁에
//   F 점액 손 — entity/SlimeKingPull.js
//   G 휴식 — 1턴 쉬며 체력 5 회복
// 킹이 움직여 지나간 자리(발자국 2x2 전체)에는 점액 장판(2턴)이 생긴다 (돌진·다가가기).
// 점액 카드 수는 자기 이동속도 비례 (돌진 200%, 던지기·공격 100%).
class SlimeKing {
    // ---------- 도우미 ----------
    // 점액 카드를 플레이어 패에 끼운다 (전투가 끝나면 사라지는 임시 카드). 패가 가득하면 덱으로
    static giveSlime(e, p, pct) {
        const n = Math.floor(e.speedNow * pct / 100 + 1e-9);
        if (n <= 0 || p !== Player.current) return [];
        for (let i = 0; i < n; i++) {
            const c = new Card("slime");
            c.ensureData().temp = true;
            if (!p.cards.addToHand(c)) p.cards.addToDeck(c);
        }
        MessageLog.add(`점액 카드 ${n}장이 끼어들었다`, "#7cd47c");
        return [new PopupAnim(p, `점액 카드 +${n}`, "#7cd47c")];
    }

    static center(e) {
        return { x: e.x + (e.size - 1) / 2, y: e.y + (e.size - 1) / 2 };
    }

    // 킹의 칸(왼쪽 아래 anchor)을 (x, y)에 놓았을 때 foe와 붙어 있나
    static touches(e, x, y, foe) {
        for (const [ax, ay] of e.tilesOf(x, y)) for (const [bx, by] of foe.tilesOf()) if (Math.abs(ax - bx) + Math.abs(ay - by) === 1) return true;
        return false;
    }

    // foe 쪽으로 가는 첫 걸음 방향 (큰 몸이 지나갈 수 있는 길만). 없으면 null
    static stepToward(w, e, foe) {
        const key = (x, y) => x + "," + y;
        const prev = new Map([[key(e.x, e.y), null]]);
        const queue = [[e.x, e.y]];
        for (let qi = 0; qi < queue.length && qi < 600; qi++) {
            const [x, y] = queue[qi];
            if (SlimeKing.touches(e, x, y, foe)) {
                let k = key(x, y);
                let dir = null;
                while (prev.get(k)) {
                    const [from, dx, dy] = prev.get(k);
                    dir = [dx, dy];
                    k = from;
                }
                return dir;
            }
            for (const [dx, dy] of Entity.DIRS) {
                const nx = x + dx;
                const ny = y + dy;
                const k = key(nx, ny);
                if (prev.has(k) || !w.getChunkAt(nx, ny) || !w.canEnter(e, nx, ny)) continue;
                prev.set(k, [key(x, y), dx, dy]);
                queue.push([nx, ny]);
            }
        }
        return null;
    }

    // 킹이 움직일 때마다 새로 차지한 칸들(발자국 전체)에 점액 장판을 깐다. (fx, fy)는 움직이기 전 왼쪽 아래 칸
    static trail(w, e, life = 2, fx = e.x, fy = e.y) {
        const before = new Set(e.tilesOf(fx, fy).map(([x, y]) => x + "," + y));
        for (const [x, y] of e.tilesOf()) if (!before.has(x + "," + y)) Goo.lay(w, x, y, life);
    }

    // ---------- A 점액 돌진 ----------
    static dirTo(e, foe) {
        const c = SlimeKing.center(e);
        const fx = foe.x + (foe.size - 1) / 2;
        const fy = foe.y + (foe.size - 1) / 2;
        const dx = fx - c.x;
        const dy = fy - c.y;
        if (Math.abs(dx) > Math.abs(dy)) return [Math.sign(dx), 0];
        return [0, Math.sign(dy) || Math.sign(dx) || 1];
    }

    // dir로 돌진하면: { steps, x, y(멈춘 왼쪽 아래 칸), tiles(지나간 칸), hit(부딪힌 것) }
    static sim(w, e, dir) {
        let x = e.x;
        let y = e.y;
        const tiles = [];
        const seen = new Set();
        let steps = 0;
        let hit = null;
        for (let guard = 0; guard < 60; guard++) {
            const nx = x + dir[0];
            const ny = y + dir[1];
            if (w.canEnter(e, nx, ny)) {
                x = nx;
                y = ny;
                steps++;
                for (const [tx, ty] of e.tilesOf(x, y)) if (!seen.has(tx + "," + ty)) { seen.add(tx + "," + ty); tiles.push([tx, ty]); }
                continue;
            }
            for (const [tx, ty] of e.tilesOf(nx, ny)) {
                const o = w.entityAt(tx, ty);
                if (o && o !== e) { hit = o; break; }
            }
            break;
        }
        return { steps, x, y, tiles, hit };
    }

    static chargeIntent(ctx, e, foe) {
        const dir = SlimeKing.dirTo(e, foe);
        const r = SlimeKing.sim(ctx.world, e, dir);
        if (r.steps < 1) return null;
        const dmg = EnemyMoves.val(e, "atk", 160);
        return {
            kind: "custom", name: "점액 돌진", dir, dmg, tiles: r.tiles, color: "#f08030",
            view: () => ({ kind: "charge", v: dmg }),
            text: () => `점액 돌진: 주황 칸을 따라 벽에 부딪힐 때까지 돌진. 부딪힌 상대에게 ${dmg} 피해 + 점액 카드 ${Math.floor(e.speedNow * 2)}장. 슬라임킹이 지나간 자리엔 점액 장판(2턴)이 생성된다`,
            run: SlimeKing.runCharge
        };
    }

    static runCharge(ai, ctx, turns, intent) {
        const e = ai.entity;
        const w = ctx.world;
        const p = ctx.player;
        const t = w.tileSize;
        const anims = [];
        let hitPlayer = false;
        if (Status.get(e, "root") > 0) return { anims: [new PopupAnim(e, "속박", "#e8e8f0")], hitPlayer };
        const r = SlimeKing.sim(w, e, intent.dir);
        if (r.steps < 1) return { anims: [new PopupAnim(e, "…", "#c8b890")], hitPlayer };
        const fx = e.x;
        const fy = e.y;
        for (let i = 0; i < r.steps; i++) {
            const bx = e.x;
            const by = e.y;
            w.moveEntity(e, intent.dir[0], intent.dir[1]);
            SlimeKing.trail(w, e, 2, bx, by); // 지나간 자리에 점액 장판
        }
        anims.push(new MoveAnim(e, new Vector(fx * t, fy * t), new Vector(e.x * t, e.y * t), 0.06 * r.steps + 0.06));
        anims.push(new AreaFlashAnim(w, r.tiles, "#7cd47c", 0.35, false));
        MessageLog.add(`${josa(e.displayName, "이가")} 점액을 흩뿌리며 돌진했다!`, "#7cd47c");
        const foe = r.hit;
        if (foe && foe.alive && (foe === p || foe instanceof Ally)) {
            MessageLog.add(`${josa(e.displayName, "이가")} ${foe === p ? "당신" : foe.displayName}을 들이받았다!`, "#f0a0a0");
            anims.push(...Combat.strike(e, foe, w, intent.dmg, "점액 돌진"));
            if (foe === p) {
                hitPlayer = true;
                anims.push(...SlimeKing.giveSlime(e, p, 200));
            }
        }
        return { anims, hitPlayer };
    }

    // ---------- B 점액 던지기 ----------
    static throwIntent(ctx, e, foe) {
        const w = ctx.world;
        const rng = EnemyMoves.rng(ctx);
        const near = [];
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
            if (!dx && !dy || Math.abs(dx) + Math.abs(dy) > 2) continue;
            if (EnemyMoves.walkableTile(w, foe.x + dx, foe.y + dy)) near.push([foe.x + dx, foe.y + dy]);
        }
        for (let i = near.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [near[i], near[j]] = [near[j], near[i]]; }
        const centers = [[foe.x, foe.y], ...near.slice(0, 6)]; // 플레이어 칸 + 주변 무작위 6곳 (모자라면 있는 만큼)
        return {
            kind: "area", name: "점액 던지기", tiles: centers.map(([x, y]) => [x, y]), centers, dmg: EnemyMoves.val(e, "atk", 80), thrown: true, color: "#7cd47c",
            cards: { pct: 100 }, goo: 2
        };
    }

    // ---------- C 다가가기 / 공격 ----------
    static biteIntent(ctx, e, foe) {
        const pct = 100;
        return {
            kind: "custom", name: "공격", pct,
            view: (ai, p) => {
                const f = ai.focus({ world: e.world, player: p });
                const d = EnemyMoves.dist(e, f);
                if (Status.get(e, "root") > 0 && d > 1) return { kind: "idle" };
                return d <= e.speedNow ? { kind: "attack", v: Status.modify(EnemyMoves.val(e, "atk", pct), e, f) } : { kind: "chase" };
            },
            text: () => `다가온다 (한 턴에 ${e.speedNow}칸) · 닿으면 ${EnemyMoves.val(e, "atk", pct)} 피해, 맞히면 점액 카드 ${Math.floor(e.speedNow)}장`,
            run: SlimeKing.runBite
        };
    }

    static runBite(ai, ctx, turns, intent) {
        const e = ai.entity;
        const w = ctx.world;
        const p = ctx.player;
        const t = w.tileSize;
        const foe = ai.focus(ctx);
        const anims = [];
        let hitPlayer = false;
        const n = e.speedNow;
        let moved = 0;
        const rooted = Status.get(e, "root") > 0;
        while (moved < n && e.alive && foe.alive && EnemyMoves.dist(e, foe) > 1 && !rooted) {
            const dir = SlimeKing.stepToward(w, e, foe);
            if (!dir) break;
            const fx = e.x;
            const fy = e.y;
            if (!w.moveEntity(e, dir[0], dir[1])) break;
            SlimeKing.trail(w, e, 2, fx, fy); // 다가가는 걸음에도 점액 장판
            anims.push(new MoveAnim(e, new Vector(fx * t, fy * t), new Vector(e.x * t, e.y * t)));
            moved++;
        }
        if (e.alive && foe.alive && EnemyMoves.dist(e, foe) === 1 && moved < n) {
            const dmg = EnemyMoves.val(e, "atk", intent.pct);
            anims.push(...Combat.strike(e, foe, w, dmg, "공격"));
            if (foe === p) {
                hitPlayer = true;
                if ((Combat.last?.dealt ?? 0) > 0) anims.push(...SlimeKing.giveSlime(e, p, 100));
            }
        }
        return { anims, hitPlayer };
    }

    // ---------- E 슬라임 소환 ----------
    // 킹 둘레의 비어 있는 칸들
    static ringTiles(w, e) {
        const out = [];
        for (let dy = -1; dy <= e.size; dy++) for (let dx = -1; dx <= e.size; dx++) {
            const inside = dx >= 0 && dx < e.size && dy >= 0 && dy < e.size;
            const corner = (dx < 0 || dx >= e.size) && (dy < 0 || dy >= e.size);
            if (inside || corner) continue;
            const x = e.x + dx;
            const y = e.y + dy;
            if (w.getChunkAt(x, y) && w.isWalkable(x, y)) out.push([x, y]);
        }
        return out;
    }

    static summonIntent(ctx, e) {
        const w = ctx.world;
        const rng = EnemyMoves.rng(ctx);
        const ring = SlimeKing.ringTiles(w, e);
        if (!ring.length) return null;
        const spot = ring[Math.floor(rng() * ring.length)];
        const hp = Math.max(1, Math.floor(e.stats.hp * 15 / 100 + 1e-9));
        return {
            kind: "custom", name: "슬라임 소환", tiles: [spot], color: "#8a50c8", spot,
            view: () => ({ kind: "summon" }),
            text: () => `슬라임 소환: 현재 체력의 15%(${hp})를 체력으로, 공격·방어는 자기의 40%인 슬라임을 곁에 부른다`,
            run: SlimeKing.runSummon
        };
    }

    static runSummon(ai, ctx, turns, intent) {
        const e = ai.entity;
        const w = ctx.world;
        const anims = [];
        let spot = intent.spot;
        if (!w.isWalkable(spot[0], spot[1])) {
            const ring = SlimeKing.ringTiles(w, e);
            spot = ring.length ? ring[0] : null;
        }
        if (!spot) return { anims: [new PopupAnim(e, "…", "#c8b890")], hitPlayer: false };
        const stats = {
            hp: Math.max(1, Math.floor(e.stats.hp * 15 / 100 + 1e-9)),
            atk: Math.floor(e.stats.attack * 40 / 100 + 1e-9),
            def: Math.floor(e.stats.defense * 40 / 100 + 1e-9)
        };
        const m = EntityTypes.create("slime", spot[0], spot[1], { lv: 1, stats });
        w.spawn(m);
        MessageLog.add(`${josa(e.displayName, "이가")} 슬라임을 뱉어 냈다 (체력 ${stats.hp}, 공격 ${stats.atk}, 방어 ${stats.def})`, "#b080e8");
        anims.push(new PopupAnim(e, "소환", "#b080e8"));
        return { anims, hitPlayer: false };
    }

    // ---------- G 휴식 ----------
    static restIntent(ctx, e) {
        const v = 5;
        return {
            kind: "custom", name: "휴식", color: "#7cd47c",
            view: () => ({ kind: "heal", v }),
            text: () => `휴식: 1턴 쉰다. 체력을 ${v} 회복한다`,
            run: SlimeKing.runRest
        };
    }

    static runRest(ai, ctx, turns, intent) {
        const e = ai.entity;
        const got = Math.max(0, Math.min(e.stats.maxHp - e.stats.hp, 5));
        e.stats.hp += got;
        MessageLog.add(`${josa(e.displayName, "이가")} 쉬면서 체력을 ${got} 회복했다`, "#7cd47c");
        return { anims: [new PopupAnim(e, "+" + got, "#7cd47c")], hitPlayer: false };
    }
}

/* ===== assets/dat/entity/SlimeKingPull.js ===== */
// 슬라임킹 F 점액 손 — 플레이어 위치로 1칸 범위 점액 손을 날린다. 맞으면 플레이어를 킹 옆칸으로 당겨온다.
// 공격력 60% 피해, 점액 카드 이동속도 100%. 실행은 area 의도 처리(EnemyAI)가 하고, 끌어올 칸 계산만 여기서 한다.
class SlimeKingPull {
    static intent(ctx, e, foe) {
        return {
            kind: "area", name: "점액 손", tiles: EnemyMoves.around(ctx.world, foe.x, foe.y, 1), dmg: EnemyMoves.val(e, "atk", 60),
            thrown: true, color: "#7cd47c", cards: { pct: 100 }, pull: true
        };
    }

    // 킹 발자국 바깥 상하좌우 변에 붙은 칸들 (모서리 제외)
    static edgeTiles(e) {
        const out = [];
        for (let dy = -1; dy <= e.size; dy++) for (let dx = -1; dx <= e.size; dx++) {
            const inside = dx >= 0 && dx < e.size && dy >= 0 && dy < e.size;
            const corner = (dx < 0 || dx >= e.size) && (dy < 0 || dy >= e.size);
            if (!inside && !corner) out.push([e.x + dx, e.y + dy]);
        }
        return out;
    }

    // v가 끌려갈 칸 [x, y]. 이미 킹 옆이면 현재 칸, 비어 있는 칸이 없으면 null
    static pullTarget(w, e, v) {
        const ring = SlimeKingPull.edgeTiles(e);
        if (ring.some(([x, y]) => x === v.x && y === v.y)) return [v.x, v.y];
        let best = null;
        let bd = Infinity;
        for (const [x, y] of ring) {
            if (!w.getChunkAt(x, y) || !w.isWalkable(x, y)) continue;
            const d = Math.abs(x - v.x) + Math.abs(y - v.y);
            if (d < bd) { bd = d; best = [x, y]; }
        }
        return best;
    }

    // 실제로 끌어온다. 움직였으면 연출 목록, 아니면 빈 배열
    static pull(w, e, v) {
        const to = SlimeKingPull.pullTarget(w, e, v);
        if (!to || (to[0] === v.x && to[1] === v.y)) return [];
        const t = w.tileSize;
        const fx = v.x;
        const fy = v.y;
        w.removeEntity(v);
        v.x = to[0];
        v.y = to[1];
        w.addEntity(v);
        MessageLog.add(`${v instanceof Player ? "당신이" : josa(v.displayName, "이가")} ${e.displayName}에게 끌려갔다!`, "#7cd47c");
        return [new MoveAnim(v, new Vector(fx * t, fy * t), new Vector(v.x * t, v.y * t), 0.18)];
    }
}

/* ===== assets/dat/entity/SlimeQueen.js ===== */
// 슬라임퀸 (공방 데이터 slime_queen, 2x2). 로테이션 [ABCDEFG], 시작 위치 무작위.
//   A 점액 뒤덮기 — 방의 모든 칸에 점액 장판(3턴). 그 전 플레이어 턴에 공격으로 피해를 입었으면 하지 않고 쉰다
//   B 점액 손 — 플레이어 위치 1칸 범위. 공격력 60%, 점액 카드(이동속도), 속박(이동속도 100% 턴), 자기 옆으로 당겨온다
//   C 유혹 — 이동속도 200%만큼 다가가거나, 옆칸이면 매료(2칸, 이동속도 200% 턴) + 공격력 100%
//   D 공격 — 이동속도만큼 다가가거나, 옆칸이면 공격력 100% + 점액 카드(이동속도)
//   E 기 모으기
//   F 연타 — 다가가거나 옆칸이면 공격력 60% + 점액 카드(이동속도). 기를 모았으면 이 행동을 이동속도 300%번 되풀이
//   G 가두기 — 플레이어가 점액 장판 위에 있거나 패에 점액 카드가 있을 때만. 아니면 바로 다음 행동을 한다
// 가두기: 플레이어를 자기 몸 안(2x2 중 한 칸)에 넣는다.
//   - 패에 점액 카드가 있는 동안 둔화 66% + 속박 (점액 카드를 다 치우면 풀려서 걸어 나올 수 있다)
//   - 플레이어 턴 시작마다 퀸 방어력 33%만큼 점액 카드가 끼어들고, 패·덱·묘지의 점액 카드 1장당 공격력 30%(최소 1) 피해
//   - 퀸은 가둔 대상에게서 피해를 입지 않고, 가둔 대상은 퀸이 아닌 상대에게서 피해를 입지 않는다
//   - 몸 밖 칸으로 나가거나 퀸이 쓰러지면 풀린다
class SlimeQueen {
    static COLOR = "#7cd47c";
    static HOLD_SLOW = 66;

    // ---------- 점액 카드 ----------
    static give(p, n) {
        if (n <= 0 || p !== Player.current) return [];
        for (let i = 0; i < n; i++) {
            const c = new Card("slime");
            c.ensureData().temp = true;
            if (!p.cards.addToHand(c)) p.cards.addToDeck(c);
        }
        MessageLog.add(`점액 카드 ${n}장이 끼어들었다`, SlimeQueen.COLOR);
        return [new PopupAnim(p, `점액 카드 +${n}`, SlimeQueen.COLOR)];
    }

    static isSlime(c) {
        return c.defId === "slime";
    }

    static inHand(p) {
        return p.cards.hand.filter(SlimeQueen.isSlime).length;
    }

    static total(p) {
        const z = p.cards;
        return [...z.hand, ...z.deck, ...z.graveyard].filter(SlimeQueen.isSlime).length;
    }

    static cardsBySpeed(e, pct = 100) {
        return Math.floor(e.speedNow * pct / 100 + 1e-9);
    }

    // ---------- 가두기 상태 ----------
    // p를 가두고 있는 퀸 (없으면 null). 몸 밖으로 나갔거나 퀸이 쓰러졌으면 여기서 풀린다
    static holder(p) {
        const q = p && p.heldBy;
        if (!q) return null;
        if (q.alive && q.world && p.alive && q.tilesOf().some(([x, y]) => x === p.x && y === p.y)) return q;
        p.heldBy = null;
        SlimeQueen.dropFx(p);
        if (p.alive) MessageLog.add(`${q.displayName}의 몸에서 빠져나왔다`, "#a0d0a0");
        return null;
    }

    static dropFx(p) {
        if (!p.holdFx) return;
        p.holdFx = false;
        Status.set(p, "root", 0);
        Status.set(p, "slow", 0);
    }

    // 갇힌 동안: 패에 점액 카드가 있으면 둔화 66% + 속박, 없으면 풀린다. 패가 바뀔 때마다 부른다 (Card.js _changed)
    static refresh(p) {
        if (!p || !p.heldBy && !p.holdFx) return;
        const q = SlimeQueen.holder(p);
        if (q && SlimeQueen.inHand(p) > 0) {
            if (Status.get(p, "root") < 1) Status.set(p, "root", 1);
            if (Status.get(p, "slow") < SlimeQueen.HOLD_SLOW) Status.set(p, "slow", SlimeQueen.HOLD_SLOW, 1);
            p.holdFx = true;
        } else SlimeQueen.dropFx(p);
    }

    // 피해 막기 (Combat.hit): 퀸은 가둔 대상에게서, 가둔 대상은 퀸이 아닌 상대에게서 피해를 입지 않는다
    static blocks(target, source) {
        if (!source) return false;
        if (source.heldBy && SlimeQueen.holder(source) === target) return true;
        if (target.heldBy) {
            const q = SlimeQueen.holder(target);
            if (q && source !== q) return true;
        }
        return false;
    }

    // 플레이어 새 턴 (TurnManager): 점액 카드가 끼어들고, 가진 점액 카드만큼 피해
    static turnStart(p, w) {
        const q = SlimeQueen.holder(p);
        if (!q) return [];
        const anims = [];
        anims.push(...SlimeQueen.give(p, EnemyMoves.val(q, "def", 33)));
        const n = SlimeQueen.total(p);
        const per = Math.max(1, EnemyMoves.val(q, "atk", 30));
        if (n > 0) {
            MessageLog.add(`${q.displayName}의 몸 안에서 녹아내린다 (점액 카드 ${n}장 × ${per})`, "#f0a0a0");
            anims.push(...EnemyMoves.hurt(q, p, n * per, "소화", w));
        }
        SlimeQueen.refresh(p);
        return anims;
    }

    // ---------- 움직임 ----------
    // foe 쪽으로 n칸까지 다가간다. { anims, moved }
    static advance(ai, ctx, n) {
        const e = ai.entity;
        const w = ctx.world;
        const t = w.tileSize;
        const foe = ai.focus(ctx);
        const anims = [];
        let moved = 0;
        if (Status.get(e, "root") > 0) {
            if (EnemyMoves.dist(e, foe) > 1) anims.push(new PopupAnim(e, "속박", "#e8e8f0"));
            return { anims, moved };
        }
        while (moved < n && e.alive && foe.alive && EnemyMoves.dist(e, foe) > 1) {
            const dir = SlimeKing.stepToward(w, e, foe);
            if (!dir) break;
            const fx = e.x;
            const fy = e.y;
            if (!w.moveEntity(e, dir[0], dir[1])) break;
            anims.push(new MoveAnim(e, new Vector(fx * t, fy * t), new Vector(e.x * t, e.y * t)));
            moved++;
        }
        return { anims, moved };
    }

    // 다가가거나, 닿아 있으면(이동을 다 쓰지 않았을 때) 친다. o: { moves, pct, name, cards(이동속도 %), charm: { n, turns } }
    static approach(ai, ctx, o) {
        const e = ai.entity;
        const w = ctx.world;
        const p = ctx.player;
        const foe = ai.focus(ctx);
        const adv = SlimeQueen.advance(ai, ctx, o.moves);
        const anims = adv.anims;
        let hitPlayer = false;
        if (e.alive && foe.alive && EnemyMoves.dist(e, foe) <= 1 && adv.moved < o.moves) {
            if (o.charm && foe === p) {
                Status.charm(e, foe, o.charm.n, o.charm.turns);
                MessageLog.add(`${josa(e.displayName, "이가")} 당신을 홀렸다 (매료 ${o.charm.n}칸, ${o.charm.turns}턴)`, Status.DEFS.charm.color);
                anims.push(new PopupAnim(foe, "매료", Status.DEFS.charm.color));
            }
            anims.push(...Combat.strike(e, foe, w, EnemyMoves.val(e, "atk", o.pct), o.name));
            if (foe === p) {
                hitPlayer = true;
                if (o.cards && p.alive) anims.push(...SlimeQueen.give(p, SlimeQueen.cardsBySpeed(e, o.cards)));
            }
        }
        return { anims, hitPlayer };
    }

    static approachView(ai, p, e, moves, pct) {
        const f = ai.focus({ world: e.world, player: p });
        const d = EnemyMoves.dist(e, f);
        if (Status.get(e, "root") > 0 && d > 1) return { kind: "idle" };
        return d <= moves ? { kind: "attack", v: Status.modify(EnemyMoves.val(e, "atk", pct), e, f) } : { kind: "chase" };
    }

    // ---------- A 점액 뒤덮기 ----------
    // 퀸이 있는 방의 걸을 수 있는 칸 전부
    static roomTiles(w, e) {
        const seen = new Set();
        const queue = [];
        for (const [x, y] of e.tilesOf()) { seen.add(x + "," + y); queue.push([x, y]); }
        for (let i = 0; i < queue.length && queue.length < 4000; i++) {
            const [x, y] = queue[i];
            for (const [dx, dy] of Entity.DIRS) {
                const k = (x + dx) + "," + (y + dy);
                if (seen.has(k) || !w.getChunkAt(x + dx, y + dy) || !EnemyMoves.walkableTile(w, x + dx, y + dy)) continue;
                seen.add(k);
                queue.push([x + dx, y + dy]);
            }
        }
        return queue;
    }

    static floodIntent(ctx, e) {
        return {
            kind: "custom", name: "점액 뒤덮기", color: SlimeQueen.COLOR,
            view: () => ({ kind: "area", name: "점액 뒤덮기" }),
            text: () => "점액 뒤덮기: 방의 모든 칸에 점액 장판(3턴)을 깐다. 그 전에 공격으로 피해를 입히면 하지 않고 쉰다",
            run: SlimeQueen.runFlood
        };
    }

    static runFlood(ai, ctx) {
        const e = ai.entity;
        const w = ctx.world;
        if (ai.mem.hurtAt !== undefined && ai.mem.hurtAt === ctx.player.turnNo) {
            MessageLog.add(`${josa(e.displayName, "은는")} 얻어맞아 점액을 퍼뜨리지 못했다`, "#a0d0a0");
            return { anims: [new PopupAnim(e, "움찔", "#c8b890")], hitPlayer: false };
        }
        const tiles = SlimeQueen.roomTiles(w, e);
        for (const [x, y] of tiles) Goo.lay(w, x, y, 3);
        MessageLog.add(`${josa(e.displayName, "이가")} 방 전체를 점액으로 뒤덮었다 (3턴)`, SlimeQueen.COLOR);
        return { anims: [new PopupAnim(e, "점액 뒤덮기", SlimeQueen.COLOR), new AreaFlashAnim(w, tiles, SlimeQueen.COLOR, 0.35, false)], hitPlayer: false };
    }

    // ---------- B 점액 손 ----------
    static handIntent(ctx, e, foe) {
        return {
            kind: "area", name: "점액 손", tiles: EnemyMoves.around(ctx.world, foe.x, foe.y, 1), dmg: EnemyMoves.val(e, "atk", 60),
            thrown: true, color: SlimeQueen.COLOR, cards: { pct: 100 }, pull: true, root: Math.max(1, SlimeQueen.cardsBySpeed(e, 100))
        };
    }

    // ---------- C 유혹 ----------
    static charmIntent(ctx, e) {
        const moves = () => SlimeQueen.cardsBySpeed(e, 200);
        const turns = () => Math.max(1, SlimeQueen.cardsBySpeed(e, 200));
        return {
            kind: "custom", name: "유혹",
            view: (ai, p) => SlimeQueen.approachView(ai, p, e, moves(), 100),
            text: () => `유혹: 다가온다 (한 턴에 ${moves()}칸) · 닿으면 매료 2칸 ${turns()}턴 + ${EnemyMoves.val(e, "atk", 100)} 피해`,
            run: (ai, c) => SlimeQueen.approach(ai, c, { moves: moves(), pct: 100, name: "유혹", charm: { n: 2, turns: turns() } })
        };
    }

    // ---------- D 공격 ----------
    static biteIntent(ctx, e) {
        return {
            kind: "custom", name: "공격",
            view: (ai, p) => SlimeQueen.approachView(ai, p, e, e.speedNow, 100),
            text: () => `다가온다 (한 턴에 ${e.speedNow}칸) · 닿으면 ${EnemyMoves.val(e, "atk", 100)} 피해 + 점액 카드 ${SlimeQueen.cardsBySpeed(e)}장`,
            run: (ai, c) => SlimeQueen.approach(ai, c, { moves: e.speedNow, pct: 100, name: "공격", cards: 100 })
        };
    }

    // ---------- E 기 모으기 ----------
    static focusIntent(ctx, e) {
        return {
            kind: "custom", name: "기 모으기",
            view: () => ({ kind: "buff", name: "기 모으기" }),
            text: () => `기를 모은다: 다음 연타를 ${Math.max(1, SlimeQueen.cardsBySpeed(e, 300))}번 되풀이한다`,
            run: (ai) => {
                ai.mem.charged = true;
                MessageLog.add(`${josa(e.displayName, "이가")} 기를 모은다`, "#f0c060");
                return { anims: [new PopupAnim(e, "기 모으기", "#f0c060")], hitPlayer: false };
            }
        };
    }

    // ---------- F 연타 ----------
    static flurryIntent(ctx, e) {
        const reps = (ai) => ai.mem.charged ? Math.max(1, SlimeQueen.cardsBySpeed(e, 300)) : 1;
        return {
            kind: "custom", name: "연타",
            view: (ai, p) => SlimeQueen.approachView(ai, p, e, e.speedNow * reps(ai), 60),
            text: () => `연타: 다가오거나 닿으면 ${EnemyMoves.val(e, "atk", 60)} 피해 + 점액 카드 ${SlimeQueen.cardsBySpeed(e)}장${e.ai.mem.charged ? ` · 기를 모아서 ${reps(e.ai)}번 되풀이한다` : ""}`,
            run: (ai, c) => {
                const n = reps(ai);
                ai.mem.charged = false;
                const out = { anims: [], hitPlayer: false };
                const steps = [];
                for (let i = 0; i < n && e.alive && c.player.alive; i++) {
                    const r = SlimeQueen.approach(ai, c, { moves: e.speedNow, pct: 60, name: "연타", cards: 100 });
                    steps.push(r.anims);
                    out.hitPlayer = out.hitPlayer || r.hitPlayer;
                }
                out.anims = steps.length > 1 ? [new SeqAnim(steps)] : (steps[0] ?? []);
                return out;
            }
        };
    }

    // ---------- G 가두기 ----------
    static canHold(e, p) {
        return !!p && p === Player.current && p.alive && !SlimeQueen.holder(p) && (Goo.on(p) || SlimeQueen.inHand(p) > 0);
    }

    static holdIntent(ctx, e, foe) {
        if (foe !== ctx.player || !SlimeQueen.canHold(e, foe)) return null; // 못 하면 바로 다음 행동 (fallback "next")
        return {
            kind: "custom", name: "가두기", color: SlimeQueen.COLOR,
            view: () => ({ kind: "area", name: "가두기" }),
            text: () => "가두기: 당신이 점액 장판 위에 있거나 패에 점액 카드가 있으면 몸 안에 가둔다. 갇히면 턴마다 점액 카드가 끼어들고 점액 카드 수만큼 피해 · 패의 점액 카드를 다 치우면 걸어 나올 수 있다",
            run: SlimeQueen.runHold
        };
    }

    static runHold(ai, ctx) {
        const e = ai.entity;
        const w = ctx.world;
        const p = ctx.player;
        const t = w.tileSize;
        if (!SlimeQueen.canHold(e, p)) {
            MessageLog.add(`${josa(e.displayName, "의")} 가두기를 피했다`, "#a0d0a0");
            return { anims: [new PopupAnim(e, "놓쳤다", "#c8b890")], hitPlayer: false };
        }
        // 몸 안 칸 중 플레이어에게 가장 가까운 칸으로 끌어 넣는다
        let best = null;
        let bd = Infinity;
        for (const [x, y] of e.tilesOf()) {
            const d = Math.abs(x - p.x) + Math.abs(y - p.y);
            if (d < bd) { bd = d; best = [x, y]; }
        }
        const fx = p.x;
        const fy = p.y;
        w.removeEntity(p);
        p.x = best[0];
        p.y = best[1];
        w.addEntity(p);
        p.heldBy = e;
        MessageLog.add(`${josa(e.displayName, "이가")} 당신을 몸 안에 가뒀다! 패의 점액 카드를 다 치워야 걸어 나올 수 있다`, "#f0a0a0");
        SlimeQueen.refresh(p);
        return { anims: [new MoveAnim(p, new Vector(fx * t, fy * t), new Vector(p.x * t, p.y * t), 0.18), new PopupAnim(p, "갇힘", SlimeQueen.COLOR)], hitPlayer: true };
    }
}

/* ===== assets/dat/entity/Merchant.js ===== */
// 상인 (상점 방의 주민). 말을 걸면 거래 창(ShopDialog)이 뜬다.
// 때릴 수도 있다: 맞으면 화가 나서 덤비고(NeutralAI), 다시는 거래하지 않는다. 쓰러뜨리면 가진 돈을 떨어뜨린다.
// upgrades: [{ color, sold }] — 파는 카드 강화 3개 (쉬운 색 서로 다른 2 + 어려운 색 1, 시드로 결정). 값은 산 횟수(buys)만큼 기본값의 50%씩 오른다.
//   roomState() = { upgrades, buys } → 방을 나갔다 들어와도 data.extra로 복원 (Run.captureRoom)
// stock: [{ card, price, sold }] — 방을 만들 때 굴린다 (RoomGen). 카드 빼기는 여러 번 할 수 있고 뺄 때마다 값이 오른다 (Run.removeCost, 상점마다 처음부터)
class Merchant extends Entity {
    static NAMES = ["철수", "덕배", "만복", "봉식", "칠복", "용팔", "갑돌", "춘삼"];

    constructor(x, y, data = {}) {
        super(x, y, "villager_merchant", {
            type: "merchant",
            name: data.name ?? "상인",
            stats: { maxHp: 30, attack: 5, defense: 2 },
            tags: ["creature", "human", "npc", "merchant"],
            ai: new NeutralAI({ sight: 99 })
        });
        this.stock = data.stock ?? [];
        this.money = data.money ?? 60;
        this.data = data;
        const ex = data.extra;
        if (ex && Array.isArray(ex.upgrades)) {
            this.upgrades = ex.upgrades.map((u) => ({ color: u.color, sold: !!u.sold }));
            this.buys = ex.buys ?? 0;
        } else {
            const rng = Rng.make(Rng.mix(data.seed ?? 1, 9157));
            const easy = Rng.shuffle(rng, [...UpgradeFlow.EASY]).slice(0, 2);
            const hard = Rng.pick(rng, UpgradeFlow.HARD);
            this.upgrades = [...easy, hard].map((color) => ({ color, sold: false }));
            this.buys = 0;
        }
    }

    static UPGRADE_EASY = 50;
    static UPGRADE_HARD = 100;

    // 카드 강화의 지금 값: 기본값 × (100 + 50×산 횟수) / 100 (버림)
    upgradePrice(color) {
        const base = UpgradeFlow.COLORS[color].hard ? Merchant.UPGRADE_HARD : Merchant.UPGRADE_EASY;
        return Math.floor(base * (100 + 50 * this.buys) / 100);
    }

    roomState() {
        return { upgrades: this.upgrades.map((u) => ({ color: u.color, sold: u.sold })), buys: this.buys };
    }

    get angry() {
        return !!this.ai.enemy;
    }

    get interactable() {
        return true;
    }

    interact(ctx) {
        if (this.angry) {
            MessageLog.add(`${josa(this.displayName, "은는")} 화가 나서 거래하지 않는다`, "#f0a0a0");
            return true;
        }
        ctx.run.ui.shop.open(this);
        return true;
    }

    static LINES = [
        "어서 오세요. 이 깊은 곳까지 오시다니, 대단하시네요.",
        "물건은 좋아요. 값은… 깊이만큼 비싸죠.",
        "카드가 너무 많으면 손이 무거워요. 빼 드릴까요?",
        "여기선 저를 때리지 마세요. 저도 꽤 셉니다."
    ];

    line() {
        const rng = (this.world && this.world.rng) || Math.random;
        return Merchant.LINES[Math.floor(rng() * Merchant.LINES.length)];
    }
}

EntityTypes.register("merchant", (x, y, d) => new Merchant(x, y, d));
